<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control and Information Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2212%22 fill=%22%23FFD23F%22 stroke=%22%2314163A%22 stroke-width=%225%22/%3E%3Cpath d=%22M36 10L18 36h12l-4 18 20-28H34z%22 fill=%22%23fff%22 stroke=%22%2314163A%22 stroke-width=%224%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#14163A; --ink-2:#4A4D78; --ink-3:#8A8DB0;
  --paper:#FFFFFF; --page:#E4F2FF; --dot:rgba(20,22,58,.07);
  --sun:#FFD23F; --sun-2:#FFF3C4;
  --good:#12A15E; --good-bg:#DCF7E9;
  --bad:#E23D45; --bad-bg:#FFE1E2;
  --warn:#C77700; --warn-bg:#FFF0D1;
  --c1:#2F7DE1; --c1t:#DCEBFF;
  --c2:#F39200; --c2t:#FFE8C2;
  --c3:#9A4FE0; --c3t:#EEE0FF;
  --c4:#119C77; --c4t:#D2F4E8;
  --c5:#E23F66; --c5t:#FFDDE6;
  --c6:#0E9BB0; --c6t:#D3F3F7;
  --c7:#C77700; --c7t:#FFF0D1;
  --c8:#5B4FE0; --c8t:#E3E1FF;
  --c9:#D9469E; --c9t:#FCE1F1;
  --col:var(--c1); --tint:var(--c1t);
  --shadow:4px 4px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --r:14px; --r-sm:10px;
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.col-c1{--col:var(--c1);--tint:var(--c1t)} .col-c2{--col:var(--c2);--tint:var(--c2t)} .col-c3{--col:var(--c3);--tint:var(--c3t)}
.col-c4{--col:var(--c4);--tint:var(--c4t)} .col-c5{--col:var(--c5);--tint:var(--c5t)} .col-c6{--col:var(--c6);--tint:var(--c6t)}
.col-c7{--col:var(--c7);--tint:var(--c7t)} .col-c8{--col:var(--c8);--tint:var(--c8t)} .col-c9{--col:var(--c9);--tint:var(--c9t)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-width:0}
.logo-mark{font-family:var(--display);font-size:28px;letter-spacing:.05em;color:var(--c8);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg);white-space:nowrap}
.unit-chip{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:#fff;padding:4px 8px;border-radius:6px;white-space:nowrap}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--sun-2);border:2px solid var(--ink);border-radius:999px;padding:3px 12px 3px 6px;white-space:nowrap}
.xp svg{width:20px;height:20px}
.xp.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:scale(1.18)}}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:2px 2px 0 var(--ink);padding:0;text-decoration:none}
.icon-btn svg{width:22px;height:22px}
@media (max-width:620px){.unit-chip{display:none}.logo-mark{font-size:24px}}
@media (max-width:380px){.topbar-in{gap:7px;padding-inline:12px}.xp{padding:3px 9px 3px 5px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font-weight:800;font-size:16px;line-height:1.2;box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .08s;text-align:center;text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-go{background:var(--sun)}
.btn-ink{background:var(--ink);color:#fff}
.btn-col{background:var(--col);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn-sm{min-height:40px;padding:6px 14px;font-size:14px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.screen{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* home */
.hero{margin-top:20px;padding:20px;display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(42px,7vw,66px)}
.hero h1 span{color:var(--c8);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.hero p.lead{margin-top:10px;max-width:50ch;color:var(--ink-2)}
.hero .row{margin-top:14px}
.kick{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:2px solid var(--ink);border-radius:10px;padding:10px 6px;background:var(--page);text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
@media (max-width:680px){.hero{grid-template-columns:1fr}}
.hw{margin-top:16px;padding:14px 16px;display:grid;gap:10px;background:var(--sun-2)}
.hw h2{font-size:28px}
.hw-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper)}
.hw-item.done{background:var(--good-bg)}
.hw-check{width:30px;height:30px;margin:2px 0 0;accent-color:var(--good);cursor:pointer}
.hw-body{min-width:0;display:grid;gap:6px}
.hw-body label{cursor:pointer;font-weight:800;font-size:16px;line-height:1.3}
.hw-body p{font-size:15px}
.hw-body .row{gap:8px}
.hw-item.done .hw-title{text-decoration:line-through;text-decoration-thickness:2px}
.due{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;border:2px solid var(--ink);background:var(--bad-bg);white-space:nowrap;margin-left:2px;vertical-align:1px}
.hw-item.done .due{background:var(--paper)}
.hw-note{font-size:14px!important;padding:8px 10px;border:2px dashed var(--ink);border-radius:8px;background:var(--warn-bg)}
.hw-note b{color:var(--warn)}
.hw-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.ext{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.sec-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:34px 0 14px}
.sec-title h2{font-size:36px}
.sec-title p{color:var(--ink-2);font-size:14px}

/* lesson trail */
.trail{position:relative;display:grid;gap:20px;padding-block:4px}
.trail::before{content:"";position:absolute;top:0;bottom:-20px;left:50%;border-left:4px dashed var(--ink-3);transform:translateX(-2px)}
.land{position:relative;width:calc(50% - 26px);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;text-align:left;background:var(--tint);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .15s}
.land:nth-child(odd){justify-self:start}
.land:nth-child(even){justify-self:end}
.land:hover{transform:translateY(-3px) rotate(-.4deg)}
.land::after{content:"";position:absolute;top:24px;width:22px;height:22px;border-radius:50%;background:var(--col);border:3px solid var(--ink)}
.land:nth-child(odd)::after{right:-40px}
.land:nth-child(even)::after{left:-40px}
@media (max-width:680px){.trail::before{left:18px}.land{width:calc(100% - 44px);justify-self:end!important}.land::after{left:-40px!important;right:auto!important}}
.badge{width:56px;height:56px;border-radius:50%;background:var(--col);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink);flex:none}
.badge svg{width:32px;height:32px}
.land-num{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);display:block}
.land .sub{font-size:14px;color:var(--ink-2);margin-top:2px}
.land-foot{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.day{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.progress-note{font-size:13px;font-weight:700;color:var(--ink-2)}
.stars{display:flex;gap:2px}
.stars svg{width:24px;height:24px}
.sticker{position:absolute;top:-19px;right:12px;font-family:var(--display);font-size:18px;letter-spacing:.05em;background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;transform:rotate(4deg);box-shadow:2px 2px 0 var(--ink)}
.sticker.ok{background:var(--good)}
.lt{display:block;font-family:var(--display);font-size:28px;line-height:1.05;letter-spacing:.03em;margin-top:1px}
.land .sub,.xcard .sub{display:block}
.xcard .lt{font-size:32px}
.xcard .sub{font-size:14px;margin-top:2px}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px}
@media (max-width:680px){.extras{grid-template-columns:1fr}}
.xcard{position:relative;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--tint);text-align:left}
.xcard .row{grid-column:1 / -1}
.xcard.final{background:var(--sun)}
.xcard.final .badge{background:var(--ink)}
.bank{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.bank{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:340px){.bank{grid-template-columns:1fr}}
.vw{border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:3px 3px 0 var(--col)}
.vw summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;overflow-wrap:anywhere}
.vw summary::-webkit-details-marker{display:none}
.vw summary::after{content:"+";flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;line-height:1;background:var(--tint)}
.vw[open] summary::after{content:"\2013"}
.vw p{padding:0 12px 12px;font-size:14px;color:var(--ink-2)}
.vw p small{display:block;margin-top:4px;font-weight:700;color:var(--col)}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.chip-land{font-family:var(--display);font-size:22px;letter-spacing:.04em;padding:3px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--col);color:#fff;-webkit-text-stroke:.5px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.step{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:13px;padding:0}
.step.done{background:var(--good);color:#fff}
.step.now{box-shadow:0 0 0 3px var(--sun);transform:scale(1.1)}
@media (max-width:560px){.steps{margin-left:0}}
.intro{margin-top:14px;padding:20px;display:grid;gap:10px;background:var(--tint)}
.intro h2{font-size:clamp(36px,7vw,58px);color:var(--col);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.intro .bigq{font-size:clamp(19px,2.6vw,23px);font-weight:700;max-width:46ch}
.intro .from{font-size:14px;color:var(--ink-2)}
.scene-box{margin:16px 0 0;padding:12px;display:grid;gap:10px;position:relative}
.scene{position:relative;background:var(--tint);border:3px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;width:100%;max-width:680px;margin-inline:auto}
.scene svg{width:100%;height:100%;display:block}
.scene-box figcaption{font-size:15px;color:var(--ink-2)}
.scene-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.motion-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 10px;font-size:13px;font-weight:800;border:2px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:2px 2px 0 var(--ink)}
.motion-btn svg{width:14px;height:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block;flex:none}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{min-height:38px;padding:5px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:700;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.tog[aria-pressed="true"]{background:var(--col);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.icard{padding:14px 16px;border:3px solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow-sm);min-width:0}
.icard h3{font-size:25px;color:var(--col);-webkit-text-stroke:.7px var(--ink)}
.icard p{margin-top:6px;font-size:16px}
.icard ul{margin:8px 0 0;padding-left:20px;font-size:15px;display:grid;gap:4px}
.fact{margin-top:16px;padding:14px 16px;background:var(--sun-2);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow-sm);transform:rotate(-.5deg)}
.fact .tag{font-family:var(--display);font-size:22px;letter-spacing:.04em;margin-right:6px}
.connect{margin-top:16px;padding:12px 16px;border:3px dashed var(--ink);border-radius:var(--r);background:var(--paper);font-size:15px}
.connect b.tag{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.04em;color:var(--col);margin-right:4px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.kw-chip{font-size:14px;font-weight:700;padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--tint)}
.kw .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-right:4px}
.widget{margin-top:16px;padding:16px;display:grid;gap:12px}
.widget h3{font-size:28px}
.widget .how{font-size:14px;color:var(--ink-2)}
.qc{margin-top:28px}
.qc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.qc-head h2{font-size:36px}
.qc-head p{color:var(--ink-2);font-size:14px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}

/* widgets */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.split{grid-template-columns:1fr}}
.figure{position:relative;width:100%;max-width:520px;margin:0 auto;border:3px solid var(--ink);border-radius:var(--r-sm);background:var(--tint);overflow:hidden}
.figure svg{display:block;width:100%;height:100%}
.pins{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font-weight:800;font-size:13px;line-height:1;padding:0;display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
button.pin:hover:not([disabled]){background:#fff}
.pin.seen{background:var(--good-bg)}
.pin.sel{background:var(--col);color:#fff}
.pin.right{background:var(--good);color:#fff}
.pin.wrong{background:var(--bad);color:#fff;animation:shake .4s}
.pin.hi{background:var(--c5);color:#fff;animation:pinPulse 1.3s ease-in-out infinite}
.pin[disabled]{cursor:default}
@keyframes pinPulse{50%{box-shadow:0 0 0 7px rgba(226,63,102,.35),2px 2px 0 var(--ink)}}
.part-info{border:3px solid var(--ink);border-radius:var(--r-sm);padding:12px 14px;background:var(--tint);min-height:96px}
.part-info h4{margin:0;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.03em}
.part-info p{margin-top:4px;font-size:16px}
.part-chips{display:flex;flex-wrap:wrap;gap:6px}
.part-chips button{font-size:13px;font-weight:700;padding:4px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper)}
.part-chips button.seen{background:var(--good-bg)}
.part-chips button[aria-pressed="true"]{background:var(--col);color:#fff}
.cells3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ccard{border:2px solid var(--ink);border-radius:12px;background:var(--paper);padding:12px;box-shadow:2px 2px 0 var(--ink);min-width:0}
.ccard svg{width:64px;height:48px;display:block;margin-bottom:4px}
.ccard h4{margin:0;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.03em}
.ccard p{font-size:14px;margin-top:4px}
.tastes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tastes{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:460px){.tastes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tcard{border:2px solid var(--ink);border-radius:12px;background:var(--paper);padding:10px;display:grid;gap:4px;justify-items:center;text-align:center;box-shadow:2px 2px 0 var(--ink)}
.tcard svg{width:56px;height:56px}
.tcard b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1;letter-spacing:.03em}
.tcard span{font-size:13px;color:var(--ink-2);line-height:1.35}
.day-line{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.day-line li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--paper)}
.day-line .n{width:34px;height:34px;border-radius:50%;background:var(--col);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:20px;text-shadow:1px 1px 0 var(--ink)}
.day-line b{display:block}
.day-line span{font-size:14px;color:var(--ink-2)}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.chain li{position:relative;flex:1 1 120px;min-width:0;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:2px 2px 0 var(--ink);font-size:14px;line-height:1.3}
.chain li b{display:block;font-size:15px;color:var(--col)}
.chain li small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.chain li:not(:last-child)::after{content:"\2192";position:absolute;right:-9px;top:50%;transform:translate(50%,-50%);font-weight:800;font-size:16px;z-index:1}
@media (max-width:560px){.chain{flex-direction:column}.chain li{flex:0 0 auto}.chain li:not(:last-child)::after{content:"\2193";right:auto;left:50%;top:auto;bottom:-10px;transform:translate(-50%,50%)}}
.steps-list{margin:0;padding-left:22px;display:grid;gap:4px;font-size:15px}
.sens{display:grid;gap:8px}
.sens-row{display:grid;grid-template-columns:minmax(96px,150px) 1fr auto;gap:10px;align-items:center;font-weight:700;font-size:15px}
.sens-row .bar{height:20px}
.sens-row small{font-size:12px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.probe{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.probe .vw{box-shadow:3px 3px 0 var(--col)}
.probe .vw p{color:var(--ink)}
.flavor{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.flavor svg{width:120px;height:auto;display:block}
@media (max-width:420px){.flavor{grid-template-columns:1fr;justify-items:center}}
.nose-clip{transition:opacity .3s}
.flavor[data-held="false"] .nose-clip{opacity:0}
.smell-wave{transition:opacity .3s}
.flavor[data-held="true"] .smell-wave{opacity:.1}
.vmini{max-width:300px;margin:0 auto;border:3px solid var(--ink);border-radius:var(--r-sm);background:var(--tint);overflow:hidden}
.vmini svg{display:block;width:100%;height:auto}

/* reaction-time test */
.rt-pad{width:100%;min-height:190px;display:grid;place-items:center;align-content:center;gap:6px;padding:18px;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow-sm);background:var(--paper);color:var(--ink);text-align:center;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.rt-pad .big{font-family:var(--display);font-size:clamp(34px,7vw,52px);letter-spacing:.04em;line-height:1}
.rt-pad .small{font-size:15px;font-weight:700}
.rt-pad[data-state="wait"]{background:var(--ink);color:#fff}
.rt-pad[data-state="go"]{background:var(--good);color:#fff}
.rt-pad[data-state="go"] .big{-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.rt-pad[data-state="false"]{background:var(--bad-bg)}
.rt-pad[data-state="result"],.rt-pad[data-state="done"]{background:var(--sun-2)}
.rt-tries{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;font-weight:700}
.rt-try{min-width:66px;padding:4px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);text-align:center;font-variant-numeric:tabular-nums}
.rt-try.empty{border-style:dashed;color:var(--ink-3)}
.rt-try.best{background:var(--good);color:#fff}

/* blind-spot test */
.bs-strip{position:relative;height:150px;border:3px solid var(--ink);border-radius:var(--r-sm);background:#fff;overflow:hidden}
.bs-cross,.bs-dot{position:absolute;top:50%;transform:translate(-50%,-50%)}
.bs-cross{font-family:Arial,sans-serif;font-weight:700;font-size:44px;line-height:1;color:#111}
.bs-dot{width:30px;height:30px;border-radius:50%;background:#111}
.bs-strip[data-eye="right"] .bs-cross{left:14%} .bs-strip[data-eye="right"] .bs-dot{left:84%}
.bs-strip[data-eye="left"] .bs-cross{left:86%} .bs-strip[data-eye="left"] .bs-dot{left:16%}

/* balance demo */
.bal-wrap{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:560px){.bal-wrap{grid-template-columns:1fr}}
.bal-fig{border:3px solid var(--ink);border-radius:var(--r-sm);background:var(--tint);overflow:hidden;max-width:220px;width:100%;margin:0 auto}
.bal-fig svg{display:block;width:100%;height:auto}
#sv-bal .bal-head,#sv-bal .bal-fluid{transform-box:view-box;transform-origin:110px 100px}
#sv-bal .bal-flap{transform-box:fill-box;transform-origin:50% 100%}
#sv-bal.turn .bal-head{animation:balTurnHead 3.2s ease-in-out forwards}
#sv-bal.turn .bal-fluid{animation:balTurnFluid 3.2s ease-in-out forwards}
#sv-bal.turn .bal-flap{animation:balTurnFlap 3.2s ease-in-out forwards}
#sv-bal.spin .bal-head{animation:balSpinHead 4s ease-in-out forwards}
#sv-bal.spin .bal-fluid{animation:balSpinFluid 4s ease-in-out forwards}
#sv-bal.spin .bal-flap{animation:balSpinFlap 4s ease-in-out forwards}
#sv-bal.turn-still .bal-head{transform:rotate(60deg)} #sv-bal.turn-still .bal-fluid{transform:rotate(30deg)} #sv-bal.turn-still .bal-flap{transform:rotate(-26deg)}
#sv-bal.spin-still .bal-fluid{transform:rotate(30deg)} #sv-bal.spin-still .bal-flap{transform:rotate(26deg)}
@keyframes balTurnHead{0%{transform:rotate(0)}45%,100%{transform:rotate(90deg)}}
@keyframes balTurnFluid{0%{transform:rotate(0)}45%{transform:rotate(45deg)}80%,100%{transform:rotate(90deg)}}
@keyframes balTurnFlap{0%{transform:rotate(0)}20%,45%{transform:rotate(-26deg)}80%,100%{transform:rotate(0)}}
@keyframes balSpinHead{0%{transform:rotate(0)}45%,100%{transform:rotate(720deg)}}
@keyframes balSpinFluid{0%{transform:rotate(0)}45%{transform:rotate(650deg)}65%{transform:rotate(760deg)}100%{transform:rotate(720deg)}}
@keyframes balSpinFlap{0%{transform:rotate(0)}12%,40%{transform:rotate(-26deg)}52%,68%{transform:rotate(26deg)}100%{transform:rotate(0)}}

/* label lab */
.fig-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fig-pick button{min-height:40px;padding:5px 14px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:800;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.fig-pick button[aria-pressed="true"]{background:var(--col);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.fig-pick small{font-weight:700;opacity:.85}

/* questions */
.q-card{padding:18px;display:grid;gap:14px}
.q-kicker{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.q-text{font-size:20px;line-height:1.5;font-weight:600}
.q-how{font-size:14px;font-weight:700;color:var(--ink-2)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:56px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:600;font-size:17px;line-height:1.35;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.opt:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--page)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-bg);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad-bg);animation:shake .4s}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.04)}}
.seq{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot{width:100%;min-height:48px;display:flex;gap:10px;align-items:center;text-align:left;padding:8px 12px;border:2px dashed var(--ink-3);border-radius:10px;background:var(--page);font-weight:600;font-size:16px;line-height:1.3}
.slot .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.slot .ph{color:var(--ink-3)}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--tint);animation:fillIn .35s cubic-bezier(.3,1.6,.5,1)}
.slot.ok{background:var(--good-bg)} .slot.no{background:var(--bad-bg)}
.slot.ok .n{background:var(--good)} .slot.no .n{background:var(--bad)}
@keyframes fillIn{0%{transform:scale(.92)}100%{transform:none}}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{min-height:44px;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:600;font-size:15px;line-height:1.3;text-align:left;box-shadow:2px 2px 0 var(--ink)}
.chipbtn:hover{background:var(--sun-2)}
.sort-list{display:grid;gap:8px}
.sort-row{display:grid;gap:8px;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--paper)}
.sort-row p{font-weight:600;font-size:16px}
.sort-row.ok{background:var(--good-bg)} .sort-row.no{background:var(--bad-bg)}
.sort-row .corr{font-size:14px;font-weight:800;color:var(--good)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--page);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button[disabled]{cursor:default}
.fb{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:start;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;animation:slideUp .3s ease-out}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb .burst{font-family:var(--display);font-size:30px;line-height:1;transform:rotate(-4deg);-webkit-text-stroke:1px var(--ink)}
.fb.ok .burst{color:var(--good)} .fb.no .burst{color:var(--bad)}
.fb .fb-body{font-size:16px;min-width:0}
.fb .fb-body ol{margin:6px 0 6px;padding-left:22px}
.fb .row{grid-column:1 / -1;justify-content:flex-end}
@media (max-width:420px){.fb{grid-template-columns:1fr}}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.qc-done{padding:20px;display:grid;gap:12px;justify-items:center;text-align:center;background:var(--tint)}
.qc-done .big{font-family:var(--display);font-size:clamp(38px,8vw,56px);line-height:1;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.result-stars{display:flex;gap:10px;justify-content:center}
.result-stars span{display:inline-block;animation:starIn .6s cubic-bezier(.3,1.6,.5,1) both}
.result-stars svg{width:56px;height:56px;display:block}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}

/* review + report */
.test-top{display:grid;gap:10px;margin-top:16px}
.test-top .row{justify-content:space-between}
.round-name{font-family:var(--display);font-size:26px;letter-spacing:.04em}
.counter{font-weight:800;font-variant-numeric:tabular-nums}
.progress{height:16px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.progress i{display:block;height:100%;background:var(--sun);border-right:2px solid var(--ink);transition:width .4s}
.test-intro{margin-top:16px;padding:22px;display:grid;gap:14px}
.test-intro h2{font-size:clamp(40px,8vw,60px)}
.test-intro ul{margin:0;padding-left:20px;display:grid;gap:4px}
.report-head{margin-top:16px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:600px){.report-head{grid-template-columns:1fr;justify-items:center;text-align:center}.report-head .row{justify-content:center}}
.ring{width:156px;height:156px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;align-content:center;font-family:var(--display);font-size:46px;line-height:1}
.ring .num small{font-family:var(--body);font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:.06em}
.rank{font-family:var(--display);font-size:clamp(34px,6vw,52px);line-height:1}
.report-head p{margin-top:6px;color:var(--ink-2)}
.bars{padding:16px;display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(130px,230px) 1fr auto;gap:10px 12px;align-items:center}
.bar-label{font-weight:700;line-height:1.25}
.bar-label small{display:block;font-weight:500;font-size:12px;color:var(--ink-2)}
.bar{height:22px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--col);border-right:2px solid var(--ink);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar i.zero{border-right:0}
.bar-end{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pct{font-weight:800;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.status{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:2px solid var(--ink);white-space:nowrap}
.status.good{background:var(--good-bg)} .status.mid{background:var(--warn-bg)} .status.low{background:var(--bad-bg)} .status.na{background:var(--page)}
@media (max-width:600px){.bar-row{grid-template-columns:1fr auto}.bar-row .bar{grid-column:1 / -1;grid-row:2}}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:p}
.plan li{counter-increment:p;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start;padding:14px;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.plan li::before{content:counter(p);grid-row:span 2;width:40px;height:40px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:24px}
.plan li > *{grid-column:2;min-width:0}
.plan li span{display:block}
.plan .row{margin-top:4px}
.history{padding:16px;display:flex;align-items:flex-end;gap:10px;min-height:170px;overflow-x:auto}
.hcol{flex:0 0 52px;display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink-2)}
.hbar{width:34px;background:var(--c5);border:2px solid var(--ink);border-radius:6px 6px 0 0}
.hbar.p{background:var(--c4)}
.hcol b{color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.answers{padding:6px 16px 16px}
.answers summary{cursor:pointer;font-weight:800;padding:10px 0}
.ans{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:2px dashed var(--ink-3);font-size:14px}
.ans .mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;color:#fff}
.ans .mark.ok{background:var(--good)} .ans .mark.no{background:var(--bad)}
.ans small{color:var(--ink-2)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:42px;padding:6px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:800;box-shadow:2px 2px 0 var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.target{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;font-weight:700}
.target .bar{flex:1 1 160px;position:relative;overflow:visible}
.target .bar i{border-radius:999px}
.target .bar .mark70{position:absolute;top:-6px;bottom:-6px;left:70%;border-left:3px dashed var(--ink)}

/* scenes */
.scene *,.mini *,.vmini *{transform-box:fill-box;transform-origin:center}
/* an element with its own SVG transform attribute (rotate(a cx cy)) keeps the default SVG origin */
.scene [transform],.mini [transform],.vmini [transform]{transform-box:view-box;transform-origin:0 0}
.o{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.o2{stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.scene svg,.figure svg,.vmini svg,.bal-fig svg,.flavor svg{fill:var(--ink)}
.t{font-family:var(--display);letter-spacing:.04em}
.lb{font-family:var(--body);font-weight:700}
.a-bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.a-sway{animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.a-spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.a-pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}15%{transform:scale(1.16)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.a-rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(6px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.a-blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.a-vib{animation:vib .22s linear infinite}
@keyframes vib{50%{transform:translateX(1.6px)}}
.a-glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.35}}
.d1{animation-delay:.4s} .d2{animation-delay:.8s} .d3{animation-delay:1.2s} .d4{animation-delay:1.6s} .d5{animation-delay:2s}
#sv-nerv .cns,#sv-nerv .pns,#sv-skin .rc,#sv-ear .hear,#sv-ear .bal,#sv-taste .myth,#sv-taste .truth{transition:opacity .3s}
#sv-nerv[data-ns="cns"] .pns,#sv-nerv[data-ns="pns"] .cns{opacity:.12}
#sv-skin[data-skin="touch"] .rc:not(.r-touch),#sv-skin[data-skin="press"] .rc:not(.r-press),#sv-skin[data-skin="temp"] .rc:not(.r-temp),#sv-skin[data-skin="pain"] .rc:not(.r-pain){opacity:.12}
#sv-ear[data-ear="hear"] .bal,#sv-ear[data-ear="bal"] .hear{opacity:.12}
#sv-taste[data-tongue="truth"] .myth,#sv-taste[data-tongue="myth"] .truth{opacity:0}
#sv-eye .iris-t{transform-origin:50% 0;transition:transform .5s ease}
#sv-eye .iris-b{transform-origin:50% 100%;transition:transform .5s ease}

body.motion-off .scene *,body.motion-off .mini *,body.motion-off .vmini *{animation-play-state:paused!important}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.xp-float{position:fixed;z-index:60;font-family:var(--display);font-size:32px;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);text-shadow:2px 2px 0 var(--ink);pointer-events:none;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{transform:translate(-50%,-72px) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){
  body:not(.motion-on) .scene *,body:not(.motion-on) .mini *,body:not(.motion-on) .vmini *{animation:none!important}
  .screen,.result-stars span,.fb,.opt,.slot,.pin,.xp.bump{animation:none!important}
  .btn,.opt,.land,.bar i,.progress i,#sv-eye *,.nose-clip,.smell-wave{transition:none!important}
}
/* ---------- PRINT: an A4 study sheet replaces the interactive page ---------- */
.print-sheet{display:none}
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff!important;background-image:none!important}
  body > :not(.print-sheet){display:none!important}
  .print-sheet{display:block;color:#111;font-family:var(--body);font-size:9.7pt;line-height:1.34}
  .print-sheet *{animation:none!important;transition:none!important;box-shadow:none!important}
  .print-sheet h1,.print-sheet h2,.print-sheet h3{font-family:var(--body);font-weight:800;letter-spacing:0;line-height:1.2;color:#111}
  .print-sheet h1{font-size:16pt}
  .print-sheet h2{font-size:14pt;margin:8pt 0 4pt;break-after:avoid}
  .print-sheet h3{font-size:10.5pt;margin:0 0 1pt;break-after:avoid}
  .print-sheet p{margin:0 0 3pt}
  .print-sheet ul,.print-sheet ol{margin:0;padding-left:12pt}
  .print-sheet li{margin:0 0 1.5pt}
  .print-sheet b{font-weight:800}

/* ---------- FLOW: dots that travel along SVG paths ---------- */
/* Each flow follows one or more path segments. A segment can fade its colour (c0 -> c1),

const Flow = (() => {

  const mix = (a, b, k) => "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(",") + ")";

  function add(svg, cfg){

      const el = svg.querySelector("#" + s[0]);
      if (!el || typeof el.getTotalLength !== "function") return;
      let len = 0; try { len = el.getTotalLength(); } catch (e) { len = 0; }
      if (len > 0) segs.push({el, len, c0:rgb(s[1]), c1:rgb(s[2] || s[1]), jit:s[3] || 0});

    const g = document.createElementNS(NS, "g");

  }
  function draw(){
    items.forEach(it => {
      if (!it.dots[0].isConnected) return;
      it.dots.forEach((c, i) => {

        let d = f * it.total, k = 0;
        while (k < it.segs.length - 1 && d > it.segs[k].len){ d -= it.segs[k].len; k++; }

function papillae(){
  let out = "", seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let y = 36; y <= 160; y += 11) for (let x = 30; x <= 102; x += 11){
    const px = x + (rnd() - .5) * 6, py = y + (rnd() - .5) * 6;
    const inside = py < 106 ? (px > 26 && px < 106) : Math.pow((px - 66) / 42, 2) + Math.pow((py - 106) / 64, 2) < 1;
    if (inside && Math.abs(px - 66) > 3) out += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.4" fill="#FFC9D5" stroke="#E46F8A" stroke-width="1"/>`;
  }
  return out;
}

}

function startCheck(c){
  const host = $("#qc-host"); let i = 0, right = 0;
  const step = () => {
    if (i >= c.check.length) return finishCheck(c, right, host);
    const q = c.check[i];
    mountQ(host, q, {kicker:`Question ${i + 1} of ${c.check.length}`, xp:10,
      nextLabel:i === c.check.length - 1 ? "See my stars" : "Next question",
      onAnswer(ok){ if (ok) right++; },
      onNext(){ i++; step(); scrollToEl(host); }});
  };
  step();
}
function finishCheck(c, right, host){
  const n = c.check.length, stars = right === n ? 3 : right === n - 1 ? 2 : right > 0 ? 1 : 0;
  const st = chState(c.id);
  S.ch[c.id] = Object.assign({}, st, {seen:true, done:true, best:Math.max(st.best || 0, right), n, stars:Math.max(st.stars || 0, stars)});
  save();
  const nextC = CH[c.n];
  host.innerHTML = `<div class="qc-done panel" aria-live="polite">
    <p class="big">${stars === 3 ? "PERFECT!" : stars === 2 ? "GREAT JOB!" : stars === 1 ? "GOOD START!" : "KEEP GOING!"}</p>
    <div class="result-stars" role="img" aria-label="${stars} of 3 stars">${[0, 1, 2].map(k => `<span style="animation-delay:${k * .18}s">${starSVG(k < stars)}</span>`).join("")}</div>
    <p>You got <b>${right} of ${n}</b> right.${stars < 3 ? " Read the cards above again, then try for 3 stars." : ""}</p>
    <div class="row" style="justify-content:center">
      <button class="btn btn-sm" data-act="retry-check">Try again</button>
      ${nextC ? `<button class="btn btn-sm btn-go" data-act="open" data-ch="${nextC.id}">Part ${nextC.n}: ${nextC.name} ${ARROW}</button>` : `<button class="btn btn-sm btn-go" data-act="review">Lesson Review ${ARROW}</button>`}
    </div></div>`;
  if (stars === 3){ Sound.win(); FX.party(); } else if (stars > 0) Sound.good();
  $$(".step").forEach(b => { if (b.dataset.ch === c.id) b.classList.add("done"); });
}

/* ---------- QUESTION ENGINE ---------- */
function mountQ(host, q, cfg){
  cfg = cfg || {};
  let body = "";
  if (q.t === "mc"){
    const ord = shuffle(q.o.map((_, i) => i));
    body = `<div class="opts">${ord.map((oi, k) => `<button class="opt" data-oi="${oi}"><span class="k">${"ABCDEF"[k]}</span><span>${q.o[oi]}</span></button>`).join("")}</div>`;
  } else if (q.t === "order"){
    body = `<p class="q-how">Tap the steps in the right order. Tap a placed step to send it back.</p><ol class="seq" aria-label="Your order"></ol><div class="pool" role="group" aria-label="Steps to place"></div><div class="row"><button class="btn btn-ink btn-sm" data-check disabled>Check my order</button></div>`;
  } else if (q.t === "sort"){
    const items = shuffle(q.items.map((_, i) => i));
    body = `<p class="q-how">Pick a group for each one, then check.</p><div class="sort-list">${items.map(i => `<div class="sort-row" data-i="${i}"><p>${q.items[i][0]}</p><div class="seg" role="group" aria-label="${strip(q.items[i][0])}">${q.groups.map((g, gi) => `<button data-g="${gi}" aria-pressed="false">${g}</button>`).join("")}</div></div>`).join("")}</div><div class="row"><button class="btn btn-ink btn-sm" data-check disabled>Check</button></div>`;
  } else if (q.t === "find"){
    body = `<p class="q-how">Tap the right number on the diagram.</p>`;
  }
  const fig = q.fig ? figHTML(q.fig, q.t === "find" ? {mode:"find", pins:q.pins} : {hi:q.hi}) : "";
  host.innerHTML = `<div class="q-card panel"><p class="q-kicker">${cfg.kicker || ""}</p><p class="q-text">${q.q}</p>${fig}${body}<div class="fb-slot"></div></div>`;
  const card = host.firstElementChild, slot = $(".fb-slot", card);
  let done = false;
  function finish(ok, extra, detail, el){
    if (done) return; done = true;
    if (ok){ Sound.good(); addXP(cfg.xp || 10, el); FX.burstEl(el, 26); } else Sound.bad();
    if (cfg.onAnswer) cfg.onAnswer(ok, detail || {});
    slot.innerHTML = `<div class="fb ${ok ? "ok" : "no"}"><span class="burst">${ok ? pick(PRAISE) : "NOT QUITE"}</span><div class="fb-body">${extra || ""}${q.why ? `<p>${q.why}</p>` : ""}</div><div class="row"><button class="btn btn-go" data-next>${cfg.nextLabel || "Next"} ${ARROW}</button></div></div>`;
    announce((ok ? "Correct! " : "Not quite. ") + strip(extra) + " " + strip(q.why));
    const nb = $("[data-next]", slot);
    nb.addEventListener("click", () => { Sound.tap(); if (cfg.onNext) cfg.onNext(ok); });
    try { nb.focus({preventScroll:true}); } catch (e) {}
    const r = slot.getBoundingClientRect();
    if (r.bottom > innerHeight - 8) window.scrollBy({top:r.bottom - innerHeight + 24, behavior:reduceMotion ? "auto" : "smooth"});
  }
  if (q.t === "mc"){
    $$(".opt", card).forEach(b => b.addEventListener("click", () => {
      if (done) return;
      const oi = +b.dataset.oi, ok = oi === q.a;
      $$(".opt", card).forEach(x => { x.disabled = true; const xi = +x.dataset.oi; if (xi === q.a) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); else x.classList.add("dim"); });
      finish(ok, ok ? "" : `<p>Answer: <b>${q.o[q.a]}</b></p>`, {given:strip(q.o[oi]), correct:strip(q.o[q.a])}, b);
    }));
  } else if (q.t === "order"){
    const n = q.items.length; let pool = shuffle(q.items.map((_, i) => i)); if (pool.every((v, i) => v === i)) pool.reverse();
    const placed = [], seq = $(".seq", card), poolEl = $(".pool", card), chk = $("[data-check]", card);
    const draw = () => {
      seq.innerHTML = q.items.map((_, i) => placed[i] !== undefined
        ? `<li><button class="slot filled" data-un="${i}" aria-label="Step ${i + 1}: ${strip(q.items[placed[i]])}. Tap to send it back."><span class="n">${i + 1}</span><span>${q.items[placed[i]]}</span></button></li>`
        : `<li><div class="slot"><span class="n">${i + 1}</span><span class="ph">${i === placed.length ? "tap a step below" : ""}</span></div></li>`).join("");
      poolEl.innerHTML = pool.filter(v => !placed.includes(v)).map(v => `<button class="chipbtn" data-add="${v}">${q.items[v]}</button>`).join("");
      chk.disabled = placed.length !== n;
    };
    draw();
    seq.addEventListener("click", e => { const b = e.target.closest("[data-un]"); if (!b || done) return; placed.splice(+b.dataset.un, 1); Sound.tap(); draw(); });
    poolEl.addEventListener("click", e => {
      const b = e.target.closest("[data-add]"); if (!b || done) return;
      placed.push(+b.dataset.add); Sound.tap(); draw();
      const nx = poolEl.querySelector("[data-add]");
      try { (nx || chk).focus({preventScroll:true}); } catch (err) {}
    });
    chk.addEventListener("click", () => {
      if (done || placed.length !== n) return;
      const ok = placed.every((v, i) => v === i), right = placed.filter((v, i) => v === i).length;
      seq.innerHTML = placed.map((v, i) => `<li><div class="slot ${v === i ? "ok" : "no"}"><span class="n">${i + 1}</span><span>${q.items[v]}</span></div></li>`).join("");
      poolEl.innerHTML = ""; chk.hidden = true;
      finish(ok, ok ? "" : `<p>${right} of ${n} steps are in the right place. The correct order is:</p><ol>${q.items.map(t => `<li>${t}</li>`).join("")}</ol>`,
        {given:placed.map(v => strip(q.items[v])).join(" → "), correct:q.items.map(strip).join(" → ")}, seq);
    });
  } else if (q.t === "sort"){
    const choice = {}, rows = $$(".sort-row", card), chk = $("[data-check]", card);
    rows.forEach(r => r.addEventListener("click", e => {
      const b = e.target.closest("[data-g]"); if (!b || done) return;
      choice[r.dataset.i] = +b.dataset.g;
      $$("[data-g]", r).forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      Sound.tap(); chk.disabled = Object.keys(choice).length !== q.items.length;
    }));
    chk.addEventListener("click", () => {
      if (done || Object.keys(choice).length !== q.items.length) return;
      let right = 0;
      rows.forEach(r => {
        const i = +r.dataset.i, good = choice[i] === q.items[i][1];
        if (good) right++;
        r.classList.add(good ? "ok" : "no");
        $$("[data-g]", r).forEach(x => { x.disabled = true; });
        if (!good) r.insertAdjacentHTML("beforeend", `<span class="corr">✓ Answer: ${q.groups[q.items[i][1]]}</span>`);
      });
      chk.hidden = true;
      const ok = right === q.items.length;
      finish(ok, ok ? "" : `<p>${right} of ${q.items.length} sorted correctly. The fixes are marked in green above.</p>`,
        {given:`${right} of ${q.items.length} sorted correctly`, correct:q.items.map(it => `${strip(it[0])}: ${q.groups[it[1]]}`).join("; ")}, chk);
    });
  } else if (q.t === "find"){
    const F = FIGS[q.fig];
    $$(".pin", card).forEach(p => p.addEventListener("click", () => {
      if (done) return;
      const k = p.dataset.pin, ok = k === q.a;
      $$(".pin", card).forEach(x => { x.disabled = true; if (x.dataset.pin === q.a) x.classList.add("right"); });
      if (!ok) p.classList.add("wrong");
      finish(ok, ok ? `<p>Yes, that's the <b>${F.parts[q.a].name}</b>.</p>` : `<p>You tapped the <b>${F.parts[k].name}</b>. The answer is number ${q.pins.indexOf(q.a) + 1}, the <b>${F.parts[q.a].name}</b>.</p>`,
        {given:F.parts[k].name, correct:F.parts[q.a].name}, p);
    }));
  }
}

/* ---------- LABEL LAB ---------- */
let labMode = "learn", labFig = "eye", labSel = null;
const DRILL_SETS = ["eye", "ear", "brain", "neuron", "mix"];
const seenIn = f => Object.keys(FIGS[f].parts).filter(k => S.lab.seen[f + ":" + k]).length;
function markSeen(f, k, el){
  if (S.lab.seen[f + ":" + k]) return false;
  S.lab.seen[f + ":" + k] = true; save(); addXP(2, el);
  return true;
}
function renderLab(){
  if (labMode === "learn" && !FIGS[labFig]) labFig = "eye";
  const lb = labBest();
  const sets = labMode === "drill" ? DRILL_SETS : FIG_KEYS;
  const note = k => labMode === "drill"
    ? (typeof S.lab.best[k] === "number" ? ` <small>· best ${S.lab.best[k]}%</small>` : "")
    : ` <small>· ${seenIn(k)}/${Object.keys(FIGS[k].parts).length}</small>`;
  $("#scr-lab").innerHTML = `<div class="col-c9">
    <div class="lesson-top"><span class="chip-land">Label Lab</span><span class="day">Parts 2, 3, 7 and 8</span></div>
    <div class="intro panel"><p class="kick">Practice · Thu 29/10: the eye and the ear</p><h2>Label Lab</h2><p class="bigq">Can you label the eye, the ear, the brain and a neuron?</p>
      <p class="from">Explore each diagram first: tap a number to see the part's name and its job. Then take the drill and match each label to its numbered pin. Your best score for each drill is saved.</p></div>
    <div class="tabs" role="tablist" aria-label="Label Lab mode" style="margin-top:16px">
      <button class="tab" role="tab" data-act="lab-mode" data-mode="learn" aria-selected="${labMode === "learn"}">1 · Explore (${labSeenN()}/${LAB_TOTAL})</button>
      <button class="tab" role="tab" data-act="lab-mode" data-mode="drill" aria-selected="${labMode === "drill"}">2 · Drill${lb === null ? "" : ` (best ${lb}%)`}</button>
    </div>
    <div class="fig-pick" role="group" aria-label="${labMode === "drill" ? "Choose a drill" : "Choose a diagram"}">${sets.map(k => `<button data-act="lab-fig" data-fig="${k}" aria-pressed="${labFig === k}">${k === "mix" ? "All four (mixed)" : FIGS[k].title}${note(k)}</button>`).join("")}</div>
    <div id="lab-body" style="margin-top:14px"></div></div>`;
  if (labMode === "learn") labLearn(); else labDrillStart();

function labLearn(){
  const body = $("#lab-body"), F = FIGS[labFig], keys = Object.keys(F.parts), nm = F.title.toLowerCase();
  body.innerHTML = `<section class="widget panel" style="margin-top:0"><p class="how">Tap a number (or a name) to see what that part does. Explore all ${keys.length}, then try the drill.</p>
    <div class="split">${figHTML(labFig, {mode:"learn", pins:keys})}
      <div style="display:grid;gap:12px;align-content:start">
        <div class="part-info lab-info" aria-live="polite"><h4>Tap a number</h4><p>Each number points to one part of ${nm}.</p></div>
        <div class="part-chips" role="group" aria-label="Parts of ${nm}">${keys.map(k => `<button data-labpart="${k}" class="${S.lab.seen[labFig + ":" + k] ? "seen" : ""}" aria-pressed="false">${F.parts[k].name}</button>`).join("")}</div>
        <div class="row"><button class="btn btn-go btn-sm" data-act="lab-mode" data-mode="drill">Start the drill ${ARROW}</button></div>
      </div></div></section>`;
  if (labSel && F.parts[labSel]) selectLabPart(labSel, true);
}
function selectLabPart(k, quiet){
  const F = FIGS[labFig], keys = Object.keys(F.parts); labSel = k;
  $$("#lab-body .pin").forEach(p => p.classList.toggle("sel", p.dataset.pin === k));
  $$("#lab-body [data-labpart]").forEach(b => b.setAttribute("aria-pressed", b.dataset.labpart === k ? "true" : "false"));
  const box = $("#lab-body .lab-info");
  if (box) box.innerHTML = `<h4>${keys.indexOf(k) + 1} · ${F.parts[k].name}</h4><p>${F.parts[k].info}</p>`;
  if (markSeen(labFig, k, $(`#lab-body .pin[data-pin="${k}"]`))){
    $$(`#lab-body [data-pin="${k}"], #lab-body [data-labpart="${k}"]`).forEach(x => x.classList.add("seen"));
    const tab = $('[data-act="lab-mode"][data-mode="learn"]'); if (tab) tab.textContent = `1 · Explore (${labSeenN()}/${LAB_TOTAL})`;
    const sm = $(`.fig-pick [data-fig="${labFig}"] small`); if (sm) sm.textContent = `· ${seenIn(labFig)}/${keys.length}`;
    if (seenIn(labFig) === keys.length){ Sound.win(); announce(`You explored all ${keys.length} parts of ${F.title.toLowerCase()}. Try the drill!`); }
  }

}
function labDrillStart(){
  const set = labFig;
  let items;
  if (set === "mix") items = shuffle(FIG_KEYS.flatMap(f => shuffle(Object.keys(FIGS[f].parts)).slice(0, 3).map(k => [f, k])));
  else {
    const keys = shuffle(Object.keys(FIGS[set].parts));
    items = keys.map(k => [set, k]);
    items.push([set, pick(keys.filter(k => k !== keys[keys.length - 1]))]);
  }
  const rounds = items.map(([f, k], i) => {
    const F = FIGS[f], all = Object.keys(F.parts);
    return i % 2 === 0
      ? {t:"find", fig:f, pins:all, a:k, key:k, q:`Find it: tap the <b>${F.parts[k].name}</b>.`, why:F.parts[k].info}
      : {t:"mc", fig:f, hi:k, key:k, q:"Name it: which part is marked with the pink <b>?</b>", o:[F.parts[k].name, ...shuffle(all.filter(x => x !== k)).slice(0, 3).map(x => F.parts[x].name)], a:0, why:F.parts[k].info};
  });
  let i = 0, right = 0; const misses = [];
  const body = $("#lab-body");
  const step = () => {
    if (i >= rounds.length) return labDrillDone(set, right, rounds.length, misses);
    body.innerHTML = `<div class="test-top" style="margin-top:0"><div class="row"><span class="round-name">${set === "mix" ? "Mixed" : FIGS[set].title} drill</span><span class="counter">${i + 1} / ${rounds.length}</span></div>
      <div class="progress" role="progressbar" aria-label="Drill progress" aria-valuemin="0" aria-valuemax="${rounds.length}" aria-valuenow="${i}"><i style="width:${pctOf(i, rounds.length)}%"></i></div></div><div id="ld-q" style="margin-top:14px"></div>`;
    const q = rounds[i];
    mountQ($("#ld-q"), q, {kicker:(q.t === "find" ? "Find the part" : "Name the part") + (set === "mix" ? " · " + FIGS[q.fig].title : ""), xp:5,
      nextLabel:i === rounds.length - 1 ? "See my score" : "Next",
      onAnswer(ok){ if (ok) right++; else misses.push(q.fig + ":" + q.key); },
      onNext(){ i++; step(); scrollToEl($("#lab-body")); }});
  };
  step();
}
function labDrillDone(set, right, n, misses){
  const pct = pctOf(right, n), pass = pct >= 70, prev = S.lab.best[set];
  const isNew = typeof prev === "number" && pct > prev;
  S.lab.best[set] = typeof prev === "number" ? Math.max(prev, pct) : pct;
  S.lab.runs.push({t:Date.now(), set, pct}); if (S.lab.runs.length > 20) S.lab.runs = S.lab.runs.slice(-20);
  save();
  const uniq = [...new Set(misses)].map(s => s.split(":"));
  $("#lab-body").innerHTML = `<div class="qc-done panel" aria-live="polite">
    <p class="big">${pct === 100 ? "PERFECT!" : pass ? "WELL DONE!" : "NOT YET!"}</p>
    <p style="font-size:20px;font-weight:800">${right} / ${n} correct · ${pct}%</p>
    <div class="target" style="width:min(420px,100%)"><span>0%</span><div class="bar" role="img" aria-label="Score ${pct}% with the 70% goal marked"><i style="width:${pct}%;background:${pass ? "var(--good)" : "var(--bad)"}"></i><span class="mark70"></span></div><span>goal 70%</span></div>
    <p>${isNew ? "New best! " : ""}Your best for this drill: <b>${S.lab.best[set]}%</b>. ${pass ? "Now aim for 100%!" : "Explore the parts again, then retry the drill."}</p>
    ${uniq.length ? `<p><b>Review these:</b> ${uniq.map(([f, k]) => FIGS[f].parts[k].name + (set === "mix" ? ` (${FIGS[f].title.toLowerCase()})` : "")).join(", ")}</p>` : ""}
    <div class="row" style="justify-content:center"><button class="btn btn-sm" data-act="lab-mode" data-mode="learn">Explore the parts</button><button class="btn btn-sm btn-go" data-act="lab-again">Try the drill again</button></div></div>`;
  if (pct === 100){ Sound.win(); FX.party(); } else if (pass) Sound.win();
  const tab = $('[data-act="lab-mode"][data-mode="drill"]'); if (tab) tab.textContent = `2 · Drill (best ${labBest()}%)`;
  const b = $(`.fig-pick [data-fig="${set}"]`); if (b) b.innerHTML = `${set === "mix" ? "All four (mixed)" : FIGS[set].title} <small>· best ${S.lab.best[set]}%</small>`;
}

/* ---------- LESSON REVIEW ---------- */
function pickReview(){
  const byCh = CH.map(c => shuffle(REVIEW.filter(q => q.ch === c.id)));
  const qs = byCh.flatMap(a => a.slice(0, 2));
  const rest = shuffle(byCh.flatMap(a => a.slice(2)));
  return shuffle(qs.concat(rest.slice(0, Math.max(0, 20 - qs.length))));
}
function renderReviewIntro(){
  R = null;
  $("#scr-review").innerHTML = `<div class="test-intro panel">
    <p class="kick">Thursday 29/10 · Lesson Review</p><h2>Lesson Review</h2>
    <p>20 questions picked at random from a bank of ${REVIEW.length}, with at least 2 from every part of the lesson, so every try is a new mix. At the end, a weak-spot report shows which parts to replay.</p>

/* ---------- REACTION-TIME TEST (Part 3) ---------- */
/* idle -> wait (random 1.5-4 s) -> go -> result ... after 5 good tries -> done. A tap during "wait" is a false start. */
const RT = (() => {
  let state = "idle", tries = [], t0 = 0, timer = 0, lastIn = 0, pad = null;
  function reset(){ if (timer) clearTimeout(timer); timer = 0; state = "idle"; tries = []; pad = null; }
  function set(st, big, small){ state = st; if (!pad) return; pad.dataset.state = st; pad.innerHTML = `<span class="big">${big}</span><span class="small">${small}</span>`; }
  function info(html){ const el = $("#rtInfo"); if (el) el.innerHTML = html; }
  function drawTries(){
    const el = $("#rtTries"); if (!el) return;
    const best = tries.length ? Math.min(...tries) : null;
    el.innerHTML = `<span>Tries:</span>` + [0, 1, 2, 3, 4].map(i => tries[i] === undefined
      ? `<span class="rt-try empty">${i + 1}</span>`
      : `<span class="rt-try${tries[i] === best ? " best" : ""}">${tries[i]} ms</span>`).join("");
  }
  function arm(){
    set("wait", "WAIT…", "Tap when it turns green");
    timer = setTimeout(() => {
      timer = 0; set("go", "TAP!", "Now!"); t0 = performance.now();
      requestAnimationFrame(() => { if (state === "go") t0 = performance.now(); });
    }, 1500 + Math.random() * 2500);
  }
  function finish(){
    const best = Math.min(...tries), avg = Math.round(tries.reduce((s, v) => s + v, 0) / tries.length), prev = S.react.best;
    if (prev === null || best < prev) S.react.best = best;
    S.react.runs.push({t:Date.now(), best}); if (S.react.runs.length > 12) S.react.runs = S.react.runs.slice(-12);
    save();
    set("done", best + " ms", "Your best of 5. Tap to play again.");
    addXP(10, pad); Sound.win();
    info(`<h4>Best of 5: ${best} ms (${(best / 1000).toFixed(2)} s)</h4>
      <p>Average: ${avg} ms. ${prev !== null && best < prev ? "That's a new personal best! " : ""}A typical reaction to something you see takes about <b>0.2–0.3 seconds</b> (200–300 ms).</p>
      <p><b>Why can't it be 0?</b> Your eyes have to <b>sense</b> the green, the signal travels to your brain, your brain <b>processes</b> it and decides to tap, and a signal travels along motor neurons to your finger muscles, which <b>move</b>. Sense → process → move. The signals themselves are fast, so most of the time goes on sensing and deciding.</p>
      <p class="how">In sprint races, a start less than 0.1 seconds after the starting gun counts as a false start, because nobody can really react that fast.</p>`);
    announce(`Best of 5: ${best} milliseconds.`);
  }
  function hit(){
    if (!pad) return;
    const now = performance.now();
    if (state === "idle" || state === "result" || state === "false"){ arm(); return; }
    if (state === "done"){ tries = []; drawTries(); arm(); return; }
    if (state === "wait"){
      if (timer) clearTimeout(timer); timer = 0; Sound.bad();
      set("false", "TOO SOON!", "False start: it wasn't green yet, so that one doesn't count. Tap to try again.");
      announce("False start. That one doesn't count."); return;
    }
    if (state === "go"){
      const ms = Math.round(now - t0);
      if (ms < 100){ Sound.bad(); set("false", "TOO SOON!", "Under 100 ms is too fast to be a real reaction: that was a guess! Tap to try again."); announce("Too fast to be real. It counts as a false start."); return; }
      tries.push(ms); drawTries(); Sound.good();
      if (tries.length < 5){ set("result", ms + " ms", `Try ${tries.length} of 5. Tap to go again.`); announce(ms + " milliseconds. Try " + tries.length + " of 5."); }
      else finish();
    }
  }
  function mount(){
    pad = $("#rtPad"); if (!pad) return;
    state = "idle"; tries = []; drawTries();
    pad.addEventListener("pointerdown", e => { if (e.button > 0) return; lastIn = performance.now(); hit(); });
    pad.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat){ e.preventDefault(); lastIn = performance.now(); hit(); } });
    pad.addEventListener("click", () => { if (performance.now() - lastIn < 800) return; hit(); });
  }
  return {mount, reset, get state(){ return state; }, get tries(){ return tries.slice(); }};
})();

    + `</div><h2>Word bank</h2><div class="ps-bank">${bank}</div>`
    + `<section class="ps-labelpage">` + head("Label the Eye and the Ear", "Write the name of each numbered part. Use the word box.")
    + row("eye", "The eye") + row("ear", "The ear")
    + `<div class="ps-box"><h3>Word box</h3><ul class="ps-words">${words.map(w => `<li>${w}</li>`).join("")}</ul></div>`
    + `<h2>What each part does</h2><div class="ps-bank">${jobs("eye")}${jobs("ear")}</div>`
    + `<p class="ps-key"><b>Answer key.</b> Eye: ${key("eye")}. Ear: ${key("ear")}.</p></section>`;
}

/* ---------- START ---------- */
$("#xpVal").textContent = S.xp;
renderSoundBtn();
applyMotionClass();
addEventListener("hashchange", route);
route();
renderPrintSheet();
</script>
