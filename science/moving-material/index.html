<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moving Material Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2212%22 fill=%22%23FFD23F%22 stroke=%22%2314163A%22 stroke-width=%225%22/%3E%3Cpath d=%22M18 33l9 9 19-20%22 fill=%22none%22 stroke=%22%2314163A%22 stroke-width=%227%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#14163A; --ink-2:#4A4D78; --ink-3:#8A8DB0;
  --paper:#FFFFFF; --page:#E4F2FF; --dot:rgba(20,22,58,.07);
  --sun:#FFD23F; --sun-2:#FFF3C4;
  --good:#12A15E; --good-bg:#DCF7E9;
  --bad:#E23D45; --bad-bg:#FFE1E2;
  --warn:#C77700; --warn-bg:#FFF0D1;
  --c1:#2F7DE1; --c1t:#DCEBFF;
  --c2:#F39200; --c2t:#FFE8C2;
  --c3:#9A4FE0; --c3t:#EEE0FF;
  --c4:#119C77; --c4t:#D2F4E8;
  --c5:#E23F66; --c5t:#FFDDE6;
  --c6:#0E9BB0; --c6t:#D3F3F7;
  --c7:#C77700; --c7t:#FFF0D1;
  --c8:#5B4FE0; --c8t:#E3E1FF;
  --c9:#D9469E; --c9t:#FCE1F1;
  --col:var(--c1); --tint:var(--c1t);
  --shadow:4px 4px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --r:14px; --r-sm:10px;
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.col-c1{--col:var(--c1);--tint:var(--c1t)} .col-c2{--col:var(--c2);--tint:var(--c2t)} .col-c3{--col:var(--c3);--tint:var(--c3t)}
.col-c4{--col:var(--c4);--tint:var(--c4t)} .col-c5{--col:var(--c5);--tint:var(--c5t)} .col-c6{--col:var(--c6);--tint:var(--c6t)}
.col-c7{--col:var(--c7);--tint:var(--c7t)} .col-c8{--col:var(--c8);--tint:var(--c8t)} .col-c9{--col:var(--c9);--tint:var(--c9t)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-width:0}
.logo-mark{font-family:var(--display);font-size:28px;letter-spacing:.05em;color:var(--c5);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg);white-space:nowrap}
.unit-chip{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:#fff;padding:4px 8px;border-radius:6px;white-space:nowrap}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--sun-2);border:2px solid var(--ink);border-radius:999px;padding:3px 12px 3px 6px;white-space:nowrap}
.xp svg{width:20px;height:20px}
.xp.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:scale(1.18)}}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:2px 2px 0 var(--ink);padding:0}
.icon-btn svg{width:22px;height:22px}
@media (max-width:560px){.unit-chip{display:none}.logo-mark{font-size:24px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font-weight:800;font-size:16px;line-height:1.2;box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .08s;text-align:center;text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-go{background:var(--sun)}
.btn-ink{background:var(--ink);color:#fff}
.btn-col{background:var(--col);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn-sm{min-height:40px;padding:6px 14px;font-size:14px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.screen{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* home */
.hero{margin-top:20px;padding:20px;display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(42px,7vw,66px)}
.hero h1 span{color:var(--c5);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.hero p.lead{margin-top:10px;max-width:50ch;color:var(--ink-2)}
.hero .row{margin-top:14px}
.kick{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:2px solid var(--ink);border-radius:10px;padding:10px 6px;background:var(--page);text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
@media (max-width:680px){.hero{grid-template-columns:1fr}}
.hw{margin-top:16px;padding:14px 16px;display:grid;gap:10px;background:var(--sun-2)}
.hw h2{font-size:28px}
.hw-item{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper)}
.hw-item p{flex:1 1 230px;font-size:15px}
.hw-item p b{display:block;font-size:16px}
.due{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;border:2px solid var(--ink);background:var(--bad-bg);white-space:nowrap;margin-top:4px}
.sec-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:34px 0 14px}
.sec-title h2{font-size:36px}
.sec-title p{color:var(--ink-2);font-size:14px}

/* lesson trail */
.trail{position:relative;display:grid;gap:20px;padding-block:4px}
.trail::before{content:"";position:absolute;top:0;bottom:-20px;left:50%;border-left:4px dashed var(--ink-3);transform:translateX(-2px)}
.land{position:relative;width:calc(50% - 26px);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;text-align:left;background:var(--tint);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .15s}
.land:nth-child(odd){justify-self:start}
.land:nth-child(even){justify-self:end}
.land:hover{transform:translateY(-3px) rotate(-.4deg)}
.land::after{content:"";position:absolute;top:24px;width:22px;height:22px;border-radius:50%;background:var(--col);border:3px solid var(--ink)}
.land:nth-child(odd)::after{right:-40px}
.land:nth-child(even)::after{left:-40px}
@media (max-width:680px){.trail::before{left:18px}.land{width:calc(100% - 44px);justify-self:end!important}.land::after{left:-40px!important;right:auto!important}}
.badge{width:56px;height:56px;border-radius:50%;background:var(--col);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink);flex:none}
.badge svg{width:32px;height:32px}
.land-num{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.land h3{font-size:28px}
.land .sub{font-size:14px;color:var(--ink-2);margin-top:2px}
.land-foot{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.day{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.progress-note{font-size:13px;font-weight:700;color:var(--ink-2)}
.stars{display:flex;gap:2px}
.stars svg{width:24px;height:24px}
.sticker{position:absolute;top:-19px;right:12px;font-family:var(--display);font-size:18px;letter-spacing:.05em;background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;transform:rotate(4deg);box-shadow:2px 2px 0 var(--ink)}
.sticker.ok{background:var(--good)}
.land-num{display:block}
.lt{display:block;font-family:var(--display);font-size:28px;line-height:1.05;letter-spacing:.03em;margin-top:1px}
.land .sub,.xcard .sub{display:block}
.xcard .lt{font-size:32px}
.xcard .sub{font-size:14px;margin-top:2px}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px}
@media (max-width:680px){.extras{grid-template-columns:1fr}}
.xcard{position:relative;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--tint);text-align:left}
.xcard h3{font-size:32px}
.xcard p{font-size:14px}
.xcard .row{grid-column:1 / -1}
.xcard.final{background:var(--sun)}
.xcard.final .badge{background:var(--ink)}
.bank{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.bank{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:340px){.bank{grid-template-columns:1fr}}
.vw{border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:3px 3px 0 var(--col)}
.vw summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;overflow-wrap:anywhere}
.vw summary::-webkit-details-marker{display:none}
.vw summary::after{content:"+";flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;line-height:1;background:var(--tint)}
.vw[open] summary::after{content:"\2013"}
.vw p{padding:0 12px 12px;font-size:14px;color:var(--ink-2)}
.vw p small{display:block;margin-top:4px;font-weight:700;color:var(--col)}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.chip-land{font-family:var(--display);font-size:22px;letter-spacing:.04em;padding:3px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--col);color:#fff;-webkit-text-stroke:.5px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.step{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:13px;padding:0}
.step.done{background:var(--good);color:#fff}
.step.now{box-shadow:0 0 0 3px var(--sun);transform:scale(1.1)}
@media (max-width:560px){.steps{margin-left:0}}
.intro{margin-top:14px;padding:20px;display:grid;gap:10px;background:var(--tint)}
.intro h2{font-size:clamp(36px,7vw,58px);color:var(--col);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.intro .bigq{font-size:clamp(19px,2.6vw,23px);font-weight:700;max-width:46ch}
.intro .from{font-size:14px;color:var(--ink-2)}
.scene-box{margin:16px 0 0;padding:12px;display:grid;gap:10px;position:relative}
.scene{position:relative;background:var(--tint);border:3px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;width:100%;max-width:680px;margin-inline:auto}
.scene svg{width:100%;height:100%;display:block}
.scene-box figcaption{font-size:15px;color:var(--ink-2)}
.scene-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.motion-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 10px;font-size:13px;font-weight:800;border:2px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:2px 2px 0 var(--ink)}
.motion-btn svg{width:14px;height:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block;flex:none}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{min-height:38px;padding:5px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:700;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.tog[aria-pressed="true"]{background:var(--col);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.icard{padding:14px 16px;border:3px solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow-sm);min-width:0}
.icard h3{font-size:25px;color:var(--col);-webkit-text-stroke:.7px var(--ink)}
.icard p{margin-top:6px;font-size:16px}
.icard ul{margin:8px 0 0;padding-left:20px;font-size:15px;display:grid;gap:4px}
.ref-tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);background:var(--page);border:2px solid var(--ink);border-radius:6px;padding:1px 6px;margin-bottom:6px}
.fact{margin-top:16px;padding:14px 16px;background:var(--sun-2);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow-sm);transform:rotate(-.5deg)}
.fact .tag{font-family:var(--display);font-size:22px;letter-spacing:.04em;margin-right:6px}
.connect{margin-top:16px;padding:12px 16px;border:3px dashed var(--ink);border-radius:var(--r);background:var(--paper);font-size:15px}
.connect b.tag{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.04em;color:var(--col);margin-right:4px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.kw-chip{font-size:14px;font-weight:700;padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--tint)}
.kw .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-right:4px}
.widget{margin-top:16px;padding:16px;display:grid;gap:12px}
.widget h3{font-size:28px}
.widget .how{font-size:14px;color:var(--ink-2)}
.qc{margin-top:28px}
.qc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.qc-head h2{font-size:36px}
.qc-head p{color:var(--ink-2);font-size:14px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}

/* widgets */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.split{grid-template-columns:1fr}}
.figure{position:relative;width:100%;max-width:520px;margin:0 auto;border:3px solid var(--ink);border-radius:var(--r-sm);background:var(--tint);overflow:hidden}
.figure svg{display:block;width:100%;height:100%}
.pins{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font-weight:800;font-size:13px;line-height:1;padding:0;display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
button.pin:hover:not([disabled]){background:#fff}
.pin.seen{background:var(--good-bg)}
.pin.sel{background:var(--col);color:#fff}
.pin.right{background:var(--good);color:#fff}
.pin.wrong{background:var(--bad);color:#fff;animation:shake .4s}
.pin.hi{background:var(--c5);color:#fff;animation:pinPulse 1.3s ease-in-out infinite}
.pin[disabled]{cursor:default}
@keyframes pinPulse{50%{box-shadow:0 0 0 7px rgba(226,63,102,.35),2px 2px 0 var(--ink)}}
.part-info{border:3px solid var(--ink);border-radius:var(--r-sm);padding:12px 14px;background:var(--tint);min-height:96px}
.part-info h4{margin:0;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.03em}
.part-info p{margin-top:4px;font-size:16px}
.part-chips{display:flex;flex-wrap:wrap;gap:6px}
.part-chips button{font-size:13px;font-weight:700;padding:4px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper)}
.part-chips button.seen{background:var(--good-bg)}
.part-chips button[aria-pressed="true"]{background:var(--col);color:#fff}
.vessels svg{width:100%;height:auto;display:block}
.jar{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center}
.jar svg{width:110px;height:auto;display:block}
.jar .btns{display:grid;gap:8px}
.jar-layer{transition:opacity .25s}
.jar[data-sel] .jar-layer{opacity:.35}
.jar[data-sel="plasma"] .jl-plasma,.jar[data-sel="buffy"] .jl-buffy,.jar[data-sel="red"] .jl-red{opacity:1}
.animal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.animal-grid{grid-template-columns:1fr}}
.acard{border:3px solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow-sm);overflow:hidden;min-width:0}
.acard .mini{aspect-ratio:160/90;border-bottom:3px solid var(--ink);background:var(--tint)}
.acard .mini svg{width:100%;height:100%;display:block}
.acard .txt{padding:10px 12px 12px}
.acard h4{margin:0;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.03em}
.acard h4 small{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--col);margin-left:6px}
.acard p{font-size:15px;margin-top:4px}
.hearts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.hearts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hcard{border:2px solid var(--ink);border-radius:12px;background:var(--paper);padding:10px;display:grid;gap:4px;justify-items:center;text-align:center;box-shadow:2px 2px 0 var(--ink)}
.hcard svg{width:72px;height:72px}
.hcard b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.hcard span{font-size:13px;color:var(--ink-2);line-height:1.35}
.hcard .n{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--col)}
.day-line{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.day-line li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--paper)}
.day-line time{font-weight:800;font-variant-numeric:tabular-nums;background:var(--ink);color:#fff;border-radius:6px;text-align:center;padding:2px 0;font-size:14px}
.day-line b{display:block}
.day-line span{font-size:14px;color:var(--ink-2)}
.cells3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ccard{border:2px solid var(--ink);border-radius:12px;background:var(--paper);padding:12px;box-shadow:2px 2px 0 var(--ink)}

<script>
"use strict";
/* ---------- HELPERS ---------- */
const $ = (s, r) => (r || document).querySelector(s);

const pctOf = (a, b) => b ? Math.round(a / b * 100) : 0;

const PRAISE = ["NICE!", "BOOM!", "YES!", "SPOT ON!", "GREAT!", "NAILED IT!"];

/* ---------- SAVED PROGRESS (this device only) ---------- */
const KEY = "flowlab-g6-m2-l4-v1";
const fresh = () => ({xp:0, ch:{}, cell:{best:null, seen:{}, runs:[]}, attempts:[], sound:true, motion:null});
let S = (() => {
  try {
    const raw = localStorage.getItem(KEY);

  } catch (e) {}
  return fresh();
})();
if (!S.cell || typeof S.cell !== "object") S.cell = fresh().cell;
if (!S.cell.seen) S.cell.seen = {};
if (!Array.isArray(S.cell.runs)) S.cell.runs = [];
if (!Array.isArray(S.attempts)) S.attempts = [];

const motionOn = () => S.motion === null || S.motion === undefined ? !reduceMotion : !!S.motion;

/* ---------- SOUND (tiny synth, no files) ---------- */
const Sound = {
  ctx:null,
  get(){ try { if (!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); }
    if (this.ctx.state === "suspended") this.ctx.resume(); return this.ctx; } catch (e) { return null; } },
  tone(f, at, dur, type, vol){ const c = this.get(); if (!c) return; try {
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
    o.type = type || "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05); } catch (e) {} },
  good(){ if (!S.sound) return; this.tone(660, 0, .15); this.tone(990, .1, .25); },
  bad(){ if (!S.sound) return; this.tone(196, 0, .28, "square", .05); this.tone(147, .12, .3, "square", .05); },
  win(){ if (!S.sound) return; [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .11, .3)); },
  tap(){ if (!S.sound) return; this.tone(520, 0, .06, "sine", .05); },
  beat(){ if (!S.sound) return; this.tone(70, 0, .12, "sine", .2); this.tone(60, .2, .12, "sine", .16); }

/* ---------- CONFETTI ---------- */
const FX = (() => {
  const cv = $("#fx"), ctx = cv && cv.getContext ? cv.getContext("2d") : null;
  let parts = [], raf = 0;
  const COLS = ["#FFD23F","#2F7DE1","#F39200","#9A4FE0","#119C77","#E23F66"];
  function size(){ if (!cv) return; const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; }

    const d = window.devicePixelRatio || 1;
    ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life < p.max);
    parts.forEach(p => {
      p.life++; p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - p.life / p.max); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;

  function burstAt(x, y, n){
    if (reduceMotion || !ctx) return;
    for (let i = 0; i < (n || 36); i++){ const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 7;
      parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 4, r:5 + Math.random()*6, rot:Math.random()*6, vr:(Math.random()-.5)*.4, c:COLS[i % COLS.length], life:0, max:55 + Math.random()*40, sq:Math.random() < .55}); }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function burstEl(el, n){ if (!el) return; const r = el.getBoundingClientRect(); burstAt(r.left + r.width/2, r.top + r.height/2, n); }
  function party(){ for (let k = 0; k < 5; k++) setTimeout(() => burstAt(innerWidth * (.15 + Math.random()*.7), innerHeight * (.2 + Math.random()*.25), 40), k * 170); }
  return {burstEl, party};
})();

function floatXP(el, text){
  if (!el || reduceMotion) return;
  const r = el.getBoundingClientRect(), f = document.createElement("div");
  f.className = "xp-float"; f.textContent = text; f.style.left = (r.left + r.width/2) + "px"; f.style.top = (r.top - 6) + "px";
  document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
}

  const v = $("#xpVal"); if (v) v.textContent = S.xp;
  const box = $("#xpBox"); if (box){ box.classList.remove("bump"); void box.offsetWidth; box.classList.add("bump"); }
  if (el) floatXP(el, "+" + n);

function announce(t){ const l = $("#live"); if (!l) return; l.textContent = ""; setTimeout(() => { l.textContent = t; }, 30); }

/* ---------- FLOW: dots that travel along SVG paths ---------- */
/* Each flow follows one or more path segments. A segment can fade its colour (c0 -> c1),
   which is how blood turns red in the lungs and blue in the body. */
const Flow = (() => {
  let items = [], raf = 0, t = 0, last = 0;
  const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, k) => "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(",") + ")";

/* ---------- QUESTION ENGINE ---------- */
function mountQ(host, q, cfg){
  cfg = cfg || {};
  let body = "";
  if (q.t === "mc"){
    const ord = shuffle(q.o.map((_, i) => i));
    body = `<div class="opts">${ord.map((oi, k) => `<button class="opt" data-oi="${oi}"><span class="k">${"ABCDEF"[k]}</span><span>${q.o[oi]}</span></button>`).join("")}</div>`;
  } else if (q.t === "order"){
    body = `<p class="q-how">Tap the steps in the right order. Tap a placed step to send it back.</p><ol class="seq" aria-label="Your order"></ol><div class="pool" role="group" aria-label="Steps to place"></div><div class="row"><button class="btn btn-ink btn-sm" data-check disabled>Check my order</button></div>`;
  } else if (q.t === "sort"){
    const items = shuffle(q.items.map((_, i) => i));
    body = `<p class="q-how">Pick a group for each one, then check.</p><div class="sort-list">${items.map(i => `<div class="sort-row" data-i="${i}"><p>${q.items[i][0]}</p><div class="seg" role="group" aria-label="${strip(q.items[i][0])}">${q.groups.map((g, gi) => `<button data-g="${gi}" aria-pressed="false">${g}</button>`).join("")}</div></div>`).join("")}</div><div class="row"><button class="btn btn-ink btn-sm" data-check disabled>Check</button></div>`;
  } else if (q.t === "find"){
    body = `<p class="q-how">Tap the right number on the diagram.</p>`;
  }
  const fig = q.fig ? figHTML(q.fig, q.t === "find" ? {mode:"find", pins:q.pins} : {hi:q.hi}) : "";
  host.innerHTML = `<div class="q-card panel"><p class="q-kicker">${cfg.kicker || ""}</p><p class="q-text">${q.q}</p>${fig}${body}<div class="fb-slot"></div></div>`;
  const card = host.firstElementChild, slot = $(".fb-slot", card);
  let done = false;
  function finish(ok, extra, detail, el){
    if (done) return; done = true;
    if (ok){ Sound.good(); addXP(cfg.xp || 10, el); FX.burstEl(el, 26); } else Sound.bad();
    if (cfg.onAnswer) cfg.onAnswer(ok, detail || {});
    slot.innerHTML = `<div class="fb ${ok ? "ok" : "no"}"><span class="burst">${ok ? pick(PRAISE) : "NOT QUITE"}</span><div class="fb-body">${extra || ""}${q.why ? `<p>${q.why}</p>` : ""}</div><div class="row"><button class="btn btn-go" data-next>${cfg.nextLabel || "Next"} ${ARROW}</button></div></div>`;
    announce((ok ? "Correct! " : "Not quite. ") + strip(extra) + " " + strip(q.why));
    const nb = $("[data-next]", slot);
    nb.addEventListener("click", () => { Sound.tap(); if (cfg.onNext) cfg.onNext(ok); });
    try { nb.focus({preventScroll:true}); } catch (e) {}
    const r = slot.getBoundingClientRect();
    if (r.bottom > innerHeight - 8) window.scrollBy({top:r.bottom - innerHeight + 24, behavior:reduceMotion ? "auto" : "smooth"});
  }
  if (q.t === "mc"){
    $$(".opt", card).forEach(b => b.addEventListener("click", () => {
      if (done) return;
      const oi = +b.dataset.oi, ok = oi === q.a;
      $$(".opt", card).forEach(x => { x.disabled = true; const xi = +x.dataset.oi; if (xi === q.a) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); else x.classList.add("dim"); });
      finish(ok, ok ? "" : `<p>Answer: <b>${q.o[q.a]}</b></p>`, {given:strip(q.o[oi]), correct:strip(q.o[q.a])}, b);
    }));
  } else if (q.t === "order"){
    const n = q.items.length; let pool = shuffle(q.items.map((_, i) => i)); if (pool.every((v, i) => v === i)) pool.reverse();
    const placed = [], seq = $(".seq", card), poolEl = $(".pool", card), chk = $("[data-check]", card);
    const draw = () => {
      seq.innerHTML = q.items.map((_, i) => placed[i] !== undefined
        ? `<li><button class="slot filled" data-un="${i}" aria-label="Step ${i + 1}: ${strip(q.items[placed[i]])}. Tap to send it back."><span class="n">${i + 1}</span><span>${q.items[placed[i]]}</span></button></li>`
        : `<li><div class="slot"><span class="n">${i + 1}</span><span class="ph">${i === placed.length ? "tap a step below" : ""}</span></div></li>`).join("");
      poolEl.innerHTML = pool.filter(v => !placed.includes(v)).map(v => `<button class="chipbtn" data-add="${v}">${q.items[v]}</button>`).join("");
      chk.disabled = placed.length !== n;
    };
    draw();
    seq.addEventListener("click", e => { const b = e.target.closest("[data-un]"); if (!b || done) return; placed.splice(+b.dataset.un, 1); Sound.tap(); draw(); });
    poolEl.addEventListener("click", e => {
      const b = e.target.closest("[data-add]"); if (!b || done) return;
      placed.push(+b.dataset.add); Sound.tap(); draw();
      const nx = poolEl.querySelector("[data-add]");
      try { (nx || chk).focus({preventScroll:true}); } catch (err) {}
    });
    chk.addEventListener("click", () => {
      if (done || placed.length !== n) return;
      const ok = placed.every((v, i) => v === i), right = placed.filter((v, i) => v === i).length;
      seq.innerHTML = placed.map((v, i) => `<li><div class="slot ${v === i ? "ok" : "no"}"><span class="n">${i + 1}</span><span>${q.items[v]}</span></div></li>`).join("");
      poolEl.innerHTML = ""; chk.hidden = true;
      finish(ok, ok ? "" : `<p>${right} of ${n} steps are in the right place. The correct order is:</p><ol>${q.items.map(t => `<li>${t}</li>`).join("")}</ol>`,
        {given:placed.map(v => strip(q.items[v])).join(" → "), correct:q.items.map(strip).join(" → ")}, seq);
    });
  } else if (q.t === "sort"){
    const choice = {}, rows = $$(".sort-row", card), chk = $("[data-check]", card);
    rows.forEach(r => r.addEventListener("click", e => {
      const b = e.target.closest("[data-g]"); if (!b || done) return;
      choice[r.dataset.i] = +b.dataset.g;
      $$("[data-g]", r).forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      Sound.tap(); chk.disabled = Object.keys(choice).length !== q.items.length;
    }));
    chk.addEventListener("click", () => {
      if (done || Object.keys(choice).length !== q.items.length) return;
      let right = 0;
      rows.forEach(r => {
        const i = +r.dataset.i, good = choice[i] === q.items[i][1];
        if (good) right++;
        r.classList.add(good ? "ok" : "no");
        $$("[data-g]", r).forEach(x => { x.disabled = true; });
        if (!good) r.insertAdjacentHTML("beforeend", `<span class="corr">✓ Answer: ${q.groups[q.items[i][1]]}</span>`);
      });
      chk.hidden = true;
      const ok = right === q.items.length;
      finish(ok, ok ? "" : `<p>${right} of ${q.items.length} sorted correctly. The fixes are marked in green above.</p>`,
        {given:`${right} of ${q.items.length} sorted correctly`, correct:q.items.map(it => `${strip(it[0])}: ${q.groups[it[1]]}`).join("; ")}, chk);
    });
  } else if (q.t === "find"){
    const F = FIGS[q.fig];
    $$(".pin", card).forEach(p => p.addEventListener("click", () => {
      if (done) return;
      const k = p.dataset.pin, ok = k === q.a;
      $$(".pin", card).forEach(x => { x.disabled = true; if (x.dataset.pin === q.a) x.classList.add("right"); });
      if (!ok) p.classList.add("wrong");
      finish(ok, ok ? `<p>Yes, that's the <b>${F.parts[q.a].name}</b>.</p>` : `<p>You tapped the <b>${F.parts[k].name}</b>. The answer is number ${q.pins.indexOf(q.a) + 1}, the <b>${F.parts[q.a].name}</b>.</p>`,
        {given:F.parts[k].name, correct:F.parts[q.a].name}, p);
    }));
  }
}

/* ---------- CELL LAB ---------- */
let cellMode = "learn", cellSel = null;
const CELL_KEYS = Object.keys(FIGS.cell.parts);
function renderCell(){
  const seenN = CELL_KEYS.filter(k => S.cell.seen[k]).length;
  $("#scr-cell").innerHTML = `<div class="col-c9">
    <div class="lesson-top"><span class="chip-land">Cell Lab</span><span class="day">Homework 8.1 · due Sat 24/10</span></div>
    <div class="intro panel"><p class="kick">IXL practice · Module 1 L2 review</p><h2>Cell Lab</h2><p class="bigq">Can you label every part of an animal cell?</p>
      <p class="from">Your IXL homework, <b>Animal cell diagrams: label parts</b>, needs at least 70%. Explore the parts first, then take the drill. The mitochondria are where the oxygen your blood delivers gets used!</p></div>
    <div class="tabs" role="tablist" aria-label="Cell Lab mode" style="margin-top:16px">
      <button class="tab" role="tab" data-act="cell-mode" data-mode="learn" aria-selected="${cellMode === "learn"}">1 · Explore (${seenN}/9)</button>
      <button class="tab" role="tab" data-act="cell-mode" data-mode="drill" aria-selected="${cellMode === "drill"}">2 · Drill${S.cell.best === null ? "" : ` (best ${S.cell.best}%)`}</button>
    </div>
    <div id="cell-body" style="margin-top:14px"></div></div>`;
  if (cellMode === "learn") cellLearn(); else cellDrillStart();
}
function cellLearn(){
  const body = $("#cell-body"), P = FIGS.cell.parts;
  body.innerHTML = `<section class="widget panel" style="margin-top:0"><p class="how">Tap a number (or a name) to see what that part does. Explore all 9, then try the drill.</p>
    <div class="split">${figHTML("cell", {mode:"learn", pins:CELL_KEYS})}
      <div style="display:grid;gap:12px;align-content:start">
        <div class="part-info cell-info" aria-live="polite"><h4>Tap a number</h4><p>Each number points to one part of the cell.</p></div>
        <div class="part-chips" role="group" aria-label="Cell parts">${CELL_KEYS.map(k => `<button data-cellpart="${k}" class="${S.cell.seen[k] ? "seen" : ""}" aria-pressed="false">${P[k].name}</button>`).join("")}</div>
        <div class="row"><button class="btn btn-go btn-sm" data-act="cell-mode" data-mode="drill">Start the drill ${ARROW}</button></div>
      </div></div></section>`;
  if (cellSel) selectCellPart(cellSel, true);
}
function selectCellPart(k, quiet){
  const P = FIGS.cell.parts; cellSel = k;
  $$("#cell-body .pin").forEach(p => p.classList.toggle("sel", p.dataset.pin === k));
  $$("#cell-body [data-cellpart]").forEach(b => b.setAttribute("aria-pressed", b.dataset.cellpart === k ? "true" : "false"));
  const box = $("#cell-body .cell-info");
  if (box) box.innerHTML = `<h4>${CELL_KEYS.indexOf(k) + 1} · ${P[k].name}</h4><p>${P[k].info}</p>`;
  if (!S.cell.seen[k]){
    S.cell.seen[k] = true; save(); addXP(2, $(`#cell-body .pin[data-pin="${k}"]`));
    $$(`#cell-body [data-pin="${k}"], #cell-body [data-cellpart="${k}"]`).forEach(x => x.classList.add("seen"));
    const n = CELL_KEYS.filter(x => S.cell.seen[x]).length, tab = $('[data-mode="learn"]');
    if (tab) tab.textContent = `1 · Explore (${n}/9)`;
    if (n === 9){ Sound.win(); announce("You explored all 9 parts. Try the drill!"); }
  }
  if (!quiet) Sound.tap();
}
function cellDrillStart(){
  const P = FIGS.cell.parts, keys = shuffle(CELL_KEYS);
  keys.push(pick(CELL_KEYS.filter(k => k !== keys[keys.length - 1])));
  const rounds = keys.map((k, i) => i % 2 === 0
    ? {t:"find", fig:"cell", pins:CELL_KEYS, a:k, q:`Find it: tap the <b>${P[k].name}</b>.`, why:P[k].info}
    : (() => { const wrong = shuffle(CELL_KEYS.filter(x => x !== k)).slice(0, 3); return {t:"mc", fig:"cell", hi:k, q:"Name it: which part is marked with the pink <b>?</b>", o:[P[k].name, ...wrong.map(x => P[x].name)], a:0, why:P[k].info, key:k}; })());
  let i = 0, right = 0; const misses = [];
  const body = $("#cell-body");
  const step = () => {
    if (i >= rounds.length) return cellDrillDone(right, rounds.length, misses);
    body.innerHTML = `<div class="test-top" style="margin-top:0"><div class="row"><span class="round-name">Cell Drill</span><span class="counter">${i + 1} / ${rounds.length}</span></div>
      <div class="progress" role="progressbar" aria-label="Drill progress" aria-valuemin="0" aria-valuemax="${rounds.length}" aria-valuenow="${i}"><i style="width:${pctOf(i, rounds.length)}%"></i></div></div><div id="cd-q" style="margin-top:14px"></div>`;
    const q = rounds[i];
    mountQ($("#cd-q"), q, {kicker:q.t === "find" ? "Find the part" : "Name the part", xp:5,
      nextLabel:i === rounds.length - 1 ? "See my score" : "Next",
      onAnswer(ok){ if (ok) right++; else misses.push(q.t === "find" ? q.a : q.key); },
      onNext(){ i++; step(); scrollToEl($("#cell-body")); }});
  };
  step();
}
function cellDrillDone(right, n, misses){
  const pct = pctOf(right, n), pass = pct >= 70, P = FIGS.cell.parts;
  S.cell.best = S.cell.best === null ? pct : Math.max(S.cell.best, pct);
  S.cell.runs.push({t:Date.now(), pct}); if (S.cell.runs.length > 12) S.cell.runs = S.cell.runs.slice(-12);
  save();
  const uniq = [...new Set(misses)];
  $("#cell-body").innerHTML = `<div class="qc-done panel" aria-live="polite">
    <p class="big">${pct === 100 ? "PERFECT!" : pass ? "TARGET HIT!" : "NOT YET!"}</p>
    <p style="font-size:20px;font-weight:800">${right} / ${n} correct · ${pct}%</p>
    <div class="target" style="width:min(420px,100%)"><span>0%</span><div class="bar" role="img" aria-label="Score ${pct}% with the 70% target marked"><i style="width:${pct}%;background:${pass ? "var(--good)" : "var(--bad)"}"></i><span class="mark70"></span></div><span>IXL target 70%</span></div>
    <p>${pass ? "You're ready for the IXL homework. Aim for 100% to be safe!" : "Below the 70% target. Explore the parts again, then retry the drill."}</p>
    ${uniq.length ? `<p><b>Review these:</b> ${uniq.map(k => P[k].name).join(", ")}</p>` : ""}
    <div class="row" style="justify-content:center"><button class="btn btn-sm" data-act="cell-mode" data-mode="learn">Explore the parts</button><button class="btn btn-sm btn-go" data-act="cell-mode" data-mode="drill">Try the drill again</button></div></div>`;
  if (pct === 100){ Sound.win(); FX.party(); } else if (pass) Sound.win();
  const tab = $('[data-mode="drill"]'); if (tab) tab.textContent = `2 · Drill (best ${S.cell.best}%)`;
}

/* ---------- LESSON REVIEW ---------- */
function renderReviewIntro(){
  R = null;
  const counts = CH.map(c => [c, REVIEW.filter(q => q.ch === c.id).length]);
  $("#scr-review").innerHTML = `<div class="test-intro panel">
    <p class="kick">Thursday 22/10 · Lesson Review</p><h2>Lesson Review</h2>
    <p>${REVIEW.length} mixed questions from every part of the lesson, in a new random order each time. At the end you'll get a weak-spot report that shows which parts to replay.</p>
    <ul>${counts.map(([c, k]) => `<li>Part ${c.n}: ${c.name} · ${k} ${k === 1 ? "question" : "questions"}</li>`).join("")}</ul>
    <div class="row"><button class="btn btn-go" data-act="start-review">Start the review ${ARROW}</button>${S.attempts.length ? `<button class="btn btn-sm" data-act="last-report">See my last report</button>` : ""}</div></div>`;
}
function startReview(){ R = {qs:shuffle(REVIEW), i:0, log:[]}; reviewStep(); }
function reviewStep(){
  const host = $("#scr-review");
  if (R.i >= R.qs.length) return finishReview();
  const q = R.qs[R.i], c = chOf(q.ch);
  host.innerHTML = `<div class="test-top"><div class="row"><span class="round-name">Lesson Review</span><span class="counter">${R.i + 1} / ${R.qs.length}</span></div>
    <div class="progress" role="progressbar" aria-label="Review progress" aria-valuemin="0" aria-valuemax="${R.qs.length}" aria-valuenow="${R.i}"><i style="width:${pctOf(R.i, R.qs.length)}%"></i></div></div>
    <div id="rv-q" class="col-${c.col}" style="margin-top:14px"></div>`;
  mountQ($("#rv-q"), q, {kicker:`Part ${c.n} · ${c.name}`, xp:10,
    nextLabel:R.i === R.qs.length - 1 ? "See my report" : "Next",
    onAnswer(ok, detail){ R.log.push({ch:q.ch, q:strip(q.q), ok, given:detail.given || "", correct:detail.correct || ""}); },
    onNext(){ R.i++; reviewStep(); window.scrollTo(0, 0); }});
}
function finishReview(){
  const by = {};
  R.log.forEach(l => { by[l.ch] = by[l.ch] || [0, 0]; by[l.ch][1]++; if (l.ok) by[l.ch][0]++; });
  const right = R.log.filter(l => l.ok).length, n = R.log.length;
  const a = {t:Date.now(), right, n, pct:pctOf(right, n), by, log:R.log};
  S.attempts.push(a); if (S.attempts.length > 12) S.attempts = S.attempts.slice(-12);
  save(); R = null;
  nav("#/report");
}
function renderReport(a){
  const pct = a.pct, rank = pct >= 90 ? "Circulation Champion!" : pct >= 75 ? "Blood Flow Pro!" : pct >= 50 ? "Getting There!" : "Keep Training!";
  const C = 2 * Math.PI * 64;
  const rows = CH.filter(c => a.by[c.id]).map(c => {
    const [r, n] = a.by[c.id], p = pctOf(r, n), cls = p >= 80 ? "good" : p >= 50 ? "mid" : "low", lab = p >= 80 ? "Strong" : p >= 50 ? "Review" : "Replay";
    return `<div class="bar-row col-${c.col}"><div class="bar-label">Part ${c.n} · ${c.name}<small>${r} of ${n} right</small></div><div class="bar"><i class="${p ? "" : "zero"}" data-w="${p}"></i></div><div class="bar-end"><span class="pct">${p}%</span><span class="status ${cls}">${lab}</span></div></div>`;
  }).join("");
  const weak = CH.filter(c => a.by[c.id] && pctOf(a.by[c.id][0], a.by[c.id][1]) < 70)
    .sort((x, y) => pctOf(a.by[x.id][0], a.by[x.id][1]) - pctOf(a.by[y.id][0], a.by[y.id][1]));
  const plan = weak.length
    ? weak.map(c => `<li><b>Replay Part ${c.n}: ${c.name}</b><span>${c.q} Re-read the cards, then redo the quick check for 3 stars.</span><div class="row"><button class="btn btn-sm btn-go" data-act="open" data-ch="${c.id}">Open Part ${c.n} ${ARROW}</button></div></li>`).join("")
    : `<li><b>No weak spots this time!</b><span>Every part scored 70% or more. Keep it fresh with the Cell Lab drill for your IXL homework.</span><div class="row"><button class="btn btn-sm btn-go" data-act="cell">Open the Cell Lab ${ARROW}</button></div></li>`;
  const hist = S.attempts.slice(-8);
  $("#scr-report").innerHTML = `
  <div class="report-head panel">
    <div class="ring" role="img" aria-label="Score ${pct} percent"><svg viewBox="0 0 156 156"><circle cx="78" cy="78" r="64" fill="none" stroke="#E4F2FF" stroke-width="18"/><circle cx="78" cy="78" r="64" fill="none" stroke="${pct >= 70 ? "#12A15E" : "#E23D45"}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${(C * pct / 100).toFixed(1)} ${C.toFixed(1)}"/><circle cx="78" cy="78" r="73" fill="none" stroke="#14163A" stroke-width="2"/><circle cx="78" cy="78" r="55" fill="none" stroke="#14163A" stroke-width="2"/></svg><div class="num">${pct}%<small>${a.right} / ${a.n}</small></div></div>
    <div><p class="rank">${rank}</p><p>Lesson Review · ${fmtDate(a.t)}</p>
      <div class="row" style="margin-top:12px"><button class="btn btn-go btn-sm" data-act="start-review">Retake the review</button><button class="btn btn-sm" data-act="home">${BACK} Lesson map</button></div></div>
  </div>
  <div class="sec-title"><h2>Weak-spot report</h2><p>Score for each part of the lesson</p></div>
  <div class="bars panel">${rows}</div>
  <div class="sec-title"><h2>Your study plan</h2><p>${weak.length ? "Start with the lowest score" : "Nice work"}</p></div>
  <ol class="plan">${plan}</ol>
  ${hist.length > 1 ? `<div class="sec-title"><h2>Your progress</h2><p>Last ${hist.length} reviews</p></div><div class="history panel" role="img" aria-label="Review scores over time">${hist.map(h => `<div class="hcol"><b>${h.pct}%</b><div class="hbar${h.pct >= 70 ? " p" : ""}" style="height:${Math.max(6, h.pct * 1.1)}px"></div><span>${fmtDate(h.t).split(",")[0]}</span></div>`).join("")}</div>` : ""}
  <details class="answers panel" style="margin-top:18px"><summary>Check every answer (${a.n})</summary>
    ${(a.log || []).map(l => `<div class="ans"><span class="mark ${l.ok ? "ok" : "no"}">${l.ok ? "✓" : "✗"}</span><div><b>${l.q}</b><br>${l.ok ? `<small>${l.correct}</small>` : `<small>Your answer: ${l.given}</small><br><small>Correct: ${l.correct}</small>`}</div></div>`).join("")}
  </details>`;
  requestAnimationFrame(() => setTimeout(() => $$("#scr-report .bar i").forEach(i => { i.style.width = i.dataset.w + "%"; }), 60));
  if (pct >= 90){ Sound.win(); FX.party(); }
}

/* ---------- EVENTS ---------- */
function renderSoundBtn(){
  const b = $("#soundBtn"); b.innerHTML = S.sound ? ICON_SOUND : ICON_MUTE;
  b.setAttribute("aria-label", S.sound ? "Turn sound off" : "Turn sound on");
}
document.addEventListener("click", e => {
  const pin = e.target.closest(".hx .pin");
  if (pin){
    const k = pin.dataset.pin, P = FIGS.heart.parts, box = $(".hx .part-info");
    $$(".hx .pin").forEach(p => p.classList.toggle("sel", p === pin));
    if (box) box.innerHTML = `<h4>${Object.keys(P).indexOf(k) + 1} · ${P[k].name}</h4><p>${P[k].info}</p>`;
    if (k === "lv" || k === "rv") Sound.beat(); else Sound.tap();
    return;
  }
  const cpin = e.target.closest("#cell-body .figure button.pin");
  if (cpin && cellMode === "learn" && !cpin.closest(".q-card")){ selectCellPart(cpin.dataset.pin); return; }
  const cchip = e.target.closest("[data-cellpart]");
  if (cchip){ selectCellPart(cchip.dataset.cellpart); return; }
  const jar = e.target.closest("[data-jar]");
  if (jar){
    const k = jar.dataset.jar, w = jar.closest(".widget"), j = $(".jar", w), info = JAR_INFO[k];
    j.dataset.sel = k;
    $$("[data-jar]", w).forEach(b => b.classList.toggle("btn-col", b === jar));
    $(".jar-info", w).innerHTML = `<h4>${info[0]}</h4><p>${info[1]}</p>`;
    Sound.tap(); return;
  }
  const tp = e.target.closest("button[data-plant]");
  if (tp){
    const svg = $("#sv-plant"); if (svg) svg.dataset.show = tp.dataset.plant;
    $$("button[data-plant]").forEach(b => b.setAttribute("aria-pressed", b === tp ? "true" : "false"));
    Sound.tap(); return;
  }
  const tl = e.target.closest("button[data-loop]");
  if (tl){
    const svg = $("#sv-loop"); if (svg) svg.dataset.loop = tl.dataset.loop;
    $$("button[data-loop]").forEach(b => b.setAttribute("aria-pressed", b === tl ? "true" : "false"));
    Sound.tap(); return;
  }
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "home") nav("#/");
  else if (act === "open") nav("#/part/" + t.dataset.ch);
  else if (act === "cell"){ cellMode = "learn"; nav("#/cell"); }
  else if (act === "review") nav("#/review");
  else if (act === "start-review"){ if (location.hash !== "#/review"){ history.pushState(null, "", "#/review"); show("review"); } startReview(); }
  else if (act === "last-report") nav("#/report");
  else if (act === "retry-check"){ const id = location.hash.split("/")[2], c = chOf(id); if (c){ startCheck(c); scrollToEl($("#qc-host")); } }
  else if (act === "cell-mode"){ cellMode = t.dataset.mode; Sound.tap(); renderCell(); }
  else if (act === "motion") toggleMotion();
  else if (act === "sound"){ S.sound = !S.sound; save(); renderSoundBtn(); if (S.sound) Sound.tap(); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden) Flow.stop(); else Flow.start(); });

/* ---------- START ---------- */
$("#xpVal").textContent = S.xp;
renderSoundBtn();
applyMotionClass();
addEventListener("hashchange", route);
route();


</script>
