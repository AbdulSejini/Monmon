<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Science Quiz 2 Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2212%22 fill=%22%23D2F4E8%22 stroke=%22%2314163A%22 stroke-width=%225%22/%3E%3Cpath d=%22M26 14h12M29 14v13L18 46a4 4 0 0 0 3.5 6h21a4 4 0 0 0 3.5-6L35 27V14%22 fill=%22none%22 stroke=%22%23119C77%22 stroke-width=%225%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#14163A; --ink-2:#4A4D78; --ink-3:#8A8DB0;
  --paper:#FFFFFF; --page:#E4F2FF; --dot:rgba(20,22,58,.07);
  --sun:#FFD23F; --sun-2:#FFF3C4;
  --good:#12A15E; --good-bg:#DCF7E9;
  --bad:#E23D45; --bad-bg:#FFE1E2;
  --col:#119C77; --tint:#D2F4E8;
  --shadow:4px 4px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --r:14px; --r-sm:10px;
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0}
:focus-visible{outline:3px solid #2F7DE1;outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.p-l2{--col:#2F7DE1;--tint:#DCEBFF} .p-l3{--col:#F39200;--tint:#FFE8C2} .p-l4{--col:#E23F66;--tint:#FFDDE6}
.p-l5{--col:#9A4FE0;--tint:#EEE0FF} .p-test{--col:#119C77;--tint:#D2F4E8}

.topbar{background:var(--paper);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--display);font-size:28px;letter-spacing:.05em;color:#5FD9A9;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg);white-space:nowrap;line-height:1.2}
.chip{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:#fff;padding:4px 8px;border-radius:6px;white-space:nowrap}
.xp{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--sun-2);border:2px solid var(--ink);border-radius:999px;padding:2px 11px;white-space:nowrap}
.spacer{flex:1}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--sun-2);box-shadow:2px 2px 0 var(--ink);text-decoration:none;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:800;text-decoration:none;box-shadow:var(--shadow-sm);text-align:center;line-height:1.25}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.go{background:var(--sun)}
.btn.ink{background:var(--ink);color:#fff}
.btn.sm{min-height:40px;padding:5px 12px;font-size:15px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.hero{margin-top:20px;padding:18px;display:grid;gap:12px;border-inline-start:12px solid var(--col)}
.hero h1{font-size:clamp(34px,7vw,52px)}
.hero .sub{color:var(--ink-2);font-weight:700}
.badge{font-size:13px;font-weight:800;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--sun-2);white-space:nowrap}
.badge.hot{background:var(--bad);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:2px solid var(--ink);border-radius:var(--r-sm);padding:8px;background:var(--page);text-align:center;display:grid}
.stat b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;font-weight:700;color:var(--ink-2)}
.sec{margin-top:30px}
.sec-head{margin-bottom:12px;display:grid;gap:2px}
.sec-head h2{font-size:36px}
.sec-head p{color:var(--ink-2);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{padding:14px;display:grid;gap:8px;border:3px solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow-sm);border-inline-start:10px solid var(--col)}
.tile b{font-size:18px;line-height:1.3}
.tile span{font-size:14px;color:var(--ink-2);font-weight:600}
.test-cta{margin-top:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--sun-2)}
.test-cta p{flex:1 1 260px;font-weight:600}

/* lessons */
.part{scroll-margin-top:12px}
.part-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.part-head h2{font-size:36px;color:var(--col);-webkit-text-stroke:.6px var(--ink)}
.part-head span{font-size:14px;font-weight:700;color:var(--ink-2)}
.card{padding:16px;display:grid;gap:10px;border-inline-start:10px solid var(--col);scroll-margin-top:12px}
.card + .card{margin-top:12px}
.card h3{font-size:26px}
.card h4{margin:0;font-size:16px;font-weight:800}
.kp{padding-inline-start:22px;display:grid;gap:6px}
.kp li::marker{color:var(--col)}
.big-idea{border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--tint);padding:8px 12px;font-weight:700}
.gtable{width:100%;border-collapse:collapse;font-size:15px}
.gtable th,.gtable td{border:2px solid var(--ink);padding:6px 8px;text-align:start;vertical-align:top}
.gtable th{background:var(--tint)}
.tscroll{overflow-x:auto}
.fig{display:grid;gap:8px;justify-items:center;margin:0;min-width:0}
.fig svg{display:block;width:100%;max-width:440px;height:auto;border:3px solid var(--ink);border-radius:var(--r-sm);background:var(--tint)}
.fig ol{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 14px;width:100%;font-size:15px}
.fig ol li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.fig ol li i{font-style:normal;font-weight:800;font-size:13px;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:var(--sun);display:grid;place-items:center;line-height:1}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.words p{border:2px solid var(--ink);border-radius:var(--r-sm);padding:6px 10px;background:var(--paper);font-size:15px;box-shadow:2px 2px 0 var(--col)}
.words b{color:var(--ink)}
.lab-cta{margin-top:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--tint)}
.lab-cta p{flex:1 1 240px;font-weight:600}
.ixl-box{margin-top:14px;padding:14px 16px;display:grid;gap:10px;background:#DCF7E9;scroll-margin-top:12px}
.ixl-box h3{font-size:24px}
.ixl-box p{font-weight:600}
.ixl-box ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ixl-box li{display:grid;gap:6px}
.ixl-box li b{font-size:16px}
.ixl-links{display:flex;flex-wrap:wrap;gap:8px}
.ixl-box .note{font-size:14px;font-weight:500;color:var(--ink-2)}

/* practice */
.run{margin-top:20px;padding:16px;display:grid;gap:14px;border-inline-start:10px solid var(--col)}
.run > *,.card > *,.fb > *{min-width:0}
.run-top{display:flex;align-items:center;gap:10px}
.run-top b{font-size:17px}
.counter{margin-inline-start:auto;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.run-top .btn{white-space:nowrap}
.progress{height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--page);overflow:hidden}
.progress i{display:block;height:100%;background:var(--col);transition:width .3s}
.q-part{font-size:13px;font-weight:800;color:var(--col);text-transform:uppercase;letter-spacing:.06em}
.q-text{font-size:20px;font-weight:600;line-height:1.6}
.q-text .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--ink)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:var(--shadow-sm);font-weight:600;text-align:start;font-size:17px;line-height:1.35}
.opt .k{display:grid;place-items:center;width:30px;height:30px;flex:none;border:2px solid var(--ink);border-radius:8px;background:var(--tint);font-weight:800}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-size:20px;min-height:60px}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px 12px;align-items:center;padding:8px 10px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--paper)}
.mrow.num{grid-template-columns:34px minmax(0,1fr)}
.mrow.num b{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--sun);display:grid;place-items:center;font-size:14px;line-height:1}
.mrow.right{background:var(--good-bg);border-color:var(--good)}
.mrow.wrong{background:var(--bad-bg);border-color:var(--bad)}
.mrow b{font-weight:700}
.mrow select{width:100%;min-height:46px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:4px 8px;font-weight:600;font-size:16px}
.mrow .fix{grid-column:1 / -1;font-size:14px;font-weight:700;color:var(--good)}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px}
.ord-pool .opt{min-height:46px;font-size:16px;flex:1 1 200px}
.ord-pool .opt:disabled{opacity:.35;box-shadow:none;transform:translate(3px,3px)}
.ord-ans{list-style:none;display:grid;gap:8px;counter-reset:o}
.ord-ans li{counter-increment:o;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;min-height:46px;padding:6px 12px;border:2px dashed var(--ink-3);border-radius:var(--r-sm);background:var(--page);font-weight:600}
.ord-ans li::before{content:counter(o);width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:14px}
.ord-ans li.on{border-style:solid;border-color:var(--ink);background:var(--paper)}
.ord-ans li.right{background:var(--good-bg);border:2px solid var(--good)}
.ord-ans li.wrong{background:var(--bad-bg);border:2px solid var(--bad)}
.ord-ans li small{grid-column:2;font-size:13px;font-weight:700;color:var(--good)}
.typein input{width:100%;min-height:50px;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-size:19px;font-weight:600;background:#fff}
.fb{border:3px solid var(--ink);border-radius:var(--r-sm);padding:10px 14px;display:grid;gap:6px}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb .burst{font-family:var(--display);font-size:26px;letter-spacing:.04em}
.fb .why{font-size:16px}
.peek{border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);padding:4px 12px}
.peek summary{font-weight:800;color:#1F5FB8;cursor:pointer;min-height:40px;padding-block:6px}
.peek-in{display:grid;gap:8px;padding:2px 0 10px;font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.result{margin-top:20px;padding:18px;display:grid;gap:12px;text-align:center}
.result .big{font-family:var(--display);font-size:56px;letter-spacing:.03em;line-height:1.1}
.result .big small{font-family:var(--body);font-size:20px;color:var(--ink-2)}
.parts4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.miss-list{display:grid;gap:10px;margin-top:12px}
.miss{padding:10px 14px;display:grid;gap:4px;text-align:start}
.miss .q{font-weight:600}
.miss .a{font-size:15px;color:var(--ink-2);font-weight:700}
.miss a{font-weight:800;color:#1F5FB8}
.foot{margin-top:28px;font-size:14px;color:var(--ink-2);display:grid;gap:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:620px){.parts4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.chip{display:none}.logo{font-size:24px}.mrow{grid-template-columns:1fr}.mrow.num{grid-template-columns:34px minmax(0,1fr)}.q-text{font-size:18px}.stat b{font-size:21px}.sec-head h2,.part-head h2{font-size:32px}}
/* lively lessons (LIVELY LESSONS in the script): cards that rise in, the «Explain it» teacher, moving diagrams, flip cards */
.lv-tip{font-size:15px;font-weight:600;color:var(--ink-2)}
.lv-in{opacity:0;transform:translateY(22px) scale(.97)}
.lv-in.lv-on{opacity:1;transform:none;transition:opacity .5s ease,transform .6s cubic-bezier(.2,1.5,.4,1)}
.lv-in .kp > li{opacity:0;transform:translateX(-12px)}
.lv-in.lv-on .kp > li{opacity:1;transform:none;transition:opacity .4s ease,transform .45s cubic-bezier(.2,1.4,.4,1);transition-delay:calc(var(--i,0) * 90ms + 200ms)}
.lv-bar,.lv-figbar,.lv-whead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lv-figbar{justify-content:center}
.lv-whead{justify-content:space-between}
.lv-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:5px 14px;border:2px solid var(--ink);border-radius:999px;background:var(--sun);color:var(--ink);font:800 15px/1.2 var(--body);box-shadow:2px 2px 0 var(--ink);cursor:pointer;transition:transform .12s}
.lv-btn:hover{transform:translateY(-1px)}
.lv-btn:active{transform:translateY(1px);box-shadow:1px 1px 0 var(--ink)}
.lv-btn.lv-alt{background:var(--paper)}
/* a 3D model inside a topic: a picture of it with a play button, then the live model in a frame (science/lab-3d?embed=1) */
.l3{display:grid;gap:8px;min-width:0}
.l3-poster{position:relative;display:block;width:100%;padding:0;border:3px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;background:#141A3C;cursor:pointer;box-shadow:var(--shadow-sm)}
.l3-poster img{display:block;width:100%;height:auto;aspect-ratio:2/1;object-fit:cover}
.l3-badge{position:absolute;top:8px;inset-inline-start:8px;padding:1px 9px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-weight:800;font-size:14px}
.l3-play{position:absolute;inset-inline:0;bottom:10px;margin:0 auto;width:max-content;max-width:92%;padding:8px 16px;border:2px solid var(--ink);border-radius:999px;background:var(--sun);font-weight:800;font-size:16px;line-height:1.3;box-shadow:2px 2px 0 var(--ink)}
.l3-poster:hover .l3-play{transform:translateY(-2px)}
@media (max-width:560px){.l3-poster img{aspect-ratio:8/5}.l3-play{bottom:8px;padding:6px 12px;font-size:14px}}
.l3 iframe{display:block;width:100%;border:3px solid var(--ink);border-radius:var(--r-sm);background:#fff}
.l3-no{margin:0;padding:8px 12px;border:2px dashed var(--ink);border-radius:var(--r-sm);font-weight:700}
.l3-flat{margin:8px 0}
.l3-flat summary{cursor:pointer;font-weight:800;font-size:15px;min-height:40px;display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);list-style:none}
.l3-flat summary::-webkit-details-marker{display:none}
.l3-flat summary::after{content:"▾"}
.l3-flat[open] summary::after{content:"▴"}
.l3-flat[open] summary{margin-bottom:8px}
.lv-btn[aria-pressed="true"]{background:#FFC9DD}
.lv-stamp{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border:2px solid #0E7A47;border-radius:999px;background:#DDF4E8;color:#0E7A47;font-weight:800;font-size:14px}
.lv-stamp.lv-pop{animation:lv-pop .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes lv-pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}70%{transform:scale(1.25) rotate(4deg);opacity:1}100%{transform:none}}
/* the teacher: one point lit at a time, its key words marked */
.lv-teach .kp > li{opacity:.4;transition:opacity .3s,background-color .3s,transform .3s}
.lv-teach .kp > li.lv-past{opacity:.75}
.lv-teach .kp > li.lv-now{opacity:1;background:var(--tint);border-radius:10px;box-shadow:0 0 0 3px var(--col);transform:scale(1.015);padding:4px 8px;margin-inline-start:-8px}
.lv-now b{background:linear-gradient(transparent 58%,#FFE066 58%) no-repeat 0 0/0 100%;animation:lv-mark .7s ease forwards;animation-delay:calc(var(--k,0) * .35s + .3s)}
@keyframes lv-mark{to{background-size:100% 100%}}
/* lesson heads: the lesson's icon bounces in, and how many topics are explained */
.part-head .lv-icon{display:inline-block;align-self:center;font-size:34px;line-height:1;color:inherit;transform-origin:50% 90%}
.part-head.lv-on .lv-icon{animation:lv-boing 1s cubic-bezier(.2,1.6,.4,1)}
@keyframes lv-boing{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.3) rotate(8deg)}100%{transform:none}}
.lv-prog{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--ink-2)}
.lv-prog i{display:block;width:90px;height:12px;border:2px solid var(--ink);border-radius:999px;background:linear-gradient(90deg,var(--col) var(--p,0%),var(--paper) var(--p,0%))}
.lv-prog.lv-full span::after{content:" 🎉"}
/* moving diagrams */
.lv-cap{max-width:440px;width:100%;margin:0;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:700;font-size:15px;box-shadow:2px 2px 0 var(--col);text-align:center}
.lv-cap:empty{display:none}
.lv-cap.lv-pop{animation:lv-cap .35s ease}
@keyframes lv-cap{from{transform:translateY(6px);opacity:.2}to{transform:none;opacity:1}}
.lv-playing svg{box-shadow:0 0 0 4px var(--sun),4px 4px 0 4px var(--ink)}
.fig .mk.lv-hot circle{fill:#FF6FB5}
.fig ol li.lv-hot{background:var(--sun-2);border-radius:8px;box-shadow:0 0 0 2px var(--ink)}
/* the words: flip cards */
.lv-hint{font-size:14px;color:var(--ink-2);font-weight:600}
.lv-flip{display:grid;width:100%;padding:0;border:0;background:none;cursor:pointer;perspective:800px;text-align:start;font:inherit;color:inherit}
.lv-flip > span{grid-area:1/1;display:grid;align-content:center;gap:2px;min-height:64px;padding:8px 12px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);box-shadow:2px 2px 0 var(--col);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.lv-flip .lv-f{font-weight:800;font-size:18px}
.lv-flip .lv-f small{font-size:12px;font-weight:700;color:var(--ink-2)}
.lv-flip .lv-b{transform:rotateY(180deg);background:var(--tint);font-size:15px}
.lv-flip[aria-pressed="true"] .lv-f{transform:rotateY(-180deg)}
.lv-flip[aria-pressed="true"] .lv-b{transform:rotateY(0)}
.lv-flip:focus-visible > span{outline:3px solid var(--ink);outline-offset:2px}
/* a whole lesson explained */

/* ---------- HELPERS ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => String(s).replace(/<[^>]+>/g, "");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const rand = a => a[Math.floor(Math.random() * a.length)];
function todayISO(){ try { return new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } }
const dayDiff = (a, b) => Math.round((Date.UTC(...b.split("-").map((x, i) => i === 1 ? x - 1 : +x)) - Date.UTC(...a.split("-").map((x, i) => i === 1 ? x - 1 : +x))) / 864e5);
function announce(t){ const l = $("#live"); if (l){ l.textContent = ""; setTimeout(() => { l.textContent = t; }, 40); } }

/* ---------- SAVED PROGRESS ---------- */
const fresh = () => ({xp:0, xq:{}, best:null, tests:0, rounds:0, mastered:{}, seen:{}});
let S = (() => { try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && typeof v === "object") return Object.assign(fresh(), v); } catch (e) {} return fresh(); })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function addXP(n){ S.xp += n; save(); $("#xpVal").textContent = S.xp; }
/* points once per question: a right answer to a question already rewarded (same kind, text and answer) gives no new xp */
function xqKey(){ const s = Array.prototype.join.call(arguments, "|"); let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
/* a lesson mastered (80% of a full round, or 24 of 30 in the test): the arcade (assets/arcade.js) gives play time for it, once */
function master(m){ if (!S.mastered || typeof S.mastered !== "object") S.mastered = {}; if (!S.mastered[m]) S.mastered[m] = Date.now(); }

/* ---------- THE BANKS, joined ---------- */
const TOPICS = T23.concat(T45).map(t => Object.assign({les:t.id.slice(0, 2)}, t));
const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const VOCAB = V23.concat(V45);
const tagged = a => a.map(q => Object.assign({p:TOPIC[q.l].les}, q));
const MC = tagged(MC23.concat(MC45)), TF = tagged(TF23.concat(TF45)), TYPE = tagged(TY23.concat(TY45));
const ORDER = tagged(OR23.concat(OR45)), LABEL = tagged(LB23);
const of = (a, les) => a.filter(q => q.p === les);

/* ---------- DIAGRAMS ----------
   A figure is a drawing with numbered markers. On the page every marker is named in the key under it; in a "label it" question
   only some markers are shown, numbered again from 1, and each number gets a list of names to choose from. */
function figHTML(key, ids, named){
  const F = FIGS[key], list = ids || F.parts.map((x, i) => i);
  const marks = list.map((i, n) => { const [x, y] = F.parts[i].at;
    return '<g class="mk"><circle cx="' + x + '" cy="' + y + '" r="11" fill="#FFD23F" stroke="#14163A" stroke-width="2.5"/><text x="' + x + '" y="' + (y + 4.5) + '" text-anchor="middle" font-size="13" font-weight="800" font-family="Lexend,system-ui,sans-serif" fill="#14163A">' + (n + 1) + '</text></g>'; }).join("");
  return '<figure class="fig" data-fig="' + key + '"><svg viewBox="' + F.vb + '" style="max-width:' + (F.w || 440) + 'px" role="img" aria-label="' + esc(F.alt) + (named ? "" : ", with numbered parts to label") + '">' + F.svg + marks + '</svg>'
    + (named ? '<ol>' + list.map((i, n) => '<li><i>' + (n + 1) + '</i><span><b>' + F.parts[i].name + ':</b> ' + F.parts[i].job + '</span></li>').join("") + '</ol>' : "") + '</figure>';
}

/* ---------- ROUNDS ----------
   A round is a list of steps: mc, tf, type (a term to type), match (terms to meanings), label (parts of a diagram) or order
   (a path or process to put in order). Every step remembers its lesson, for the test's breakdown. */
function spread(list, n){
  /* n questions spread over the lesson's topics, so a round covers the whole lesson */
  const by = {}; shuffle(list).forEach(q => (by[q.l] = by[q.l] || []).push(q));
  const groups = shuffle(Object.values(by)), out = [];
  while (out.length < n && groups.some(g => g.length)) groups.forEach(g => { if (g.length && out.length < n) out.push(g.shift()); });
  return out;
}
function mixed(items){ if (items.length < 2) return items.slice(); let s; do s = shuffle(items); while (s.every((x, i) => x === items[i])); return s; }
const mcStep = q => ({type:"mc", q, order:shuffle(q.o.map((o, i) => i))});
const tfStep = q => ({type:"tf", q});
const tyStep = q => ({type:"type", q});
/* words whose meanings overlap are never matched together */
const CLASH = [["voluntary muscle", "skeletal muscle"], ["involuntary muscle", "cardiac muscle"], ["involuntary muscle", "smooth muscle"],
  ["digestion", "mechanical digestion"], ["digestion", "chemical digestion"], ["elimination", "excretory system"], ["receptor", "taste buds"]];
const clash = (a, b) => CLASH.some(c => c.includes(a) && c.includes(b));
function matchStep(les){
  const got = [];
  for (const v of shuffle(VOCAB.filter(v => TOPIC[v[2]].les === les))) if (got.length < 4 && !got.some(g => clash(g[0], v[0]))) got.push(v);
  const ps = got.map(v => ({a:v[0], b:v[1], l:v[2]}));
  return {type:"match", ps, p:les, right:shuffle(ps.map((x, i) => i))};
}
function labelStep(q){
  const F = FIGS[q.fig], ids = pick(F.parts.map((x, i) => i), Math.min(q.n || 5, F.parts.length)).sort((a, b) => a - b);
  const ps = ids.map((i, n) => ({a:String(n + 1), b:F.parts[i].name, l:q.l}));
  return {type:"label", q, ids, ps, p:q.p, right:shuffle(ps.map((x, i) => i))};
}
const orderStep = q => ({type:"order", q, pool:mixed(q.items), ans:[]});
function lessonSteps(les){
  const singles = spread(of(MC, les), 6).map(mcStep).concat(pick(of(TF, les), 2).map(tfStep), pick(of(TYPE, les), 1).map(tyStep));
  const lb = of(LABEL, les), od = of(ORDER, les), big = [];
  if (lb.length) big.push(labelStep(rand(lb)));
  big.push(od.length && Math.random() < .6 ? orderStep(rand(od)) : matchStep(les));
  return shuffle(singles).concat(big);
}
const TEST_PLAN = {l2:[6, 1, 1], l3:[6, 1, 1], l4:[5, 1, 1], l5:[5, 1, 1]};   /* mc, tf, type: 8 + 8 + 7 + 7 = 30 */
function testSteps(){
  return LESSONS.flatMap(x => { const [m, t, y] = TEST_PLAN[x.id];
    return shuffle(spread(of(MC, x.id), m).map(mcStep).concat(pick(of(TF, x.id), t).map(tfStep), pick(of(TYPE, x.id), y).map(tyStep))); });
}
const MODES = Object.fromEntries(LESSONS.map(x => [x.id, {name:"Lesson " + x.n + ": " + x.name, short:"Lesson " + x.n + " practice", p:x.id, steps:() => lessonSteps(x.id)}]));
MODES.test = {name:"Practice test", short:"Practice test", p:"test", steps:testSteps};
const PART_LABEL = {mc:"Choose the best answer", tf:"True or false?", type:"Type the science word", match:"Match each word", label:"Label the diagram", order:"Put them in order"};
let R = null;
function start(mode){ R = {mode, steps:MODES[mode].steps(), i:0, res:[], locked:false}; renderStep(); window.scrollTo(0, 0); }
const stepLes = st => st.type === "match" || st.type === "label" ? st.p : st.q.p;

function renderStep(){
  const st = R.steps[R.i], n = R.steps.length, p = stepLes(st);
  R.locked = false;

    + st.order.map((k, i) => '<button class="opt" type="button" data-act="mc" data-k="' + k + '"><span class="k" aria-hidden="true">' + "ABCD"[i] + '</span><span>' + esc(st.q.o[k]) + '</span></button>').join("") + '</div>';
  else if (st.type === "tf") body = '<p class="q-text" id="qtext">' + esc(st.q.q) + '</p><div class="tf" role="group" aria-labelledby="qtext">'
    + '<button class="opt" type="button" data-act="tf" data-v="1">✔ True</button><button class="opt" type="button" data-act="tf" data-v="0">✖ False</button></div>';

    + (st.type === "label" ? figHTML(st.q.fig, st.ids, false) : "") + '<div class="match">'
    + st.ps.map((x, i) => '<div class="mrow' + (st.type === "label" ? " num" : "") + '" data-i="' + i + '"><b id="ma' + i + '">' + esc(x.a) + '</b><select data-i="' + i + '" aria-labelledby="qtext ma' + i + '"><option value="">Choose…</option>'
      + st.right.map(j => '<option value="' + j + '">' + esc(st.ps[j].b) + '</option>').join("") + '</select></div>').join("") + '</div>'

  else body = '<p class="q-text" id="qtext">' + esc(st.q.q).replace("______", '<span class="blank" aria-label="blank"></span>') + '</p><div class="typein"><input id="typeIn" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-labelledby="qtext" placeholder="Type the word"></div>'
    + '<div class="actions"><button class="btn go" type="button" data-act="checktype">Check</button></div>';
  $("#main").innerHTML = '<section class="run panel p-' + p + '">'
    + '<div class="run-top"><button class="btn sm" type="button" data-act="home">← Page</button><b>' + esc(MODES[R.mode].short) + '</b><span class="counter">' + (R.i + 1) + ' / ' + n + '</span></div>'
    + '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + R.i + '" aria-label="Questions done"><i style="width:' + Math.round(R.i / n * 100) + '%"></i></div>'
    + '<p class="q-part">Lesson ' + LESSON[p].n + ' · ' + PART_LABEL[st.type] + '</p>' + body + '<div id="fbBox"></div></section>';
  if (window.MonmonAnswers) MonmonAnswers.ask();
  const f = $(".opt") || $("select") || $("#typeIn");
  if (f && window.matchMedia && matchMedia("(pointer: fine)").matches) f.focus({preventScroll:true});
}

/* ---------- LESSON CARDS, shown in place during a round and on the page ---------- */
const topicBody = t => '<ul class="kp">' + t.pts.map(x => '<li>' + x + '</li>').join("") + '</ul>' + (t.fig ? figHTML(t.fig, null, true) : "") + (t.more || "");
/* on the page, a topic with a 3D model shows the model first; its flat drawing (the one the label questions use) folds away */
const cardBody = t => !LAB3D[t.id] || !t.fig ? topicBody(t)
  : '<ul class="kp">' + t.pts.map(x => '<li>' + x + '</li>').join("") + '</ul><details class="l3-flat"><summary>🖼️ Flat drawing with the names</summary>' + figHTML(t.fig, null, true) + '</details>' + (t.more || "");
const lessonPeek = l => '<details class="peek"><summary>Look at “' + esc(TOPIC[l].t) + '”</summary><div class="peek-in">' + topicBody(TOPIC[l]) + '</div></details>';
const lessonLink = l => '<a href="#' + l + '" data-act="lesson" data-l="' + esc(l) + '">Review “' + esc(TOPIC[l].t) + '” →</a>';

/* ---------- ANSWERS ---------- */
function record(ok, given, right, why, l, text, p){
  /* every answer goes to the parent's report (assets/answers.js) */
  if (window.MonmonAnswers) MonmonAnswers.log({tp:l, tn:(typeof TOPIC === "object" && TOPIC && TOPIC[l] && TOPIC[l].t) || "", k:R.steps[R.i].type, q:text, a:given, r:right, ok, w:why, m:R.mode});
  R.res.push({ok, given, right, why, l, text, p, type:R.steps[R.i].type});
  R.rep = false;
  if (ok){
    if (!S.xq || typeof S.xq !== "object") S.xq = {};
    const k = xqKey(R.steps[R.i].type, text, right);
    if (S.xq[k]) R.rep = true; else { S.xq[k] = 1; addXP(10); }
  }
}
function feedback(ok, why, l, extra){
  R.locked = true;
  const last = R.i === R.steps.length - 1;
  $("#fbBox").innerHTML = '<div class="fb ' + (ok ? "ok" : "no") + '"><span class="burst">' + (ok ? "Nice! ✔" : "Not quite ✖") + '</span>' + (ok && R.rep ? '<p class="why">⭐ You already got points for this question, so no new points this time. New points come from questions you haven’t answered right before.</p>' : "") + (extra || "")
    + '<p class="why">' + esc(why) + '</p>' + (ok ? "" : lessonPeek(l)) + '</div>'
    + '<div class="actions"><button class="btn ink" type="button" data-act="next" id="nextBtn">' + (last ? "See my result →" : "Next →") + '</button></div>';
  announce((ok ? "Correct. " : "Not quite. ") + why);
  $("#nextBtn").focus({preventScroll:true});
}
function answerMC(k){
  const st = R.steps[R.i]; if (R.locked) return;
  const ok = k === 0;
  document.querySelectorAll(".opt").forEach(b => { const bk = +b.dataset.k; b.disabled = true; b.classList.add(bk === 0 ? "right" : bk === k ? "wrong" : "dim"); });
  record(ok, st.q.o[k], st.q.o[0], st.q.w, st.q.l, strip(st.q.q), st.q.p);
  feedback(ok, st.q.w, st.q.l);
}
function answerTF(v){
  const st = R.steps[R.i]; if (R.locked) return;
  const ok = v === st.q.a;
  document.querySelectorAll(".opt").forEach(b => { const bv = b.dataset.v === "1"; b.disabled = true; b.classList.add(bv === st.q.a ? "right" : bv === v ? "wrong" : "dim"); });
  record(ok, v ? "True" : "False", st.q.a ? "True" : "False", st.q.w, st.q.l, st.q.q, st.q.p);
  feedback(ok, st.q.w, st.q.l);
}
function checkMatch(){
  const st = R.steps[R.i]; if (R.locked) return;
  const sel = [...document.querySelectorAll(".mrow select")];
  if (sel.some(s => s.value === "")){ announce("Choose an answer for each row first."); sel.find(s => s.value === "").focus(); return; }
  let right = 0;
  sel.forEach(s => {
    const i = +s.dataset.i, ok = +s.value === i, row = s.closest(".mrow");
    s.disabled = true; row.classList.add(ok ? "right" : "wrong");
    if (!ok) row.insertAdjacentHTML("beforeend", '<p class="fix">Right answer: ' + esc(st.ps[i].b) + '</p>');
    if (ok) right++;
    const lab = st.type === "label";
    record(ok, st.ps[+s.value].b, st.ps[i].b, lab ? "Number " + st.ps[i].a + " is the " + st.ps[i].b.toLowerCase() + "." : st.ps[i].a + ": " + st.ps[i].b,
      st.ps[i].l, lab ? strip(st.q.q) + " (number " + st.ps[i].a + ")" : st.ps[i].a, st.p);
  });
  const miss = st.ps.find((x, i) => +sel[i].value !== i);
  feedback(right === st.ps.length, right + " of " + st.ps.length + " right." + (st.type === "label" && st.q.w ? " " + st.q.w : ""), miss ? miss.l : st.ps[0].l);
}
/* typed words: capitals, spaces and a plural s don't matter; one slip in a long word counts, with the spelling shown */
const norm = s => String(s).toLowerCase().replace(/[^a-z]+/g, " ").trim();
const sing = s => s.replace(/(ies)$/, "y").replace(/(s)$/, "");
function lev(a, b){
  const d = Array.from({length:a.length + 1}, (x, i) => [i].concat(Array(b.length).fill(0)));
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function typeOK(q, typed){
  const t = norm(typed), forms = [q.a].concat(q.alt || []).map(norm);
  if (!t) return "";
  if (forms.some(f => f === t || sing(f) === sing(t))) return "ok";
  if (t.length >= 4 && forms.some(f => f.length >= 6 && lev(f, t) <= 1)) return "spell";
  return "";
}
function checkType(){
  const st = R.steps[R.i]; if (R.locked) return;
  const inp = $("#typeIn"), v = inp.value.trim();
  if (!norm(v)){ announce("Type your answer first."); inp.focus(); return; }
  const r = typeOK(st.q, v), ok = r !== "";
  inp.readOnly = true;
  record(ok, v, st.q.a, st.q.w, st.q.l, st.q.q.replace("______", "___"), st.q.p);
  feedback(ok, st.q.w, st.q.l, r === "spell" ? '<p><b>Check the spelling: ' + esc(st.q.a) + '</b></p>' : ok ? "" : '<p><b>The word is: ' + esc(st.q.a) + '</b></p>');
}
function orderPick(i){
  const st = R.steps[R.i]; if (R.locked || st.ans.includes(i)) return;
  st.ans.push(i); orderDraw();
}
function orderUndo(){ const st = R.steps[R.i]; if (R.locked || !st.ans.length) return; st.ans.pop(); orderDraw(); }
function orderDraw(){
  const st = R.steps[R.i], lis = document.querySelectorAll("#ordAns li");
  lis.forEach((li, k) => { const i = st.ans[k]; li.textContent = i === undefined ? "" : st.pool[i]; li.classList.toggle("on", i !== undefined); });
  document.querySelectorAll(".ord-pool .opt").forEach(b => { b.disabled = st.ans.includes(+b.dataset.i); });
  $("#ordUndo").disabled = !st.ans.length;
  $("#ordCheck").disabled = st.ans.length < st.pool.length;
  const nextBtn = [...document.querySelectorAll(".ord-pool .opt")].find(b => !b.disabled);
  if (nextBtn && window.matchMedia && matchMedia("(pointer: fine)").matches) nextBtn.focus({preventScroll:true});
  else if (!nextBtn) $("#ordCheck").focus({preventScroll:true});
}
function checkOrder(){
  const st = R.steps[R.i]; if (R.locked || st.ans.length < st.pool.length) return;
  let right = 0;
  document.querySelectorAll(".ord-pool .opt").forEach(b => { b.disabled = true; });
  $("#ordUndo").disabled = true; $("#ordCheck").disabled = true;
  document.querySelectorAll("#ordAns li").forEach((li, k) => {
    const given = st.pool[st.ans[k]], want = st.q.items[k], ok = given === want;
    li.classList.add(ok ? "right" : "wrong");
    if (!ok) li.insertAdjacentHTML("beforeend", '<small>Here: ' + esc(want) + '</small>');
    if (ok) right++;
    record(ok, given, want, "Step " + (k + 1) + " is: " + want + ".", st.q.l, strip(st.q.q) + " (step " + (k + 1) + ")", st.q.p);
  });
  feedback(right === st.q.items.length, right + " of " + st.q.items.length + " in the right place. " + st.q.w, st.q.l);

/* ----- «Explain it»: a topic, point by point ----- */
function lvExplain(card){
  const same = LV && LV.kind === "explain" && LV.el === card;
  lvStop();
  if (same || !card) return;
  const items = [...card.querySelectorAll(":scope > .kp > li")], btn = card.querySelector('[data-lv="explain"]'), bar = card.querySelector(".lv-bar");
  if (!items.length) return;
  const nx = document.createElement("button");
  nx.type = "button"; nx.className = "lv-btn lv-alt"; nx.dataset.lv = "next"; nx.textContent = "⏭ Next";
  const my = {kind:"explain", el:card, dead:false, timer:0, i:-1};
  my.stop = () => { my.dead = true; clearTimeout(my.timer); lvHush(); card.classList.remove("lv-teach"); items.forEach(li => li.classList.remove("lv-now", "lv-past")); nx.remove(); lvBtn(btn, false); };
  const next = () => {
    if (my.dead) return;
    clearTimeout(my.timer); lvHush();
    const i = ++my.i;
    if (i >= items.length){ my.stop(); if (LV === my) LV = null; lvExplored(card); return; }
    items.forEach((li, j) => { li.classList.toggle("lv-now", j === i); li.classList.toggle("lv-past", j < i); });
    const li = items[i];
    li.querySelectorAll("b").forEach((b, k) => b.style.setProperty("--k", k));
    if (i) sfx("ding");
    lvShow(li);
    const t0 = performance.now(), text = li.textContent.replace(/\s+/g, " ").trim();
    const spoke = lvSay(text, () => { if (!my.dead && my.i === i) my.timer = setTimeout(next, Math.max(0, 1300 - (performance.now() - t0)) + 450); });
    if (!spoke) my.timer = setTimeout(next, lvReadMs(text));
  };
  my.next = next;
  card.classList.remove("lv-in", "lv-on");
  LV = my; card.classList.add("lv-teach"); lvBtn(btn, true); bar.appendChild(nx);
  sfx("whoosh"); next();
}

  if (!st){ st = document.createElement("span"); st.className = "lv-stamp"; st.textContent = "✓ Explained"; bar.appendChild(st); }

}

const lvEase = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const lvWave = (t, ms) => (1 - Math.cos(t / ms * 2 * Math.PI)) / 2;   /* 0 → 1 → 0, once every ms */
/* the heart's lub-dub: a beat, a smaller second beat, then a rest, once every per ms */
function lvLubdub(t, per){ const f = (t % per) / per; return f < .14 ? Math.sin(f / .14 * Math.PI) : f > .22 && f < .34 ? .6 * Math.sin((f - .22) / .12 * Math.PI) : 0; }
const lvRot = (el, a, cx, cy) => { if (el) el.setAttribute("transform", "rotate(" + a.toFixed(2) + " " + cx + " " + cy + ")"); };
const lvScale = (el, sx, sy, cx, cy) => { if (el) el.setAttribute("transform", "translate(" + cx + " " + cy + ") scale(" + sx.toFixed(3) + " " + sy.toFixed(3) + ") translate(" + (-cx) + " " + (-cy) + ")"); };
function lvAt(el, q){
  if (el.tagName === "g") el.setAttribute("transform", "translate(" + q.x.toFixed(1) + " " + q.y.toFixed(1) + ")");
  else { el.setAttribute("cx", q.x.toFixed(1)); el.setAttribute("cy", q.y.toFixed(1)); }
}

function lvBubble(c, txt, fill){
  const g = c.add("g", {});

  c.add("text", {y:3, "text-anchor":"middle", "font-size":7.5, "font-weight":800, "font-family":"Lexend,system-ui,sans-serif", fill:INK}, txt, g);

}
/* dots that run round a loop, each coloured by where it is */
function lvFlow(route, dots, t, ms, color){
  dots.forEach((e, i) => { const f = ((t / ms) + i / dots.length) % 1; lvAt(e, route(f)); e.setAttribute("fill", color(f)); });
}

function lvShed(c, t, q, every, mk){

function lvWatch(fig){
  const same = LV && LV.kind === "watch" && LV.el === fig;
  lvStop();
  if (same || !fig) return;
  const A = LV_FIG[fig.dataset.fig], svg = fig.querySelector("svg"), cap = fig.querySelector(".lv-cap"), btn = fig.querySelector('[data-lv="watch"]');
  if (!A || !svg) return;
  const marks = [...svg.querySelectorAll(".mk")], rows = [...fig.querySelectorAll("ol > li")];
  const layer = document.createElementNS(NS, "g");
  layer.setAttribute("class", "lv-layer"); layer.setAttribute("aria-hidden", "true");
  svg.insertBefore(layer, marks[0] || null);
  const c = {svg, layer, sl:null, n:{}, q:s => svg.querySelector(s), qa:s => [...svg.querySelectorAll(s)],
    /* make an element: in this step's layer (gone when the step ends), in the diagram's layer (keep = true) or in a group */
    add(tag, at, txt, where){ const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (txt != null) e.textContent = txt;
      (where === true ? layer : where || c.sl || layer).appendChild(e); return e; },
    route(d){ const pth = c.add("path", {d, fill:"none", stroke:"none"}), L = pth.getTotalLength(); return f => pth.getPointAtLength(Math.max(0, Math.min(1, f)) * L); },
    once(k){ if (c.n[k]) return false; c.n[k] = 1; return true; }};
  const halo = c.add("circle", {r:15, fill:"none", stroke:"#FF6FB5", "stroke-width":4, opacity:0}, null, true);
  const hot = mk => {
    marks.forEach((m, j) => m.classList.toggle("lv-hot", j === mk)); rows.forEach((r, j) => r.classList.toggle("lv-hot", j === mk));
    const at = mk >= 0 && FIGS[fig.dataset.fig].parts[mk].at;
    if (at){ halo.setAttribute("cx", at[0]); halo.setAttribute("cy", at[1]); halo.setAttribute("opacity", 1); } else halo.setAttribute("opacity", 0);
  };
  const say = text => { cap.textContent = text; cap.classList.remove("lv-pop"); void cap.offsetWidth; cap.classList.add("lv-pop"); };
  const my = {kind:"watch", el:fig, dead:false, raf:0, timer:0};
  my.stop = () => {
    my.dead = true; cancelAnimationFrame(my.raf); clearTimeout(my.timer); lvHush(); hot(-1);
    layer.remove(); svg.querySelectorAll('[class^="mv-"]').forEach(g => g.removeAttribute("transform"));
    fig.classList.remove("lv-playing"); lvBtn(btn, false);
    if (!my.ended) cap.textContent = "";
  };
  LV = my; fig.classList.add("lv-playing"); lvBtn(btn, true);
  if (A.setup) A.setup(c);
  let i = -1;
  const step = () => {
    if (my.dead) return;
    if (c.sl) c.sl.remove();
    c.sl = document.createElementNS(NS, "g"); layer.insertBefore(c.sl, halo); c.n = {};
    const st = A.steps[++i];
    if (!st){ my.ended = true; my.stop(); if (LV === my) LV = null; say(A.end); sfx("tada"); lvSay(A.end); return; }
    hot(st.mk);
    say(st.cap);
    if (st.sfx) sfx(st.sfx);
    if (st.init) st.init(c);
    let said = false;
    if (!lvSay(st.cap, () => { said = true; })) said = true;
    const t0 = performance.now(), still = lvStill();
    const frame = now => {
      if (my.dead) return;
      const t = Math.max(0, now - t0), p = Math.min(1, t / st.dur);
      if (!still && st.tick) st.tick(c, p, t);
      halo.setAttribute("r", (14 + 4 * lvWave(t, 700)).toFixed(1));
      if (p >= 1 && said){ my.timer = setTimeout(step, 400); return; }
      my.raf = requestAnimationFrame(frame);
    };
    my.raf = requestAnimationFrame(frame);
  };
  lvShow(svg);
  sfx("whoosh"); step();
}

/* ----- cards that rise in as they come into view ----- */
let lvIO = null;
function lvReveal(root){
  if (lvIO){ lvIO.disconnect(); lvIO = null; }
  if (lvStill() || !("IntersectionObserver" in window)) return;   /* nothing is hidden */
  const els = [...root.querySelectorAll(".part .part-head, .part article.card, .part .lab-cta")];
  els.forEach(el => { el.classList.add("lv-in"); el.querySelectorAll(":scope > .kp > li").forEach((li, i) => li.style.setProperty("--i", Math.min(i, 8))); });
  /* once it has risen in, the card goes back to plain (so «Explain it» can dim and light its points) */
  lvIO = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; const el = e.target; el.classList.add("lv-on"); lvIO.unobserve(el); setTimeout(() => el.classList.remove("lv-in", "lv-on"), 1700); }),
    {rootMargin:"0px 0px -6% 0px", threshold:.06});
  els.forEach(el => lvIO.observe(el));
}

/* ----- the sound switch in the top bar ----- */
function lvSndBtn(){ const b = $("#sndBtn"); if (b){ const on = lvSoundOn(); b.setAttribute("aria-pressed", on ? "true" : "false"); b.setAttribute("aria-label", "Sounds and reading voice: " + (on ? "on" : "off")); } }
function lvToggleSound(){
  const on = !lvSoundOn();
  if (window.MonmonRewards && MonmonRewards.sound) MonmonRewards.sound(on); else lvMute = !on;
  if (!on) lvHush();
  lvSndBtn();
  announce(on ? "Sounds on" : "Sounds off");
}

/* after the home is drawn: stamps, progress, ▶ buttons on the diagrams, cards that rise in */
function enliven(){
  const main = $("#main"); L3 = null;
  LESSONS.forEach(x => lvProgress(x.id));
  main.querySelectorAll(".part article.card[id]").forEach(card => lvStamp(card, !!(S.seen && S.seen[card.id]), false));
  main.querySelectorAll(".part figure.fig[data-fig]").forEach(fig => {
    const A = LV_FIG[fig.dataset.fig];
    if (!A || fig.querySelector(".lv-figbar")) return;
    const bar = document.createElement("div"); bar.className = "lv-figbar";
    bar.innerHTML = '<button class="lv-btn" type="button" data-lv="watch" aria-pressed="false" data-label="' + esc(A.label) + '">' + esc(A.label) + '</button>';
    fig.insertBefore(bar, fig.firstChild);
    const cap = document.createElement("p"); cap.className = "lv-cap"; cap.setAttribute("aria-live", "polite");
    fig.querySelector("svg").after(cap);
  });
  lvReveal(main);
  lvSndBtn();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lv]");
  if (b){
    const a = b.dataset.lv;
    if (a === "l3") lab3dOpen(b.closest(".l3"));
    else if (a === "l3close"){ const box = L3 && L3.box; lab3dClose(); if (box) box.querySelector(".l3-poster").focus(); }
    else if (a === "explain"){ lab3dHush(); lvExplain(b.closest("article.card")); }
    else if (a === "next"){ if (LV && LV.next) LV.next(); }
    else if (a === "watch"){ lab3dHush(); lvWatch(b.closest("figure.fig")); }
    else if (a === "snd") lvToggleSound();
    else if (a === "flipall"){
      const on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on ? "true" : "false"); b.textContent = on ? "↺ Hide the meanings" : "↻ Show all meanings";
      b.closest(".lv-words").querySelectorAll(".lv-flip").forEach((f, i) => setTimeout(() => f.setAttribute("aria-pressed", on ? "true" : "false"), lvStill() ? 0 : i * 35));
      sfx("flip");
    }
    return;
  }
  const f = e.target.closest(".lv-flip");
  if (f){ f.setAttribute("aria-pressed", f.getAttribute("aria-pressed") === "true" ? "false" : "true"); sfx("flip"); return; }
  if (e.target.closest("[data-act]")) lvStop();   /* a practice round or the print button: stop what is playing */
});
document.addEventListener("visibilitychange", () => { if (document.hidden) lvStop(); });
/* another device explained a topic: show it here */
window.addEventListener("monmon-sync", () => {
  if (typeof R !== "undefined" && R) return;
  LESSONS.forEach(x => lvProgress(x.id));
  document.querySelectorAll(".part article.card[id]").forEach(card => lvStamp(card, !!(S.seen && S.seen[card.id]), false));
});

/* ---------- EVENTS ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "start") start(b.dataset.m);
  else if (a === "mc") answerMC(+b.dataset.k);
  else if (a === "tf") answerTF(b.dataset.v === "1");
  else if (a === "checkmatch") checkMatch();
  else if (a === "checktype") checkType();
  else if (a === "ordpick") orderPick(+b.dataset.i);
  else if (a === "ordundo") orderUndo();
  else if (a === "checkorder") checkOrder();
  else if (a === "next") next();
  else if (a === "home"){ R = null; renderHome(); window.scrollTo(0, 0); }
  else if (a === "lesson"){ e.preventDefault(); R = null; renderHome(); const t = document.getElementById(b.dataset.l); if (t) t.scrollIntoView(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "typeIn" && R && !R.locked){ e.preventDefault(); checkType(); } });
$("#printBtn").addEventListener("click", () => window.print());
/* another device's progress arrived: refresh the numbers in place, without leaving a round */
window.addEventListener("monmon-sync", e => {
  try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v) S = Object.assign(fresh(), v); } catch (err) {}
  $("#xpVal").textContent = S.xp;
  if (!R){ const stats = document.querySelectorAll(".hero .stat b"); if (stats.length === 3){ stats[0].textContent = S.best === null ? "–" : S.best + "/30"; stats[1].textContent = S.tests; stats[2].textContent = S.xp; } }
  e.preventDefault();
});

$("#xpVal").textContent = S.xp;
renderHome();
renderPrint();
if (location.hash.length > 1){ const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
