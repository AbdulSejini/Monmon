name: EduPage probe (temporary)

# Runs tools/edupage_sync.py as the sync workflow will, on the two kinds of
# machine it will use, without committing or pushing anything. Runs only on
# the work branch and only when this file changes.
on:
  push:
    branches: [claude/zen-mayer-9y6b6q]
    paths: [".github/workflows/edupage-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm]
        try: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run the sync script (no commit)
        id: fetch
        run: |
          echo "PROBE $(python3 --version) at $(command -v python3); $(bash --version | head -1)"
          python3 tools/edupage_sync.py
      - name: Report
        if: always()
        run: |
          echo "PROBE outcome=${{ steps.fetch.outcome }} read=${{ steps.fetch.outputs.read }} changed=${{ steps.fetch.outputs.changed }}"
          echo "PROBE $(git diff --stat -- index.html | tail -1)"
