name: Delete gh-pages branch (one-off)

# Runs once when this file is pushed to the working branch; removed right after.
on:
  push:
    branches: [claude/new-session-a2carx]
    paths: [.github/workflows/delete-gh-pages.yml]

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the unused gh-pages branch
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/gh-pages" || echo "gh-pages is already gone"
        env:
          GH_TOKEN: ${{ github.token }}
