name: Sync EduPage

# Refreshes index.html from the school's public EduPage homework/tests list
# twice a day (06:23 and 16:23 Jeddah time) and commits only when it changed.
# GitHub Pages builds the site from this branch, so a sync commit goes live.
on:
  schedule:
    - cron: "23 3,13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: edupage-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Fetch homework and tests for class 6.3
        run: python3 tools/edupage_sync.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync homework and tests from EduPage"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # the bot's push should start a Pages build by itself; ask for one in case it doesn't
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
