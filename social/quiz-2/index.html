<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مراجعة الاجتماعيات: الاختبار القصير 2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2212%22 fill=%22%23F5E6D6%22 stroke=%22%2314163A%22 stroke-width=%225%22/%3E%3Cpath d=%22M32 50V22M32 22c-10-8-18-4-20 0M32 22c10-8 18-4 20 0M32 22c-6-10-2-14 0-14M32 22c6-10 2-14 0-14%22 fill=%22none%22 stroke=%22%230F8A5F%22 stroke-width=%224.5%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#14163A; --ink-2:#4A4D78; --ink-3:#8A8DB0;
  --paper:#FFFFFF; --page:#F6EFE6; --dot:rgba(20,22,58,.07);
  --sun:#FFD23F; --sun-2:#FFF3C4;
  --good:#12A15E; --good-bg:#DCF7E9;
  --bad:#E23D45; --bad-bg:#FFE1E2;
  --col:#8C5A2B; --tint:#F5E6D6;
  --shadow:4px 4px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --r:14px; --r-sm:10px;
  --font:"Tajawal","Segoe UI","Geeza Pro",Tahoma,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:18px 18px;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.3;font-weight:800;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0}
:focus-visible{outline:3px solid #2F7DE1;outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.c-so1{--col:#B5651D;--tint:#FBE9D7} .c-so2{--col:#0F8A5F;--tint:#D7F2E6} .c-so3{--col:#7A4FD0;--tint:#ECE3FF} .c-mock{--col:#8C5A2B;--tint:#F5E6D6}

.topbar{background:var(--paper);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:880px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{font-size:26px;font-weight:800;color:#E9B97A;-webkit-text-stroke:1.2px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg);white-space:nowrap;line-height:1.2}
.chip{font-size:13px;font-weight:800;background:var(--ink);color:#fff;padding:3px 9px;border-radius:6px;white-space:nowrap}
.xp{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--sun-2);border:2px solid var(--ink);border-radius:999px;padding:2px 11px;white-space:nowrap}
.spacer{flex:1}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--sun-2);box-shadow:2px 2px 0 var(--ink);text-decoration:none;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:800;text-decoration:none;box-shadow:var(--shadow-sm);text-align:center;white-space:nowrap}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.go{background:var(--sun)}
.btn.ink{background:var(--ink);color:#fff}
.btn.sm{min-height:38px;padding:5px 12px;font-size:15px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.hero{margin-top:20px;padding:18px;display:grid;gap:12px;border-inline-start:12px solid var(--col)}
.hero h1{font-size:clamp(26px,5.6vw,38px)}
.hero .sub{color:var(--ink-2);font-weight:700}
.badge{font-size:13px;font-weight:800;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--sun-2);white-space:nowrap}
.badge.hot{background:var(--bad);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:2px solid var(--ink);border-radius:var(--r-sm);padding:8px;background:var(--page);text-align:center;display:grid}
.stat b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;font-weight:700;color:var(--ink-2)}
.sec{margin-top:30px}
.sec-head{margin-bottom:12px;display:grid;gap:2px}
.sec-head h2{font-size:27px}
.sec-head p{color:var(--ink-2);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{padding:14px;display:grid;gap:8px;align-content:start;border:3px solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow-sm);border-inline-start:10px solid var(--col)}
.tile b{font-size:17px;line-height:1.45}
.tile span{font-size:14px;color:var(--ink-2);font-weight:700}
.tile .row{margin-top:auto}
.mock-cta{margin-top:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--sun-2)}
.mock-cta p{flex:1 1 260px;font-weight:700}

/* the timeline */
.tl{position:relative;display:grid;gap:10px;padding-inline-start:30px}
.tl::before{content:"";position:absolute;inset-block:8px;inset-inline-start:11px;border-inline-start:4px solid var(--col)}
.tl li{list-style:none;position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:8px 12px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);box-shadow:2px 2px 0 var(--ink)}
.tl li::before{content:"";position:absolute;inset-inline-start:-27px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--sun);border:3px solid var(--ink)}
.tl li.big::before{background:var(--col)}
.tl .y{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;color:var(--col);white-space:nowrap}
.tl .y small{display:block;font-size:12px;color:var(--ink-2);font-weight:700}
.tl .e{font-weight:700;font-size:16px}
/* the emirs of ad-Diriyah */
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chain span{border:2px solid var(--ink);border-radius:999px;padding:3px 11px;background:var(--tint);font-weight:800;font-size:15px}
.chain span.top{background:var(--col);color:#fff}
.chain i{font-style:normal;font-weight:800;color:var(--ink-3)}
/* the imams */
.imams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.imam{position:relative;padding:14px 16px 16px;display:grid;gap:8px;align-content:start;border:3px solid var(--ink);border-radius:16px;background:linear-gradient(160deg,var(--tint),#fff 70%);box-shadow:5px 5px 0 var(--ink);scroll-margin-top:12px}
.imam .num{position:absolute;top:-14px;inset-inline-start:14px;width:34px;height:34px;border-radius:50%;background:var(--col);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:17px}
.imam h3{font-size:21px;margin-top:6px}
.imam .yrs{justify-self:start;font-weight:800;font-variant-numeric:tabular-nums;background:var(--ink);color:#fff;border-radius:8px;padding:1px 10px;font-size:15px}
.imam .tag{justify-self:start;font-weight:800;font-size:14px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:1px 10px}
.quals{display:flex;flex-wrap:wrap;gap:6px}
.quals span{font-size:13.5px;font-weight:800;border:2px solid var(--col);color:var(--col);background:#fff;border-radius:999px;padding:1px 9px}
.imam ul{padding-inline-start:18px;display:grid;gap:3px;font-size:15.5px}
.imam .end{font-size:14.5px;font-weight:700;color:var(--ink-2);border-top:2px dashed var(--ink-3);padding-top:6px}
.logo5{display:flex;flex-wrap:wrap;gap:8px}
.logo5 span{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:12px;padding:4px 10px;background:#fff;font-weight:800}
.logo5 span b{font-size:22px;line-height:1}

/* lesson summaries */
.part{scroll-margin-top:12px}
.part-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.part-head h2{font-size:27px;color:var(--col)}
.part-head span{font-size:14px;font-weight:800;color:var(--ink-2)}
.card{padding:14px 16px;display:grid;gap:8px;border-inline-start:10px solid var(--col);scroll-margin-top:12px}
.card + .card{margin-top:12px}
.card h3{font-size:20px}
.card ul{padding-inline-start:20px;display:grid;gap:4px}
.card li{font-size:16px}
.quote{border-inline-start:4px solid var(--col);background:var(--tint);border-radius:0 8px 8px 0;padding:8px 12px;font-size:16.5px;line-height:1.9;font-weight:700}
.quote small{display:block;color:var(--ink-2);font-size:13px;font-weight:700}
.def{border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--tint);padding:8px 12px;font-weight:700}
.note{font-size:14px;color:var(--ink-2);font-weight:700}

/* practice */
.run{margin-top:20px;padding:16px;display:grid;gap:14px;border-inline-start:10px solid var(--col)}
.run > *,.card > *,.fb > *{min-width:0}
.run-top{display:flex;align-items:center;gap:10px}
.run-top b{font-size:18px}
.counter{margin-inline-start:auto;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--page);overflow:hidden}
.progress i{display:block;height:100%;background:var(--col);transition:width .3s}
.q-part{font-size:14px;font-weight:800;color:var(--col)}
.q-text{font-size:21px;font-weight:700;line-height:1.7}
.q-text small{display:block;font-size:15px;color:var(--ink-2)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:var(--shadow-sm);font-weight:700;text-align:start;font-size:18px;line-height:1.45}
.opt .k{display:grid;place-items:center;width:30px;height:30px;flex:none;border:2px solid var(--ink);border-radius:8px;background:var(--tint);font-weight:800}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-size:22px;min-height:64px}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px 12px;align-items:center;padding:8px 10px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--paper)}
.mrow.right{background:var(--good-bg);border-color:var(--good)}
.mrow.wrong{background:var(--bad-bg);border-color:var(--bad)}
.mrow b{font-weight:800}
.mrow select{width:100%;min-height:46px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:4px 8px;font-weight:700}
.mrow .fix{grid-column:1 / -1;font-size:14px;font-weight:700;color:var(--good)}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px}
.ord-pool .opt{min-height:46px;font-size:16px;flex:1 1 200px}
.ord-pool .opt:disabled{opacity:.35;box-shadow:none;transform:translate(3px,3px)}
.ord-ans{list-style:none;display:grid;gap:8px;counter-reset:o}
.ord-ans li{counter-increment:o;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;min-height:46px;padding:6px 12px;border:2px dashed var(--ink-3);border-radius:var(--r-sm);background:var(--page);font-weight:700}
.ord-ans li::before{content:counter(o);width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:14px}
.ord-ans li.on{border-style:solid;border-color:var(--ink);background:var(--paper)}
.ord-ans li.right{background:var(--good-bg);border:2px solid var(--good)}
.ord-ans li.wrong{background:var(--bad-bg);border:2px solid var(--bad)}
.ord-ans li small{grid-column:2;font-size:13px;font-weight:700;color:var(--good)}
.fill input{width:100%;min-height:50px;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-size:19px;font-weight:700;background:#fff}
.fb{border:3px solid var(--ink);border-radius:var(--r-sm);padding:10px 14px;display:grid;gap:6px}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb .burst{font-size:20px;font-weight:800}
.fb .why{font-size:16px}
.peek{border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);padding:4px 12px}
.peek summary{font-weight:800;color:#1F5FB8;cursor:pointer;min-height:40px;padding-block:6px}
.peek-in{display:grid;gap:8px;padding:2px 0 10px}
.peek-in ul{padding-inline-start:20px;display:grid;gap:4px}
.peek-in li{font-size:15.5px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.result{margin-top:20px;padding:18px;display:grid;gap:12px;text-align:center}
.result .big{font-size:44px;font-weight:800;line-height:1.2}
.result .big small{font-size:20px;color:var(--ink-2)}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.miss-list{display:grid;gap:10px;margin-top:12px}
.miss{padding:10px 14px;display:grid;gap:4px;text-align:start}
.miss .q{font-weight:700}
.miss .a{font-size:15px;color:var(--ink-2);font-weight:700}
.miss a{font-weight:800;color:#1F5FB8}
.foot{margin-top:28px;font-size:14px;color:var(--ink-2);display:grid;gap:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:760px){.tiles{grid-template-columns:1fr}.imams{grid-template-columns:1fr}}
@media (max-width:520px){.chip{display:none}.mrow{grid-template-columns:1fr}.q-text{font-size:19px}.stat b{font-size:21px}.part-head h2{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* print, 2 pages: the three lessons in short with the imams; then the timelines and a practice test with its answer key */
.print-sheet{display:none}
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff!important}
  body{background-image:none!important;color:#000;font-size:9.4pt;line-height:1.45}
  .topbar,main{display:none!important}
  .print-sheet{display:block}
  .ps-head{display:flex;justify-content:space-between;align-items:baseline;gap:8pt;border-bottom:1.5pt solid #000;padding-bottom:3pt;margin-bottom:5pt}
  .ps-head h1{font-size:14.5pt}
  .ps-head p{font-size:9pt;font-weight:700}
  .ps-cols{columns:2;column-gap:6mm}
  .ps-l{break-inside:avoid;margin-bottom:5pt}
  .ps-l h3{font-size:10.5pt;border-bottom:.75pt solid #999;margin-bottom:2pt}
  .ps-l ul{padding-inline-start:12pt}
  .ps-l li{margin-bottom:1pt}
  .ps-page{break-before:page}
  .ps-tl{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:6pt}
  .ps-tl td,.ps-tl th{border:.75pt solid #888;padding:2pt 5pt;text-align:start;vertical-align:top}
  .ps-tl th{background:#eee}
  .ps-grid2{display:grid;grid-template-columns:1fr 1.25fr;gap:5mm;align-items:start}
  .ps-grid2 .ps-tl{font-size:8.6pt}
  .ps-q{margin-bottom:6pt}
  .ps-q h2{font-size:11pt;margin-bottom:3pt}
  .ps-q ol{padding-inline-start:16pt}
  .ps-q li{margin-bottom:3pt;break-inside:avoid}
  .ps-q .o{display:inline-block;margin-inline-end:12pt}
  .ps-two ol{columns:2;column-gap:6mm}
  .ps-match{width:100%;border-collapse:collapse;font-size:9.5pt}
  .ps-match td{border:.75pt solid #999;padding:1.5pt 5pt}
  .ps-key{border-top:1pt solid #000;margin-top:6pt;padding-top:3pt;font-size:8.5pt}
  .ps-key h3{font-size:10pt}
}
</style>
</head>

<script>
"use strict";
/* Social Studies, Quiz 2 of Term 1 (Tuesday 17 November): Unit 2, the First Saudi State, Lessons 3–5 of the assessment
   outline (pp. 26–29, 30–39, 40–45). Each lesson is summarised topic by topic from the current student book (1447), with
   two timelines and a card for each imam; each lesson has its own practice (choose, true or false, complete, match, put in
   order), and a mock test mixes all three. The outline gives no marks, so the mock is counted out of its questions.
   The questions are written for this page from the lessons; the book's activities and unit review are covered, not copied.
   Progress (xp, the best mock, the lessons mastered) is saved in social-g6-quiz2-v1, synced by assets/sync.js; its xp counts
   towards the rewards, and a lesson mastered (80% of a full round or of the mock) gives arcade time once.
   review/quiz-2 links each lesson here (#l-so1, #l-so2, #l-so3). */
const KEY = "social-g6-quiz2-v1", TZ = "Asia/Riyadh", QUIZ_DAY = "2026-11-17";

/* ---------- THE LESSONS ---------- */
const LESSONS = [
  {id:"so1", n:3, t:"شبه الجزيرة العربية قبل قيام الدولة السعودية الأولى", short:"قبل الدولة السعودية الأولى", pg:"26–29",
   blurb:"الحالة السياسية والاقتصادية والدينية والعلمية قبل الدولة، وما الذي تغيّر بعدها، ومراحل الدولة السعودية."},
  {id:"so2", n:4, t:"تأسيس الدولة السعودية الأولى", short:"تأسيس الدولة", pg:"30–39",
   blurb:"بنو حنيفة ومانع المريدي وتأسيس الدرعية، وأمراؤها، وتأسيس الدولة عام 1139هـ، والدعوة الإصلاحية، ويوم التأسيس."},
  {id:"so3", n:5, t:"أئمة الدولة السعودية الأولى", short:"الأئمة", pg:"40–45",
   blurb:"الأئمة الأربعة بالترتيب: سنوات حكمهم وصفاتهم وأعمالهم، ونهاية الدولة عام 1233هـ."}
];
const LESSON = Object.fromEntries(LESSONS.map(l => [l.id, l]));
/* the topics: the cards on the page; every question points to one, for the lesson box and the review link */
const TOPICS = [
  {id:"a-pol", l:"so1", t:"الحالة السياسية", pts:[
    "لم تكن شبه الجزيرة العربية تحت حكم موحّد كما كانت في عصر الرسول ﷺ والخلافة الراشدة.",

const pick = (a, n) => shuffle(a).slice(0, n);
const rand = a => a[Math.floor(Math.random() * a.length)];
/* letters normalised for checking typed Arabic: no diacritics or tatweel, one alef, ة as ه, ى as ي, Arabic-Indic digits as 0-9 */
const norm = s => String(s).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
  .replace(/[ً-ٰٟـ]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/[«»"':؛،.,()هـ]+$/g, "").replace(/[«»"':؛،.,()]/g, " ").replace(/\s+/g, " ").trim();
function fillOK(q, typed){ const v = norm(typed); return !!v && q.k.some(words => words.every(w => v.includes(norm(w)))); }
function todayISO(){ try { return new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } }
const dayDiff = (a, b) => Math.round((Date.UTC(...b.split("-").map((x, i) => i === 1 ? x - 1 : +x)) - Date.UTC(...a.split("-").map((x, i) => i === 1 ? x - 1 : +x))) / 864e5);
const count = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : n <= 10 ? n + " " + few : n + " " + many;
function announce(t){ const l = $("#live"); if (l){ l.textContent = ""; setTimeout(() => { l.textContent = t; }, 40); } }
const lesOf = t => TOPIC[t].l;

/* ---------- SAVED PROGRESS ---------- */
const fresh = () => ({xp:0, xq:{}, best:null, mocks:0, rounds:0, mastered:{}});
let S = (() => { try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && typeof v === "object") return Object.assign(fresh(), v); } catch (e) {} return fresh(); })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function addXP(n){ S.xp += n; save(); $("#xpVal").textContent = S.xp; }
/* points once per question: a right answer to a question already rewarded (same kind, text and answer) gives no new xp */
function xqKey(){ const s = Array.prototype.join.call(arguments, "|"); let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
/* a lesson mastered (80% of a full round) or the mock (80% of it): the arcade (assets/arcade.js) gives play time for it, once */
function master(m){ if (!S.mastered || typeof S.mastered !== "object") S.mastered = {}; if (!S.mastered[m]) S.mastered[m] = Date.now(); }

/* ---------- THE TOPIC CARDS, on the page and in the lesson box during a round ---------- */
function tlHTML(list, kind){
  return '<ol class="tl">' + list.map(x => kind === "stages"
    ? '<li class="' + (x[3] ? "big" : "") + '"><span class="y">' + x[0] + (x[1] ? '<small>' + x[1] + '</small>' : "") + '</span><span class="e">' + x[2] + '</span></li>'
    : '<li><span class="y">' + x[0] + '</span><span class="e">' + x[1] + '</span></li>').join("") + '</ol>';
}
const chainHTML = () => '<div class="chain" aria-label="أمراء الدرعية بالترتيب">' + EMIRS.map((n, i) => '<span' + (i === EMIRS.length - 1 ? ' class="top"' : "") + '>' + n + '</span>').join('<i aria-hidden="true">←</i>') + '</div>';
const logoHTML = () => '<p><b>شعار يوم التأسيس، خمسة عناصر:</b></p><div class="logo5">' + LOGO.map(x => '<span><b aria-hidden="true">' + x[0] + '</b>' + x[1] + '</span>').join("") + '</div>';
function imamHTML(i, full){
  const m = IMAMS[i];
  return (full ? '<span class="num" aria-hidden="true">' + (i + 1) + '</span><h3>' + m.name + '</h3>' : "")
    + '<span class="yrs">' + m.yrs + '</span><span class="tag">' + m.tag + '</span><div class="quals">' + m.quals.map(q => '<span>' + q + '</span>').join("") + '</div>'
    + '<ul>' + m.deeds.map(d => '<li>' + d + '</li>').join("") + '</ul><p class="end">' + m.end + '</p>';
}
function topicBody(t){
  if (t.imam !== undefined) return imamHTML(t.imam, false);
  return '<ul>' + t.pts.map(p => '<li>' + p + '</li>').join("") + '</ul>' + (t.quote ? '<p class="quote">' + t.quote.t + '<small>' + t.quote.s + '</small></p>' : "")
    + (t.tl === "stages" ? tlHTML(TL_STAGES, "stages") : "") + (t.chain ? chainHTML() : "") + (t.logo ? logoHTML() : "");
}
const lessonPeek = t => '<details class="peek c-' + lesOf(t) + '"><summary>راجع «' + esc(TOPIC[t].t) + '»</summary><div class="peek-in">' + topicBody(TOPIC[t]) + '</div></details>';
const lessonLink = t => '<a href="#' + t + '" data-act="lesson" data-t="' + t + '">راجع «' + esc(TOPIC[t].t) + '» ←</a>';

/* ---------- ROUNDS ----------
   A round is a list of steps: mc, tf, fill, match (four pairs of one set) or order (a sequence to tap in order). A lesson
   round is 6 choose, 3 true or false, 1 complete, then a match or an order from that lesson; the mock mixes all three. */
const mcStep = q => ({type:"mc", q, order:shuffle([0, 1, 2])});
const tfStep = q => ({type:"tf", q});
const fillStep = q => ({type:"fill", q});
function matchStep(set){ const ps = pick(set.pairs, 4); return {type:"match", set, ps, right:shuffle(ps.map((p, i) => i))}; }
function mixed(items){ let s; do s = shuffle(items); while (items.length > 1 && s.every((x, i) => x === items[i])); return s; }
const orderStep = q => ({type:"order", q, pool:mixed(q.items), ans:[]});
function spread(list, n){
  const by = {}; shuffle(list).forEach(q => (by[q.t] = by[q.t] || []).push(q));
  const groups = shuffle(Object.values(by)), out = [];
  while (out.length < n && groups.some(g => g.length)) groups.forEach(g => { if (g.length && out.length < n) out.push(g.shift()); });
  return out;
}
const ofL = (a, l) => a.filter(q => lesOf(q.t) === l);
function lessonSteps(l){
  const singles = shuffle(spread(ofL(MC, l), 6).map(mcStep).concat(pick(ofL(TF, l), 3).map(tfStep), pick(ofL(FILL, l), 1).map(fillStep)));
  const sets = MATCH.filter(m => m.ls.includes(l) && m.pairs.filter(p => lesOf(p.t) === l).length >= 4), orders = ORDER.filter(o => o.ls.includes(l));
  const big = Math.random() < .5 && orders.length ? orderStep(rand(orders)) : sets.length ? matchStep(rand(sets)) : orderStep(rand(orders));
  return singles.concat([big]);
}
function mockSteps(){
  const mc = LESSONS.flatMap((x, i) => spread(ofL(MC, x.id), [3, 4, 3][i])), tf = LESSONS.flatMap((x, i) => pick(ofL(TF, x.id), 2));
  return shuffle(mc).map(mcStep).concat(shuffle(tf).map(tfStep), [matchStep(rand(MATCH.filter(m => m.id === "years" || m.id === "imams")))],
    [orderStep(rand(ORDER.filter(o => o.items.length === 4)))], pick(FILL, 2).map(fillStep));
}
const MODES = Object.fromEntries(LESSONS.map(x => [x.id, {name:"الدرس " + x.n + ": " + x.short, short:"تدريب الدرس " + x.n, c:x.id, steps:() => lessonSteps(x.id)}]));
MODES.mock = {name:"الاختبار التجريبي", short:"الاختبار التجريبي", c:"mock", steps:mockSteps};
const PART = {mc:"اختر الإجابة الصحيحة", tf:"ضع ✔ أو ✖", fill:"أكمل الفراغ", match:"صِل من (أ) ما يناسبه من (ب)", order:"رتّب"};
let R = null;
function start(mode){ R = {mode, steps:MODES[mode].steps(), i:0, res:[], locked:false}; renderStep(); window.scrollTo(0, 0); }
const stepTopic = st => st.type === "match" ? st.ps[0].t : st.q.t;

function renderStep(){
  const st = R.steps[R.i], n = R.steps.length;
  R.locked = false;
  let body = "";
  if (st.type === "mc") body = '<p class="q-text" id="qtext">' + esc(st.q.q) + '</p><div class="opts" role="group" aria-labelledby="qtext">'
    + st.order.map((k, i) => '<button class="opt" type="button" data-act="mc" data-k="' + k + '"><span class="k" aria-hidden="true">' + "أبج"[i] + '</span><span>' + esc(st.q.o[k]) + '</span></button>').join("") + '</div>';
  else if (st.type === "tf") body = '<p class="q-text" id="qtext">' + esc(st.q.q) + '</p><div class="tf" role="group" aria-labelledby="qtext">'
    + '<button class="opt" type="button" data-act="tf" data-v="1">✔ صح</button><button class="opt" type="button" data-act="tf" data-v="0">✖ خطأ</button></div>';
  else if (st.type === "match") body = '<p class="q-text" id="qtext">' + esc(st.set.ask) + '</p><div class="match">'
    + st.ps.map((p, i) => '<div class="mrow" data-i="' + i + '"><b id="ma' + i + '">' + esc(p.a) + '</b><select data-i="' + i + '" aria-labelledby="ma' + i + '"><option value="">اختر من (ب)…</option>'
      + st.right.map(j => '<option value="' + j + '">' + esc(st.ps[j].b) + '</option>').join("") + '</select></div>').join("") + '</div>'
    + '<div class="actions"><button class="btn go" type="button" data-act="checkmatch">تحقّق</button></div>';
  else if (st.type === "order") body = '<p class="q-text" id="qtext">' + esc(st.q.q) + '<small>اضغط عليها بالترتيب: الأول ثم الذي بعده.</small></p>'
    + '<div class="ord-pool" role="group" aria-labelledby="qtext">' + st.pool.map((x, i) => '<button class="opt" type="button" data-act="ordpick" data-i="' + i + '">' + esc(x) + '</button>').join("") + '</div>'
    + '<ol class="ord-ans" id="ordAns" aria-label="ترتيبك">' + st.q.items.map(() => '<li></li>').join("") + '</ol>'
    + '<div class="actions"><button class="btn sm" type="button" data-act="ordundo" id="ordUndo" disabled>تراجع</button><button class="btn go" type="button" data-act="checkorder" id="ordCheck" disabled>تحقّق</button></div>';
  else body = '<p class="q-text" id="qtext">' + esc(st.q.q) + '</p><div class="fill"><input id="fillIn" type="text" autocomplete="off" aria-labelledby="qtext" placeholder="اكتب إجابتك"></div>'
    + '<div class="actions"><button class="btn go" type="button" data-act="checkfill">تحقّق</button></div>';
  $("#main").innerHTML = '<section class="run panel c-' + (R.mode === "mock" ? lesOf(stepTopic(st)) : R.mode) + '">'
    + '<div class="run-top"><button class="btn sm" type="button" data-act="home">→ الصفحة</button><b>' + esc(MODES[R.mode].short) + '</b><span class="counter">' + (R.i + 1) + ' / ' + n + '</span></div>'
    + '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + R.i + '" aria-label="الأسئلة المنجزة"><i style="width:' + Math.round(R.i / n * 100) + '%"></i></div>'
    + '<p class="q-part">الدرس ' + LESSON[lesOf(stepTopic(st))].n + ' · ' + PART[st.type] + '</p>' + body + '<div id="fbBox"></div></section>';
  const f = $(".opt") || $("select") || $("#fillIn");
  if (f && window.matchMedia && matchMedia("(pointer: fine)").matches) f.focus({preventScroll:true});
}

/* ---------- ANSWERS ---------- */
function record(ok, given, right, why, t, text){
  R.res.push({ok, given, right, why, t, text, l:lesOf(t), type:R.steps[R.i].type});
  R.rep = false;
  if (ok){
    if (!S.xq || typeof S.xq !== "object") S.xq = {};
    const k = xqKey(R.steps[R.i].type, text, right);
    if (S.xq[k]) R.rep = true; else { S.xq[k] = 1; addXP(10); }
  }
}
function feedback(ok, why, t, extra){
  R.locked = true;
  const last = R.i === R.steps.length - 1;
  $("#fbBox").innerHTML = '<div class="fb ' + (ok ? "ok" : "no") + '"><span class="burst">' + (ok ? "أحسنت! ✔" : "انتبه ✖") + '</span>' + (ok && R.rep ? '<p class="why">⭐ هذا السؤال أخذت نقاطه من قبل، فما فيه نقاط جديدة. النقاط الجديدة من أسئلة ما جاوبتها صح قبل.</p>' : "") + (extra || "")
    + '<p class="why">' + esc(why) + '</p>' + (ok ? "" : lessonPeek(t)) + '</div>'
    + '<div class="actions"><button class="btn ink" type="button" data-act="next" id="nextBtn">' + (last ? "النتيجة ←" : "التالي ←") + '</button></div>';
  announce((ok ? "صحيح. " : "خطأ. ") + why);
  $("#nextBtn").focus({preventScroll:true});
}
function answerMC(k){
  const st = R.steps[R.i]; if (R.locked) return;
  const ok = k === 0;
  document.querySelectorAll(".opt").forEach(b => { const bk = +b.dataset.k; b.disabled = true; b.classList.add(bk === 0 ? "right" : bk === k ? "wrong" : "dim"); });
  record(ok, st.q.o[k], st.q.o[0], st.q.w, st.q.t, st.q.q);
  feedback(ok, st.q.w, st.q.t);
}
function answerTF(v){
  const st = R.steps[R.i]; if (R.locked) return;
  const ok = v === st.q.a;
  document.querySelectorAll(".opt").forEach(b => { const bv = b.dataset.v === "1"; b.disabled = true; b.classList.add(bv === st.q.a ? "right" : bv === v ? "wrong" : "dim"); });
  record(ok, v ? "✔ صح" : "✖ خطأ", st.q.a ? "✔ صح" : "✖ خطأ", st.q.w, st.q.t, st.q.q);
  feedback(ok, st.q.w, st.q.t);
}
function checkMatch(){
  const st = R.steps[R.i]; if (R.locked) return;
  const sel = [...document.querySelectorAll(".mrow select")];
  if (sel.some(s => s.value === "")){ announce("اختر إجابة لكل عبارة أولًا."); sel.find(s => s.value === "").focus(); return; }
  let right = 0;
  sel.forEach(s => {
    const i = +s.dataset.i, ok = +s.value === i, row = s.closest(".mrow");
    s.disabled = true; row.classList.add(ok ? "right" : "wrong");
    if (!ok) row.insertAdjacentHTML("beforeend", '<p class="fix">الصحيح: ' + esc(st.ps[i].b) + '</p>');
    if (ok) right++;
    record(ok, st.ps[+s.value].b, st.ps[i].b, st.ps[i].a + ": " + st.ps[i].b + ".", st.ps[i].t, st.ps[i].a);
  });
  const miss = st.ps.find((p, i) => +sel[i].value !== i);
  feedback(right === st.ps.length, right + " من " + st.ps.length + " صحيحة.", miss ? miss.t : st.ps[0].t);
}
function orderPick(i){ const st = R.steps[R.i]; if (R.locked || st.ans.includes(i)) return; st.ans.push(i); orderDraw(); }
function orderUndo(){ const st = R.steps[R.i]; if (R.locked || !st.ans.length) return; st.ans.pop(); orderDraw(); }
function orderDraw(){
  const st = R.steps[R.i];
  document.querySelectorAll("#ordAns li").forEach((li, k) => { const i = st.ans[k]; li.textContent = i === undefined ? "" : st.pool[i]; li.classList.toggle("on", i !== undefined); });
  document.querySelectorAll(".ord-pool .opt").forEach(b => { b.disabled = st.ans.includes(+b.dataset.i); });
  $("#ordUndo").disabled = !st.ans.length; $("#ordCheck").disabled = st.ans.length < st.pool.length;
  const nb = [...document.querySelectorAll(".ord-pool .opt")].find(b => !b.disabled);
  if (nb && window.matchMedia && matchMedia("(pointer: fine)").matches) nb.focus({preventScroll:true}); else if (!nb) $("#ordCheck").focus({preventScroll:true});
}
function checkOrder(){
  const st = R.steps[R.i]; if (R.locked || st.ans.length < st.pool.length) return;
  let right = 0;
  document.querySelectorAll(".ord-pool .opt").forEach(b => { b.disabled = true; }); $("#ordUndo").disabled = true; $("#ordCheck").disabled = true;
  document.querySelectorAll("#ordAns li").forEach((li, k) => {
    const given = st.pool[st.ans[k]], want = st.q.items[k], ok = given === want;
    li.classList.add(ok ? "right" : "wrong"); if (!ok) li.insertAdjacentHTML("beforeend", '<small>مكانه: ' + esc(want) + '</small>');
    if (ok) right++;
    record(ok, given, want, "رقم " + (k + 1) + ": " + want + ".", st.q.t, st.q.q + " (رقم " + (k + 1) + ")");
  });
  feedback(right === st.q.items.length, right + " من " + st.q.items.length + " في مكانها الصحيح. الترتيب: " + st.q.items.join(" ← ") + ".", st.q.t);
}
function checkFill(){
  const st = R.steps[R.i]; if (R.locked) return;
  const inp = $("#fillIn");
  if (!norm(inp.value)){ announce("اكتب إجابتك أولًا."); inp.focus(); return; }
  const ok = fillOK(st.q, inp.value);
  inp.readOnly = true;
  const model = (st.q.ans.length > 1 ? "إجابات صحيحة: " : "الإجابة: ") + st.q.ans.join("، ") + ".";
  record(ok, inp.value.trim(), st.q.ans[0], model, st.q.t, st.q.q);
  feedback(ok, model, st.q.t);
}
function next(){ if (R.i < R.steps.length - 1){ R.i++; renderStep(); window.scrollTo(0, 0); } else result(); }

/* ---------- RESULT ---------- */
function result(){
  const res = R.res, right = res.filter(r => r.ok).length, pct = right / res.length;
  let h = '<section class="result panel c-' + MODES[R.mode].c + '">';
  if (R.mode === "mock"){
    const nb = S.best === null || pct > S.best; S.mocks++; if (nb) S.best = pct;
    if (pct >= .8) master("mock");
    if (nb) addXP(20);   /* only a new best score earns the test bonus */
    h += '<p class="q-part">الاختبار التجريبي</p><div class="big">' + right + ' <small>من ' + res.length + '</small></div><div class="parts">'
      + LESSONS.map(x => { const mine = res.filter(r => r.l === x.id); return '<div class="stat"><b>' + mine.filter(r => r.ok).length + '/' + mine.length + '</b><span>الدرس ' + x.n + '</span></div>'; }).join("") + '</div>'
      + '<p>' + (pct >= .9 ? "ممتاز، أنت جاهز للاختبار! 🌟" : pct >= .7 ? "جيد جدًا. صحّح الأخطاء تحت ثم جرّب مرة ثانية." : "راجع الدروس المذكورة تحت، ثم جرّب اختبارًا جديدًا: الأسئلة تتغيّر.") + '</p>';
  } else {
    S.rounds++;
    if (pct >= .8) master(R.mode);
    h += '<p class="q-part">' + esc(MODES[R.mode].name) + '</p><div class="big">' + right + ' <small>من ' + res.length + '</small></div>'
      + '<p>' + (right === res.length ? "كلها صحيحة! 🌟" : "صحّح الأخطاء تحت، والأسئلة تتغيّر في كل جولة.") + '</p>';
  }
  save();
  h += '<div class="row" style="justify-content:center"><button class="btn go" type="button" data-act="start" data-m="' + R.mode + '">جولة جديدة</button>'
    + (R.mode !== "mock" ? '<button class="btn" type="button" data-act="start" data-m="mock">الاختبار التجريبي</button>' : "") + '<button class="btn sm" type="button" data-act="home">الصفحة</button></div></section>';
  const miss = res.filter(r => !r.ok);
  if (miss.length) h += '<div class="sec"><div class="sec-head"><h2>صحّح هذه</h2><p>اقرأ السبب، ثم ارجع للدرس.</p></div><div class="miss-list">'
    + miss.map(r => '<div class="miss panel"><p class="q">' + esc(r.text) + '</p><p class="a">إجابتك: ' + esc(r.given) + ' · الصحيح: ' + esc(r.right) + '</p><p>' + esc(r.why) + '</p><p>' + lessonLink(r.t) + '</p></div>').join("") + '</div></div>';
  $("#main").innerHTML = h;
  window.scrollTo(0, 0);
  announce("النتيجة: " + right + " من " + res.length);
}

/* ---------- HOME ---------- */
const pctTxt = v => v === null ? "–" : Math.round(v * 100) + "%";
function renderHome(){
  const n = dayDiff(todayISO(), QUIZ_DAY), when = n < 0 ? "خلص الاختبار" : n === 0 ? "اليوم" : n === 1 ? "غدًا" : "بعد " + count(n, "يوم واحد", "يومين", "أيام", "يومًا");
  let h = '<section class="hero panel c-mock"><h1>الاجتماعيات: مراجعة الاختبار القصير 2</h1>'
    + '<p class="sub">الثلاثاء 17 نوفمبر · الوحدة الثانية: الدولة السعودية الأولى · الدروس 3–5 <span class="badge' + (n >= 0 && n <= 1 ? " hot" : "") + '">' + when + '</span></p>'
    + '<div class="stats"><div class="stat"><b>' + pctTxt(S.best) + '</b><span>أفضل اختبار تجريبي</span></div><div class="stat"><b>' + S.mocks + '</b><span>اختبارات تجريبية</span></div><div class="stat"><b>' + S.xp + '</b><span>نقاط</span></div></div>'
    + '<div class="row"><button class="btn go" type="button" data-act="start" data-m="mock">ابدأ اختبارًا تجريبيًا</button><a class="btn" href="#timeline">خط الزمن</a><a class="btn sm" href="../../review/quiz-2/index.html#soc">قائمة الاختبار القصير 2</a></div></section>';
  h += '<section class="sec"><div class="sec-head"><h2>ما في الاختبار</h2><p>ثلاثة دروس من ملف التقييم، مع صفحاتها.</p></div><div class="tiles">'
    + LESSONS.map(x => '<article class="tile c-' + x.id + '"><b>الدرس ' + x.n + ': ' + x.t + '</b><span>ص ' + x.pg + '</span><span>' + x.blurb + '</span><div class="row"><a class="btn sm" href="#l-' + x.id + '">راجعه</a>'
      + '<button class="btn sm go" type="button" data-act="start" data-m="' + x.id + '">تدرّب</button></div></article>').join("") + '</div>'
    + '<div class="mock-cta panel"><p><b>الاختبار التجريبي:</b> 10 اختيار من الدروس الثلاثة، و6 صح وخطأ، وصِل، ورتّب، وسؤالان «أكمل»، ثم نتيجتك في كل درس.</p><button class="btn go" type="button" data-act="start" data-m="mock">ابدأ</button></div></section>';
  h += '<section class="sec part c-so2" id="timeline"><div class="part-head"><h2>خط الزمن</h2><span>احفظ هذه السنوات</span></div>'
    + '<article class="card panel"><h3>مراحل الدولة السعودية</h3>' + tlHTML(TL_STAGES, "stages") + '</article>'
    + '<article class="card panel c-so3"><h3>أحداث الدولة السعودية الأولى (1139–1233هـ)</h3>' + tlHTML(TL_FIRST, "first") + '</article></section>';
  LESSONS.forEach(x => {
    h += '<section class="sec part c-' + x.id + '" id="l-' + x.id + '"><div class="part-head"><h2>الدرس ' + x.n + ': ' + x.t + '</h2><span>ص ' + x.pg + '</span></div>';
    if (x.id === "so3"){
      const t0 = TOPIC["c-titles"];
      h += '<article class="card panel" id="c-titles"><h3>' + t0.t + '</h3>' + topicBody(t0) + '</article><div class="imams" style="margin-top:22px">'
        + IMAMS.map((m, i) => '<article class="imam" id="' + ["c-m", "c-a", "c-s", "c-ab"][i] + '">' + imamHTML(i, true) + '</article>').join("") + '</div>';
    } else h += TOPICS.filter(t => t.l === x.id).map(t => '<article class="card panel" id="' + t.id + '"><h3>' + t.t + '</h3>' + topicBody(t) + '</article>').join("");
    h += '<div class="row" style="margin-top:12px"><button class="btn go" type="button" data-act="start" data-m="' + x.id + '">تدرّب على الدرس ' + x.n + '</button></div></section>';
  });
  h += '<footer class="foot"><p>الدروس والصفحات من ملف التقييم الرسمي للاختبار القصير 2، والملخص من كتاب الطالب (طبعة 1447؛ أرقام صفحاتها أقل بصفحتين). الأسئلة مكتوبة لهذه الصفحة من الدروس. إذا اختلف شيء عن الكتاب، المعتمد كلام المعلم والكتاب.</p></footer>';
  $("#main").innerHTML = h;
}

    ["الحالة الاقتصادية", "طرق غير آمنة، وحروب مستمرة، وسرقة المزارع وأماكن التجارة ← ضعف الحركة الاقتصادية والنشاط التجاري (ودفع الإتاوات لحماية القوافل)."],

/* ---------- EVENTS ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "start") start(b.dataset.m);
  else if (a === "mc") answerMC(+b.dataset.k);
  else if (a === "tf") answerTF(b.dataset.v === "1");
  else if (a === "checkmatch") checkMatch();
  else if (a === "checkfill") checkFill();
  else if (a === "ordpick") orderPick(+b.dataset.i);
  else if (a === "ordundo") orderUndo();
  else if (a === "checkorder") checkOrder();
  else if (a === "next") next();
  else if (a === "home"){ R = null; renderHome(); window.scrollTo(0, 0); }
  else if (a === "lesson"){ e.preventDefault(); R = null; renderHome(); const t = document.getElementById(b.dataset.t); if (t) t.scrollIntoView(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "fillIn" && R && !R.locked){ e.preventDefault(); checkFill(); } });
$("#printBtn").addEventListener("click", () => window.print());
/* another device's progress arrived: refresh the numbers in place, without leaving a round */
window.addEventListener("monmon-sync", e => {
  try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v) S = Object.assign(fresh(), v); } catch (err) {}
  $("#xpVal").textContent = S.xp;
  if (!R){ const st = document.querySelectorAll(".hero .stat b"); if (st.length === 3){ st[0].textContent = pctTxt(S.best); st[1].textContent = S.mocks; st[2].textContent = S.xp; } }
  e.preventDefault();
});

$("#xpVal").textContent = S.xp;
renderHome();
renderPrint();
if (location.hash.length > 1){ const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
