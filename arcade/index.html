<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صالة الألعاب</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2214%22 fill=%22%235B2BB5%22 stroke=%22%2314163A%22 stroke-width=%225%22/%3E%3Cpath d=%22M16 28h32a6 6 0 0 1 6 6v6a6 6 0 0 1-10 4l-4-4H24l-4 4a6 6 0 0 1-10-4v-6a6 6 0 0 1 6-6z%22 fill=%22%23FFD23F%22 stroke=%22%2314163A%22 stroke-width=%223%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Lilita+One&family=Tajawal:wght@500;700;800&display=swap">
<style>
:root{
  --ink:#14163A; --paper:#FFFFFF; --sun:#FFD23F; --cyan:#7CF0FF;
  --r1:#31C94E; --r2:#2F8BFF; --r3:#B15CFF; --r4:#FFB020;
  --shadow:4px 4px 0 var(--ink);
  --font:"Tajawal","Segoe UI","Geeza Pro",Tahoma,sans-serif;
  --display:"Lalezar","Tajawal",sans-serif;
  --digits:"Lilita One","Tajawal",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#1B0B47}
body{margin:0;min-height:100vh;color:#fff;font-family:var(--font);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  background:radial-gradient(circle at 15% -10%,#56D2FF 0,#2E6BFF 30%,#3A1D8F 68%,#1B0B47 100%) fixed;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(-28deg,rgba(255,255,255,.035) 0 18px,transparent 18px 46px);z-index:0}
button,a{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;line-height:1.25}
p{margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 16px 56px}

.abar{position:relative;z-index:2;background:rgba(20,22,58,.72);border-bottom:3px solid var(--ink);backdrop-filter:blur(6px)}
.abar-in{max-width:960px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--display);font-size:30px;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg) skewX(-6deg);white-space:nowrap;line-height:1.3}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 12px;white-space:nowrap}
.pill b{font-family:var(--digits);font-weight:400;font-size:19px;letter-spacing:.02em;direction:ltr}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--sun);color:var(--ink);box-shadow:2px 2px 0 var(--ink);text-decoration:none;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 20px;border:3px solid var(--ink);border-radius:12px;background:var(--sun);color:var(--ink);font-weight:800;font-size:18px;text-decoration:none;box-shadow:var(--shadow);transform:skewX(-6deg)}
.btn > span{transform:skewX(6deg)}
.btn:active{transform:skewX(-6deg) translate(3px,3px);box-shadow:none}
.btn:disabled{background:#8A8DB0;color:#2A2D55;cursor:not-allowed;box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.6)}
.btn.sm{min-height:40px;padding:5px 14px;font-size:15px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}

/* lobby */
.bank{margin-top:22px;position:relative;padding:18px 20px;border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);
  background:linear-gradient(120deg,#FFE15A 0,#FFB020 55%,#FF7A1A 100%);color:var(--ink);transform:skewY(-1.5deg);overflow:hidden}
.bank > *{transform:skewY(1.5deg)}
.bank::after{content:"";position:absolute;inset-block:0;inset-inline-end:-40px;width:180px;background:repeating-linear-gradient(60deg,rgba(255,255,255,.25) 0 10px,transparent 10px 22px)}
.bank-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;position:relative;z-index:1}
.bank h1{font-size:30px}
.bank.free{background:linear-gradient(120deg,#7CF0FF 0,#4FA7FF 55%,#9A4FE0 100%)}
.bank.free .sub + .sub{margin-top:6px;font-weight:700}
.bank .clock{font-family:var(--digits);font-size:56px;line-height:1;letter-spacing:.02em;direction:ltr;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.bank .sub{font-weight:800;position:relative;z-index:1}
.meter{position:relative;z-index:1;margin-top:10px;height:16px;border:3px solid var(--ink);border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#5B2BB5,#B15CFF);transition:width .4s}
.rules{position:relative;z-index:1;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.rules span{font-size:14px;font-weight:800;background:rgba(20,22,58,.12);border:2px solid rgba(20,22,58,.35);border-radius:999px;padding:2px 10px}
.next{margin-top:18px;padding:12px 16px;border:3px solid var(--ink);border-radius:14px;background:rgba(20,22,58,.55);box-shadow:var(--shadow);font-weight:800;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.next b{color:var(--cyan)}
.sec{margin-top:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.sec-head h2{font-size:32px;color:#fff;-webkit-text-stroke:1px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:skewX(-6deg)}
.sec-head p{color:#D9D2FF;font-weight:700;font-size:15px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.game{position:relative;border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;transform:skewY(-2deg);
  background:linear-gradient(160deg,var(--rc) 0,var(--rd) 100%);display:grid;grid-template-rows:auto 1fr auto}
.game > *{transform:skewY(2deg)}
.game .art{height:130px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 120%,rgba(255,255,255,.45),transparent 65%)}
.game .art canvas{width:150px;height:110px}
.game .info{padding:8px 14px;display:grid;gap:2px}
.game h3{font-size:25px;-webkit-text-stroke:.8px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.game .en{font-family:var(--digits);font-size:14px;letter-spacing:.06em;opacity:.9;direction:ltr;text-align:start}
.game .rar{justify-self:start;font-size:12px;font-weight:800;background:rgba(20,22,58,.55);border-radius:6px;padding:1px 8px}
.game .best{font-size:14px;font-weight:700}
.game .go{padding:0 14px 14px}
.game .go .btn{width:100%}
.game.locked{filter:saturate(.25) brightness(.8)}
.lock{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;background:rgba(20,22,58,.55);text-align:center;font-weight:800;padding:12px;z-index:2}
.lock .pad{font-size:40px;line-height:1}
.r1{--rc:#4BE26A;--rd:#14883A} .r2{--rc:#4FA7FF;--rd:#1B4FC2} .r3{--rc:#C77DFF;--rd:#6A21B8} .r4{--rc:#FFD15A;--rd:#D9770F} .r5{--rc:#5EF2E6;--rd:#7A2BD9}
.earn{display:grid;gap:12px}
.src{border:3px solid var(--ink);border-radius:14px;background:rgba(20,22,58,.6);box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:8px}
.src-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.src-head b{font-size:18px}
.src-head span{font-size:13px;color:#D9D2FF;font-weight:700}
.src-head a{margin-inline-start:auto;font-size:14px;font-weight:800;color:var(--cyan);display:inline-block;padding:10px 4px;margin-block:-10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13.5px;font-weight:700;border-radius:999px;padding:3px 10px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.chip.got{background:#1E8E45;border-color:#7DF59C}
.chip.old{background:rgba(255,255,255,.18);border-style:dashed}
details.parents{border:3px solid var(--ink);border-radius:14px;background:rgba(20,22,58,.6);box-shadow:var(--shadow);padding:6px 14px}
details.parents summary{font-weight:800;cursor:pointer;min-height:44px;padding-block:8px}
.hist{display:grid;gap:4px;padding-bottom:10px;font-size:15px}
.hist table{width:100%;border-collapse:collapse}
.hist td,.hist th{border-bottom:1px solid rgba(255,255,255,.2);padding:4px 6px;text-align:start}
.foot{margin-top:26px;font-size:14px;color:#D9D2FF}

/* playing */
.play{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:10px 12px 40px}
.hud{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hud .name{font-family:var(--display);font-size:24px;-webkit-text-stroke:.8px var(--ink);text-shadow:2px 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .pill.low{background:#E23D45;border-color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
.stage{position:relative;border:4px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:3/4}
.ov{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;padding:20px;text-align:center;background:rgba(20,22,58,.72);backdrop-filter:blur(2px)}
.ov h2{font-size:40px;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);text-shadow:4px 4px 0 var(--ink);transform:rotate(-3deg) skewX(-6deg)}
.ov .big{font-family:var(--digits);font-size:60px;line-height:1;direction:ltr;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.ov p{font-weight:700;max-width:340px}
.ov .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ov.pop h2,.ov.pop .big{animation:popIn .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes popIn{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:rotate(-3deg) skewX(-6deg);opacity:1}}
.pad{display:flex;gap:12px;margin-top:12px;direction:ltr}
.pad button{flex:1;min-height:64px;border:3px solid var(--ink);border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:30px;font-weight:800;box-shadow:var(--shadow);touch-action:none;-webkit-user-select:none;user-select:none}
.pad button.on{background:var(--sun);color:var(--ink);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.howto{margin-top:10px;font-size:15px;color:#D9D2FF;font-weight:700;text-align:center}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){.logo{font-size:25px}.bank .clock{font-size:46px}.bank h1{font-size:25px}.sec-head h2{font-size:28px}.abar .pill{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:#fff;color:#000}.abar,.play{display:none!important}}
</style>
</head>
<body>
<script src="../assets/sync.js"></script>
<script src="../assets/site-nav.js" data-root="../" data-top="0"></script>
<script src="../assets/rewards.js" data-root="../"></script>
<script src="../assets/arcade.js" data-root="../"></script>
<header class="abar">
  <div class="abar-in">
    <span class="logo">صالة الألعاب</span>
    <span class="spacer"></span>
    <span class="pill" title="رصيد اللعب">⏱ <b id="topClock">0:00</b></span>
    <a class="icon-btn" href="../index.html" aria-label="الرئيسية"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></a>
  </div>
</header>
<main class="wrap" id="lobby"></main>
<section class="play" id="play" hidden>
  <div class="hud">
    <button class="btn sm ghost" type="button" data-act="exit"><span>→ الصالة</span></button>
    <span class="name" id="gName"></span>
    <span class="spacer"></span>
    <span class="pill" id="gScorePill">⭐ <b id="gScore">0</b></span>
    <span class="pill" id="gTimePill" title="رصيد اللعب">⏱ <b id="gTime">0:00</b></span>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" width="720" height="960" tabindex="0" aria-label="ساحة اللعب"></canvas>
    <div class="ov" id="ov"></div>
  </div>
  <div class="pad" id="pad" hidden><button type="button" data-dir="-1" aria-label="يسار">◀</button><button type="button" data-dir="1" aria-label="يمين">▶</button></div>
  <p class="howto" id="howto"></p>
</section>
<div id="live" class="sr-only" aria-live="polite"></div>

<script>
"use strict";
/* The arcade: four short games, opened and timed by the ledger in assets/arcade.js. Time is spent only while a
   game is running and in front; it is saved every second, so leaving, going back or reloading never gives it back.
   One window plays at a time (monmon-arcade-live, kept on this device only). The games are written for this page.
   A parent's free-play link (arcade/#free=<key>, kept by the parent) opens every game with no clock and no daily limit.
   It spends nothing and saves nothing: the boy's balance, play time, best scores and the one-window lock are untouched.
   Only the key's SHA-256 is in this page, so reading the page does not give the link. */
const A = window.MonmonArcade;
const FREE_HASH = "636be1c69814e656acb9ac3aa3f255c2d172f683baa2a72a5c3ce92eedd0f0a6";
let FREE = false;
const FREE_BEST = {};   /* best scores of this free-play visit only */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LIVE = "monmon-arcade-live", TAB = Math.random().toString(36).slice(2, 10);
const W = 360, H = 480;
const RAR = ["", "غير شائعة", "نادرة", "ملحمية", "أسطورية", "خارقة"];
const ART = ["", "#4BE26A", "#4FA7FF", "#C77DFF", "#FFD15A", "#5EF2E6"];
const HOW = {
  drop:"وجّه المظلّة يمين ويسار (الأسهم أو الأزرار)، اجمع النجوم (5 ورا بعض تضاعفها)، وانزل من داخل الحلقات الملوّنة، وتفادَ غيوم العاصفة، وانزل على الهدف الأحمر. 3 قفزات في الجولة.",
  stack:"اضغط على الشاشة (أو المسافة) لتنزل الطابق فوق البرج. النزول المضبوط تماماً يعطيك كومبو، و3 ورا بعض تكبّر الطابق. ابنِ من المدينة إلى الفضاء!",
  storm:"اسحب يمين ويسار (أو الأسهم)، تفادَ الصخور، واجمع الطاقة الزرقاء لتبعد العاصفة، والجواهر الذهبية بـ 25. معك 3 دروع.",
  target:"اضغط على الأهداف قبل ما تختفي (الدائرة حولها هي وقتها). الذهبية بنقاط أكثر، والحمراء ألغام، والضربات السريعة ورا بعض تضاعف النقاط. الجولة 30 ثانية.",
  slice:"اسحب إصبعك (أو الفأرة وأنت ضاغط) على الفواكه لتقطيعها قبل ما توصل للأرض. القنبلة تاخذ قلب، ومعك 3 قلوب. التمرة الذهبية بـ 50، والكريستالة الزرقاء تبطّئ الوقت، و3 فواكه بسحبة وحدة كومبو. الجولة 60 ثانية."
};
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduced = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function announce(t){ const l = $("#live"); l.textContent = ""; setTimeout(() => { l.textContent = t; }, 40); }

/* ---------- sound: a tiny synth ---------- */
const SND = (() => {
  let ac = null;
  const on = () => !(window.MonmonRewards && MonmonRewards.sound && !MonmonRewards.sound());
  const ctx = () => { try { if (!ac){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); } if (ac.state === "suspended") ac.resume(); return ac; } catch (e) { return null; } };
  function tone(f, dur, type, vol, to, at){
    if (!on()) return; const a = ctx(); if (!a) return;
    const t = a.currentTime + (at || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || "square"; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq){
    if (!on()) return; const a = ctx(); if (!a) return;
    const len = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = b; f.type = "bandpass"; f.frequency.value = freq || 900; g.gain.value = vol || 0.15;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  return {
    unlock: ctx,
    coin(){ tone(988, .08, "square", .05); tone(1319, .14, "square", .05, 0, .07); },
    pop(){ tone(520, .12, "triangle", .08, 1040); },
    perfect(n){ const b = 523 * Math.pow(1.06, Math.min(n, 12)); [0, 4, 7, 12].forEach((s, i) => tone(b * Math.pow(2, s / 12), .12, "square", .045, 0, i * .05)); },
    land(){ tone(180, .25, "sine", .14, 60); noise(.15, .12, 300); },
    hit(){ noise(.25, .25, 700); tone(140, .2, "sawtooth", .05, 70); },
    whoosh(){ noise(.35, .12, 1600); },
    start(){ [392, 523, 659, 784].forEach((f, i) => tone(f, .1, "square", .05, 0, i * .07)); },
    over(){ [523, 415, 330, 262].forEach((f, i) => tone(f, .18, "triangle", .07, 0, i * .12)); },
    record(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .14, "square", .05, 0, i * .08)); },
    tick(){ tone(1200, .03, "square", .03); },
    slice(){ noise(.08, .13, 2800); tone(700, .07, "triangle", .035, 1500); },
    boom(){ noise(.55, .32, 240); tone(120, .5, "sawtooth", .08, 38); },
    freeze(){ [1568, 1319, 1175, 1568, 2093].forEach((f, i) => tone(f, .14, "sine", .05, 0, i * .06)); },
    rush(){ [440, 554, 659, 880].forEach((f, i) => tone(f, .09, "sawtooth", .04, 0, i * .05)); },
    ring(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, .1, "sine", .05, 0, i * .04)); },
    splash(){ noise(.45, .22, 520); tone(320, .3, "sine", .06, 90); },
    thunder(){ noise(.9, .16, 150); },
    level(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .14, "square", .045, 0, i * .08)); tone(1319, .3, "triangle", .05, 0, .34); },
    zap(){ tone(1500, .07, "sawtooth", .03, 520); tone(760, .09, "triangle", .05, 0, .02); }
  };
})();

/* ---------- effects: particles, floating text, shake, squash ---------- */
function FX(){
  return {
    parts:[], floats:[], rings:[], shake:0, flash:0,
    burst(x, y, color, n, sp){ if (reduced()) n = Math.ceil((n || 14) / 3); for (let i = 0; i < (n || 14); i++){ const a = Math.random() * Math.PI * 2, s = rnd((sp || 160) * .35, sp || 160); this.parts.push({x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 40, life:rnd(.35, .8), c:color, r:rnd(2.5, 5.5)}); } },
