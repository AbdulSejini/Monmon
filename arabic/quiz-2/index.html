<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مراجعة لغتي: الاختبار القصير 2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2212%22 fill=%22%23FFE8C2%22 stroke=%22%2314163A%22 stroke-width=%225%22/%3E%3Cpath d=%22M44 18v20a8 8 0 0 1-16 0M20 30h6%22 fill=%22none%22 stroke=%22%23F39200%22 stroke-width=%225%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2236%22 cy=%2213%22 r=%224%22 fill=%22%2314163A%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#14163A; --ink-2:#4A4D78; --ink-3:#8A8DB0;
  --paper:#FFFFFF; --page:#E4F2FF; --dot:rgba(20,22,58,.07);
  --sun:#FFD23F; --sun-2:#FFF3C4;
  --good:#12A15E; --good-bg:#DCF7E9;
  --bad:#E23D45; --bad-bg:#FFE1E2;
  --col:#F39200; --tint:#FFE8C2;
  --shadow:4px 4px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --r:14px; --r-sm:10px;
  --font:"Tajawal","Segoe UI","Geeza Pro",Tahoma,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:18px 18px;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0}
:focus-visible{outline:3px solid #2F7DE1;outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.u-a1{--col:#9A4FE0;--tint:#EEE0FF} .u-a2{--col:#2F7DE1;--tint:#DCEBFF} .u-a3{--col:#119C77;--tint:#D2F4E8} .u-a4{--col:#F39200;--tint:#FFE8C2} .u-a5{--col:#E23F66;--tint:#FFDDE6}

.topbar{background:var(--paper);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:860px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{font-size:26px;font-weight:800;color:#FFB24D;-webkit-text-stroke:1.2px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg);white-space:nowrap;line-height:1.2}
.chip{font-size:13px;font-weight:800;background:var(--ink);color:#fff;padding:3px 9px;border-radius:6px;white-space:nowrap}
.xp{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--sun-2);border:2px solid var(--ink);border-radius:999px;padding:2px 11px;white-space:nowrap}
.spacer{flex:1}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--sun-2);box-shadow:2px 2px 0 var(--ink);text-decoration:none;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:800;text-decoration:none;box-shadow:var(--shadow-sm);text-align:center}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.go{background:var(--sun)}
.btn.ink{background:var(--ink);color:#fff}
.btn.sm{min-height:40px;padding:5px 12px;font-size:15px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.hero{margin-top:20px;padding:18px;display:grid;gap:12px;border-inline-start:12px solid var(--col)}
.hero h1{font-size:clamp(26px,5.6vw,38px)}
.hero .sub{color:var(--ink-2);font-weight:700}
.badge{font-size:13px;font-weight:800;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--sun-2);white-space:nowrap}
.badge.hot{background:var(--bad);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:2px solid var(--ink);border-radius:var(--r-sm);padding:8px;background:var(--page);text-align:center;display:grid}
.stat b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;font-weight:700;color:var(--ink-2)}
.sec{margin-top:30px}
.sec-head{margin-bottom:12px;display:grid;gap:2px}
.sec-head h2{font-size:27px}
.sec-head p{color:var(--ink-2);font-size:15px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mode{padding:14px;display:grid;gap:6px;text-align:start;border:3px solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow-sm);border-inline-start:10px solid var(--col)}
.mode b{font-size:19px}
.mode span{font-size:14px;color:var(--ink-2);font-weight:600}
.mode.mock{grid-column:1 / -1;background:var(--sun-2)}

/* lessons */
.lessons{display:grid;gap:12px}
.lesson{padding:14px 16px;border-inline-start:10px solid var(--col);display:grid;gap:8px;scroll-margin-top:12px}
.lesson h3{font-size:21px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.lesson h3 small{font-size:13px;font-weight:700;color:var(--ink-2)}
.lesson ul{padding-inline-start:20px;display:grid;gap:5px}
.lesson li{font-size:16px}
.def{border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--tint);padding:8px 12px;font-weight:700}
.rules{width:100%;border-collapse:collapse;font-size:15.5px}
.rules th,.rules td{border:2px solid var(--ink);padding:6px 8px;text-align:start;vertical-align:top}
.rules th{background:var(--tint)}
.big-ex{font-size:20px;font-weight:800;text-align:center;border:2px dashed var(--ink);border-radius:var(--r-sm);padding:8px;background:#fff}
.big-ex b{color:var(--col)}
.passage{border-inline-start:5px solid var(--col);background:var(--tint);border-radius:8px 0 0 8px;padding:10px 14px;font-size:21px;font-weight:700;line-height:2}

/* practice */
.run{margin-top:20px;padding:16px;display:grid;gap:14px;border-inline-start:10px solid var(--col)}
.run-top{display:flex;align-items:center;gap:10px}
.run-top b{font-size:18px}
.counter{margin-inline-start:auto;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.progress{height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--page);overflow:hidden}
.progress i{display:block;height:100%;background:var(--col);transition:width .3s}
.q-part{font-size:14px;font-weight:800;color:var(--col)}
.q-text{font-size:21px;font-weight:700;line-height:1.8}
.q-text .w{color:var(--col);font-size:24px}
.q-text small{display:block;font-size:15px;color:var(--ink-2);font-weight:600}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:var(--shadow-sm);font-weight:700;text-align:start;font-size:19px}
.opt .k{display:grid;place-items:center;width:30px;height:30px;flex:none;border:2px solid var(--ink);border-radius:8px;background:var(--tint);font-weight:800}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-size:22px;min-height:64px}
.typein input{width:100%;min-height:52px;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-size:21px;font-weight:700;background:#fff}
.fb{border:3px solid var(--ink);border-radius:var(--r-sm);padding:10px 14px;display:grid;gap:6px}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb .burst{font-size:20px;font-weight:800}
.fb .why{font-size:16px}
.peek{border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);padding:4px 12px}
.peek summary{font-weight:800;color:#1F5FB8;cursor:pointer;min-height:40px;padding-block:6px}
.peek-in{display:grid;gap:8px;padding:2px 0 10px;font-size:15px}
.peek-in ul{padding-inline-start:20px;display:grid;gap:4px}
.peek-in .rules{font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.result{margin-top:20px;padding:18px;display:grid;gap:12px;text-align:center}
.result .big{font-size:44px;font-weight:800;line-height:1.2}
.result .big small{font-size:20px;color:var(--ink-2)}
.parts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.miss-list{display:grid;gap:10px;margin-top:12px}
.miss{padding:10px 14px;display:grid;gap:4px;text-align:start}
.miss .q{font-weight:700}
.miss .a{font-size:15px;color:var(--ink-2);font-weight:700}
.miss a{font-weight:800;color:#1F5FB8}

/* dictation */
.dict{padding:16px;display:grid;gap:12px;border-inline-start:10px solid var(--col);scroll-margin-top:12px}
.dict select{min-height:46px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:4px 10px;font-weight:700;max-width:100%}
.dict textarea{width:100%;min-height:120px;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:21px;line-height:1.9;background:#fff;resize:vertical}
.flashbox{border:3px dashed var(--ink);border-radius:var(--r-sm);padding:10px 14px;font-size:22px;font-weight:800;text-align:center;background:var(--sun-2);min-height:60px;display:grid;place-items:center}
.words{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.wd{border:2px solid var(--ink);border-radius:8px;padding:2px 10px;font-size:19px;font-weight:700;background:var(--good-bg)}
.wd.bad{background:var(--bad-bg)}
.wd.bad s{color:var(--bad);font-size:15px;margin-inline-start:6px}
.notes{display:grid;gap:4px;font-size:15px}
.notes p{border-inline-start:4px solid var(--col);padding-inline-start:8px}
.tip{font-size:14px;color:var(--ink-2)}
.foot{margin-top:28px;font-size:14px;color:var(--ink-2);display:grid;gap:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:620px){.modes{grid-template-columns:1fr}.parts{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.chip{display:none}.q-text{font-size:19px}.stat b{font-size:21px}.passage{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* print: the rules, then a practice test with lines for the dictation and an answer key */
.print-sheet{display:none}
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff!important}
  body{background-image:none!important;color:#000;font-size:9.6pt;line-height:1.5}
  .topbar,main{display:none!important}
  .print-sheet{display:block}
  .ps-head{display:flex;justify-content:space-between;align-items:baseline;gap:8pt;border-bottom:1.5pt solid #000;padding-bottom:3pt;margin-bottom:5pt}
  .ps-head h1{font-size:15pt}
  .ps-head p{font-size:9pt;font-weight:700}
  .ps-cols{display:grid;grid-template-columns:1fr 1fr;gap:6mm;align-items:start}
  .ps-l{break-inside:avoid;margin-bottom:5pt}
  .ps-l h3{font-size:10.5pt;border-bottom:.75pt solid #999;margin-bottom:2pt}
  .ps-l ul{padding-inline-start:12pt}
  .ps-l li{margin-bottom:1pt}
  .ps-l table{width:100%;border-collapse:collapse;font-size:9pt}
  .ps-l td,.ps-l th{border:.75pt solid #999;padding:2pt 4pt;text-align:start}
  .ps-page2{break-before:page}
  .ps-q{margin-bottom:7pt}
  .ps-q h2{font-size:11pt;margin-bottom:3pt}
  .ps-q ol{padding-inline-start:16pt}
  .ps-q li{margin-bottom:4pt}
  .ps-line{border-bottom:.75pt solid #000;height:20pt}
  .ps-key{border-top:1pt solid #000;margin-top:6pt;padding-top:3pt;font-size:8.5pt}
  .ps-key h3{font-size:10pt}
}
</style>
</head>

    <span class="logo">لغتي</span>

<script>
"use strict";
/* لغتي، الاختبار القصير 2 (الخميس 19 نوفمبر): the five items of the assessment outline (همزتا الوصل والقطع مع ابن وابنة،
   الهمزة المتوسطة، الهمزة المتطرفة، كان وأخواتها، وقطعة الإملاء), each summarised with practice, a dictation trainer for the
   outline's passage and more sentences, and a 20-question practice test. The outline gives no marks, so nothing is
   marked out of a total. The rules are the standard ones of Arabic spelling and grammar; the questions and sentences are
   written for this page. Progress is saved in arabic-g6-quiz2-v1 (synced, xp counts towards the rewards, mastered parts
   open the arcade). review/quiz-2 links each lesson here (#l-a1 … #l-a5). */
const KEY = "arabic-g6-quiz2-v1", TZ = "Asia/Riyadh", QUIZ_DAY = "2026-11-19";

/* ---------- THE LESSONS ---------- */
const LESSONS = [
  {id:"a1", t:"همزتا الوصل والقطع (ابن – ابنة)", pg:"65–68",
   def:"همزة الوصل تُنطق في أول الكلام وتسقط في وسطه، وتُكتب ألفًا بلا رأس (ا). همزة القطع تُنطق وتُكتب في كل مكان (أ، إ).",
   table:[["", "همزة الوصل (ا)", "همزة القطع (أ / إ)"],
     ["الأسماء", "ابن، ابنة، اسم، امرؤ، امرأة، اثنان، اثنتان", "كل الأسماء غيرها: أحمد، أمّ، إيمان، أخ"],
     ["الأفعال", "أمر الثلاثي (اكتبْ، اجلسْ)، وماضي الخماسي والسداسي وأمرهما ومصدرهما (انطلقَ، انطلاق، استخرجَ، استخراج)", "ماضي الرباعي وأمره ومصدره (أكرمَ، أكرِمْ، إكرام)، والثلاثي المهموز (أخذَ، أكلَ)، والمضارع للمتكلم (أكتبُ)"],
     ["الحروف", "«ال» التعريف فقط", "كل الحروف غيرها: إلى، إنّ، أنْ، أو"]],
   pts:["<b>للتمييز:</b> ضع قبل الكلمة «و» أو «ف»: إن ظهرت الهمزة في النطق فهي قطع (وأكرمَ)، وإن اختفت فهي وصل (واستمعَ = وَسْتَمَعَ).",
     "<b>ابن:</b> تُحذف ألفها إذا وقعت بين علمين ثانيهما أبٌ للأول، ولم تكن في أول السطر: «عمرُ بنُ الخطاب»، «عليُّ بنُ أبي طالب». وتبقى في غير ذلك: «هذا ابنُ عمي»، «يا ابنَ الكرام».",
     "<b>ابنة:</b> لا تُحذف ألفها أبدًا: «عائشةُ ابنةُ أبي بكر»، ويجوز «عائشةُ بنتُ أبي بكر»."]},
  {id:"a2", t:"الهمزة المتوسطة", pg:"73–76",
   def:"تُكتب الهمزة المتوسطة على حرف يناسب أقوى الحركتين: حركتها، وحركة الحرف الذي قبلها.",
   ex:"قوة الحركات: <b>الكسرة</b> ← ثم <b>الضمة</b> ← ثم <b>الفتحة</b> ← ثم السكون",
   table:[["أقوى الحركتين", "تُكتب على", "أمثلة"],
     ["الكسرة", "نبرة الياء (ئ)", "بِئْر، سُئِلَ، فِئَة، مَسائِل"],
     ["الضمة", "الواو (ؤ)", "مُؤْمِن، سُؤَال، رُؤْيَة، تَفاؤُل"],
     ["الفتحة", "الألف (أ)", "رَأْس، سَأَلَ، يَأْكُلُ، فَأْر"]],
   pts:["<b>على السطر (ء):</b> إذا كانت مفتوحة بعد ألف ساكنة: تَساءَلَ، قِراءَة، عَباءَة.", "<b>بعد ياء ساكنة</b> تُكتب على نبرة: بِيئَة، هَيْئَة."]},
  {id:"a3", t:"الهمزة المتطرفة", pg:"78–83",
   def:"تُكتب الهمزة المتطرفة (في آخر الكلمة) حسب حركة الحرف الذي قبلها فقط.",
   table:[["الحرف الذي قبلها", "تُكتب على", "أمثلة"],
     ["مفتوح", "الألف (أ)", "بَدَأَ، قَرَأَ، مَلْجَأ، نَنْشَأُ"],
     ["مضموم", "الواو (ؤ)", "التَّباطُؤ، لُؤْلُؤ، التَّكافُؤ، جَرُؤَ"],
     ["مكسور", "الياء (ئ)", "شاطِئ، قارِئ، ناشِئ، يُبْطِئ"],
     ["ساكن (ومنه حروف المد)", "السطر (ء)", "شَيْء، جُزْء، دِفْء، سَماء، هُدوء، ضَوْء"]],
   pts:["<b>فائدة:</b> مع تنوين النصب، إذا كان الحرف قبل همزة السطر يتصل بما بعده كُتبت على نبرة: «شيئًا، دفئًا»، وإن كان لا يتصل بقيت على السطر: «جزءًا، ضوءًا»، وبعد الألف: «سماءً»."]},
  {id:"a4", t:"الأفعال الناسخة (كان وأخواتها)", pg:"85–90",
   def:"كان وأخواتها أفعال تدخل على الجملة الاسمية، فترفع المبتدأ ويُسمّى اسمَها، وتنصب الخبر ويُسمّى خبرَها.",
   ex:"الجوُّ جميلٌ ← <b>كانَ</b> الجوُّ <b>جميلًا</b>",
   table:[["الفعل", "معناه", "مثال"],

/* ---------- HELPERS ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
/* without the vowel marks, the tatweel and the punctuation; the hamza and alif forms are kept, since they are what is tested */
const clean = s => String(s).replace(/[ً-ٰٟـ]/g, "").replace(/[،؛.,!؟?«»"':()\-]/g, " ").replace(/\s+/g, " ").trim();
function todayISO(){ try { return new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } }
const dayDiff = (a, b) => Math.round((Date.UTC(...b.split("-").map((x, i) => i === 1 ? x - 1 : +x)) - Date.UTC(...a.split("-").map((x, i) => i === 1 ? x - 1 : +x))) / 864e5);
const count = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : n <= 10 ? n + " " + few : n + " " + many;
function announce(t){ const l = $("#live"); if (l){ l.textContent = ""; setTimeout(() => { l.textContent = t; }, 40); } }

/* ---------- SAVED PROGRESS ---------- */
const fresh = () => ({xp:0, best:null, mocks:0, rounds:0, mastered:{}, dict:{}});
let S = (() => { try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && typeof v === "object") return Object.assign(fresh(), v); } catch (e) {} return fresh(); })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function addXP(n){ S.xp += n; save(); $("#xpVal").textContent = S.xp; }
/* a part mastered: the arcade (assets/arcade.js) gives play time for it, once */
function master(m){ if (!S.mastered || typeof S.mastered !== "object") S.mastered = {}; if (!S.mastered[m]) S.mastered[m] = Date.now(); }

/* ---------- ROUNDS ---------- */
const mcStep = q => ({type:"mc", q, order:shuffle([0, 1, 2])});
const tfStep = q => ({type:"tf", q});
const tyStep = q => ({type:"type", q});
const of = (a, l) => a.filter(q => q.l === l);
const lessonRound = (l, mc, tf, ty) => shuffle(pick(of(MC, l), mc).map(mcStep).concat(pick(of(TF, l), tf).map(tfStep))).concat(pick(of(TYPE, l), ty).map(tyStep));
const MODES = {
  a1:{name:"همزتا الوصل والقطع", steps:() => lessonRound("a1", 5, 2, 1)},
  a2:{name:"الهمزة المتوسطة", steps:() => lessonRound("a2", 5, 2, 1)},
  a3:{name:"الهمزة المتطرفة", steps:() => lessonRound("a3", 5, 2, 1)},
  a4:{name:"كان وأخواتها", steps:() => lessonRound("a4", 4, 2, 2)},
  mock:{name:"اختبار تجريبي", steps:() => lessonRound("a1", 3, 1, 1).concat(lessonRound("a2", 2, 1, 1), lessonRound("a3", 2, 1, 1), lessonRound("a4", 2, 1, 2), pick(of(MC, "a5"), 2).map(mcStep))}
};
const PART = {mc:"اختر الإجابة الصحيحة", tf:"صح أو خطأ؟", type:"اكتب الإجابة"};
let R = null;
function start(mode){ R = {mode, steps:MODES[mode].steps(), i:0, res:[], locked:false}; renderStep(); window.scrollTo(0, 0); }

function renderStep(){
  const st = R.steps[R.i], n = R.steps.length;
  R.locked = false;
  let body = "";
  if (st.type === "mc") body = '<p class="q-text" id="qtext">' + esc(st.q.q) + '</p><div class="opts" role="group" aria-labelledby="qtext">'
    + st.order.map((k, i) => '<button class="opt" type="button" data-act="mc" data-k="' + k + '"><span class="k" aria-hidden="true">' + "أبج"[i] + '</span><span>' + esc(st.q.o[k]) + '</span></button>').join("") + '</div>';
  else if (st.type === "tf") body = '<p class="q-text" id="qtext">' + esc(st.q.q) + '</p><div class="tf" role="group" aria-labelledby="qtext">'
    + '<button class="opt" type="button" data-act="tf" data-v="1">✔ صح</button><button class="opt" type="button" data-act="tf" data-v="0">✖ خطأ</button></div>';
  else body = '<p class="q-text" id="qtext">' + esc(st.q.q) + '</p><div class="typein"><input id="typeIn" type="text" autocomplete="off" spellcheck="false" aria-labelledby="qtext" placeholder="اكتب هنا"></div>'
    + '<div class="actions"><button class="btn go" type="button" data-act="checktype">تحقّق</button></div>';
  const l = st.q.l;
  $("#main").innerHTML = '<section class="run panel u-' + l + '">'
    + '<div class="run-top"><button class="btn sm" type="button" data-act="home">→ الصفحة</button><b>' + esc(MODES[R.mode].name) + '</b><span class="counter">' + (R.i + 1) + ' / ' + n + '</span></div>'
    + '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + R.i + '" aria-label="الأسئلة المنجزة"><i style="width:' + Math.round(R.i / n * 100) + '%"></i></div>'
    + '<p class="q-part">' + esc(LESSON[l].t) + ' · ' + PART[st.type] + '</p>' + body + '<div id="fbBox"></div></section>';
  const f = $(".opt") || $("#typeIn");
  if (f && window.matchMedia && matchMedia("(pointer: fine)").matches) f.focus({preventScroll:true});
}

/* ---------- LESSON CARDS ---------- */
function lessonBody(l){
  return (l.def ? '<p class="def">' + l.def + '</p>' : "") + (l.ex ? '<p class="big-ex">' + l.ex + '</p>' : "") + (l.passage ? '<p class="passage">' + esc(l.passage) + '</p>' : "")
    + (l.table ? '<table class="rules">' + l.table.map((r, i) => '<tr>' + r.map(c => i ? '<td>' + c + '</td>' : '<th>' + c + '</th>').join("") + '</tr>').join("") + '</table>' : "")
    + (l.pts ? '<ul>' + l.pts.map(p => '<li>' + p + '</li>').join("") + '</ul>' : "");
}
const lessonPeek = id => '<details class="peek"><summary>راجع درس «' + esc(LESSON[id].t) + '»</summary><div class="peek-in">' + lessonBody(LESSON[id]) + '</div></details>';
const lessonLink = id => '<a href="#l-' + id + '" data-act="lesson" data-l="' + id + '">راجع درس «' + esc(LESSON[id].t) + '» ←</a>';

/* ---------- ANSWERS ---------- */
function record(ok, given, right, why, l, text){
  R.res.push({ok, given, right, why, l, text, type:R.steps[R.i].type});
  if (ok) addXP(10);
}
function feedback(ok, why, l, extra){
  R.locked = true;
  const last = R.i === R.steps.length - 1;
  $("#fbBox").innerHTML = '<div class="fb ' + (ok ? "ok" : "no") + '"><span class="burst">' + (ok ? "أحسنت! ✔" : "انتبه ✖") + '</span>' + (extra || "")
    + '<p class="why">' + esc(why) + '</p>' + (ok ? "" : lessonPeek(l)) + '</div>'
    + '<div class="actions"><button class="btn ink" type="button" data-act="next" id="nextBtn">' + (last ? "النتيجة ←" : "التالي ←") + '</button></div>';
  announce((ok ? "صحيح. " : "خطأ. ") + why);
  $("#nextBtn").focus({preventScroll:true});
}
function answerMC(k){
  const st = R.steps[R.i]; if (R.locked) return;
  const ok = k === 0;
  document.querySelectorAll(".opt").forEach(b => { const bk = +b.dataset.k; b.disabled = true; b.classList.add(bk === 0 ? "right" : bk === k ? "wrong" : "dim"); });
  record(ok, st.q.o[k], st.q.o[0], st.q.w, st.q.l, st.q.q);
  feedback(ok, st.q.w, st.q.l);
}
function answerTF(v){
  const st = R.steps[R.i]; if (R.locked) return;
  const ok = v === st.q.a;
  document.querySelectorAll(".opt").forEach(b => { const bv = b.dataset.v === "1"; b.disabled = true; b.classList.add(bv === st.q.a ? "right" : bv === v ? "wrong" : "dim"); });
  record(ok, v ? "✔" : "✖", st.q.a ? "✔" : "✖", st.q.w, st.q.l, st.q.q);
  feedback(ok, st.q.w, st.q.l);
}
/* a hint for a sentence after كان: the sentence's subject is feminine, or the predicate lost its accusative alif */
function kanaHint(given, want){
  const g = clean(given).split(" "), w = clean(want).split(" ");
  if (w[0].endsWith("ت") && g[0] === w[0].slice(0, -1)) return "الاسم مؤنث، فتتصل بالفعل تاء التأنيث: «" + w[0] + "».";
  const gl = g[g.length - 1] || "", wl = w[w.length - 1];
  if (wl.endsWith("ين") && (gl.endsWith("ان") || gl.endsWith("ون"))) return "الخبر منصوب بالياء: «" + wl + "».";
  if (wl.endsWith("ا") && gl === wl.slice(0, -1)) return "الخبر منصوب، فنكتب ألف تنوين النصب: «" + wl + "».";
  return "";
}
function checkType(){
  const st = R.steps[R.i]; if (R.locked) return;
  const inp = $("#typeIn"), v = clean(inp.value);
  if (!v){ announce("اكتب إجابتك أولًا."); inp.focus(); return; }
  const ok = v === clean(st.q.a);
  inp.readOnly = true;
  const hint = !ok && st.q.tr ? kanaHint(inp.value, st.q.a) : "";
  record(ok, inp.value.trim(), st.q.a, st.q.w, st.q.l, st.q.q);
  feedback(ok, st.q.w, st.q.l, ok ? "" : '<p><b>الصحيح: ' + esc(st.q.a) + '</b></p>' + (hint ? '<p>' + esc(hint) + '</p>' : ""));
}
function next(){ if (R.i < R.steps.length - 1){ R.i++; renderStep(); window.scrollTo(0, 0); } else result(); }

/* ---------- RESULT ---------- */
function result(){
  const res = R.res, right = res.filter(r => r.ok).length;
  let h = '<section class="result panel">', say = right + " من " + res.length;
  if (R.mode === "mock"){
    S.mocks++; if (S.best === null || right > S.best) S.best = right;
    if (right >= 16) master("mock");
    addXP(20);
    h += '<p class="q-part">الاختبار التجريبي</p><div class="big">' + right + ' <small>من ' + res.length + '</small></div><div class="parts">'
      + LESSONS.map(l => { const mine = res.filter(r => r.l === l.id); return '<div class="stat"><b>' + mine.filter(r => r.ok).length + '/' + mine.length + '</b><span>' + esc(l.t.split(" (")[0]) + '</span></div>'; }).join("") + '</div>'
      + '<p>' + (right >= 18 ? "ممتاز، أنت جاهز! 🌟 جرّب الإملاء تحت." : right >= 14 ? "جيد جدًا. صحّح الأخطاء تحت، ثم جرّب مرة ثانية." : "راجع الدروس المذكورة تحت، ثم جرّب اختبارًا جديدًا.") + '</p>';
  } else {
    S.rounds++;
    if (right / res.length >= .8) master(R.mode);
    h += '<p class="q-part">' + esc(MODES[R.mode].name) + '</p><div class="big">' + right + ' <small>من ' + res.length + '</small></div>'
      + '<p>' + (right === res.length ? "كلها صحيحة! 🌟" : "صحّح الأخطاء تحت، والأسئلة تتغيّر في كل جولة.") + '</p>';
  }
  save();
  h += '<div class="row" style="justify-content:center"><button class="btn go" type="button" data-act="start" data-m="' + R.mode + '">جولة جديدة</button>'
    + (R.mode !== "mock" ? '<button class="btn" type="button" data-act="start" data-m="mock">اختبار تجريبي (20)</button>' : "") + '<button class="btn sm" type="button" data-act="home">الصفحة</button></div></section>';
  const miss = res.filter(r => !r.ok);
  if (miss.length) h += '<div class="sec"><div class="sec-head"><h2>صحّح هذه</h2><p>اقرأ السبب، ثم ارجع للدرس.</p></div><div class="miss-list">'
    + miss.map(r => '<div class="miss panel"><p class="q">' + esc(r.text) + '</p><p class="a">إجابتك: ' + esc(r.given) + ' · الصحيح: ' + esc(r.right) + '</p><p>' + esc(r.why) + '</p><p>' + lessonLink(r.l) + '</p></div>').join("") + '</div></div>';
  $("#main").innerHTML = h;
  window.scrollTo(0, 0);
  announce("النتيجة: " + say);
}

/* ---------- DICTATION ---------- */
let D = {i:0, timer:0};
const voice = () => { try { return (speechSynthesis.getVoices() || []).find(v => /^ar/i.test(v.lang)) || null; } catch (e) { return null; } };
function speak(text, rate){
  try { const v = voice(); if (!v) return false; const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.rate = rate || .75; speechSynthesis.cancel(); speechSynthesis.speak(u); return true; } catch (e) { return false; }
}
/* compare word by word with the longest common run, so a missing or extra word does not shift the rest */
function dictCheck(target, typed){
  const T = clean(target).split(" "), G = clean(typed).split(" ").filter(Boolean);
  const n = T.length, m = G.length, L = Array.from({length:n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = T[i] === G[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n){
    if (j < m && T[i] === G[j]){ out.push({w:T[i], ok:true}); i++; j++; }
    else if (j < m && L[i][j + 1] > L[i + 1][j]){ j++; }
    else { const near = j < m && L[i + 1][j + 1] === L[i][j] ? G[j] : ""; out.push({w:T[i], ok:false, got:near}); if (near) j++; i++; }
  }
  return out;
}
const noteFor = (s, w) => s.n[w] || s.n[w.replace(/^(ال|و|ف|ب)/, "")] || "";
function renderDict(){
  const s = DICT[D.i], hasVoice = !!voice();
  const done = (S.dict || {})[s.id];
  $("#dictBox").innerHTML = '<div class="row"><label for="dictSel" class="sr-only">اختر الجملة</label><select id="dictSel">' + DICT.map((d, i) => '<option value="' + i + '"' + (i === D.i ? " selected" : "") + '>' + (S.dict && S.dict[d.id] ? "✓ " : "") + esc(d.name) + '</option>').join("") + '</select>'
    + (hasVoice ? '<button class="btn go sm" type="button" data-act="say">🔊 استمع</button><button class="btn sm" type="button" data-act="sayslow">جزءًا جزءًا</button>' : "")
    + '<button class="btn sm" type="button" data-act="flash">اعرضها 5 ثوانٍ</button></div>'
    + (hasVoice ? "" : '<p class="tip">جهازك ما فيه صوت عربي للقراءة. استخدم «اعرضها 5 ثوانٍ» واكتبها من ذاكرتك، أو خلّ أحدًا يقرأها لك.</p>')
    + '<div class="flashbox" id="flash" aria-live="polite">' + (done ? "✓ كتبتها صحيحة من قبل" : "اسمع الجملة أو اعرضها، ثم اكتبها") + '</div>'
    + '<label for="dictIn" class="sr-only">اكتب الجملة</label><textarea id="dictIn" spellcheck="false" placeholder="اكتب الجملة هنا مع علامات الترقيم"></textarea>'
    + '<div class="row"><button class="btn go" type="button" data-act="dictcheck">صحّح</button><button class="btn sm" type="button" data-act="dictshow">اعرض الجملة</button></div><div id="dictRes" aria-live="polite"></div>';
}
function dictResult(){
  const s = DICT[D.i], typed = $("#dictIn").value;
  if (!clean(typed)){ announce("اكتب الجملة أولًا."); $("#dictIn").focus(); return; }
  const words = dictCheck(s.t, typed), right = words.filter(w => w.ok).length, all = right === words.length;
  const marks = [];
  if (((s.t.match(/،/g) || []).length > (typed.match(/[،,]/g) || []).length)) marks.push("ضع الفواصل (،) في أماكنها.");
  if (/[.]$/.test(s.t.trim()) && !/[.]\s*$/.test(typed.trim())) marks.push("ضع نقطة في آخر الجملة.");
  let h = '<div class="fb ' + (all ? "ok" : "no") + '"><span class="burst">' + (all ? "إملاء صحيح! ✔" : right + " من " + words.length + " كلمات صحيحة") + '</span>'
    + '<div class="words">' + words.map(w => '<span class="wd' + (w.ok ? "" : " bad") + '">' + esc(w.w) + (w.ok ? "" : w.got ? '<s>' + esc(w.got) + '</s>' : '<s>ناقصة</s>') + '</span>').join("") + '</div>';
  const notes = words.filter(w => !w.ok && noteFor(s, w.w)).map(w => '<p><b>' + esc(w.w) + ':</b> ' + esc(noteFor(s, w.w)) + '</p>');
  if (notes.length) h += '<div class="notes">' + notes.join("") + '</div>';
  if (marks.length) h += '<p class="tip">' + marks.join(" ") + '</p>';
  h += '</div>';
  if (all){
    if (!S.dict || typeof S.dict !== "object") S.dict = {};
    if (!S.dict[s.id]){ S.dict[s.id] = Date.now(); if (s.id === "official") master("dict"); addXP(20); h += '<p>⭐ +20 لأول مرة تكتبها صحيحة.</p>'; }
    save();
  }
  $("#dictRes").innerHTML = h;
  announce(all ? "إملاء صحيح." : right + " من " + words.length + " كلمات صحيحة.");
}

/* ---------- HOME ---------- */
function renderHome(){
  const n = dayDiff(todayISO(), QUIZ_DAY), when = n < 0 ? "خلص الاختبار" : n === 0 ? "اليوم" : n === 1 ? "غدًا" : "بعد " + count(n, "يوم واحد", "يومين", "أيام", "يومًا");
  let h = '<section class="hero panel u-a4"><h1>لغتي: مراجعة الاختبار القصير 2</h1>'
    + '<p class="sub">الخميس 19 نوفمبر · الهمزات وكان وأخواتها والإملاء <span class="badge' + (n >= 0 && n <= 1 ? " hot" : "") + '">' + when + '</span></p>'
    + '<div class="stats"><div class="stat"><b>' + (S.best === null ? "–" : S.best + "/20") + '</b><span>أفضل اختبار تجريبي</span></div><div class="stat"><b>' + Object.keys(S.dict || {}).length + '/' + DICT.length + '</b><span>جمل إملاء صحيحة</span></div><div class="stat"><b>' + S.xp + '</b><span>نقاط</span></div></div>'
    + '<div class="row"><button class="btn go" type="button" data-act="start" data-m="mock">ابدأ اختبارًا تجريبيًا</button><a class="btn" href="#dict">تدرّب على الإملاء</a><a class="btn sm" href="../../review/quiz-2/index.html#ar">قائمة الاختبار القصير 2</a></div></section>';
  h += '<section class="sec"><div class="sec-head"><h2>تدرّب</h2><p>الأسئلة تتغيّر في كل جولة، ومع كل إجابة سببها.</p></div><div class="modes">'
    + ["a1", "a2", "a3", "a4"].map(id => '<button class="mode u-' + id + '" type="button" data-act="start" data-m="' + id + '"><b>' + esc(MODES[id].name) + '</b><span>' + (id === "a4" ? "8 أسئلة، منها إدخال الفعل على جملة" : "8 أسئلة، منها كتابة الكلمة الصحيحة") + '</span></button>').join("")
    + '<button class="mode mock u-a5" type="button" data-act="start" data-m="mock"><b>اختبار تجريبي (20 سؤالًا)</b><span>من كل الدروس، ثم نتيجتك في كل درس وتصحيح الأخطاء.</span></button></div></section>';
  h += '<section class="sec" id="dict"><div class="sec-head"><h2>الإملاء</h2><p>قطعة الاختبار أولًا، ثم جمل فيها كل أنواع الهمزة. اسمع، ثم اكتب، ثم صحّح.</p></div><article class="dict panel u-a5" id="dictBox"></article></section>';
  h += '<section class="sec" id="lessons"><div class="sec-head"><h2>الدروس</h2><p>نطاق الاختبار في الملف الرسمي، مع الصفحات.</p></div><div class="lessons">'
    + LESSONS.map(l => '<article class="lesson panel u-' + l.id + '" id="l-' + l.id + '"><h3>' + esc(l.t) + (l.pg ? ' <small>ص ' + l.pg + '</small>' : "") + '</h3>' + lessonBody(l) + '</article>').join("") + '</div></section>';
  h += '<footer class="foot"><p>النطاق والصفحات من ملف التقييم الرسمي للاختبار القصير 2. القواعد هي قواعد الإملاء والنحو المعروفة، والأسئلة والجمل مكتوبة لهذه الصفحة. إذا اختلف شيء عن الكتاب، المعتمد كلام المعلم والكتاب.</p></footer>';
  $("#main").innerHTML = h;
  renderDict();
}

/* ---------- PRINT ---------- */
function renderPrint(){
  const fix = [["يئكل", "يأكل"], ["بأر", "بئر"], ["مئمن", "مؤمن"], ["قرائة", "قراءة"], ["شاطء", "شاطئ"], ["شيئ", "شيء"], ["التباطئ", "التباطؤ"], ["ملجئ", "ملجأ"]];
  const kind = [["استخراج", "وصل"], ["أكرم", "قطع"], ["امرأة", "وصل"], ["إيمان", "قطع"], ["اجلس", "وصل"], ["إلى", "قطع"]];
  const kana = TYPE.filter(q => q.tr).slice(0, 4);
  $("#printSheet").innerHTML = '<header class="ps-head"><h1>لغتي: ملخص الاختبار القصير 2</h1><p>الصف السادس · الخميس 19/11/2026</p></header><div class="ps-cols"><div>'
    + [LESSON.a1, LESSON.a2, LESSON.a5].map(psLesson).join("") + '</div><div>' + [LESSON.a3, LESSON.a4].map(psLesson).join("") + '</div></div>'
    + '<section class="ps-page2"><header class="ps-head"><h1>اختبار تجريبي</h1><p>الاسم: ……………………</p></header>'
    + '<div class="ps-q"><h2>السؤال الأول: صحّح كتابة الهمزة</h2><ol>' + fix.map(f => '<li>' + f[0] + ' ← ……………</li>').join("") + '</ol></div>'
    + '<div class="ps-q"><h2>السؤال الثاني: نوع الهمزة (وصل / قطع)</h2><ol>' + kind.map(k => '<li>' + k[0] + ': ……………</li>').join("") + '</ol></div>'
    + '<div class="ps-q"><h2>السؤال الثالث: أدخل الفعل الناسخ على الجملة، واضبط الخبر</h2><ol>' + kana.map(q => '<li>' + esc(q.q.replace("أدخل ", "").replace(" على الجملة:", " :")) + ' ………………………………</li>').join("") + '</ol></div>'
    + '<div class="ps-q"><h2>السؤال الرابع: الإملاء (يُملى عليك)</h2><div class="ps-line"></div><div class="ps-line"></div><div class="ps-line"></div></div>'
    + '<div class="ps-key"><h3>الإجابات</h3><p><b>الأول:</b> ' + fix.map((f, i) => (i + 1) + ') ' + f[1]).join(" · ") + '</p><p><b>الثاني:</b> ' + kind.map((k, i) => (i + 1) + ') ' + k[1]).join(" · ") + '</p>'
    + '<p><b>الثالث:</b> ' + kana.map((q, i) => (i + 1) + ') ' + esc(q.w.split(":")[0].replace(/\.$/, ""))).join(" · ") + '</p><p><b>الرابع:</b> ' + esc(DICT[0].t) + '</p></div></section>';
}
function psLesson(l){
  return '<div class="ps-l"><h3>' + esc(l.t) + (l.pg ? ' · ص ' + l.pg : "") + '</h3>' + (l.def ? '<p><b>' + l.def + '</b></p>' : "") + (l.ex ? '<p>' + l.ex + '</p>' : "") + (l.passage ? '<p><b>' + esc(l.passage) + '</b></p>' : "")
    + (l.table ? '<table>' + l.table.map((r, i) => '<tr>' + r.map(c => i ? '<td>' + c + '</td>' : '<th>' + c + '</th>').join("") + '</tr>').join("") + '</table>' : "")
    + (l.pts ? '<ul>' + l.pts.map(p => '<li>' + p + '</li>').join("") + '</ul>' : "") + '</div>';
}

/* ---------- EVENTS ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "start") start(b.dataset.m);
  else if (a === "mc") answerMC(+b.dataset.k);
  else if (a === "tf") answerTF(b.dataset.v === "1");
  else if (a === "checktype") checkType();
  else if (a === "next") next();
  else if (a === "home"){ R = null; renderHome(); window.scrollTo(0, 0); }
  else if (a === "lesson"){ e.preventDefault(); R = null; renderHome(); const t = document.getElementById("l-" + b.dataset.l); if (t) t.scrollIntoView(); }
  else if (a === "say") speak(DICT[D.i].t, .75);
  else if (a === "sayslow"){ const parts = (DICT[D.i].t.match(/[^،.]+[،.]?/g) || []).map(x => x.trim()).filter(Boolean); let k = 0; const go = () => { if (k < parts.length){ const t = parts[k++]; try { const v = voice(); const u = new SpeechSynthesisUtterance(t); u.voice = v; u.lang = v.lang; u.rate = .65; u.onend = () => setTimeout(go, 1600); speechSynthesis.speak(u); } catch (err) {} } }; try { speechSynthesis.cancel(); } catch (err) {} go(); }
  else if (a === "flash"){ const f = $("#flash"); f.textContent = DICT[D.i].t; clearTimeout(D.timer); D.timer = setTimeout(() => { f.textContent = "اكتبها الحين من ذاكرتك"; $("#dictIn").focus(); }, 5000); }
  else if (a === "dictshow"){ $("#flash").textContent = DICT[D.i].t; }
  else if (a === "dictcheck") dictResult();
});
document.addEventListener("change", e => { if (e.target.id === "dictSel"){ D.i = +e.target.value; clearTimeout(D.timer); renderDict(); } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "typeIn" && R && !R.locked){ e.preventDefault(); checkType(); } });
$("#printBtn").addEventListener("click", () => window.print());
try { speechSynthesis.addEventListener("voiceschanged", () => { if (!R && $("#dictBox") && !$("#dictIn").value) renderDict(); }); } catch (e) {}
window.addEventListener("monmon-sync", e => {
  try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v) S = Object.assign(fresh(), v); } catch (err) {}
  $("#xpVal").textContent = S.xp;
  if (!R){ const st = document.querySelectorAll(".hero .stat b"); if (st.length === 3){ st[0].textContent = S.best === null ? "–" : S.best + "/20"; st[1].textContent = Object.keys(S.dict || {}).length + "/" + DICT.length; st[2].textContent = S.xp; } }
  e.preventDefault();
});

$("#xpVal").textContent = S.xp;
renderHome();
renderPrint();
if (location.hash.length > 1){ const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
</script>
