<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Number Line Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2212%22 fill=%22%23FFD23F%22 stroke=%22%2314163A%22 stroke-width=%225%22/%3E%3Cpath d=%22M21 21l22 22M43 21L21 43%22 stroke=%22%2314163A%22 stroke-width=%227%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#14163A; --ink-2:#4A4D78; --ink-3:#8A8DB0;
  --paper:#FFFFFF; --page:#E4F2FF; --dot:rgba(20,22,58,.07);
  --sun:#FFD23F; --sun-2:#FFF3C4;
  --good:#12A15E; --good-bg:#DCF7E9;
  --bad:#E23D45; --bad-bg:#FFE1E2;
  --warn:#C77700; --warn-bg:#FFF0D1;
  --c1:#2F7DE1; --c1t:#DCEBFF;
  --c2:#F39200; --c2t:#FFE8C2;
  --c3:#9A4FE0; --c3t:#EEE0FF;
  --c4:#119C77; --c4t:#D2F4E8;
  --c5:#E23F66; --c5t:#FFDDE6;
  --col:var(--c1); --tint:var(--c1t);
  --shadow:4px 4px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --r:14px; --r-sm:10px;
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--c1);font-weight:700;overflow-wrap:anywhere}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.land-c1{--col:var(--c1);--tint:var(--c1t)} .land-c2{--col:var(--c2);--tint:var(--c2t)} .land-c3{--col:var(--c3);--tint:var(--c3t)}
.land-c4{--col:var(--c4);--tint:var(--c4t)} .land-c5{--col:var(--c5);--tint:var(--c5t)}

/* math type: powers and stacked fractions */
sup{font-size:.62em;line-height:0;position:relative;vertical-align:baseline;top:-.62em;font-weight:inherit}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.8em;line-height:1.08;margin:0 .1em;font-variant-numeric:tabular-nums;white-space:nowrap}
.fr .nu{border-bottom:.1em solid currentColor;padding:0 .14em}
.fr .de{padding:0 .14em}
.fr .sl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fp{font-size:1.3em;line-height:1;font-weight:400;vertical-align:-.1em}
sup.qm{display:inline-block;font-size:.8em;min-width:1.2em;padding:0 .12em;border:2px dashed var(--ink-2);border-radius:5px;text-align:center;line-height:1.2;top:-.45em;color:var(--ink-2);margin-left:.14em}
.t,.nw{white-space:nowrap}
.slot{display:inline-grid;place-items:center;width:1.5em;height:1.5em;margin:0 .15em;border:2px dashed var(--ink-2);border-radius:50%;vertical-align:middle;font-size:.9em;font-weight:800;color:var(--ink-2);line-height:1}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo-mark{font-family:var(--display);font-size:28px;letter-spacing:.05em;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg);white-space:nowrap}
.unit-chip{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:#fff;padding:4px 8px;border-radius:6px;white-space:nowrap}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--sun-2);border:2px solid var(--ink);border-radius:999px;padding:3px 12px 3px 6px;white-space:nowrap}
.xp svg{width:20px;height:20px}
.xp.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:scale(1.18)}}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:2px 2px 0 var(--ink);padding:0}
.icon-btn svg{width:22px;height:22px}
@media (max-width:520px){.unit-chip{display:none}.logo-mark{font-size:24px}}
@media (max-width:400px){.topbar-in{gap:8px}.logo-mark{font-size:22px}.xp{padding:3px 9px 3px 5px}}
/* phones: the site strip above has the way home, so this bar keeps its room for the XP */
@media (max-width:400px){.topbar a.icon-btn{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font-weight:800;font-size:16px;line-height:1.2;text-decoration:none;box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-go{background:var(--sun)}
.btn-ink{background:var(--ink);color:#fff}
.btn-col{background:var(--col);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn-sm{min-height:38px;padding:6px 12px;font-size:14px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.screen{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* home */
.hero{margin-top:20px;padding:20px;display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(42px,7vw,66px)}
.hero h1 span{color:var(--c1);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.hero p{margin-top:10px;max-width:50ch;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:2px solid var(--ink);border-radius:10px;padding:10px 6px;background:var(--page);text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
@media (max-width:680px){.hero{grid-template-columns:1fr}}
.banner{margin-top:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sun-2)}
.banner.alert{background:var(--bad-bg)}
.banner p{flex:1 1 260px}
.sec-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:34px 0 14px}
.sec-title h2{font-size:36px}
.sec-title p{color:var(--ink-2);font-size:14px}

/* quest trail */
.trail{position:relative;display:grid;gap:20px;padding-block:4px}
.trail::before{content:"";position:absolute;top:0;bottom:-20px;left:50%;border-left:4px dashed var(--ink-3);transform:translateX(-2px)}
.land{position:relative;width:calc(50% - 26px);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;text-align:left;background:var(--tint);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .12s}
.land:nth-child(odd){justify-self:start}
.land:nth-child(even){justify-self:end}
.land:hover{transform:translateY(-3px) rotate(-.4deg)}
.land::after{content:"";position:absolute;top:24px;width:22px;height:22px;border-radius:50%;background:var(--col);border:3px solid var(--ink)}
.land:nth-child(odd)::after{right:-40px}
.land:nth-child(even)::after{left:-40px}
@media (max-width:680px){.trail::before{left:18px}.land{width:calc(100% - 44px);justify-self:end!important}.land::after{left:-40px!important;right:auto!important}}
.badge{width:56px;height:56px;border-radius:50%;background:var(--col);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
.badge svg{width:32px;height:32px}
.land-num{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.land h3{font-size:30px}
.land .sub{font-size:14px;color:var(--ink-2)}
.land-foot{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.progress-note{font-size:13px;font-weight:700;color:var(--ink-2)}
.stars{display:flex;gap:2px}
.stars svg{width:24px;height:24px}
.sticker{position:absolute;top:-19px;right:12px;font-family:var(--display);font-size:18px;letter-spacing:.05em;background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;transform:rotate(4deg);box-shadow:2px 2px 0 var(--ink)}
.sticker.ok{background:var(--good)}
.final{position:relative;margin:36px auto 0;max-width:560px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--sun)}
.final h3{font-size:34px}
.final p{font-size:14px;color:var(--ink)}
.final .row{grid-column:1 / -1}
.final .badge{background:var(--ink)}

/* homework */
.hw{padding:16px;display:grid;gap:14px}
.hw-item{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start;padding:14px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--paper)}
.hw-item.done{background:var(--good-bg)}
.hw-check{width:30px;height:30px;margin:2px 0 0;accent-color:var(--good);cursor:pointer}
.hw-item h3{font-size:24px}
.hw-item .due{font-size:13px;font-weight:800;color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.hw-item ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.hw-body{grid-column:2;display:grid;gap:8px;min-width:0}
.hw-note{font-size:13px;color:var(--ink-2)}
.foot-note{margin-top:28px;text-align:center;font-size:13px;color:var(--ink-2)}
.foot-links{justify-content:center;margin-top:28px}
.link-btn{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;font-size:13px}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.chip-land{font-family:var(--display);font-size:22px;letter-spacing:.04em;padding:3px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--col);color:#fff;-webkit-text-stroke:.5px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.intro{margin-top:14px;padding:22px;display:grid;gap:14px;background:var(--tint)}
.intro h2{font-size:clamp(40px,8vw,64px);color:var(--col);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.intro p{font-size:18px;max-width:60ch}
.lcards{display:grid;gap:18px;margin-top:18px}
.lcard{padding:16px;display:grid;gap:14px}
.lcard-num{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.lcard h3{font-size:32px;color:var(--col);-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.lgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px 20px;align-items:center}
.lgrid.solo{grid-template-columns:1fr}
@media (max-width:720px){.lgrid{grid-template-columns:1fr}}
.ltext{display:grid;gap:12px;min-width:0;font-size:17px;line-height:1.6}
.ltext b{background:var(--sun-2);padding:0 4px;border-radius:4px}
.trick-inline{display:block;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--sun-2);transform:rotate(-.6deg);box-shadow:2px 2px 0 var(--ink);font-weight:500}
.ex{border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--page);padding:12px 14px}
.ex h4{margin:0;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.ex .ex-q{margin-top:2px;font-weight:800;font-size:18px}
.ex ol{margin:8px 0 0;padding-left:22px;display:grid;gap:4px}
.note{font-size:15px;padding:10px 12px;border-left:6px solid var(--col);background:var(--tint);border-radius:0 10px 10px 0}
.tscroll{overflow-x:auto;max-width:100%}
.rtable{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--ink);border-radius:10px;overflow:hidden;font-size:15px;background:var(--paper)}
.rtable th,.rtable td{padding:7px 10px;text-align:left;border-bottom:2px solid var(--page)}
.rtable th{background:var(--ink);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.rtable tr:last-child td{border-bottom:0}
.rtable td:first-child{font-weight:800;white-space:nowrap}
@media (max-width:420px){.rtable{font-size:14px}.rtable th,.rtable td{padding:6px 7px}}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}

/* lesson pictures */
.viz{width:100%;max-width:440px;margin:0 auto;border:3px solid var(--ink);border-radius:var(--r-sm);background:#fff;overflow:hidden;box-shadow:var(--shadow-sm)}
.viz svg{display:block;width:100%;height:auto}
.viz .vt{font-family:var(--body);font-size:15px;font-weight:700;fill:var(--ink)}
.viz .vs{font-family:var(--body);font-size:13px;font-weight:600;fill:var(--ink-2)}
.viz .vb{font-family:var(--body);font-size:21px;font-weight:800;fill:var(--ink)}
.viz .vd{font-family:var(--display);fill:var(--ink);letter-spacing:.02em}
.viz .vcap{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.08em;fill:var(--ink-2)}
.viz .ln{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.viz .lt{stroke:var(--ink-3);stroke-width:1.2;fill:none}
.viz .tile{fill:var(--tint);stroke:var(--ink);stroke-width:2.5}
.viz .hot{fill:var(--col);stroke:var(--ink);stroke-width:2.5}
.viz .sun{fill:var(--sun-2);stroke:var(--ink);stroke-width:2.5}
.viz .wht{fill:#fff;stroke:var(--ink);stroke-width:2.5}

/* questions */
.test-top{display:grid;gap:10px;margin-top:16px}
.test-top .row{justify-content:space-between}
.round-name{font-family:var(--display);font-size:26px;letter-spacing:.04em}
.counter{font-weight:800;font-variant-numeric:tabular-nums}
.progress{height:16px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.progress i{display:block;height:100%;background:var(--sun);border-right:2px solid var(--ink);transition:width .4s}
.q-card{margin-top:14px;padding:18px;display:grid;gap:14px;min-width:0}
.q-kicker{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.q-text{font-size:20px;line-height:1.55;font-weight:500;overflow-wrap:anywhere}
.q-text:focus,.q-text:focus-visible{outline:none}
.q-text b{background:var(--sun-2);padding:0 5px;border-radius:5px;box-shadow:inset 0 -3px 0 var(--sun);white-space:nowrap}
.qx{display:block;margin-top:8px;padding:8px 12px;border:2px dashed var(--ink-3);border-radius:10px;background:var(--page);font-size:22px;font-weight:700;line-height:1.7;font-variant-numeric:tabular-nums}
@media (max-width:420px){.q-text{font-size:19px}.qx{font-size:20px;padding:6px 10px}}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.opts.two{grid-template-columns:1fr}.opts.four{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:56px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:600;font-size:18px;line-height:1.35;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;font-variant-numeric:tabular-nums;min-width:0}
.opt:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--page)}
.opt.big{justify-content:center;font-family:var(--display);font-size:34px;font-weight:400;letter-spacing:.04em;min-height:64px;text-align:center}
.opt.big .fr{font-size:.72em}
.opt.big.sym{font-family:var(--body);font-weight:800;font-size:36px}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-bg);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad-bg);animation:shake .4s}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.04)}}
.ans-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.type-in{min-width:0;font:inherit;font-size:22px;font-weight:700;letter-spacing:.02em;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.type-in:focus{outline:none;box-shadow:0 0 0 4px var(--sun)}
.type-in.ok{background:var(--good-bg)} .type-in.no{background:var(--bad-bg);animation:shake .4s}
.type-in.num{width:10em;max-width:100%}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:block;text-align:center}
.unit{font-weight:800;font-size:18px;color:var(--ink-2)}
/* the power input: a big base box with a small raised exponent box */
.pow-in{display:flex;align-items:flex-start;gap:4px}
.pow-b{display:grid;justify-items:center;gap:2px;margin-top:30px}
.pow-e{display:grid;justify-items:center;gap:2px}
.type-in.base{width:5.4em;font-size:28px;text-align:center;padding:10px 8px}
.type-in.exp{width:2.8em;font-size:18px;text-align:center;padding:6px 4px}
.keys{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.keys span{font-size:12px;font-weight:700;color:var(--ink-2);margin-right:4px}
.key{min-width:44px;height:40px;padding:0 10px;border:2px solid var(--ink);border-radius:9px;background:var(--page);font-weight:800;font-size:18px;box-shadow:2px 2px 0 var(--ink)}
.key:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.input-msg{font-size:14px;font-weight:700;color:var(--bad);min-height:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.hint-box{padding:10px 14px;border:2px dashed var(--ink);border-radius:10px;background:var(--sun-2);font-size:16px;animation:slideUp .3s ease-out}
.hint-box b.tag,.tip b.tag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:#fff;padding:2px 7px;border-radius:5px;margin-right:6px}
.fb{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:start;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;animation:slideUp .3s ease-out}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}

<script>
"use strict";

/* ---------- CORE HELPERS ---------- */
const INK = "#14163A";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduceMotion = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const finePointer = !!(window.matchMedia && matchMedia("(pointer: fine)").matches);
const pctOf = (a, b) => b ? Math.round(a / b * 100) : 0;
const fmtDate = t => { try { return new Date(t).toLocaleString("en-GB", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); } catch (e) { return ""; } };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- NUMBERS ---------- */
const near = (a, b) => Math.abs(a - b) < 1e-9;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const isWhole = v => near(v, Math.round(v));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
/* exact whole-number power (all values here stay far below 2^53) */
const ipow = (b, e) => { let v = 1; for (let i = 0; i < e; i++) v *= b; return v; };
/* 1234567 → "1,234,567" */
const fmtInt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

/* Reads 81, 0.09, 4/9, 2 1/2, 1,000,000, "36 cm²" … and returns NaN if it can't.
   A comma between groups of three digits is a thousands separator (1,000,000);
   any other comma between digits is a decimal comma (0,09). */
function parseNum(raw){
  let s = String(raw == null ? "" : raw).trim().toLowerCase();
  s = s.replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x660)).replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x6F0));
  s = s.replace(/٬/g, ",").replace(/٫/g, ".");
  s = s.replace(/[−‒–—﹣－]/g, "-").replace(/[⁄∕÷]/g, "/").replace(/[()]/g, " ");
  s = s.replace(/½/g, " 1/2").replace(/¼/g, " 1/4").replace(/¾/g, " 3/4");
  s = s.replace(/([a-z])[²³]/g, "$1");
  s = s.replace(/[a-z]+\.?/g, " ").replace(/\s+/g, " ").trim().replace(/^\+\s*/, "").replace(/^-\s+/, "-");
  s = s.replace(/(^|[^\d.,])([1-9]\d{0,2}(?:,\d{3})+)(?![\d,])/g, (m, a, n) => a + n.replace(/,/g, ""));
  if (/^-?[1-9]\d{0,2}( \d{3})+$/.test(s)) s = s.replace(/ /g, "");
  s = s.replace(/(\d),(\d)/g, "$1.$2");
  let m;
  if ((m = s.match(/^(-?)(\d+\.?\d*|\.\d+)$/))) return (m[1] ? -1 : 1) * parseFloat(m[2]);
  if ((m = s.match(/^(-?)(\d+) (\d+) ?\/ ?(\d+)$/)) && +m[4]) return (m[1] ? -1 : 1) * (+m[2] + +m[3] / +m[4]);
  if ((m = s.match(/^(-?)(\d+) ?\/ ?(\d+)$/)) && +m[3]) return (m[1] ? -1 : 1) * (+m[2] / +m[3]);
  return NaN;
}

/* ---------- MATH TEXT ----------
   A tiny markup for maths: "6^4", "(2/3)^2", "1/16".
   M() turns it into HTML (raised exponents, stacked fractions); T() into plain text ("6⁴", "(2/3)²"). */
const SUPC = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","n":"ⁿ"};
const supT = e => { const s = String(e); return s.split("").every(c => SUPC[c]) ? s.split("").map(c => SUPC[c]).join("") : "^" + s; };
const sup = e => e === "?" ? '<sup class="qm">?</sup>' : "<sup>" + e + "</sup>";
/* a stacked fraction; the hidden slash (and hidden brackets around a product) keep the plain text right: "(2 × 2)/(3 × 3)" */
const hp = x => /\s/.test(String(x)) ? '<span class="sl">(</span>' + x + '<span class="sl">)</span>' : x;
const fr = (n, d) => '<span class="fr"><span class="nu">' + hp(n) + '</span><span class="sl">/</span><span class="de">' + hp(d) + '</span></span>';
const FPO = '<span class="fp">(</span>', FPC = '<span class="fp">)</span>';
function M(s){
  return String(s).replace(/\(([\d ×]+)\)\/\(([\d ×]+)\)/g, (m, a, b) => fr(a.trim(), b.trim()))
    .replace(/\((\d+)\/(\d+)\)/g, (m, a, b) => FPO + fr(a, b) + FPC)
    .replace(/(\d+)\/(\d+)/g, (m, a, b) => fr(a, b))
    .replace(/\^(\d+|\?|n)/g, (m, e) => sup(e));
}
const T = s => String(s).replace(/\^(\d+|\?|n)/g, (m, e) => supT(e));
/* HTML → plain text for the answer lists and the screen-reader announcements */
const strip = h => String(h).replace(/<sup[^>]*>(.*?)<\/sup>/g, (m, e) => supT(e.replace(/<[^>]*>/g, "")))
  .replace(/<br\s*\/?>/g, " ").replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
  .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&").replace(/\s+/g, " ").trim();
/* Line breaks: keep "(5 × 10³)" terms and "fraction + full stop" together. Applied to each screen's HTML. */
const NW_FR = /<b><span class="fr">(?:(?!<\/span><\/span>).)*<\/span><\/span><\/b>[.,;:?!]|<span class="fr">(?:(?!<\/span><\/span>).)*<\/span><\/span>[.,;:?!]/g;
const TERM10 = /\(?\d[\d,]* × 10<sup[^>]*>[^<]*<\/sup>\)?/g;
const keep = h => String(h).replace(NW_FR, m => '<span class="nw">' + m + '</span>').replace(TERM10, m => '<span class="t">' + m + '</span>');
const NAMES = ["Sami", "Lina", "Omar", "Huda", "Yousef", "Reem", "Faisal", "Noura", "Ziad", "Dana"];

/* multiple choice: items[0] is the right answer; each wrong item can carry a tip for that slip */
function mcQ(o, items, layout){
  const order = shuffle(items.map((it, i) => i));
  return Object.assign({kind:"mc", layout:layout || "list", opts:order.map(i => items[i].h), optTips:order.map(i => items[i].tip || ""), ans:order.indexOf(0)}, o);
}

/* ---------- RATIONAL NUMBERS ----------
   Values are plain numbers. fmtDec() writes one with a real minus sign (−2.25); mixed() writes a fraction value as a
   mixed number for M() ("−1 2/5"), which stacks the fraction. */
const MINUS = "−";
const fmtDec = v => (v < 0 ? MINUS : "") + String(+Math.abs(v).toFixed(4));
function mixed(v, d){
  const neg = v < 0, a = Math.abs(v), w = Math.floor(a + 1e-9), n = Math.round((a - w) * d);
  if (!n) return (neg ? MINUS : "") + w;
  const g = gcd(n, d);
  return (neg ? MINUS : "") + (w ? w + " " : "") + n / g + "/" + d / g;
}
/* a value as the lesson writes it: a fraction value keeps its fraction, anything else is a decimal */
const numH = (v, d) => d ? M(mixed(v, d)) : fmtDec(v);
const numT = (v, d) => d ? strip(M(mixed(v, d))) : fmtDec(v);
const absBars = h => '<span class="abs">|' + h + '|</span>';

/* ---------- PICTURES (SVG) ---------- */
const svgBox = (w, h, body, label) => '<div class="viz"><svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(label) + '">' + body + '</svg></div>';
const tx = (x, y, s, cls, anchor, extra) => '<text class="' + cls + '" x="' + x + '" y="' + y + '"' + (anchor ? ' text-anchor="' + anchor + '"' : "") + (extra || "") + '>' + s + '</text>';
const numLabel = v => (v < 0 ? MINUS : "") + String(+Math.abs(v).toFixed(2));
/* A number line from lo to hi: a tick every `step`, a longer labelled tick every `every` (1 by default),
   lettered points, and arcs from 0 (for opposites and absolute value). */
function nline(o){
  const W = 420, x0 = 28, x1 = 392, top = (o.pts || []).some(p => p.name) || o.arcs ? (o.arcs ? 74 : 54) : 34, y = top, H = y + 40;
  const X = v => x0 + (v - o.lo) / (o.hi - o.lo) * (x1 - x0), f = v => X(v).toFixed(1);
  let s = '<path class="ln" d="M' + (x0 - 16) + ' ' + y + ' H' + (x1 + 16) + '"/>'
    + '<path class="ln" d="M' + (x0 - 8) + ' ' + (y - 6) + ' L' + (x0 - 16) + ' ' + y + ' L' + (x0 - 8) + ' ' + (y + 6) + '"/>'
    + '<path class="ln" d="M' + (x1 + 8) + ' ' + (y - 6) + ' L' + (x1 + 16) + ' ' + y + ' L' + (x1 + 8) + ' ' + (y + 6) + '"/>';
  const every = o.every || 1, n = Math.round((o.hi - o.lo) / o.step);
  for (let k = 0; k <= n; k++){
    const v = o.lo + k * o.step, big = isWhole(v / every);
    s += '<path class="' + (big ? "ln" : "lt") + '" d="M' + f(v) + ' ' + (y - (big ? 9 : 6)) + ' V' + (y + (big ? 9 : 6)) + '"/>';

/* ---------- QUESTIONS ----------
   A generator returns a question: kind "num" (typed: num is the answer, diag(g) a tip for a wrong value) or "mc"
   (from mcQ: the first item is right, a wrong item can carry a tip for that slip). viz is shown under the question. */
const LETTERS = ["A", "B", "C", "D"];
/* "Which point shows …?": four values on one number line, lettered A–D from left to right; the first value is right */
function letterQ(o, line, target, wrongs){
  const vals = [target].concat(wrongs.map(w => w[0]));
  const order = vals.map((v, i) => ({v, i})).sort((a, b) => a.v - b.v), name = [];
  order.forEach((p, k) => { name[p.i] = LETTERS[k]; });
  const viz = nline(Object.assign({}, line, {pts:order.map((p, k) => ({v:p.v, name:LETTERS[k]})),
    label:"A number line from " + numLabel(line.lo) + " to " + numLabel(line.hi) + " with points A, B, C and D."}));
  const optTips = LETTERS.map(L => { const i = name.indexOf(L); return i > 0 ? wrongs[i - 1][1] : ""; });
  return Object.assign({kind:"mc", layout:"four", opts:LETTERS.slice(), optTips, ans:LETTERS.indexOf(name[0]), viz, ansText:name[0] + " (" + numLabel(target) + ")"}, o);
}
/* four values that sit on ticks, all different and at least one tick apart */
const spread = (vals, step) => vals.every((a, i) => vals.every((b, j) => i === j || Math.abs(a - b) >= step - 1e-9));

function symQ(o, a, b, tipFor){
  const ans = a < b - 1e-9 ? 0 : a > b + 1e-9 ? 1 : 2, opts = ["&lt;", "&gt;", "="];
  return Object.assign({kind:"mc", layout:"three", opts, ans, optTips:opts.map((x, i) => i === ans ? "" : tipFor(i)), ansText:["<", ">", "="][ans]}, o);
}

/* ---------- CONFETTI ---------- */
const FX = (() => {
  const cv = $("#fx"), ctx = cv && cv.getContext ? cv.getContext("2d") : null;
  let parts = [], raf = 0;
  const COLS = ["#FFD23F", "#2F7DE1", "#F39200", "#9A4FE0", "#119C77", "#E23F66"];
  function size(){ if (!cv) return; const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; }
  size(); addEventListener("resize", size);
  function tick(){
    const d = window.devicePixelRatio || 1;
    ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life < p.max);
    parts.forEach(p => {
      p.life++; p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - p.life / p.max); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.sq) ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); else { ctx.beginPath(); ctx.arc(0, 0, p.r / 2.6, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    });
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
  function burstAt(x, y, n){
    if (reduceMotion || !ctx) return;
    for (let i = 0; i < (n || 36); i++){ const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 7;
      parts.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 4, r:5 + Math.random() * 6, rot:Math.random() * 6, vr:(Math.random() - .5) * .4, c:COLS[i % COLS.length], life:0, max:55 + Math.random() * 40, sq:Math.random() < .55}); }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function burstEl(el, n){ if (!el) return; const r = el.getBoundingClientRect(); burstAt(r.left + r.width / 2, r.top + r.height / 2, n); }
  function party(){ for (let k = 0; k < 5; k++) setTimeout(() => burstAt(innerWidth * (.15 + Math.random() * .7), innerHeight * (.2 + Math.random() * .25), 40), k * 170); }
  return {burstEl, party};
})();

function finalReport(){

  const rep = {t:Date.now(), pct, right, n, skills, items:res.map(r => ({ok:r.ok, skill:r.skill, text:r.text, given:r.given, correct:r.correct, why:r.why}))};

function renderReport(rep){
  const C = 2 * Math.PI * 64, rank = rep.pct >= 90 ? "Number Line Master" : rep.pct >= 75 ? "Integer Expert" : rep.pct >= 50 ? "Lab Assistant" : "Explorer in Training";
  const low = Object.keys(rep.skills).some(k => rep.skills[k][0] / rep.skills[k][1] < .5);
  const ready = rep.pct >= 80 && !low ? "You're ready for Lessons 2-1 to 2-3 on Quiz 2. Check 2-4 to 2-6 and 3-1 in the other two labs too."
    : rep.pct >= 60 ? "Almost ready. Practice the skills marked below, then take the challenge again." : "Practice the zones in the study plan below, then take the challenge again before the quiz.";
  let h = '<div class="land-c1"><div class="lesson-top"><button class="btn btn-sm" data-act="home">← Map</button><span class="your">' + fmtDate(rep.t) + '</span></div>'
    + '<div class="panel report-head"><div class="ring"><svg viewBox="0 0 156 156" aria-hidden="true"><circle cx="78" cy="78" r="64" fill="none" stroke="#E4F2FF" stroke-width="16"/><circle cx="78" cy="78" r="64" fill="none" stroke="' + (rep.pct >= 75 ? "#12A15E" : rep.pct >= 50 ? "#F39200" : "#E23D45") + '" stroke-width="16" stroke-linecap="round" stroke-dasharray="' + (C * rep.pct / 100).toFixed(2) + ' ' + C.toFixed(2) + '"/></svg><div class="num">' + rep.pct + '%<small>' + rep.right + ' / ' + rep.n + '</small></div></div>'
    + '<div><div class="land-num">Final Challenge result</div><div class="rank">' + rank + '</div><p>' + ready + '</p><div class="row" style="margin-top:12px"><button class="btn btn-go" data-act="startfinal">Try again</button><a class="btn btn-sm" href="' + REVIEW + '">Quiz 2 checklist</a></div></div></div>';
  h += '<div class="sec-title"><h2>Skills</h2><p>Green 80%+ · Orange 50–79% · Red below 50%.</p></div><div class="panel bars">';
  const order = SKILL_ORDER.filter(k => rep.skills[k]);
  order.forEach(k => {
    const [c, t] = rep.skills[k], p = pctOf(c, t), st = p >= 80 ? "good" : p >= 50 ? "mid" : "low";
    h += '<div class="bar-row land-' + ZONES[SKILLS[k].zone].col + '"><div class="bar-label">' + SKILLS[k].name + '<small>' + ZONES[SKILLS[k].zone].name + ' · ' + c + '/' + t + '</small></div>'
      + '<div class="bar" role="img" aria-label="' + p + ' percent"><i class="' + (p ? "" : "zero") + '" data-w="' + p + '"></i></div><div class="bar-end"><span class="pct">' + p + '%</span><span class="status ' + st + '">' + (st === "good" ? "Strong" : st === "mid" ? "Almost" : "Practice") + '</span></div></div>';
  });
  h += '</div>';
  const weak = order.map(k => ({k, p:rep.skills[k][0] / rep.skills[k][1]})).filter(x => x.p < .8).sort((a, b) => a.p - b.p);
  h += '<div class="sec-title"><h2>Study Plan</h2><p>' + (weak.length ? "Do these in order, weakest first. Each one takes about 5 minutes." : "No weak spots. Keep it fresh before Quiz 2.") + '</p></div>';
  if (weak.length){
    h += '<ol class="plan">' + weak.map(x => {
      const zi = SKILLS[x.k].zone;
      return '<li><b>' + SKILLS[x.k].name + '</b> <span class="your">(' + Math.round(x.p * 100) + '%) · Zone ' + (zi + 1) + ': ' + ZONES[zi].name + '</span><p>' + M(SKILLS[x.k].tip) + '</p><div class="row"><button class="btn btn-sm" data-act="zone" data-z="' + zi + '">Re-read ' + ZONES[zi].name + '</button><button class="btn btn-sm btn-go" data-act="practice" data-z="' + zi + '">Practice ' + ZONES[zi].name + '</button></div></li>';
    }).join("") + '</ol>';
  } else h += '<ol class="plan"><li><b>Finish the Quiz 2 checklist</b><p>Lessons 2-4 to 2-6 are in the coordinate plane lab, and Lesson 3-1 in the exponents lab.</p><div class="row"><a class="btn btn-sm btn-go" href="' + REVIEW + '">Quiz 2 checklist</a><a class="btn btn-sm" href="' + GRID + '">Coordinate plane</a><a class="btn btn-sm" href="' + POWER + '">Exponents</a></div></li></ol>';
  const fs = finals().slice(-8);
  if (fs.length > 1) h += '<div class="sec-title"><h2>Progress</h2><p>Your last ' + fs.length + ' Final Challenges.</p></div><div class="panel history">'
    + fs.map(a => '<div class="hcol"><b>' + a.pct + '%</b><div class="hbar" style="height:' + Math.max(6, a.pct * 1.1) + 'px"></div><span>' + fmtDate(a.t).split(",")[0] + '</span></div>').join("") + '</div>';
  h += '<div class="sec-title"><h2>Every Answer</h2></div><div class="panel answers"><details><summary>Show all ' + rep.n + ' questions with explanations</summary>'
    + rep.items.map((r, i) => '<div class="ans"><span class="mark ' + (r.ok ? "ok" : "no") + '" aria-label="' + (r.ok ? "correct" : "wrong") + '">' + (r.ok ? "✓" : "✗") + '</span><div><b>' + (i + 1) + '. ' + esc(r.text) + '</b><br><small>You: ' + esc(r.given) + ' · Answer: ' + esc(r.correct) + '</small><p>' + r.why + '</p></div></div>').join("")
    + '</details></div></div>';
  $("#scr-report").innerHTML = keep(h);
  requestAnimationFrame(() => requestAnimationFrame(() => $$("#scr-report .bar i").forEach(i => { i.style.width = i.dataset.w + "%"; })));
}

/* ---------- EVENTS ---------- */
function goHome(){ renderHome(); show("home"); setHash(""); }
const ACT = {
  home(){ goHome(); },
  zone(b){ openZone(+b.dataset.z); },
  practice(b){ startPractice(+b.dataset.z); },
  final(){ renderFinalIntro(); },
  startfinal(){ startFinal(); },
  mc(b){ chooseMC(+b.dataset.i); },
  check(){ check(); },
  hint(){ showHint(); },
  next(){ next(); },
  key(b){
    const inp = R && R.lastInput; if (!inp || inp.readOnly) return;
    const k = b.dataset.k, s = inp.selectionStart == null ? inp.value.length : inp.selectionStart, e = inp.selectionEnd == null ? s : inp.selectionEnd;
    inp.value = inp.value.slice(0, s) + k + inp.value.slice(e);
    inp.focus({preventScroll:true}); try { inp.setSelectionRange(s + k.length, s + k.length); } catch (err) {}
  },
  sound(){ S.sound = !S.sound; save(); renderSoundBtn(); if (S.sound) Sound.tap(); },
  lastreport(){ if (S.last){ renderReport(S.last); show("report"); setHash("#/report"); } },
  reset(){ if (confirm("Reset all Number Line Lab progress? On a linked device this resets it on the family's other devices too.")){ const snd = S.sound; S = fresh(); S.sound = snd; save(); $("#xpVal").textContent = 0; renderHome(); } }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b, e);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || current !== "quiz" || !R) return;
  const t = e.target;
  if (t.id === "inN" && !R.locked){ e.preventDefault(); check(); }
});
document.addEventListener("mousedown", e => { if (e.target.closest(".key")) e.preventDefault(); });
function route(){
  const [a, b] = location.hash.replace(/^#\/?/, "").split("/"), z = parseInt(b, 10) - 1;
  if (a === "zone" && ZONES[z]) openZone(z);
  else if (a === "practice" && ZONES[z]) startPractice(z);
  else if (a === "final") renderFinalIntro();
  else if (a === "report" && S.last){ renderReport(S.last); show("report"); }
  else goHome();
}
addEventListener("hashchange", route);

/* ---------- PRINT SHEET (A4; only visible when printing) ---------- */
/* fixed questions, so the printed answer key always matches */
const PS_QS = [
  {q:"Write an integer for each.", blanks:["a) 12 m below sea level", "b) a gain of 7 points", "c) 3 degrees below zero"], key:"a) −12 b) 7 c) −3"},
  {q:"Write the opposite.", blanks:["a) 9", "b) −14", "c) 0", "d) −(−6) ="], key:"a) −9 b) 14 c) 0 d) 6"},
  {q:"Circle the integers: −8, 2.5, 0, " + M("3/4") + ", 17, −1.5", key:"−8, 0 and 17"},
  {q:"Mark and label each point on the number line: A = −3, B = 2.5, C = −1 " + M("1/2") + ", D = −(−4).", fig:true, key:"A at −3; B halfway between 2 and 3; C halfway between −2 and −1; D at 4"},
  {q:"Use &lt;, &gt; or =.", blanks:["a) −7 ☐ −3", "b) −0.6 ☐ −0.65", "c) −" + M("3/4") + " ☐ −0.75", "d) 1.2 ☐ −5"], key:"a) &lt; b) &gt; c) = d) &gt;"},
  {q:"Order from least to greatest: 1.5, −2 " + M("1/4") + ", −0.5, −2, " + M("3/4") + ".", line:true, key:"−2 " + M("1/4") + ", −2, −0.5, " + M("3/4") + ", 1.5"},
  {q:"Find each absolute value.", blanks:["a) |−9|", "b) |4.5|", "c) |−2 " + M("1/3") + "|", "d) |0|"], key:"a) 9 b) 4.5 c) 2 " + M("1/3") + " d) 0"},
  {q:"Use &lt;, &gt; or =.", blanks:["a) |−6| ☐ |4|", "b) −6 ☐ |4|", "c) |−2.5| ☐ 2.5"], key:"a) &gt; b) &lt; c) ="},
  {q:"Test score changes: Ali −5, Badr +4, Saad −2, Tariq +3. a) Who had the greatest change? b) Who had the greatest increase?", line:true, key:"a) Ali: |−5| = 5 is the farthest from 0 b) Badr"},
  {q:"Lina's balance is −25 riyals and Omar's is −40 riyals. a) How much does Omar owe? b) Who owes more? Explain with absolute value.", line:true, line2:true, key:"a) 40 riyals b) Omar, because |−40| = 40 &gt; |−25| = 25"}
];
function renderPrintSheet(){
  const el = $("#printSheet"); if (!el) return;
  const head = (title, sub) => '<header class="ps-head"><div><h1>' + title + '</h1><p class="ps-sub">' + sub + '</p></div><p class="ps-meta">Class 6.3 · Quiz 2 on Sunday 8/11/2026</p></header>';
  const check = body => '<div class="ps-check"><span class="box"></span><div>' + body + '</div></div>';
  const box = (title, body) => '<div class="ps-box"><h3>' + title + '</h3>' + body + '</div>';
  const rules = [
    ["Opposites", "the opposite of 7 is −7 &nbsp;·&nbsp; −(−7) = 7 &nbsp;·&nbsp; 0 is its own opposite"],
    ["Right is greater", "−1 &gt; −2 &nbsp;·&nbsp; −0.5 &gt; −0.75 &nbsp;·&nbsp; −8 &lt; −3"],
    ["Fractions as decimals", "−" + M("3/4") + " = −0.75 &nbsp;·&nbsp; −1 " + M("2/5") + " = −1.4 &nbsp;·&nbsp; 2 " + M("1/2") + " = 2.5"],
    ["Order", "least to greatest = left to right: −3.5, −2.5, 0.4, 1.25"],
    ["Absolute value", "distance from 0, never negative: |−6.33| = 6.33 &nbsp;·&nbsp; |4| = 4 &nbsp;·&nbsp; |0| = 0"],
    ["Compare", "|−8| = 8 &gt; |5| = 5, but −8 &lt; 5 &nbsp;·&nbsp; for a negative x, |x| &gt; x"]
  ];
  el.innerHTML = keep(head("Integers, Rational Numbers and Absolute Value: Study Sheet", "enVision Mathematics, Volume 1 · Lessons 2-1 (pp. 69–74), 2-2 (pp. 75–80) and 2-3 (pp. 81–86)")
    + '<div class="ps-row"><figure class="ps-fig">' + vizAbs() + '<figcaption>−3 and 3 are opposites: the same distance from 0. Their absolute value is 3.</figcaption></figure>'
    + box("Words to know", '<ul><li><b>Integers:</b> the counting numbers, their opposites and 0: … −2, −1, 0, 1, 2 …</li>'
      + '<li><b>Opposites:</b> the same distance from 0 on opposite sides: 4 and −4.</li>'
      + '<li><b>Rational number:</b> can be written as a fraction of two integers: 6, −1, ' + M("4/5") + ', 0.5, −1.75.</li>'
      + '<li><b>Absolute value:</b> the distance from 0: |−5| = 5. Read it “the absolute value of negative 5”.</li>'
      + '<li><b>Positive</b> numbers are right of 0, <b>negative</b> ones left of 0. 0 is neither.</li></ul>') + '</div>'
    + '<h2>Key rules</h2><table class="ps-table"><tr><th>Rule</th><th>Example</th></tr>' + rules.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join("") + '</table>'
    + '<h2>One worked example per zone</h2><div class="ps-two">'
    + box("1 · Integer Island", '<p>Point D is 7 ticks left of 0, so D = <b>−7</b>. Its opposite is 7. “12 m below sea level” is <b>−12</b>.</p>')
    + box("2 · Rational Road", '<p>4 spaces between −3 and −2 make each tick 0.25, and B is 1 tick left of −2: <b>B = −2.25</b>. −' + M("3/4") + ' = −0.75 &gt; −0.8.</p>')
    + box("3 · Absolute Value Bridge", '<p>|−4| = 4 and |3| = 3, so a change of −4 is <b>greater</b> than +3. A balance of −35 riyals is a debt of <b>35 riyals</b>.</p>')
    + box("Common traps", '<ul><li>−8 is less than −3, not more.</li><li>Absolute value is never negative.</li><li>Count the spaces between integers to find a tick\'s size.</li><li>−2.25 is left of −2, not between −2 and −1.</li><li>Least to greatest: the most negative first.</li></ul>')
    + '</div>'
    + '<h2>Quiz 2 · Sunday 8/11 · Math</h2>'
    + check('<b>Lessons 2-1 to 2-3</b> (pp. 69–86): this lab.')
    + check('<b>Lessons 2-4 to 2-6</b> (pp. 89–110): the coordinate plane lab.')
    + check('<b>Lesson 3-1</b> (pp. 123–128): the exponents lab.')
    + '<section class="ps-page2">' + head("Integers, Rational Numbers and Absolute Value: Practice", "Show your work. The answer key is at the bottom: cover it while you practice.")
    + '<ol class="ps-qs">' + PS_QS.map(q => '<li>' + q.q
      + (q.blanks ? '<span class="ps-fills">' + q.blanks.map(b => '<span class="ps-fill">' + b + '<span class="ps-blank"></span></span>').join(" ") + '</span>' : "")
      + (q.fig ? '<span class="ps-nl">' + nline({lo:-5, hi:5, step:0.5, label:"A blank number line from −5 to 5 with a tick every half."}) + '</span>' : "")
      + (q.line ? '<span class="ps-line"></span>' : "") + (q.line2 ? '<span class="ps-line"></span>' : "") + '</li>').join("") + '</ol>'
    + '<div class="ps-key"><h3>Answer key</h3><ol>' + PS_QS.map(q => '<li>' + q.key + '</li>').join("") + '</ol></div></section>');
}

/* ---------- START ---------- */
$("#xpVal").textContent = S.xp;
renderSoundBtn();
route();
renderPrintSheet();
