<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Tutor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2212%22 fill=%22%2312A15E%22 stroke=%22%2314163A%22 stroke-width=%225%22/%3E%3Cpath d=%22M18 44V20h18v6H25v4h9v6h-9v8z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M40 44l4-10%22 stroke=%22%23FFD23F%22 stroke-width=%225%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;500;700;800&family=Tajawal:wght@500;700;800&display=swap">
<style>
:root{
  --ink:#14163A; --ink-2:#4A4D78; --ink-3:#8A8DB0;
  --paper:#FFFFFF; --page:#E9F7EF; --dot:rgba(20,22,58,.07);
  --sun:#FFD23F; --sun-2:#FFF3C4;
  --good:#12A15E; --good-bg:#DCF7E9; --bad:#E23D45; --bad-bg:#FFE1E2; --warn:#C77700; --warn-bg:#FFF0D1;
  --c1:#2F7DE1; --c1t:#DCEBFF; --c2:#F39200; --c2t:#FFE8C2; --c3:#9A4FE0; --c3t:#EEE0FF; --c4:#119C77; --c4t:#D2F4E8; --c5:#E23F66; --c5t:#FFDDE6;
  --col:var(--c4); --tint:var(--c4t);
  --shadow:4px 4px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink); --r:14px; --r-sm:10px;
  --display:"Bangers","Impact","Arial Black",sans-serif; --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
a{color:#1F5FB8;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.u-c1{--col:var(--c1);--tint:var(--c1t)} .u-c2{--col:var(--c2);--tint:var(--c2t)} .u-c3{--col:var(--c3);--tint:var(--c3t)} .u-c4{--col:var(--c4);--tint:var(--c4t)} .u-c5{--col:var(--c5);--tint:var(--c5t)}
.ar{font-family:"Tajawal","Segoe UI",system-ui,sans-serif;direction:rtl;text-align:right;unicode-bidi:isolate}
.ar bdi.nw{white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo-mark{font-family:var(--display);font-size:26px;letter-spacing:.05em;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg);white-space:nowrap}
.unit-chip{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:#fff;padding:4px 8px;border-radius:6px;white-space:nowrap}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--sun-2);border:2px solid var(--ink);border-radius:999px;padding:3px 12px 3px 6px;white-space:nowrap}
.xp svg{width:20px;height:20px}
.xp.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:scale(1.18)}}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:2px 2px 0 var(--ink)}
.icon-btn svg{width:22px;height:22px}
@media (max-width:520px){.unit-chip{display:none}.logo-mark{font-size:22px}}
/* narrow phones: the top bar keeps its buttons on one line (the voice button joined the sound button) */
@media (max-width:374px){.topbar-in{padding:8px 10px;gap:6px}.logo-mark{font-size:20px}.xp{padding:3px 8px 3px 4px;gap:4px}.icon-btn{width:40px;height:40px}}

/* buttons and panels */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font-weight:800;font-size:16px;line-height:1.2;box-shadow:var(--shadow-sm);text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-go{background:var(--sun)} .btn-ink{background:var(--ink);color:#fff} .btn-col{background:var(--col);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn-sm{min-height:40px;padding:6px 12px;font-size:14px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.screen{animation:enter .3s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sec-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:30px 0 12px}
.sec-title h2{font-size:34px}
.sec-title p{color:var(--ink-2);font-size:14px}
.none{color:var(--ink-2);font-size:14px}

/* home */
.hero{margin-top:20px;padding:20px;display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:center}
.hero h1{font-size:clamp(40px,7vw,62px)}
.hero h1 span{color:var(--good);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.hero p{margin-top:8px;color:var(--ink-2)}
.hero .ar{margin-top:8px;color:var(--ink);font-weight:700}
.badge{display:inline-block;margin-top:10px;padding:3px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--sun-2);font-weight:800;font-size:14px}
.badge.hot{background:var(--bad);color:#fff}
.big-progress{display:grid;gap:8px;text-align:center}
.big-progress b{font-family:var(--display);font-weight:400;font-size:64px;line-height:1}
.big-progress small{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.bar{height:20px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-right:2px solid var(--ink);transition:width .6s}
.bar i.zero{border-right:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:2px solid var(--ink);border-radius:10px;padding:8px 6px;background:var(--page);text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1}
.stat span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
@media (max-width:680px){.hero{grid-template-columns:1fr}}
.how{margin-top:14px;padding:14px 16px;display:grid;gap:8px;background:var(--sun-2)}
.how ol{margin:0;padding-inline-start:20px;display:grid;gap:2px}
.actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px}
.unit{margin-top:16px;padding:14px;display:grid;gap:10px;background:var(--tint)}
.unit-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.unit-head h3{font-size:30px;color:var(--col);-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.unit-head .pg{font-size:13px;font-weight:800;color:var(--ink-2)}
.unit-head .ar{flex:1 1 auto;font-size:15px;font-weight:700}
.unit-done{font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--good);color:#fff}
.skill{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--paper)}
.skill b{font-size:16px}
.skill .sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--ink-2)}
.dots{display:inline-flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.dots i.on{background:var(--good)}
.chip{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;border:2px solid var(--ink);background:var(--page);white-space:nowrap}
.chip.ok{background:var(--good-bg)} .chip.rev{background:var(--bad-bg)} .chip.new{background:var(--paper)}
.unit-links{display:flex;flex-wrap:wrap;gap:8px;font-size:14px}
@media (max-width:520px){.skill{grid-template-columns:1fr}.skill .btn{justify-self:start}}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.chip-unit{font-family:var(--display);font-size:20px;letter-spacing:.04em;padding:3px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--col);color:#fff;-webkit-text-stroke:.5px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.skill-title{margin-top:12px;font-size:clamp(30px,6vw,46px);color:var(--col);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.step{display:grid;gap:0;justify-items:center;padding:6px 4px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:800;font-size:13px;line-height:1.2;text-align:center}
.step small{font-family:"Tajawal",sans-serif;font-weight:700;font-size:12px;color:var(--ink-2)}
.step.now{background:var(--sun);box-shadow:var(--shadow-sm)}
.step.done{background:var(--good-bg)}
.card{margin-top:14px;padding:18px;display:grid;gap:14px}
.card h2{font-size:30px}
.en-text{font-size:19px;line-height:1.6}
.ar-text{padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--sun-2);font-size:18px;font-weight:600;line-height:1.75}
.ar-text::before{content:"بالعربي";display:inline-block;margin-inline-end:8px;padding:0 8px;border-radius:6px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;vertical-align:2px}
.card-nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.pager{font-weight:800;color:var(--ink-2);font-size:14px}
.wtable{width:100%;border-collapse:collapse;font-size:15px}
.wtable td{padding:6px 8px;border-top:2px dashed var(--ink-3);vertical-align:top}
.wtable td:first-child{font-weight:800;white-space:nowrap}
@media (max-width:440px){.wtable tr{display:block;padding:6px 0;border-top:2px dashed var(--ink-3)}.wtable td{display:block;padding:1px 4px;border-top:0}.wtable td.ar{text-align:right}}
.say-btn{border:2px solid var(--ink);border-radius:8px;background:var(--paper);padding:0 6px;font-size:13px;margin-inline-start:6px}
.think{padding:12px 14px;border:2px dashed var(--ink);border-radius:12px;background:var(--page)}
.think h4{margin:0 0 6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.think ol{margin:0;padding-inline-start:20px;display:grid;gap:4px}

/* questions */
.q-card{margin-top:14px;padding:18px;display:grid;gap:14px}
.q-kicker{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.q-text{font-size:20px;line-height:1.5;font-weight:500}
.q-ctx .q-sent{font-size:19px;line-height:1.6;padding:10px 14px;border-left:6px solid var(--col);background:var(--tint);border-radius:0 10px 10px 0}
.q-ctx b,.q-sent b{background:var(--sun-2);padding:0 4px;border-radius:5px;box-shadow:inset 0 -3px 0 var(--sun)}
.blank{display:inline-block;min-width:5ch;margin:0 2px;padding:0 6px;border-bottom:3px solid var(--ink);background:var(--sun-2);border-radius:6px 6px 0 0;font-weight:800;color:var(--ink-2);text-align:center}
.passage{padding:12px 16px;border-left:6px solid var(--col);background:var(--tint);border-radius:0 10px 10px 0;font-size:17px;line-height:1.7}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:420px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:54px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:600;font-size:17px;line-height:1.35;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.opt:hover:not([disabled]){transform:translate(-1px,-1px)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--page)}
.opt .ar{flex:1;font-size:18px}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-bg)} .opt.right .k{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad-bg);animation:shake .4s} .opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.toks{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:19px}
.toks.lines{flex-direction:column;align-items:stretch}
.tok{padding:6px 10px;min-height:44px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font-size:19px;font-weight:600;box-shadow:2px 2px 0 var(--ink)}
.toks.lines .tok{text-align:left;font-size:16px}
.tok.bold{background:var(--sun-2);font-weight:800;text-decoration:underline 3px var(--sun)}
.tok.right{background:var(--good-bg);border-color:var(--good)} .tok.wrong{background:var(--bad-bg);animation:shake .4s}
.tok[disabled]{cursor:default}
.tok-end{font-size:22px;font-weight:800}
.ord-ans{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:2px dashed var(--ink-3);border-radius:12px;background:var(--page)}
.ord-ans .tok{background:var(--sun-2)}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px}
.hint-box{padding:10px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--sun-2)}
.fb{display:grid;gap:8px;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;animation:slideUp .3s ease-out}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb .burst{font-family:var(--display);font-size:30px;line-height:1;transform:rotate(-3deg);transform-origin:left;-webkit-text-stroke:1px var(--ink)}
.fb.ok .burst{color:var(--good)} .fb.no .burst{color:var(--bad)}
.fb .rule{padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);display:grid;gap:6px}
.fb .rule h4{margin:0;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.fb .rule .ar{font-size:16px;font-weight:600}
.fb .row{justify-content:flex-end}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.run-top{display:grid;gap:8px;margin-top:16px}
.run-top .row{justify-content:space-between}
.run-name{font-family:var(--display);font-size:26px;letter-spacing:.04em}
.counter{font-weight:800;font-variant-numeric:tabular-nums}
.progress{height:14px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.progress i{display:block;height:100%;background:var(--sun);border-right:2px solid var(--ink);transition:width .4s}
.streak{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800}
.streak .dots i{width:22px;height:22px}
.letter{padding:14px 16px;border:2px solid var(--ink);border-radius:10px;background:#FFFDF6;font-size:16px;line-height:1.5;display:grid;gap:8px}
.letter .lt-head,.letter .lt-close,.letter .lt-sign{justify-self:end;text-align:left}
.letter .lt-body p{margin:0 0 6px;text-indent:1.5em}
.letter .hl{outline:3px solid var(--bad);outline-offset:3px;border-radius:6px;background:var(--sun-2)}

/* results */
.res-head{margin-top:16px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.res-num{font-family:var(--display);font-size:72px;line-height:1;color:var(--col);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
@media (max-width:560px){.res-head{grid-template-columns:1fr;text-align:center;justify-items:center}}
.bars{padding:16px;display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:8px 12px;align-items:center}
.bar-row .bar i{background:var(--col)}
.bar-label{font-weight:700;line-height:1.25}
.bar-label small{display:block;font-weight:500;font-size:12px;color:var(--ink-2)}
.pct{font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:560px){.bar-row{grid-template-columns:1fr auto}.bar-row .bar{grid-column:1 / -1;grid-row:2}}
.answers{padding:6px 16px 16px}
.answers summary{cursor:pointer;font-weight:800;padding:10px 0}
.ans{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:2px dashed var(--ink-3);font-size:14px}
.ans .mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;color:#fff}
.ans .mark.ok{background:var(--good)} .ans .mark.no{background:var(--bad)}
.copy-area{width:100%;min-height:150px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--ink);border-radius:10px;padding:10px;background:var(--page);color:var(--ink)}
.celebrate{margin-top:16px;padding:26px 18px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--good-bg)}
.celebrate .big{font-family:var(--display);font-size:clamp(52px,12vw,84px);line-height:1;color:var(--good);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);animation:zoomIn .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes zoomIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.xp-float{position:fixed;z-index:60;font-family:var(--display);font-size:30px;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);text-shadow:2px 2px 0 var(--ink);pointer-events:none;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{transform:translate(-50%,-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){.screen,.opt,.tok,.fb,.celebrate .big,.xp.bump{animation:none!important}.bar i,.progress i{transition:none!important}}

/* print: a rules sheet */
.print-sheet{display:none}
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff!important;background-image:none!important;color:#000}
  body{font-size:9.5pt;line-height:1.35}
  .topbar,main.wrap,#fx,#live{display:none!important}
  .print-sheet{display:block!important}
  *,*::before,*::after{animation:none!important;transition:none!important;box-shadow:none!important;text-shadow:none!important}
  .ps-head{border-bottom:.75pt solid #999;padding-bottom:4pt;margin-bottom:6pt}
  .ps-head h1{font-size:16pt;color:#000}
  .ps-head p{font-size:9pt;color:#333;margin-top:2pt}
  .ps-unit{break-inside:avoid;margin-bottom:3pt}
  .ps-unit h2{font-size:11pt;color:#000;margin:4pt 0 1pt}
  .ps-rule{display:grid;grid-template-columns:20fr 43fr 37fr;gap:6pt;padding:1.5pt 0;border-top:.5pt solid #ccc;break-inside:avoid;font-size:8.5pt;line-height:1.28}
  .ps-rule b{font-size:8.5pt}
  .ps-rule .ar{font-size:8.5pt}
  .ps-words{width:100%;border-collapse:collapse;font-size:8.5pt;break-before:page}
  .ps-words th,.ps-words td{border:.5pt solid #999;padding:2pt 4pt;text-align:left;vertical-align:top}
  .ps-words td.ar{text-align:right}
}
</style>

/* ===== MAIN IDEA ===== */
const passageBox = sents => '<div class="passage">' + sents.map(s => esc(s)).join(" ") + "</div>";
function m1(){
  const P = pick(PASSAGES), k = pick(["topic", "main", "main", "tvm", "nb"]), ctx = passageBox(P.s);

  if (k === "main") return mc("What is the <b>main idea</b> of this passage?", P.main, [P.narrow, P.broad, P.off], `“${esc(P.narrow)}” is only one detail (too narrow). “${esc(P.broad)}” could fit almost any text (too broad). The main idea covers all the details: <b>${esc(P.main)}</b>`,
    {ctx, sig:"m1m:" + P.id, steps:["Name the topic.", "What does the writer say about it in every sentence?", `<b>${esc(P.main)}</b>`]});
  if (k === "tvm"){ const isT = Math.random() < .5, x = isT ? P.topic : P.main;
    return mc(`Is this the <b>topic</b> or the <b>main idea</b> of the passage?<br>“${esc(x)}”`, isT ? "the topic" : "the main idea", [isT ? "the main idea" : "the topic"],

  return mc(`Someone says the main idea is: “${esc(x)}”. Is it…`, right, ["too narrow: it is only one detail", "too broad: it could fit almost any text", "just right: it covers all the details"].filter(y => y !== right),
    `The main idea must cover all the details: <b>${esc(P.main)}</b>`, {ctx, sig:"m1n:" + P.id + c});
}
function m2(){
  const P = pick(PASSAGES), ctx = passageBox(P.s), stated = P.st >= 0, k = pick(stated ? ["which", "which", "si", "where"] : ["impl", "impl", "si", "where"]);

  if (k === "which"){ const others = sample(P.s.filter((s, i) => i !== P.st), 3);

    stated ? `It is stated: “${esc(P.s[P.st])}”` : `No sentence says it. Add the details together: <b>${esc(P.main)}</b>`, {ctx, sig:"m2s:" + P.id});

function m3(){

const TOWNS = [["Jeddah", "Saudi Arabia"], ["Riyadh", "Saudi Arabia"], ["Abha", "Saudi Arabia"], ["Dammam", "Saudi Arabia"], ["Dubai", "UAE"], ["Cairo", "Egypt"], ["Amman", "Jordan"], ["Muscat", "Oman"]];

function makeLetter(){

    body:["Thanks so much for the " + gift + " you gave me! I couldn’t wait to try it.", "I was so happy when I opened the box. Now I use it every day."], close:pick(CLOSINGS), sign:me.n};
}
const PARTS = ["Heading", "Greeting", "Body", "Closing", "Signature"];
function letterHTML(L, hl){

}
function w1(){
  const k = pick(["which", "which", "tap", "order", "order2", "fact", "fact"]);
  if (k === "fact") return bankQ(LETTER_FACTS, "w1f");
  const L = makeLetter();
  if (k === "which"){ const part = pick(PARTS);
    return mc("Which part of the letter is <b>highlighted</b>?", part, PARTS.filter(x => x !== part), {Heading:"The heading is your address and the date, at the top.", Greeting:"The greeting begins the letter: Dear …,", Body:"The body is the main part: one or more paragraphs.", Closing:"The closing is a short phrase that ends the letter, with a comma.", Signature:"The signature is the writer’s name."}[part],
      {ctx:letterHTML(L, part), sig:"w1w:" + part + L.sign + L.head[2]}); }

function w2(){

/* ---------- SAVED PROGRESS: english-g6-tutor-v1, synced by assets/sync.js; its xp counts towards the rewards ----------
   sk[skill] = {done: time it was understood, review: 1 after a later mistake, ok, bad, best}; seen[skill] = the last questions asked
   (short hashes), so they are not asked again soon; tests = the practice tests (summaries only); mastered = the units understood and a
   test at 80%, which the arcade (assets/arcade.js) turns into play time, once each. */
const KEY = "english-g6-tutor-v1", TZ = "Asia/Riyadh", QUIZ_DAY = "2026-11-12", STREAK = 5, REVIEW = 3, SEEN = 40;

function load(){ try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && typeof v === "object") return Object.assign(freshS(), v); } catch (e) {} return freshS(); }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const SK = id => S.sk[id] || (S.sk[id] = {done:0, review:0, ok:0, bad:0, best:0});
const $ = (s, r = document) => r.querySelector(s);
const UNIT = Object.fromEntries(UNITS.map(u => [u.id, u]));
const unitSkills = u => SKILLS.filter(s => s.unit === u);
const reduceMotion = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

const daysTo = iso => Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(todayISO() + "T00:00:00Z")) / 864e5);
function announce(t){ const l = $("#live"); if (l) l.textContent = t; }
/* Arabic text with English inside: each English run is isolated (<bdi>), so its brackets and commas stay in place */
const bidi = h => String(h).split(/(<[^>]+>)/).map(x => x.charAt(0) === "<" ? x : x.replace(/[A-Za-z][A-Za-z0-9’'\-]*(?:[ ,./:;’'()–\-]+[A-Za-z0-9][A-Za-z0-9’'\-]*)*/g, m => (m.length <= 28 ? '<bdi class="nw">' : "<bdi>") + m + "</bdi>")).join("");

/* ---------- sound, speech, confetti ---------- */
const Sound = {
  ctx:null,
  get(){ try { if (!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); } if (this.ctx.state === "suspended") this.ctx.resume(); return this.ctx; } catch (e) { return null; } },
  tone(f, at, dur, type, vol){ const c = this.get(); if (!c) return; try { const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
    o.type = type || "triangle"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05); } catch (e) {} },
  good(){ if (S.sound) { this.tone(660, 0, .15); this.tone(990, .1, .25); } },
  bad(){ if (S.sound) { this.tone(196, 0, .28, "square", .05); this.tone(147, .12, .3, "square", .05); } },
  win(){ if (S.sound) [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .11, .3)); },

};
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
/* the reading voice (assets/voice.js): the clearest English voice on this device, sentence by sentence */
function speak(text){ if (!canSpeak) return; if (window.MonmonVoice) { MonmonVoice.speak(text, {lang: "en", rate: .85}); return; } try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = .85; speechSynthesis.speak(u); } catch (e) {} }
const FX = (() => {
  const cv = $("#fx"), ctx = cv && cv.getContext ? cv.getContext("2d") : null; let parts = [], raf = 0;
  const COLS = ["#FFD23F", "#2F7DE1", "#F39200", "#9A4FE0", "#119C77", "#E23F66"];
  function size(){ if (!cv) return; const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; }
  size(); addEventListener("resize", size);
  function tick(){ const d = window.devicePixelRatio || 1; ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life < p.max);
    parts.forEach(p => { p.life++; p.vy += .25; p.x += p.vx; p.y += p.vy; p.rot += p.vr; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - p.life / p.max); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });

    for (let i = 0; i < (n || 30); i++){ const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 7; parts.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 4, r:5 + Math.random() * 6, rot:Math.random() * 6, vr:(Math.random() - .5) * .4, c:COLS[i % COLS.length], life:0, max:55 + Math.random() * 40}); }
    if (!raf) raf = requestAnimationFrame(tick); }
  return {burstEl(el, n){ if (!el) return; const r = el.getBoundingClientRect(); burstAt(r.left + r.width / 2, r.top + r.height / 2, n); },
    party(){ for (let k = 0; k < 5; k++) setTimeout(() => burstAt(innerWidth * (.15 + Math.random() * .7), innerHeight * (.2 + Math.random() * .25), 40), k * 170); }};
})();
function addXP(n, el){

const ICON_SOUND = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#FFD23F" stroke="#14163A" stroke-width="2" stroke-linejoin="round"/><path d="M16 9q2 3 0 6M18.5 6.5q4 5.5 0 11" fill="none" stroke="#14163A" stroke-width="2" stroke-linecap="round"/></svg>';

/* ---------- a new question for a skill: never one of the last SEEN asked for it, nor one already in this round ---------- */
function freshQ(skill, used){
  const seen = S.seen[skill] || (S.seen[skill] = []);
  let q = null;
  for (let t = 0; t < 200; t++){ q = MAKE[skill](); q.h = hashS(q.sig); if (!seen.includes(q.h) && !(used && used.has(q.h))) break; }   /* small banks have rare forms: try hard for one not seen lately */
  seen.push(q.h); if (seen.length > SEEN) seen.splice(0, seen.length - SEEN);
  if (used) used.add(q.h);
  q.skill = skill;
  if (q.kind === "order"){ q.pool = q.items.map((x, i) => i); do shuffle(q.pool); while (q.pool.every((x, i) => x === i)); }

/* ---------- A ROUND: try (2 with hints) · prove (STREAK in a row) · mix (10) · test (30) ---------- */
function mixList(){
  let pool = SKILLS.filter(s => S.sk[s.id] && S.sk[s.id].done).map(s => s.id);
  if (pool.length < 3) pool = SKILLS.map(s => s.id);
  const weighted = pool.flatMap(id => status(id) === "review" ? [id, id, id] : [id]), out = [];
  while (out.length < 10){ const x = pick(weighted); if (out[out.length - 1] !== x || pool.length === 1) out.push(x); }
  return out;
}
function testList(){
  const plan = [["r1", "r1", "r2", "r2", "r3", "r3"], ["m1", "m2", "m3", pick(["m1", "m2", "m3"])], ["v1", "v1", "v1", "v2", "v2", "v2", "v3", "v3"], ["g1", "g1", "g1", "g2", "g2", "g2", "g3", "g3"], ["w1", "w1", "w2", "w3"]];
  return plan.flatMap(p => shuffle(p.slice()));
}
function startRun(mode, skill){

    need:prove ? (status(skill) === "done" || status(skill) === "review" ? REVIEW : STREAK) : 0, list:mode === "mix" ? mixList() : mode === "test" ? testList() : null};

}
function nextQ(first){

}
const dots = (k, n) => '<span class="dots">' + Array.from({length:n}, (_, i) => `<i class="${i < k ? "on" : ""}"></i>`).join("") + "</span>";

  else if (q.kind === "tap") h += `<div class="toks${q.lines ? " lines" : ""}">${q.toks.map((t, i) => `<button class="tok${q.bold === i ? " bold" : ""}" data-act="tap" data-i="${i}">${esc(t)}</button>`).join("")}${q.end && !q.lines ? `<span class="tok-end">${q.end}</span>` : ""}</div>`;

function answerMC(i, btn){

    ${ok ? "" : `<div>The answer: <b>${answerHTML(q)}</b></div>`}<div>${q.why}</div>
    ${ok || R.mode === "test" ? "" : `<div class="rule"><h4>Remember the rule</h4><div>${s.rule[0]}</div><div class="ar" lang="ar">${bidi(s.rule[1])}</div></div>`}
    ${!ok && R.mode === "prove" && R.wrong >= 3 ? '<div class="row" style="justify-content:flex-start"><button class="btn btn-sm" data-act="relearn">Explain it to me again</button></div>' : ""}
    <div class="row"><button class="btn btn-go next-btn" data-act="next">${label}</button></div></div>`;

/* ---------- RESULTS of a mixed review or a practice test ---------- */
function finishRun(){
  const R = RUN, n = R.res.length, right = R.res.filter(r => r.ok).length, pct = Math.round(right / n * 100), by = {};
  R.res.forEach(r => { const u = SKILL[r.s].unit, b = by[u] || (by[u] = [0, 0]); b[1]++; if (r.ok) b[0]++; });
  const weak = uniq(R.res.filter(r => !r.ok).map(r => r.s));
  LAST = {kind:R.mode, at:Date.now(), n, right, pct, by, weak, res:R.res};
  if (R.mode === "test"){
    S.tests.push({at:LAST.at, n, right, pct, by, weak}); if (S.tests.length > 12) S.tests.splice(0, S.tests.length - 12);
    S.best = Math.max(S.best || 0, pct); if (pct >= 80) S.mastered.test = 1;

}

  let h = `<div class="panel res-head u-${col}"><div class="res-num">${a.pct}%</div><div><div class="q-kicker">${a.kind === "test" ? "Practice test" : "Mixed review"}</div>
    <h2 style="font-size:40px">${a.pct >= 90 ? "AMAZING!" : a.pct >= 80 ? "GREAT JOB!" : a.pct >= 60 ? "GOOD WORK!" : "KEEP GOING!"}</h2><p>${a.right} of ${a.n} right. ${a.weak.length ? "The skills you missed are marked “Review me!” on the home page." : "No mistakes!"}</p>
    <p class="ar" lang="ar">${a.weak.length ? "المهارات اللي غلطت فيها صار عليها «Review me!» في الصفحة الرئيسية: راجعها وأثبتها من جديد." : "ما غلطت ولا مرة، ممتاز!"}</p>
    <div class="row" style="margin-top:10px"><button class="btn btn-go" data-act="${a.kind}">${a.kind === "test" ? "Another practice test (new questions)" : "Another mixed review"}</button><button class="btn" data-act="home">Home</button></div></div></div>`;
  h += `<div class="sec-title"><h2>By part</h2></div><div class="panel bars">`;
  UNITS.forEach(u => { const b = a.by[u.id]; if (!b) return; const p = Math.round(b[0] / b[1] * 100);
    h += `<div class="bar-row u-${u.col}"><div class="bar-label">${u.name}<small>${b[0]} of ${b[1]} right</small></div><div class="bar"><i class="${p ? "" : "zero"}" style="width:${p}%"></i></div><span class="pct">${p}%</span></div>`; });
  h += "</div>";
  if (a.weak.length) h += `<div class="sec-title"><h2>Learn these again</h2><p>Each one opens the lesson.</p></div><div class="row">${a.weak.map(id => `<button class="btn btn-sm btn-go" data-act="skill" data-s="${id}">${SKILL[id].name}</button>`).join("")}</div>`;
  h += `<div class="sec-title"><h2>Every answer</h2></div><details class="panel answers"><summary>Show all ${a.n} answers</summary>${a.res.map((r, i) => `<div class="ans"><span class="mark ${r.ok ? "ok" : "no"}">${r.ok ? "✓" : "✗"}</span><div><small>${i + 1}. ${esc(SKILL[r.s].name)}</small><div>${esc(r.p)}</div><div>${r.ok ? "" : "Your answer: <b>" + esc(r.g) + "</b> · "}Correct: <b>${esc(r.c)}</b></div></div></div>`).join("")}</details>`;
  h += `<div class="sec-title"><h2>For a parent</h2></div><div class="panel" style="padding:14px;display:grid;gap:10px"><textarea class="copy-area" id="copyText" readonly aria-label="Summary">${esc(reportText(a))}</textarea>
    <div class="row"><button class="btn btn-sm btn-go" data-act="copy">Copy the summary</button><span class="none" id="copyNote"></span></div></div>`;
  sec.innerHTML = h;
}

/* ---------- print: the rules of every skill, then the 20 words ---------- */
function buildPrint(){
  let h = '<header class="ps-head"><h1>English Quiz 2: the rules</h1><p>Thursday 12 November · reading, main idea, vocabulary Unit 4, grammar 7.1–7.3, friendly letter</p></header>';
  UNITS.forEach(u => { h += `<section class="ps-unit"><h2>${u.name} (${u.pages})</h2>` + unitSkills(u.id).map(s => `<div class="ps-rule"><b>${s.name}</b><span>${s.rule[0]}</span><span class="ar" lang="ar">${bidi(s.rule[1])}</span></div>`).join("") + "</section>"; });
  h += '<table class="ps-words"><thead><tr><th>Word</th><th>Meaning</th><th>بالعربي</th></tr></thead><tbody>' + VALL.map(w => `<tr><td><b>${w}</b></td><td>${esc(VW[w].short)}</td><td class="ar" lang="ar">${esc(VW[w].ar)}</td></tr>`).join("") + "</tbody></table>";
  $("#printSheet").innerHTML = h;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.act){
    case "home": RUN = null; L = null; $("#scr-lesson").innerHTML = ""; $("#scr-run").innerHTML = ""; renderHome(); show("home"); break;
    case "sound": S.sound = !S.sound; save(); renderSound(); Sound.tap(); break;
    case "skill": openSkill(d.s); break;
    case "step": L.step = +d.i; L.card = 0; if (L.step === 1) L.ex = null; RUN = null; renderLesson(); window.scrollTo(0, 0); break;
    case "card": L.card = Math.max(0, +d.i); renderLesson(); break;
    case "another": L.ex = null; renderLesson(); break;
    case "hint": { const hb = RUN && $(RUN.el + " .hint-box"); if (hb){ hb.hidden = false; b.disabled = true; } break; }
    case "ans": answerMC(+d.i, b); break;
    case "tap": answerTap(+d.i, b); break;
    case "ord": ordTap(+d.i); break;
    case "ordundo": if (RUN && !RUN.locked){ RUN.ord.pop(); ordDraw(); } break;
    case "ordcheck": ordCheck(b); break;
    case "next": onNext(); break;
    case "relearn": L.step = 0; L.card = 0; RUN = null; renderLesson(); window.scrollTo(0, 0); break;
    case "mix": L = null; $("#scr-lesson").innerHTML = ""; startRun("mix"); break;
    case "test": L = null; $("#scr-lesson").innerHTML = ""; startRun("test"); break;
    case "say": speak(d.t); break;
    case "copy": { const ta = $("#copyText"), note = $("#copyNote"); const fb = () => { ta.focus(); ta.select(); note.textContent = "Selected: copy it from your keyboard or menu."; };
      try { navigator.clipboard.writeText(ta.value).then(() => { note.textContent = "Copied!"; }, fb); } catch (err) { fb(); } break; }
  }
});
document.addEventListener("keydown", e => {
  if (!RUN || e.altKey || e.ctrlKey || e.metaKey || (e.target && e.target.tagName === "TEXTAREA")) return;
  if (e.key === "Enter" && RUN.locked){ const nb = $(RUN.el + " .next-btn"); if (nb && document.activeElement !== nb){ e.preventDefault(); nb.click(); } return; }
  if (RUN.locked || RUN.q.kind !== "mc") return;
  const k = e.key.toLowerCase(), i = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (k.length === 1 && i >= 0){ const o = $(RUN.el).querySelectorAll(".opt")[i]; if (o) o.click(); }
});
/* another device's progress arrived: take it, and redraw the home page in place */
window.addEventListener("monmon-sync", e => {
  const mine = S; S = load(); S.sound = mine.sound;
  $("#xpVal").textContent = S.xp;
  if (current === "home") renderHome();
  e.preventDefault();
});

$("#xpVal").textContent = S.xp;
renderSound();
renderHome();
buildPrint();
</script>
</body></html>
