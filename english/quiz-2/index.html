<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Quiz 2 Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2212%22 fill=%22%23FFDDE6%22 stroke=%22%2314163A%22 stroke-width=%225%22/%3E%3Cpath d=%22M18 46V18h10a8 8 0 0 1 0 16h-10M34 46l12-28 12 28M38 37h16%22 fill=%22none%22 stroke=%22%23E23F66%22 stroke-width=%225%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#14163A; --ink-2:#4A4D78; --ink-3:#8A8DB0;
  --paper:#FFFFFF; --page:#E4F2FF; --dot:rgba(20,22,58,.07);
  --sun:#FFD23F; --sun-2:#FFF3C4;
  --good:#12A15E; --good-bg:#DCF7E9;
  --bad:#E23D45; --bad-bg:#FFE1E2;
  --tip:#C77700; --tip-bg:#FFF0D1;
  --col:#E23F66; --tint:#FFDDE6;
  --shadow:4px 4px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --r:14px; --r-sm:10px;
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0}
:focus-visible{outline:3px solid #2F7DE1;outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.p-read{--col:#E23F66;--tint:#FFDDE6} .p-idea{--col:#F39200;--tint:#FFE8C2} .p-vocab{--col:#9A4FE0;--tint:#EEE0FF}
.p-gram{--col:#2F7DE1;--tint:#DCEBFF} .p-write{--col:#119C77;--tint:#D2F4E8} .p-test{--col:#E23D45;--tint:#FFE1E2}

.topbar{background:var(--paper);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--display);font-size:28px;letter-spacing:.05em;color:#FF8FB0;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg);white-space:nowrap;line-height:1.2}
.chip{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:#fff;padding:4px 8px;border-radius:6px;white-space:nowrap}
.xp{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--sun-2);border:2px solid var(--ink);border-radius:999px;padding:2px 11px;white-space:nowrap}
.spacer{flex:1}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--sun-2);box-shadow:2px 2px 0 var(--ink);text-decoration:none;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:800;text-decoration:none;box-shadow:var(--shadow-sm);text-align:center;line-height:1.25}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.go{background:var(--sun)}
.btn.ink{background:var(--ink);color:#fff}
.btn.sm{min-height:40px;padding:5px 12px;font-size:15px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.hero{margin-top:20px;padding:18px;display:grid;gap:12px;border-inline-start:12px solid var(--col)}
.hero h1{font-size:clamp(34px,7vw,52px)}
.hero .sub{color:var(--ink-2);font-weight:700}
.badge{font-size:13px;font-weight:800;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--sun-2);white-space:nowrap}
.badge.hot{background:var(--bad);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:2px solid var(--ink);border-radius:var(--r-sm);padding:8px;background:var(--page);text-align:center;display:grid}
.stat b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;font-weight:700;color:var(--ink-2)}
.sec{margin-top:30px}
.sec-head{margin-bottom:12px;display:grid;gap:2px}
.sec-head h2{font-size:36px}
.sec-head p{color:var(--ink-2);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.tile{padding:14px;display:grid;gap:8px;border:3px solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow-sm);border-inline-start:10px solid var(--col)}
.tile b{font-size:18px;line-height:1.3}
.tile span{font-size:14px;color:var(--ink-2);font-weight:600}
.test-cta{margin-top:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--sun-2)}
.test-cta p{flex:1 1 260px;font-weight:600}

/* lessons */
.part{scroll-margin-top:12px}
.part-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.part-head h2{font-size:36px;color:var(--col);-webkit-text-stroke:.6px var(--ink)}
.part-head span{font-size:14px;font-weight:700;color:var(--ink-2)}
.card{padding:16px;display:grid;gap:10px;border-inline-start:10px solid var(--col);scroll-margin-top:12px}
.card + .card{margin-top:12px}
.card h3{font-size:26px}
.card h4{margin:0;font-size:16px;font-weight:800}
.card ul,.card ol{padding-inline-start:22px;display:grid;gap:4px}
.big-idea{border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--tint);padding:8px 12px;font-weight:700}
.facts{display:grid;gap:6px}
.facts div{display:grid;grid-template-columns:150px 1fr;gap:10px;padding-bottom:6px;border-bottom:1px dashed var(--ink-3)}
.facts div:last-child{border-bottom:0}
.facts dt,.facts b.k{font-weight:800;color:var(--col)}
.words-mini{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.words-mini p{border:2px solid var(--ink);border-radius:var(--r-sm);padding:6px 10px;background:var(--page);font-size:15px}
details.think{border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);padding:4px 12px}
details.think summary{font-weight:700;cursor:pointer;min-height:40px;padding-block:6px}
details.think p{padding:2px 0 10px;color:var(--ink-2)}
.passage{border-inline-start:5px solid var(--col);background:var(--tint);border-radius:0 10px 10px 0;padding:10px 14px;font-size:16px;line-height:1.7}
.gtable{width:100%;border-collapse:collapse;font-size:15px}
.gtable th,.gtable td{border:2px solid var(--ink);padding:6px 8px;text-align:start;vertical-align:top}
.gtable th{background:var(--tint)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.word{padding:12px 14px;display:grid;gap:6px;align-content:start;scroll-margin-top:12px;border-inline-start:8px solid var(--col)}
.word h3{font-size:28px;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.word h3 small{font-family:var(--body);font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:0}
.word .say{margin-inline-start:auto;width:36px;height:36px;border:2px solid var(--ink);border-radius:8px;background:var(--tint);display:grid;place-items:center;padding:0}
.word .say svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.word .m{font-weight:700}
.word .sa{font-size:14px;color:var(--ink-2)}
.word .ex{font-size:14.5px;font-style:italic}
.letter{background:#FFFDF6;border:2px solid var(--ink);border-radius:var(--r-sm);padding:14px 16px;display:grid;gap:10px;font-size:16px;line-height:1.7;background-image:repeating-linear-gradient(transparent 0 26px,rgba(47,125,225,.12) 26px 27px)}
.letter .lp{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start}
.letter .lp > span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--col);border-radius:6px;padding:2px 6px;justify-self:start;margin-top:4px}
.letter .lp.right p{text-align:start}
.letter .body p + p{margin-top:8px}
.marks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.marks div{border:2px solid var(--ink);border-radius:var(--r-sm);padding:8px;background:var(--paper);display:grid;gap:2px}
.marks b{font-size:20px}
.marks span{font-size:13px;font-weight:700;color:var(--ink-2)}

/* the letter checker */
.checker{padding:16px;display:grid;gap:12px;border-inline-start:10px solid var(--col);scroll-margin-top:12px}
.prompt{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:2px dashed var(--ink);border-radius:var(--r-sm);padding:8px 12px;background:var(--tint)}
.prompt p{flex:1 1 240px;font-weight:700}
.checker textarea{width:100%;min-height:300px;border:3px solid var(--ink);border-radius:12px;padding:12px;font-size:17px;line-height:1.6;background:#fff;resize:vertical}
.checker .hint{font-size:14px;color:var(--ink-2)}
.report{display:grid;gap:10px}
.rgroup{border:2px solid var(--ink);border-radius:var(--r-sm);padding:10px 12px;display:grid;gap:6px;background:var(--paper)}
.rgroup h4{margin:0;font-size:15px;font-weight:800;display:flex;justify-content:space-between;gap:8px}
.ritem{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:15px}
.ritem i{font-style:normal;font-weight:800;text-align:center}
.ritem.ok i{color:var(--good)} .ritem.no i{color:var(--bad)} .ritem.tip i{color:var(--tip)}
.ritem.no{background:var(--bad-bg);border-radius:6px} .ritem.tip{background:var(--tip-bg);border-radius:6px}
.verdict{border:3px solid var(--ink);border-radius:var(--r-sm);padding:10px 14px;font-weight:800}
.verdict.ok{background:var(--good-bg)} .verdict.no{background:var(--tip-bg)}

/* practice */
.run{margin-top:20px;padding:16px;display:grid;gap:14px;border-inline-start:10px solid var(--col)}
.run-top{display:flex;align-items:center;gap:10px}
.run-top b{font-size:17px}
.counter{margin-inline-start:auto;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.progress{height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--page);overflow:hidden}
.progress i{display:block;height:100%;background:var(--col);transition:width .3s}
.q-part{font-size:13px;font-weight:800;color:var(--col);text-transform:uppercase;letter-spacing:.06em}
.q-text{font-size:20px;font-weight:600;line-height:1.6}
.q-text i{font-weight:500}
.q-text .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--ink)}
.q-text small{display:block;margin-top:4px;font-size:15px;color:var(--ink-2);font-weight:600}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:var(--shadow-sm);font-weight:600;text-align:start;font-size:17px;line-height:1.35}
.opt .k{display:grid;place-items:center;width:30px;height:30px;flex:none;border:2px solid var(--ink);border-radius:8px;background:var(--tint);font-weight:800}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-size:20px;min-height:60px}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px 12px;align-items:center;padding:8px 10px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--paper)}
.mrow.right{background:var(--good-bg);border-color:var(--good)}
.mrow.wrong{background:var(--bad-bg);border-color:var(--bad)}
.mrow b{font-weight:700}
.mrow select{width:100%;min-height:46px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:4px 8px;font-weight:600;font-size:16px}
.mrow .fix{grid-column:1 / -1;font-size:14px;font-weight:700;color:var(--good)}
.typein input{width:100%;min-height:50px;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-size:19px;font-weight:600;background:#fff}
.fb{border:3px solid var(--ink);border-radius:var(--r-sm);padding:10px 14px;display:grid;gap:6px}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb .burst{font-family:var(--display);font-size:26px;letter-spacing:.04em}
.fb .why{font-size:16px}
.peek{border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);padding:4px 12px}
.peek summary{font-weight:800;color:#1F5FB8;cursor:pointer;min-height:40px;padding-block:6px}
.peek-in{display:grid;gap:8px;padding:2px 0 10px;font-size:15px}
.peek-in ul{padding-inline-start:20px;display:grid;gap:4px}
.peek-in .gtable{font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.result{margin-top:20px;padding:18px;display:grid;gap:12px;text-align:center}
.result .big{font-family:var(--display);font-size:56px;letter-spacing:.03em;line-height:1.1}
.result .big small{font-family:var(--body);font-size:20px;color:var(--ink-2)}
.parts5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.miss-list{display:grid;gap:10px;margin-top:12px}
.miss{padding:10px 14px;display:grid;gap:4px;text-align:start}
.miss .q{font-weight:600}
.miss .a{font-size:15px;color:var(--ink-2);font-weight:700}
.miss a{font-weight:800;color:#1F5FB8}
.foot{margin-top:28px;font-size:14px;color:var(--ink-2);display:grid;gap:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:620px){.marks{grid-template-columns:repeat(2,1fr)}.parts5{grid-template-columns:repeat(3,1fr)}.words-mini{grid-template-columns:1fr}.facts div{grid-template-columns:1fr;gap:2px}}
@media (max-width:520px){.chip{display:none}.logo{font-size:24px}.mrow{grid-template-columns:1fr}.q-text{font-size:18px}.stat b{font-size:21px}.letter .lp{grid-template-columns:1fr;gap:2px}.sec-head h2,.part-head h2{font-size:32px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* print, 3 pages: a study sheet, the word list with the model letter, then a practice test with its answer key */
.print-sheet{display:none}
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff!important}
  body{background-image:none!important;color:#000;font-size:9.3pt;line-height:1.4}
  .topbar,main{display:none!important}
  .print-sheet{display:block}
  .print-sheet h1,.print-sheet h2,.print-sheet h3{font-family:var(--body);font-weight:800;letter-spacing:0}
  .ps-head{display:flex;justify-content:space-between;align-items:baseline;gap:8pt;border-bottom:1.5pt solid #000;padding-bottom:3pt;margin-bottom:5pt}
  .ps-head h1{font-size:14pt}
  .ps-head p{font-size:9pt;font-weight:700}
  .ps-cols{display:grid;grid-template-columns:1fr 1fr;gap:6mm;align-items:start}
  .ps-b{break-inside:avoid;margin-bottom:5pt}
  .ps-b h3{font-size:10.5pt;border-bottom:.75pt solid #999;margin-bottom:2pt}
  .ps-b ul,.ps-b ol{padding-inline-start:12pt}
  .ps-b li{margin-bottom:1pt}
  .ps-page{break-before:page}
  .ps-words{width:100%;border-collapse:collapse;font-size:8.8pt}
  .ps-words th,.ps-words td{border:.75pt solid #888;padding:2.5pt 4pt;text-align:start;vertical-align:top}
  .ps-words th{background:#eee}
  .ps-letter{margin-top:8pt;border:1pt solid #000;padding:6pt 9pt;font-size:9.5pt;line-height:1.5}
  .ps-letter p + p{margin-top:4pt}
  .ps-q{margin-bottom:6pt;break-inside:avoid}
  .ps-q h2{font-size:10.5pt;margin-bottom:3pt}
  .ps-q ol{padding-inline-start:16pt}
  .ps-q li{margin-bottom:3pt}
  .ps-bank{border:.75pt solid #000;padding:3pt 6pt;margin-bottom:4pt;font-weight:700;word-spacing:6pt}
  .ps-pass{border-inline-start:2pt solid #000;padding-inline-start:6pt;margin-bottom:4pt;font-style:italic}
  .ps-q .o{display:inline-block;margin-inline-end:12pt}
  .ps-key{border-top:1pt solid #000;margin-top:6pt;padding-top:3pt;font-size:8.5pt}
  .ps-key h3{font-size:10pt}
}
</style>
</head>

<script src="../../assets/site-nav.js" data-root="../../"></script>

<script>
"use strict";
/* English, Quiz 2 of Term 1 (Thursday 12 November): the five parts in the assessment outline (StudySync "Individual Twin",
   the central or main idea, Vocabulary Workshop Level A Unit 4, grammar Lessons 7.1–7.3, a friendly letter), each with a
   lesson and practice, a 30-question practice test across all five, and a letter checker for the writing task. The outline
   gives marks only for the letter (3.5), so the practice test is counted out of 30 questions, not given a mark. Questions,
   sentences, passages and the model letter are written for this page; the books' texts are not copied.
   Progress (xp, the best practice test) is saved in english-g6-quiz2-v1, synced by assets/sync.js; its xp counts towards
   the rewards. The letter being written stays on this device only (english-g6-quiz2-letter is not synced).
   review/quiz-2 links each part here (#p-read, #p-idea, #p-vocab, #p-gram, #p-write). */
const KEY = "english-g6-quiz2-v1", DRAFT = "english-g6-quiz2-letter", TZ = "Asia/Riyadh", QUIZ_DAY = "2026-11-12";

const PARTS = [
  {id:"read", name:"Reading: “Individual Twin”", short:"Reading", src:"StudySync, personal statement", pg:"42–44"},
  {id:"idea", name:"Central or Main Idea", short:"Main idea", src:"Reading skill", pg:"45–46"},
  {id:"vocab", name:"Vocabulary: Level A, Unit 4", short:"Vocabulary", src:"Vocabulary Workshop", pg:"52–58"},
  {id:"gram", name:"Grammar: Nouns and Pronouns", short:"Grammar", src:"Chapter 7, Lessons 7.1–7.3", pg:"141–146"},
  {id:"write", name:"Writing: a Friendly Letter", short:"Letter", src:"Writing", pg:"46–49"}
];
const PART = Object.fromEntries(PARTS.map(p => [p.id, p]));

/* ---------- READING: "Individual Twin" ---------- */
const READ = {
  facts:[
    ["Genre", "A <b>personal statement</b>: a short essay in which the writer explains who he is. It is written in the <b>first person</b> (“I”)."],
    ["Writer", "Zachary Walsdorf (2018). He grew up in San Antonio with his <b>twin sister, Rachel</b>."],
    ["Beginning", "As young children the twins were very close and even dressed alike."],

/* ---------- HELPERS ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => String(s).replace(/<[^>]+>/g, "");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const rand = a => a[Math.floor(Math.random() * a.length)];
function todayISO(){ try { return new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } }
const dayDiff = (a, b) => Math.round((Date.UTC(...b.split("-").map((x, i) => i === 1 ? x - 1 : +x)) - Date.UTC(...a.split("-").map((x, i) => i === 1 ? x - 1 : +x))) / 864e5);
function announce(t){ const l = $("#live"); if (l){ l.textContent = ""; setTimeout(() => { l.textContent = t; }, 40); } }
const ICON_SAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>';

/* ---------- VOCABULARY QUESTIONS (made at random from WORDS) ---------- */
function apart(x){ const g = GROUPS.find(g => g.includes(x.w)) || []; return WORDS.filter(y => y !== x && !g.includes(y.w)); }
function vocabQ(kind, x){
  const pool = apart(x), l = "w:" + x.w, card = x.w + " (" + x.pos + "): " + x.m + ".";
  if (kind === "meaning") return {p:"vocab", l, q:"What does <b>" + x.w + "</b> mean?", o:[x.m].concat(pick(pool, 2).map(y => y.m)), w:card};
  if (kind === "word") return {p:"vocab", l, q:"Which word means “" + x.m + "”?", o:[x.w].concat(pick(pool, 2).map(y => y.w)), w:card};
  if (kind === "syn"){ const r = rand(x.syn); return {p:"vocab", l, q:"Which word or phrase is a <b>synonym</b> of <b>" + x.w + "</b> (nearly the same meaning)?", o:[r].concat(pick(pool, 2).map(y => rand(y.syn))), w:card + " Synonyms: " + x.syn.join(", ") + "."}; }
  if (kind === "ant"){ const r = rand(x.ant); return {p:"vocab", l, q:"Which word or phrase is most nearly the <b>opposite</b> of <b>" + x.w + "</b>?", o:[r].concat(pick(pool.filter(y => y.ant), 2).map(y => rand(y.ant))), w:card + " Antonyms: " + x.ant.join(", ") + "."}; }
  const s = rand(x.s), blank = s[0].replace("___", '<span class="blank" aria-label="blank"></span>'), full = s[0].replace("___", x.w);
  if (kind === "type") return {p:"vocab", l, type:"type", q:"Type the Unit 4 word that completes the sentence:<br>" + blank + "<small>Hint: it means “" + x.m + "”.</small>", a:x.w, w:full};
  const same = pool.filter(y => (POS[s[1]] || []).includes(y.w) && !(s[2] || []).includes(y.w));
  return {p:"vocab", l, q:"Choose the word that best completes the sentence:<br>" + blank, o:[x.w].concat(pick(same, 2).map(y => y.w)), w:full + " (" + x.w + ": " + x.m + ")"};
}
function vocabSet(n, withType){
  const kinds = ["meaning", "word", "sentence", "sentence", "syn", "ant", "meaning", "sentence", "word", "syn"];
  return pick(WORDS, n).map((x, i) => { let k = kinds[i % kinds.length]; if (k === "ant" && !x.ant) k = "sentence"; if (withType && i === n - 1) k = "type"; return vocabQ(k, x); });
}
function vocabMatch(){ return pick(WORDS, 4).map(x => ({a:x.w, b:x.m, l:"w:" + x.w})); }

/* ---------- ROUNDS ----------
   A round is a list of steps: {type:"mc"|"tf"|"type"|"match", …}. Every step remembers its part, for the test's breakdown. */
const tag = (a, p) => a.map(q => Object.assign({p}, q, {l:q.l || p}));
const mcStep = q => ({type:"mc", q, order:shuffle(q.o.map((o, i) => i))});
const tfStep = q => ({type:"tf", q});
const qStep = q => q.type === "type" ? {type:"type", q} : q.a === true || q.a === false ? tfStep(q) : mcStep(q);
const matchStep = (ps, p) => ({type:"match", ps, p, right:shuffle(ps.map((x, i) => i))});
const B = {read:{mc:tag(READ_MC, "read"), tf:tag(READ_TF, "read")}, idea:{mc:tag(IDEA_MC, "idea"), tf:tag(IDEA_TF, "idea")},
  gram:{mc:tag(GRAM_MC, "gram"), tf:tag(GRAM_TF, "gram")}, write:{mc:tag(WRITE_MC, "write"), tf:tag(WRITE_TF, "write")}};
const draw = (part, mc, tf) => shuffle(pick(B[part].mc, mc).concat(pick(B[part].tf, tf))).map(qStep);
const MODES = {
  read:{name:"Reading: “Individual Twin”", p:"read", steps:() => draw("read", 6, 2)},
  idea:{name:"Central or main idea", p:"idea", steps:() => draw("idea", 4, 2)},
  vocab:{name:"Vocabulary, Unit 4", p:"vocab", steps:() => vocabSet(8, true).map(qStep).concat([matchStep(vocabMatch(), "vocab")])},
  gram:{name:"Grammar 7.1–7.3", p:"gram", steps:() => draw("gram", 8, 2)},
  write:{name:"Friendly letter", p:"write", steps:() => [matchStep(WRITE_MATCH.map(x => Object.assign({l:"write"}, x)), "write")].concat(draw("write", 4, 2))},
  test:{name:"Practice test", p:"test", steps:() => draw("read", 4, 2).concat(draw("idea", 3, 1), vocabSet(8, true).map(qStep), draw("gram", 7, 1), draw("write", 3, 1))}
};
const TEST_N = {read:6, idea:4, vocab:8, gram:8, write:4};
const PART_LABEL = {mc:"Choose the best answer", tf:"True or false?", type:"Type the word", match:"Match each one"};
let R = null;
function start(mode){ R = {mode, steps:MODES[mode].steps(), i:0, res:[], locked:false}; renderStep(); window.scrollTo(0, 0); }
const stepPart = st => st.type === "match" ? st.p : st.q.p;

function renderStep(){
  const st = R.steps[R.i], n = R.steps.length, p = stepPart(st);
  R.locked = false;
  let body = "";
  if (st.type === "mc") body = (st.q.pass ? '<p class="passage">' + esc(PASSAGES[st.q.pass]) + '</p>' : "") + '<p class="q-text" id="qtext">' + st.q.q + '</p><div class="opts" role="group" aria-labelledby="qtext">'
    + st.order.map((k, i) => '<button class="opt" type="button" data-act="mc" data-k="' + k + '"><span class="k" aria-hidden="true">' + "ABCD"[i] + '</span><span>' + esc(st.q.o[k]) + '</span></button>').join("") + '</div>';
  else if (st.type === "tf") body = '<p class="q-text" id="qtext">' + esc(st.q.q) + '</p><div class="tf" role="group" aria-labelledby="qtext">'
    + '<button class="opt" type="button" data-act="tf" data-v="1">✔ True</button><button class="opt" type="button" data-act="tf" data-v="0">✖ False</button></div>';
  else if (st.type === "match") body = '<p class="q-text" id="qtext">' + (p === "vocab" ? "Match each word with its meaning." : "Match each part of the letter with an example.") + '</p><div class="match">'
    + st.ps.map((x, i) => '<div class="mrow" data-i="' + i + '"><b id="ma' + i + '">' + esc(x.a) + '</b><select data-i="' + i + '" aria-labelledby="ma' + i + '"><option value="">Choose…</option>'
      + st.right.map(j => '<option value="' + j + '">' + esc(st.ps[j].b) + '</option>').join("") + '</select></div>').join("") + '</div>'
    + '<div class="actions"><button class="btn go" type="button" data-act="checkmatch">Check</button></div>';
  else body = '<p class="q-text" id="qtext">' + st.q.q + '</p><div class="typein"><input id="typeIn" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-labelledby="qtext" placeholder="Type the word"></div>'
    + '<div class="actions"><button class="btn go" type="button" data-act="checktype">Check</button></div>';
  $("#main").innerHTML = '<section class="run panel p-' + p + '">'
    + '<div class="run-top"><button class="btn sm" type="button" data-act="home">← Page</button><b>' + esc(MODES[R.mode].name) + '</b><span class="counter">' + (R.i + 1) + ' / ' + n + '</span></div>'
    + '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + R.i + '" aria-label="Questions done"><i style="width:' + Math.round(R.i / n * 100) + '%"></i></div>'
    + '<p class="q-part">' + esc(PART[p].short) + ' · ' + PART_LABEL[st.type] + '</p>' + body + '<div id="fbBox"></div></section>';
  const f = $(".opt") || $("select") || $("#typeIn");
  if (f && window.matchMedia && matchMedia("(pointer: fine)").matches) f.focus({preventScroll:true});
}

/* ---------- ANSWERS ---------- */
function record(ok, given, right, why, l, text, p){
  R.res.push({ok, given, right, why, l, text, p, type:R.steps[R.i].type});
  if (ok) addXP(10);
}
function feedback(ok, why, l, extra){
  R.locked = true;
  const last = R.i === R.steps.length - 1;
  $("#fbBox").innerHTML = '<div class="fb ' + (ok ? "ok" : "no") + '"><span class="burst">' + (ok ? "Nice! ✔" : "Not quite ✖") + '</span>' + (extra || "")
    + '<p class="why">' + esc(why) + '</p>' + (ok ? "" : lessonPeek(l)) + '</div>'
    + '<div class="actions"><button class="btn ink" type="button" data-act="next" id="nextBtn">' + (last ? "See my result →" : "Next →") + '</button></div>';
  announce((ok ? "Correct. " : "Not quite. ") + why);
  $("#nextBtn").focus({preventScroll:true});
}
function answerMC(k){
  const st = R.steps[R.i]; if (R.locked) return;
  const ok = k === 0;
  document.querySelectorAll(".opt").forEach(b => { const bk = +b.dataset.k; b.disabled = true; b.classList.add(bk === 0 ? "right" : bk === k ? "wrong" : "dim"); });
  record(ok, st.q.o[k], st.q.o[0], st.q.w, st.q.l, strip(st.q.q), st.q.p);
  feedback(ok, st.q.w, st.q.l);
}
function answerTF(v){
  const st = R.steps[R.i]; if (R.locked) return;
  const ok = v === st.q.a;
  document.querySelectorAll(".opt").forEach(b => { const bv = b.dataset.v === "1"; b.disabled = true; b.classList.add(bv === st.q.a ? "right" : bv === v ? "wrong" : "dim"); });
  record(ok, v ? "True" : "False", st.q.a ? "True" : "False", st.q.w, st.q.l, st.q.q, st.q.p);
  feedback(ok, st.q.w, st.q.l);
}
function checkMatch(){
  const st = R.steps[R.i]; if (R.locked) return;
  const sel = [...document.querySelectorAll(".mrow select")];
  if (sel.some(s => s.value === "")){ announce("Choose an answer for each row first."); sel.find(s => s.value === "").focus(); return; }
  let right = 0;
  sel.forEach(s => {
    const i = +s.dataset.i, ok = +s.value === i, row = s.closest(".mrow");
    s.disabled = true; row.classList.add(ok ? "right" : "wrong");
    if (!ok) row.insertAdjacentHTML("beforeend", '<p class="fix">Right answer: ' + esc(st.ps[i].b) + '</p>');
    if (ok) right++;

  });

  feedback(right === st.ps.length, right + " of " + st.ps.length + " right.", miss ? miss.l : st.ps[0].l);
}

/* ---------- THE LETTER CHECKER ----------
   Looks for what the outline asks for (the date, a greeting, six complete sentences, a friendly closing, the name) and the
   commas and capitals of the lesson. It is a checklist, not a mark: the teacher marks the ideas and the handwriting. */
const MONTHS = "(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sept?|oct|nov|dec)";
const DATE_MDY = new RegExp("\\b" + MONTHS + "\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(\\s*,)?\\s*(\\d{4})\\b", "i");
const DATE_DMY = new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+" + MONTHS + "\\.?,?\\s*(\\d{4})\\b", "i");
const DATE_NUM = /\b\d{1,2}\s*[\/.-]\s*\d{1,2}\s*[\/.-]\s*\d{2,4}\b/;
const GREET = /^(dear|hi|hello|hey)\b/i;
const CLOSE = /^(your\s+(?:loving\s+|best\s+|good\s+|dear\s+)?(?:friend|pal|buddy|cousin|nephew|niece|brother|sister|son|daughter|grandson|granddaughter|student|classmate|neighbor|neighbour)|yours(?:\s+truly|\s+sincerely|\s+faithfully)?|love|lots of love|with love|best wishes|warm wishes|best|take care|talk to you soon|talk soon|see you soon|see you|bye for now|bye|all the best|cheers|hugs|miss you|regards|kind regards|best regards|sincerely|thanks again|thank you again)\b/i;
const FORMAL = /^(yours\s+sincerely|yours\s+faithfully|yours\s+truly|sincerely|regards|kind regards|best regards)\b/i;
const FRIENDLY = /\b(\w+['’](m|re|s|ve|ll|d|t)|thanks|awesome|amazing|cool|fun|wow|psyched|thrilled|excited|hilarious|can['’]t wait)\b/i;
const STIFF = /(i am writing to inform|thank you kindly|it gave me great pleasure|to whom it may concern)/i;
const UNIT4 = new RegExp("\\b(" + WORDS.map(x => x.w).join("|") + ")(s|es|d|ed|ing|ted|led)?\\b", "gi");
function sentencesOf(text){ return (text.match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g) || []).map(s => s.trim()).filter(s => /[A-Za-z]/.test(s)); }
function letterCheck(raw){
  const L = String(raw || "").replace(/\r\n?/g, "\n").split("\n").map(s => s.replace(/\s+$/, "")), T = L.map(s => s.trim());
  const idx = T.map((s, i) => s ? i : -1).filter(i => i >= 0);
  const items = [];   /* {g: rubric group, ok: "ok"|"no"|"tip", t} */
  const add = (g, ok, t) => items.push({g, ok, t});
  if (idx.length < 3) return {items:[{g:"org", ok:"no", t:"Write your letter first: the date, a greeting, at least six sentences, a closing and your name."}], pass:false, sentences:0, unit4:[]};
  /* the date, in the heading (the first three lines) */
  let dateAt = -1;
  for (const i of idx.slice(0, 3)){
    const s = T[i], m = s.match(DATE_MDY);
    if (m){ dateAt = i;
      add("org", "ok", "Date: " + s);
      if (!m[3]) add("lang", "no", "Put a comma between the day and the year: " + m[1][0].toUpperCase() + m[1].slice(1).toLowerCase() + " " + m[2] + ", " + m[4] + ".");
      if (m[1][0] !== m[1][0].toUpperCase()) add("lang", "no", "Begin the month with a capital letter: " + m[1][0].toUpperCase() + m[1].slice(1) + ".");
      break; }
    if (DATE_DMY.test(s) || DATE_NUM.test(s)){ dateAt = i; add("org", "ok", "Date: " + s); add("lang", "tip", "In English letters the date is usually written like this: November 12, 2026."); break; }
  }
  if (dateAt < 0) add("org", "no", "Add the date at the top, for example: November 12, 2026.");
  /* the greeting */
  const gi = idx.find(i => i > dateAt && GREET.test(T[i]));
  if (gi === undefined) add("org", "no", "Start with a greeting, for example: Dear Ali,");
  else {
    add("org", "ok", "Greeting: " + T[gi]);
    if (!/,$/.test(T[gi])) add("lang", "no", "Put a comma after the greeting: " + T[gi].replace(/[.!:;]+$/, "") + ",");
    if (!/^[A-Z]/.test(T[gi])) add("lang", "no", "Begin the greeting with a capital letter: " + T[gi][0].toUpperCase() + T[gi].slice(1));
  }
  /* the closing and the name, from the end */
  const after = gi === undefined ? dateAt : gi;
  const ci = idx.slice().reverse().find(i => i > after && CLOSE.test(T[i]) && T[i].split(/\s+/).length <= 6);
  let si;
  if (ci === undefined) add("org", "no", "End with a friendly closing, for example: Your friend, or Talk to you soon,");
  else {
    const close = T[ci].split(",")[0];
    add("org", "ok", "Closing: " + T[ci]);
    if (!/,/.test(T[ci])) add("lang", "no", "Put a comma after the closing: " + T[ci].replace(/[.!:;]+$/, "") + ",");
    if (!/^[A-Z]/.test(T[ci])) add("lang", "no", "Begin the closing with a capital letter.");
    else if (/\s[A-Z]/.test(close) && !/\bI\b/.test(close)) add("lang", "tip", "Only the first word of the closing needs a capital letter: " + close[0] + close.slice(1).toLowerCase() + ",");
    if (FORMAL.test(T[ci])) add("org", "tip", "That closing sounds formal. A friendly letter uses closings like Your friend, Talk to you soon, See you soon.");
    si = idx.find(i => i > ci);
    const sameLine = T[ci].split(",").slice(1).join(",").trim();
    if (si !== undefined && T[si].split(/\s+/).length <= 4) add("org", "ok", "Signature: " + T[si]);
    else if (sameLine) { add("org", "ok", "Signature: " + sameLine); add("org", "tip", "Write your name on its own line, under the closing."); }
    else add("org", "no", "Sign your name on the line under the closing.");
  }
  /* the body: everything between the greeting and the closing */
  const from = gi !== undefined ? gi + 1 : dateAt + 1, to = ci !== undefined ? ci : idx[idx.length - 1] + 1;
  const bodyLines = L.slice(from, to), bodyText = bodyLines.map(s => s.trim()).join(" ").replace(/\s+/g, " ").trim();
  const paras = bodyLines.join("\n").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).length;
  const sents = sentencesOf(bodyText);
  const complete = sents.filter(s => s.split(/\s+/).filter(w => /[A-Za-z]/.test(w)).length >= 3 && /[.!?]["”’)]*$/.test(s) && /^["“‘(]*[A-Z]/.test(s));
  const lower = sents.filter(s => /^["“‘(]*[a-z]/.test(s)), unended = sents.filter(s => !/[.!?]["”’)]*$/.test(s));
  if (complete.length >= 6) add("ideas", "ok", complete.length + " complete sentences (the quiz asks for six).");
  else add("ideas", "no", complete.length + " complete sentence" + (complete.length === 1 ? "" : "s") + " so far. The quiz asks for at least six.");
  if (lower.length) add("lang", "no", "Begin every sentence with a capital letter: “" + lower[0].slice(0, 40) + (lower[0].length > 40 ? "…" : "") + "”");
  if (unended.length) add("lang", "no", "End every sentence with . ! or ?: “" + unended[0].slice(-40) + "”");
  if (/(^|[^A-Za-z'’])i(?=[^A-Za-z]|$)/.test(bodyText)) add("lang", "no", "Write the word I as a capital letter: I, I’m, I’ve.");
  if (paras >= 2) add("org", "ok", paras + " paragraphs in the body.");
  else if (complete.length >= 4) add("org", "tip", "Try two paragraphs: what the person did, then how it made you feel. Leave an empty line between them.");
  if (STIFF.test(bodyText)) add("ideas", "tip", "Some words sound formal. In a friendly letter, write the way you talk: “Thanks so much!”, “I’m dropping a note to say…”");
  else if (FRIENDLY.test(bodyText)) add("ideas", "ok", "Friendly, informal tone.");
  const unit4 = [...new Set((bodyText.match(UNIT4) || []).map(w => w.toLowerCase()))];
  if (unit4.length) add("ideas", "ok", "Unit 4 words used: " + unit4.join(", ") + ". Great!");
  const need = items.filter(x => x.ok === "no").length;
  return {items, pass:need === 0, sentences:complete.length, unit4, paras};
}
const RGROUPS = [["org", "Organization (1 mark): the parts in order"], ["lang", "Language accuracy (1 mark): grammar, spelling, punctuation"], ["ideas", "Ideas and content (1 mark)"]];
function hashText(s){ let h = 5381; s = String(s).replace(/\s+/g, " ").trim().toLowerCase(); for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0; return h.toString(36); }
function isModel(text){ const t = String(text).toLowerCase(); return t.includes("telescope") && t.includes("uncle khalid") && t.includes("saturn"); }
function renderReport(text){
  const r = letterCheck(text);
  let h = RGROUPS.map(([g, title]) => { const mine = r.items.filter(x => x.g === g); return mine.length ? '<div class="rgroup"><h4>' + title + '</h4>'
    + mine.map(x => '<div class="ritem ' + x.ok + '"><i aria-hidden="true">' + (x.ok === "ok" ? "✔" : x.ok === "no" ? "✖" : "💡") + '</i><span>' + esc(x.t) + '</span></div>').join("") + '</div>' : ""; }).join("");
  h += '<div class="rgroup"><h4>Check yourself</h4><div class="ritem tip"><i aria-hidden="true">💡</i><span>Ideas: did you stay on one topic and give specific details (what, where, how it felt)?</span></div>'
    + '<div class="ritem tip"><i aria-hidden="true">💡</i><span>Presentation (0.5 mark): on paper, write neatly, keep margins, and leave space between the parts.</span></div></div>';
  let verdict;
  if (r.pass && isModel(text)) verdict = '<p class="verdict no">That is the model letter. Write your own letter to earn ⭐.</p>';
  else if (r.pass){
    const hsh = hashText(text);
    if (hsh !== S.lh){ S.lh = hsh; S.letters++; addXP(30); verdict = '<p class="verdict ok">Everything the quiz asks for is there! ⭐ +30</p>'; }
    else verdict = '<p class="verdict ok">Everything the quiz asks for is there!</p>';
  } else verdict = '<p class="verdict no">Almost: fix the ✖ items, then check again.</p>';
  $("#report").innerHTML = verdict + h;
  announce(r.pass ? "Everything the quiz asks for is there." : "Some items need fixing.");
}

    + '<div class="ps-b"><h3>Reading: “Individual Twin” (StudySync, pp. 42–44)</h3><ul>' + READ.facts.map(f => '<li><b>' + f[0] + ':</b> ' + f[1] + '</li>').join("") + '</ul>'
    + '<p><b>Central idea:</b> ' + READ.central + '</p><p><b>Theme:</b> ' + READ.theme + '</p><p><b>Structure:</b> ' + READ.structure + '</p>'
    + '<p><b>Words:</b> ' + READ.words.map(w => '<i>' + w[0] + '</i> = ' + esc(w[1])).join("; ") + '</p></div>' + LETTER_PRINT + '</div><div>'
    + '<div class="ps-b"><h3>Central or main idea (pp. 45–46)</h3><ul>' + IDEA.defs.map(d => '<li><b>' + d[0] + ':</b> ' + d[1] + '</li>').join("") + '</ul><ol>' + IDEA.steps.map(s => '<li>' + s + '</li>').join("") + '</ol>'
    + '<ul>' + IDEA.notes.map(s => '<li>' + s + '</li>').join("") + '</ul></div>'
    + '<div class="ps-b"><h3>Grammar 7.1–7.3 (pp. 141–146)</h3><ul><li><b>Noun:</b> person, place, thing or idea. <b>Common</b> = any one, lowercase (city); <b>proper</b> = a specific one, capitals (Jeddah, Red Sea).</li>'
    + '<li><b>Pronoun</b> replaces a noun, its <b>antecedent</b>, and agrees with it in person and number (The players thanked their coach).</li>'
    + '<li><b>Personal:</b> I, you, he, she, it, we, they · me, him, her, us, them. <b>Possessive:</b> my, your, his, her, its, our, their · mine, yours, hers, ours, theirs (no apostrophes). <b>Indefinite:</b> everyone, nobody, both, each, few, many, several, someone…</li>'
    + '<li><b>its</b> = belonging to it · <b>it’s</b> = it is.</li><li><b>Subject pronouns</b> (I, we, you, he, she, it, they): the subject, and after is/are (The winners are Katie and she).</li>'
    + '<li><b>Object pronouns</b> (me, us, you, him, her, it, them): after an action verb or a preposition (between you and me).</li><li>Two people? Test each alone: Sara and I baked · gave Omar and me.</li></ul></div></div></div>'
    + '<section class="ps-page"><header class="ps-head"><h1>Vocabulary · Level A, Unit 4 (pp. 52–58)</h1><p>20 words</p></header><table class="ps-words"><tr><th>Word</th><th>Part of speech</th><th>Meaning</th><th>Synonyms</th><th>Antonyms</th></tr>'
    + WORDS.map(x => '<tr><td><b>' + x.w + '</b></td><td>' + x.pos + '</td><td>' + esc(x.m) + '</td><td>' + x.syn.join(", ") + '</td><td>' + (x.ant ? x.ant.join(", ") : "–") + '</td></tr>').join("") + '</table>'
    + '<div class="ps-letter"><p><b>Model friendly letter</b></p><p>' + MODEL.heading + '</p><p>' + MODEL.greeting + '</p>' + MODEL.body.map(p => '<p>' + esc(p) + '</p>').join("") + '<p>' + MODEL.closing + '<br>' + MODEL.signature + '</p></div></section>'
    + '<section class="ps-page"><header class="ps-head"><h1>Practice test</h1><p>Name: ……………………</p></header>'
    + '<div class="ps-q"><h2>A. Vocabulary: write the word from the box that completes each sentence.</h2><p class="ps-bank">' + bank.join(" · ") + '</p><ol>'
    + vw.map(x => '<li>' + esc(x.s[0][0]).replace("___", "…………………") + '</li>').join("") + '</ol></div>'
    + '<div class="ps-q"><h2>B. Grammar: circle the correct word.</h2><ol>' + gq.map(g => '<li>' + esc(g[0]) + '</li>').join("") + '</ol></div>'
    + '<div class="ps-q"><h2>C. Main idea: read, then circle the best answer.</h2><p class="ps-pass">' + esc(PASSAGES.desert) + '</p><ol>'
    + im.map(q => '<li>' + esc(q.q) + '<br>' + [q.o[1], q.o[0], q.o[2]].map((o, i) => '<span class="o">' + "abc"[i] + ') ' + esc(o) + '</span>').join("") + '</li>').join("") + '</ol></div>'
    + '<div class="ps-q"><h2>D. Letter: add the missing commas, then write the five parts in order.</h2><ol><li>Dear Uncle Khalid</li><li>November 12 2026</li><li>Your nephew</li>'
    + '<li>1 ……………… 2 ……………… 3 ……………… 4 ……………… 5 ………………</li></ol></div>'
    + '<div class="ps-key"><h3>Answers</h3><p><b>A:</b> ' + vw.map((x, i) => (i + 1) + ') ' + x.w).join(" · ") + '</p><p><b>B:</b> ' + gq.map((g, i) => (i + 1) + ') ' + esc(g[1])).join(" · ") + '</p>'
    + '<p><b>C:</b> ' + im.map((q, i) => (i + 1) + ') b ' + esc(q.o[0])).join(" · ") + '</p><p><b>D:</b> Dear Uncle Khalid, · November 12, 2026 · Your nephew, · heading, greeting, body, closing, signature</p></div></section>';
}

/* ---------- EVENTS ---------- */
let draftTimer = 0;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "start") start(b.dataset.m);
  else if (a === "mc") answerMC(+b.dataset.k);
  else if (a === "tf") answerTF(b.dataset.v === "1");
  else if (a === "checkmatch") checkMatch();
  else if (a === "checktype") checkType();
  else if (a === "next") next();
  else if (a === "say") speak(b.dataset.w);
  else if (a === "home"){ R = null; renderHome(); window.scrollTo(0, 0); }
  else if (a === "lesson"){ e.preventDefault(); R = null; renderHome(); const t = document.getElementById(anchor(b.dataset.l)); if (t) t.scrollIntoView(); }
  else if (a === "prompt"){ const p = $("#promptText"), cur = p.textContent; p.textContent = rand(PROMPTS.filter(x => x !== cur)); }
  else if (a === "checkletter") renderReport($("#letterIn").value);
  else if (a === "clearletter"){ $("#letterIn").value = ""; $("#report").innerHTML = ""; try { localStorage.removeItem(DRAFT); } catch (err) {} $("#letterIn").focus(); }
});
document.addEventListener("input", e => {
  if (e.target.id !== "letterIn") return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => { draftTimer = 0; try { localStorage.setItem(DRAFT, e.target.value); } catch (err) {} }, 400);
});
/* a letter typed just before the page closes is still kept */
window.addEventListener("pagehide", () => { const t = $("#letterIn"); if (t && draftTimer){ clearTimeout(draftTimer); draftTimer = 0; try { localStorage.setItem(DRAFT, t.value); } catch (err) {} } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "typeIn" && R && !R.locked){ e.preventDefault(); checkType(); } });
$("#printBtn").addEventListener("click", () => window.print());
/* another device's progress arrived: refresh the numbers on the home view, keeping a letter being written */
window.addEventListener("monmon-sync", e => {
  try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v) S = Object.assign(fresh(), v); } catch (err) {}
  $("#xpVal").textContent = S.xp;
  if (!R){ const stats = document.querySelectorAll(".hero .stat b"); if (stats.length === 3){ stats[0].textContent = S.best === null ? "–" : S.best + "/30"; stats[1].textContent = S.tests; stats[2].textContent = S.xp; } }
  e.preventDefault();
});

$("#xpVal").textContent = S.xp;
renderHome();
renderPrint();
if (location.hash.length > 1){ const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
</script>
</body>
</html>
