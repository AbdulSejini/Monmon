<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unit 2 Word Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#14163A; --ink-2:#4A4D78; --ink-3:#8A8DB0;
  --paper:#FFFFFF; --page:#E4F2FF; --dot:rgba(20,22,58,.07);
  --sun:#FFD23F; --sun-2:#FFF3C4;
  --good:#12A15E; --good-bg:#DCF7E9;
  --bad:#E23D45; --bad-bg:#FFE1E2;
  --warn:#C77700; --warn-bg:#FFF0D1;
  --c1:#2F7DE1; --c1t:#DCEBFF;
  --c2:#F39200; --c2t:#FFE8C2;
  --c3:#9A4FE0; --c3t:#EEE0FF;
  --c4:#119C77; --c4t:#D2F4E8;
  --c5:#E23F66; --c5t:#FFDDE6;
  --col:var(--c1); --tint:var(--c1t);
  --shadow:4px 4px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --r:14px; --r-sm:10px;
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.land-c1{--col:var(--c1);--tint:var(--c1t)} .land-c2{--col:var(--c2);--tint:var(--c2t)} .land-c3{--col:var(--c3);--tint:var(--c3t)}
.land-c4{--col:var(--c4);--tint:var(--c4t)} .land-c5{--col:var(--c5);--tint:var(--c5t)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo-mark{font-family:var(--display);font-size:28px;letter-spacing:.05em;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg);white-space:nowrap}
.unit-chip{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:#fff;padding:4px 8px;border-radius:6px;white-space:nowrap}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--sun-2);border:2px solid var(--ink);border-radius:999px;padding:3px 12px 3px 6px;white-space:nowrap}
.xp svg{width:20px;height:20px}
.xp.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:scale(1.18)}}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:2px 2px 0 var(--ink)}
.icon-btn svg{width:22px;height:22px}
@media (max-width:520px){.unit-chip{display:none}.logo-mark{font-size:24px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font-weight:800;font-size:16px;line-height:1.2;box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-go{background:var(--sun)}
.btn-ink{background:var(--ink);color:#fff}
.btn-col{background:var(--col);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn-sm{min-height:38px;padding:6px 12px;font-size:14px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.screen{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* home */
.hero{margin-top:20px;padding:20px;display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(42px,7vw,66px)}
.hero h1 span{color:var(--c2);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.hero p{margin-top:10px;max-width:50ch;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:2px solid var(--ink);border-radius:10px;padding:10px 6px;background:var(--page);text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
@media (max-width:680px){.hero{grid-template-columns:1fr}}
.banner{margin-top:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sun-2)}
.banner.alert{background:var(--bad-bg)}
.banner p{flex:1 1 260px}
.sec-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:34px 0 14px}
.sec-title h2{font-size:36px}
.sec-title p{color:var(--ink-2);font-size:14px}

/* quest trail */
.trail{position:relative;display:grid;gap:20px;padding-block:4px}
.trail::before{content:"";position:absolute;top:0;bottom:-20px;left:50%;border-left:4px dashed var(--ink-3);transform:translateX(-2px)}
.land{position:relative;width:calc(50% - 26px);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;text-align:left;background:var(--tint);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .15s}
.land:nth-child(odd){justify-self:start}
.land:nth-child(even){justify-self:end}
.land:hover{transform:translateY(-3px) rotate(-.4deg)}
.land::after{content:"";position:absolute;top:24px;width:22px;height:22px;border-radius:50%;background:var(--col);border:3px solid var(--ink)}
.land:nth-child(odd)::after{right:-40px}
.land:nth-child(even)::after{left:-40px}
@media (max-width:680px){.trail::before{left:18px}.land{width:calc(100% - 44px);justify-self:end!important}.land::after{left:-40px!important;right:auto!important}}
.badge{width:56px;height:56px;border-radius:50%;background:var(--col);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
.badge svg{width:32px;height:32px}
.land-num{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.land h3{font-size:30px}
.land .sub{font-size:14px;color:var(--ink-2)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:13px;font-weight:700;padding:2px 9px;border:2px solid var(--ink);border-radius:999px;background:var(--paper)}
.land-foot{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.progress-note{font-size:13px;font-weight:700;color:var(--ink-2)}
.stars{display:flex;gap:2px}
.stars svg{width:24px;height:24px}
.sticker{position:absolute;top:-19px;right:12px;font-family:var(--display);font-size:18px;letter-spacing:.05em;background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;transform:rotate(4deg);box-shadow:2px 2px 0 var(--ink)}
.sticker.ok{background:var(--good)}
.final{position:relative;margin:36px auto 0;max-width:560px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--sun)}
.final h3{font-size:34px}
.final p{font-size:14px;color:var(--ink)}
.final .row{grid-column:1 / -1}
.final .badge{background:var(--ink)}
.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.bank{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;text-align:left;padding:10px 30px 10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:3px 3px 0 var(--col);display:grid;gap:1px;transition:transform .1s}
.tile:hover{transform:translate(-1px,-1px)}
.tile b{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--ink-2)}
.tile i{position:absolute;top:12px;right:10px;width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.tile i.ok{background:var(--good)} .tile i.slip{background:var(--sun)} .tile i.bad{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);display:inline-block}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.chip-land{font-family:var(--display);font-size:22px;letter-spacing:.04em;padding:3px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--col);color:#fff;-webkit-text-stroke:.5px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.steps{display:flex;gap:6px;margin-left:auto}
.step{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:13px;padding:0}
.step.done{background:var(--col);color:#fff}
.step.now{box-shadow:0 0 0 3px var(--sun);transform:scale(1.1)}
.step svg{width:18px;height:18px}
.card{margin-top:14px;padding:16px;display:grid;gap:16px}
.word-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px 22px;align-items:center}
@media (max-width:700px){.word-top{grid-template-columns:1fr}}
.scene{position:relative;background:var(--tint);border:3px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;aspect-ratio:16/9;width:100%;max-width:100%}
.scene svg{width:100%;height:100%;display:block}
.word-head{display:grid;gap:12px;align-content:center;min-width:0}
.word-title{font-family:var(--display);font-size:clamp(44px,6.6vw,78px);line-height:.95;letter-spacing:.03em;color:var(--col);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);overflow-wrap:anywhere}
.word-title.long{font-size:clamp(34px,4.6vw,56px)}
.word-title .l{display:inline-block;animation:letterPop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes letterPop{0%{transform:translateY(30px) scale(.3) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.word-count{font-size:13px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pos{font-size:13px;font-weight:800;padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--sun-2)}
.say{font-weight:700;font-size:19px;letter-spacing:.02em}
.say em{font-style:normal;background:var(--ink);color:#fff;padding:0 5px;border-radius:5px}
.info{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
@media (max-width:700px){.info{grid-template-columns:1fr}}
.box{border:2px solid var(--ink);border-radius:var(--r-sm);padding:12px 14px;background:var(--paper)}
.box h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin:0 0 6px}
.kid-def{font-size:19px;font-weight:500;line-height:1.45}
.book-def{margin-top:10px;padding-top:8px;border-top:2px dashed var(--ink-3);font-size:14px;color:var(--ink-2)}
.trick{background:var(--sun-2);transform:rotate(.7deg);box-shadow:3px 3px 0 var(--ink)}
.trick p{font-size:17px;font-weight:500}
.sent{font-size:18px;line-height:1.7}
.sent + .sent{margin-top:12px;padding-top:12px;border-top:2px dashed var(--ink-3)}
.tag-pos{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.blank{display:inline-block;min-width:5.5ch;margin:0 2px;padding:0 6px;border:0;border-bottom:3px solid var(--ink);background:var(--sun-2);border-radius:6px 6px 0 0;font-weight:800;color:var(--ink-2);text-align:center}
button.blank{font-size:inherit;line-height:1.3}
.blank.filled{background:var(--tint);color:var(--ink);animation:fillIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes fillIn{0%{transform:scale(.4)}100%{transform:none}}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.two-col{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;font-weight:600;padding:3px 10px;border-radius:8px;border:2px solid var(--ink)}
.chip.syn{background:var(--good-bg)} .chip.ant{background:var(--bad-bg)}
.none{color:var(--ink-2);font-size:14px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.intro{margin-top:14px;padding:22px;display:grid;gap:14px;background:var(--tint)}
.intro h2{font-size:clamp(40px,8vw,64px);color:var(--col);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.intro p{font-size:18px;max-width:60ch}
.intro .pill{font-size:16px;padding:4px 12px}

/* questions */
.q-card{padding:18px;display:grid;gap:14px}
.q-kicker{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.q-text{font-size:20px;line-height:1.55;font-weight:500}
.q-text b{background:var(--sun-2);padding:0 5px;border-radius:5px;box-shadow:inset 0 -3px 0 var(--sun)}
.q-text .blank{min-width:7ch}
.quote{margin:0;padding:12px 16px;border-left:6px solid var(--col);background:var(--tint);border-radius:0 10px 10px 0;font-style:italic;font-size:17px;line-height:1.6}
.quote b{font-style:normal;background:var(--paper);padding:0 4px;border-radius:4px}
.quote cite{display:block;margin-top:6px;font-style:normal;font-size:12px;font-weight:700;color:var(--ink-2)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:56px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:600;font-size:17px;line-height:1.35;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.opt:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--page)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-bg);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad-bg);animation:shake .4s}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.04)}}
.fb{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:start;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;animation:slideUp .3s ease-out}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)} .fb.slip{background:var(--warn-bg)}
.fb .burst{font-family:var(--display);font-size:30px;line-height:1;transform:rotate(-4deg);-webkit-text-stroke:1px var(--ink)}
.fb.ok .burst{color:var(--good)} .fb.no .burst{color:var(--bad)} .fb.slip .burst{color:var(--sun)}
.fb .fb-body{font-size:16px}
.fb .row{grid-column:1 / -1;justify-content:flex-end}
.spell{letter-spacing:.08em;white-space:nowrap}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.type-row{display:flex;gap:10px;flex-wrap:wrap}
.type-in{flex:1 1 220px;min-width:0;font:inherit;font-size:22px;font-weight:700;letter-spacing:.04em;padding:10px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink)}
.type-in:focus{outline:none;box-shadow:0 0 0 4px var(--sun)}
.type-in.ok{background:var(--good-bg)} .type-in.no{background:var(--bad-bg);animation:shake .4s} .type-in.slip{background:var(--warn-bg)}
.hint{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.hint-boxes{display:flex;flex-wrap:wrap;gap:4px}
.hb{width:20px;height:26px;border-bottom:3px solid var(--ink-3);display:grid;place-items:end center;font-weight:800;font-size:16px;color:var(--ink);text-transform:lowercase}
.test-top{display:grid;gap:10px;margin-top:16px}
.test-top .row{justify-content:space-between}
.round-name{font-family:var(--display);font-size:26px;letter-spacing:.04em}
.counter{font-weight:800;font-variant-numeric:tabular-nums}
.progress{height:16px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.progress i{display:block;height:100%;background:var(--sun);border-right:2px solid var(--ink);transition:width .4s}
.splash{margin-top:16px;padding:34px 20px;text-align:center;display:grid;gap:14px;justify-items:center;background:var(--sun)}
.splash .big{font-family:var(--display);font-size:clamp(46px,10vw,78px);line-height:1;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:5px 5px 0 var(--ink);animation:zoomIn .6s cubic-bezier(.3,1.6,.5,1)}
.splash .round-no{font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.splash p{max-width:46ch;font-size:17px}
@keyframes zoomIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.test-intro{margin-top:16px;padding:22px;display:grid;gap:16px}
.test-intro h2{font-size:clamp(40px,8vw,60px)}
.rounds{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:r}
.rounds li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--page);counter-increment:r}
.rounds li::before{content:counter(r);width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800}
.rounds small{color:var(--ink-2);font-size:13px}

/* match game */
.match{display:grid;grid-template-columns:1fr 1.35fr;gap:12px}
.match-col{display:grid;gap:10px;align-content:start}
.m-item{padding:10px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:600;text-align:left;box-shadow:3px 3px 0 var(--ink);min-height:56px;line-height:1.3;transition:transform .08s}
.m-item.word{font-family:var(--display);font-size:24px;letter-spacing:.04em;font-weight:400}
.m-item.sel{background:var(--sun);transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.m-item.done{background:var(--good-bg);box-shadow:none;cursor:default;animation:pop .35s}
.m-item.nope{animation:shake .4s;background:var(--bad-bg)}
@media (max-width:520px){.match{gap:8px}.m-item{padding:8px 10px;font-size:14px}.m-item.word{font-size:19px}}
.result-stars{display:flex;gap:10px;justify-content:center}
.result-stars span{display:inline-block;animation:starIn .6s cubic-bezier(.3,1.6,.5,1) both}
.result-stars svg{width:64px;height:64px;display:block}
.q-how{font-size:14px;font-weight:700;color:var(--ink-2)}

  billow:{pos:"noun · verb", say:"BIL-oh",

/* make a playable copy: shuffles options and picks fair wrong answers */
function inst(q){
  const o = Object.assign({}, q);
  if (q.type === "syn" || q.type === "ant"){
    const same = shuffle(ALL.filter(w => w !== q.word && POS[w].includes(q.pos)));
    const rest = shuffle(ALL.filter(w => w !== q.word && !same.includes(w)));
    o.opts = shuffle([q.word].concat(same.concat(rest).slice(0, 3)));
    o.ans = o.opts.indexOf(q.word);
  } else if (q.type === "usage"){
    const mixed = shuffle(q.sents.map((s, i) => ({s, ok:i === 0})));
    o.opts = mixed.map(x => x.s); o.ans = mixed.findIndex(x => x.ok);
  }
  o.round = ROUND_OF[q.type];
  return o;
}
function correctText(q){ return q.type === "type" ? q.answer : q.opts[q.ans]; }
function plainPrompt(q){
  if (q.type === "usage") return "Which sentence uses \"" + q.word + "\" correctly?";
  if (q.type === "whitman") return q.prompt;
  return q.prompt.replace(/\*\*/g, "");
}

/* pick n questions, always preferring words that have been asked the least */
function pickGreedy(pool, n, cov){
  const items = shuffle(pool.slice()), out = [], used = new Set();
  for (let k = 0; k < n && items.length; k++){
    let best = 0, score = Infinity;
    items.forEach((it, i) => { const s = cov[it.word] * 10 + (used.has(it.word) ? 5 : 0); if (s < score){ score = s; best = i; } });
    const it = items.splice(best, 1)[0]; out.push(it); used.add(it.word); cov[it.word]++;
  }
  return out;
}
function buildFinal(){
  const cov = {}; ALL.forEach(w => { cov[w] = 0; });
  const rounds = [
    pickGreedy(POOL.choose, 6, cov), pickGreedy(POOL.syn, 6, cov), pickGreedy(POOL.ant, 6, cov),
    pickGreedy(POOL.type, 6, cov), pickGreedy(POOL.whitman, 2, cov).concat(pickGreedy(POOL.usage, 4, cov))
  ];
  return rounds.flatMap(r => shuffle(r).map(inst));
}
function buildPractice(words, spellWords){
  const qs = [];
  words.forEach(w => {
    const picked = [], types = new Set();
    if ((spellWords || []).includes(w)){ const t = POOL.type.find(q => q.word === w); if (t){ picked.push(t); types.add("type"); } }
    const avail = shuffle(["syn", "ant", "usage", "choose", "type", "whitman"].flatMap(p => POOL[p].filter(q => q.word === w)));
    for (const q of avail){ if (picked.length >= 2) break; if (!types.has(q.type)){ picked.push(q); types.add(q.type); } }
    picked.forEach(q => qs.push(inst(q)));
  });
  return shuffle(qs).slice(0, 16);
}

function qcFeedback(w, ok){ return `<div class="fb ${ok ? "ok" : "no"}"><span class="burst">${ok ? "YES!" : "NOT QUITE"}</span><div class="fb-body">${esc(WORDS[w].qc[2])}</div></div>`; }

function renderLesson(){
  const c = CHAPTERS[L.ch], sec = $("#scr-lesson");
  sec.className = "screen land-" + c.key;
  const steps = c.words.map((w, i) => `<button class="step ${S.seen[w] ? "done" : ""} ${L.w === i ? "now" : ""}" data-act="goword" data-i="${i}" aria-label="Word ${i + 1}: ${w}">${i + 1}</button>`).join("")
    + `<button class="step ${(S.lands[L.ch] || {}).stars ? "done" : ""}" data-act="challenge" data-ch="${L.ch}" aria-label="Land challenge">${ICON_TROPHY}</button>`;
  const top = `<div class="lesson-top">${L.from === "report" ? '<button class="btn btn-sm" data-act="backreport">← My report</button>' : '<button class="btn btn-sm" data-act="home">← Map</button>'}
    <span class="chip-land">Land ${L.ch + 1}: ${c.name}</span><div class="steps">${steps}</div></div>`;
  if (L.w < 0){
    sec.innerHTML = top + `<div class="panel intro"><div class="land-num">Land ${L.ch + 1} of 5 · ${c.tag}</div><h2>${c.name}</h2><p>${esc(c.intro)}</p>
      <div class="pills">${c.words.map(w => `<span class="pill">${w}</span>`).join("")}</div>
      <p class="none">For each word: watch the picture, hear it, learn the memory trick, and answer one quick check. Then win the land challenge.</p>
      <div class="row"><button class="btn btn-go" data-act="goword" data-i="0">Let's go →</button></div></div>`;
    return;
  }
  const w = c.words[L.w], W = WORDS[w];
  S.seen[w] = true; save();
  const letters = w.split("").map((ch, i) => `<span class="l" style="animation-delay:${i * 45}ms">${ch}</span>`).join("");
  const say = W.say.split("-").map(p => /[A-Z]/.test(p) ? `<em>${p}</em>` : p).join("-");
  const sents = W.sents.map((s, i) => `<p class="sent">${s[0] ? `<span class="tag-pos">as a ${s[0]}</span>` : ""}${withBlank(s[1], `<button class="blank" data-act="fill" data-i="${i}" aria-label="Fill in the blank">tap me</button>`)}</p>`).join("");
  const q = W.qc, st = qcState[w] || (qcState[w] = {order:shuffle([0, 1, 2]), picked:null});
  const opts = st.order.map((oi, k) => {
    const cls = st.picked === null ? "" : oi === 0 ? "right" : oi === st.picked ? "wrong" : "dim";
    return `<button class="opt ${cls}" data-act="qc" data-i="${oi}" ${st.picked !== null ? "disabled" : ""}><span class="k">${"ABC"[k]}</span><span>${esc(q[1][oi])}</span></button>`;
  }).join("");
  const last = L.w === 3;
  sec.innerHTML = top + `<article class="panel card">
    <div class="word-top"><div class="scene">${SCENES[w]()}</div>
    <div class="word-head"><div><div class="word-count">Word ${L.w + 1} of 4</div><h2 class="word-title${w.length > 11 ? " long" : ""}" aria-label="${w}">${letters}</h2></div>
      <div class="meta"><span class="pos">${W.pos}</span><span class="say">say it: ${say}</span>${canSpeak ? `<button class="btn btn-sm" data-act="say" data-t="${w}">${ICON_SOUND} Hear it</button>` : ""}</div></div></div>
    <div class="info">
      <div class="box"><h4>What it means</h4><p class="kid-def">${esc(W.kid)}</p><p class="book-def"><b>Book definition:</b> ${esc(W.book)}</p></div>
      <div class="box trick"><h4>Memory trick</h4><p>${esc(W.trick)}</p></div>
    </div>
    <div class="box"><div class="row" style="justify-content:space-between;margin-bottom:4px"><h4 style="margin:0">Use it in a sentence (tap the blank)</h4>${canSpeak ? `<button class="btn btn-sm" data-act="saysent">${ICON_SOUND} Read to me</button>` : ""}</div>${sents}</div>
    <div class="two-col">
      <div class="box"><h4>Twin words (synonyms)</h4>${W.syn.length ? `<div class="chips">${W.syn.map(s => `<span class="chip syn">${esc(s)}</span>`).join("")}</div>` : '<p class="none">The book lists no synonyms.</p>'}</div>
      <div class="box"><h4>Opposite words (antonyms)</h4>${W.ant.length ? `<div class="chips">${W.ant.map(s => `<span class="chip ant">${esc(s)}</span>`).join("")}</div>` : '<p class="none">The book lists no antonyms.</p>'}</div>
    </div>
    <div class="box"><h4>Quick check</h4><p class="q-text" style="font-size:18px">${esc(q[0])}</p>
      <div class="opts" style="margin-top:10px">${opts}</div><div class="qc-fb" style="margin-top:10px">${st.picked !== null ? qcFeedback(w, st.picked === 0) : ""}</div></div>
    <div class="lesson-nav"><button class="btn" data-act="goword" data-i="${L.w - 1}">← ${L.w === 0 ? "Land intro" : "Previous"}</button>
      <button class="btn btn-go" id="nextBtn" data-act="${last ? "challenge" : "goword"}" data-ch="${L.ch}" data-i="${L.w + 1}" ${st.picked === null ? "disabled" : ""}>${last ? "Land Challenge →" : "Next word →"}</button></div>
    ${st.picked === null ? '<p class="none" id="nextHint" style="text-align:right">Answer the quick check to unlock the next step.</p>' : ""}
  </article>`;
}
function answerQC(i, btn){
  const w = CHAPTERS[L.ch].words[L.w], st = qcState[w];
  if (!st || st.picked !== null) return;
  st.picked = i; const ok = i === 0, box = btn.closest(".box");
  box.querySelectorAll(".opt").forEach(b => { const oi = +b.dataset.i; b.disabled = true; b.classList.add(oi === 0 ? "right" : oi === i ? "wrong" : "dim"); });
  box.querySelector(".qc-fb").innerHTML = qcFeedback(w, ok);
  if (ok){ Sound.good(); FX.burstEl(btn, 26); addXP(10, btn); } else Sound.bad();
  const nb = $("#nextBtn"); if (nb) nb.disabled = false;
  const nh = $("#nextHint"); if (nh) nh.remove();
  announce(ok ? "Correct!" : "Not quite. " + WORDS[w].qc[2]);
}
function fillBlank(i, btn){
  const W = WORDS[CHAPTERS[L.ch].words[L.w]], s = W.sents[i];
  const span = document.createElement("span"); span.className = "blank filled"; span.textContent = s[2];
  btn.replaceWith(span); Sound.tap(); speak(s[1].replace("___", s[2]));
}

/* ---------- LAND CHALLENGE ---------- */
let CHG = null;
const HOW = {choose:"Tap the word that best completes the sentence.", syn:"Which unit word means the SAME as the bold words?", ant:"Which unit word means the OPPOSITE of the bold words?",
  type:"Type the missing word from this unit.", whitman:"Read the poem lines, then pick the best answer.", usage:"Only one sentence uses the word the right way. Find it!"};
function qBody(q, act){
  let h = `<p class="q-how">${HOW[q.type]}</p>`;
  if (q.type === "whitman") h += `<blockquote class="quote">${q.quote}<cite>Walt Whitman, Leaves of Grass</cite></blockquote>`;
  if (q.type === "choose" || q.type === "type") h += `<p class="q-text">${withBlank(q.prompt, '<span class="blank">' + (q.type === "choose" ? "?" : "&nbsp;") + "</span>")}</p>`;
  else if (q.type === "syn" || q.type === "ant") h += `<p class="q-text">${bold(q.prompt)}</p>`;
  else if (q.type === "usage") h += `<p class="q-text">Which sentence uses <b>${q.word}</b> correctly?</p>`;
  else h += `<p class="q-text">${esc(q.prompt)}</p>`;
  if (q.type === "type"){
    h += `<div class="type-row"><input id="typeIn" class="type-in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type the word" aria-label="Your answer"><button class="btn btn-go" data-act="tsubmit">Check</button></div>
      <div class="hint"><span>Hint:</span><span class="hint-boxes" aria-hidden="true">${q.answer.split("").map((ch, i) => `<span class="hb">${i === 0 ? ch : ""}</span>`).join("")}</span><span>${q.answer.length} letters</span></div>`;
  } else {
    h += `<div class="opts ${q.opts.length === 2 ? "two" : ""}">${q.opts.map((o, i) => `<button class="opt" data-act="${act}" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  return h + '<div class="fb-slot"></div>';
}
function markOptions(scope, q, picked){
  scope.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; b.classList.add(i === q.ans ? "right" : i === picked ? "wrong" : "dim"); });
}
const pick = a => a[Math.floor(Math.random() * a.length)];
function fbHTML(kind, q, extra, nextAct, nextLabel){
  const W = WORDS[q.word];
  const head = kind === "ok" ? pick(["YES!", "BOOM!", "NAILED IT!", "SUPER!"]) : "OOPS!";
  const body = kind === "ok" ? `<b>${q.word}</b>: ${esc(W.short)}.` : `The answer is <b>${esc(correctText(q))}</b>. <b>${q.word}</b> means ${esc(W.short)}.`;
  return `<div class="fb ${kind}"><span class="burst">${head}</span><div class="fb-body">${body}${extra || ""}</div><div class="row"><button class="btn btn-go" data-act="${nextAct}" id="nextQ">${nextLabel}</button></div></div>`;
}

function openChallenge(ch){
  const c = CHAPTERS[ch], words = shuffle(c.words.slice()).slice(0, 3), types = shuffle(["syn", "ant", "usage"]);
  const mcq = words.map((w, k) => {
    let pool = POOL[types[k]].filter(q => q.word === w);
    if (!pool.length) pool = POOL.syn.filter(q => q.word === w).concat(POOL.usage.filter(q => q.word === w));
    return inst(shuffle(pool)[0]);
  });
  CHG = {ch, phase:"match", left:shuffle(c.words.slice()), right:shuffle(c.words.slice()), selW:null, selD:null, done:{}, miss:{}, mcq, mi:0, mres:[], locked:false};
  renderChallenge(); show("challenge");
}
function renderChallenge(){
  const c = CHAPTERS[CHG.ch], sec = $("#scr-challenge");
  sec.className = "screen land-" + c.key;
  const head = `<div class="lesson-top"><button class="btn btn-sm" data-act="land" data-ch="${CHG.ch}">← Words</button><span class="chip-land">Land ${CHG.ch + 1} Challenge</span></div>`;
  if (CHG.phase === "match"){
    sec.innerHTML = head + `<div class="panel q-card"><div class="q-kicker">Part 1 of 2 · Match-up</div><p class="q-text">Tap a word, then tap its meaning.</p>
      <div class="match"><div class="match-col">${CHG.left.map(w => `<button class="m-item word" data-act="mw" data-w="${w}">${w}</button>`).join("")}</div>
      <div class="match-col">${CHG.right.map(w => `<button class="m-item" data-act="md" data-w="${w}">${esc(WORDS[w].short)}</button>`).join("")}</div></div></div>`;
  } else if (CHG.phase === "mcq"){
    sec.innerHTML = head + `<div class="panel q-card"><div class="q-kicker">Part 2 of 2 · Question ${CHG.mi + 1} of ${CHG.mcq.length}</div>${qBody(CHG.mcq[CHG.mi], "cq")}</div>`;
  } else {
    const r = CHG.result, next = CHG.ch < 4;
    const rows = c.words.map(w => {
      const bad = !!CHG.miss[w] || CHG.mres.some(x => x.w === w && !x.ok);
      return `<li><span><b>${w}</b> · ${esc(WORDS[w].short)}</span>${bad ? `<button class="btn btn-sm" data-act="word" data-w="${w}">Review</button>` : '<span class="status good">Got it</span>'}</li>`;
    }).join("");
    sec.innerHTML = head + `<div class="panel q-card" style="text-align:center">
      <div class="q-kicker">Land ${CHG.ch + 1} complete</div>
      <h2 style="font-size:clamp(40px,8vw,60px)">${r.stars === 3 ? "PERFECT!" : r.stars === 2 ? "GREAT JOB!" : "GOOD START!"}</h2>
      <div class="result-stars">${[1, 2, 3].map((k, i) => `<span style="animation-delay:${i * .18}s">${STAR(r.stars >= k)}</span>`).join("")}</div>
      <p>You scored <b>${r.total} of 7</b>: ${r.firstTry} of 4 matched on the first try, and ${r.mc} of 3 questions right.</p>
      <ul class="check-list" style="text-align:left">${rows}</ul>
      <div class="row" style="justify-content:center">${next ? `<button class="btn btn-go" data-act="land" data-ch="${CHG.ch + 1}">Next land: ${CHAPTERS[CHG.ch + 1].name} →</button>` : `<button class="btn btn-go" data-act="final">Final Challenge →</button>`}
        <button class="btn" data-act="challenge" data-ch="${CHG.ch}">Try again</button><button class="btn" data-act="home">Map</button></div></div>`;
  }
}
function matchPick(kind, w, btn){
  if (!CHG || CHG.phase !== "match" || CHG.done[w]) return;
  if (kind === "w") CHG.selW = w; else CHG.selD = w;
  const sec = $("#scr-challenge");
  sec.querySelectorAll(".m-item").forEach(b => b.classList.toggle("sel", (b.dataset.act === "mw" && b.dataset.w === CHG.selW) || (b.dataset.act === "md" && b.dataset.w === CHG.selD)));
  if (!(CHG.selW && CHG.selD)){ Sound.tap(); return; }
  const bw = sec.querySelector(`[data-act="mw"][data-w="${CHG.selW}"]`), bd = sec.querySelector(`[data-act="md"][data-w="${CHG.selD}"]`);
  if (CHG.selW === CHG.selD){
    CHG.done[CHG.selW] = true;
    [bw, bd].forEach(b => { b.classList.remove("sel"); b.classList.add("done"); b.disabled = true; });
    Sound.good(); FX.burstEl(bd, 18); if (!CHG.miss[CHG.selW]) addXP(5, bd);
  } else {
    CHG.miss[CHG.selW] = (CHG.miss[CHG.selW] || 0) + 1;
    [bw, bd].forEach(b => { b.classList.remove("sel", "nope"); void b.offsetWidth; b.classList.add("nope"); });
    Sound.bad();
  }
  CHG.selW = CHG.selD = null;
  if (Object.keys(CHG.done).length === 4) setTimeout(() => { CHG.phase = "mcq"; renderChallenge(); }, 700);
}
function answerCQ(i, btn){
  if (!CHG || CHG.locked) return; CHG.locked = true;
  const q = CHG.mcq[CHG.mi], ok = i === q.ans, sec = $("#scr-challenge");
  markOptions(sec, q, i); CHG.mres.push({w:q.word, ok});
  if (ok){ Sound.good(); FX.burstEl(btn, 24); addXP(10, btn); } else Sound.bad();
  sec.querySelector(".fb-slot").innerHTML = fbHTML(ok ? "ok" : "no", q, "", "cnext", CHG.mi < CHG.mcq.length - 1 ? "Next →" : "See my stars →");
  announce(ok ? "Correct!" : "Not correct. The answer is " + correctText(q));
}
function nextCQ(){
  CHG.locked = false;
  if (CHG.mi < CHG.mcq.length - 1){ CHG.mi++; renderChallenge(); window.scrollTo(0, 0); return; }
  const c = CHAPTERS[CHG.ch];
  const firstTry = c.words.filter(w => !CHG.miss[w]).length, mc = CHG.mres.filter(r => r.ok).length, total = firstTry + mc;
  const stars = total >= 7 ? 3 : total >= 5 ? 2 : 1, prev = S.lands[CHG.ch] || {};
  S.lands[CHG.ch] = {stars:Math.max(prev.stars || 0, stars), best:Math.max(prev.best || 0, total), last:total, at:Date.now()};
  c.words.forEach(w => {
    const bad = !!CHG.miss[w] || CHG.mres.some(r => r.w === w && !r.ok);
    const m = S.mastery[w] || (S.mastery[w] = {ok:0, bad:0, slip:0, last:""});
    if (bad){ m.bad++; m.last = "bad"; } else { m.ok++; m.last = "ok"; }
  });
  CHG.phase = "done"; CHG.result = {stars, total, firstTry, mc};
  addXP(stars * 10); save();
  renderChallenge(); window.scrollTo(0, 0); Sound.win(); FX.party();
}
/* ---------- FINAL CHALLENGE & PRACTICE ---------- */
function startRun(kind, qs){
  if (!qs.length) return;
  S.run = {kind, qs, i:0, res:[], at:Date.now(), splash:-1, locked:false};
  save(); renderTest(); show("test");
}
function resumeRun(){
  const R = S.run; if (!R) return;
  R.locked = false; if (R.res.length > R.i) R.i = R.res.length; save();
  if (R.i >= R.qs.length) finishRun(); else { renderTest(); show("test"); }
}
function renderTest(){
  const R = S.run, sec = $("#scr-test");
  if (!R){ renderHome(); show("home"); return; }
  const q = R.qs[R.i], round = ROUNDS[q.round], n = R.qs.length;
  if (R.kind === "final" && R.splash !== q.round){
    sec.innerHTML = `<div class="panel splash"><div class="round-no">Round ${q.round + 1} of 5</div><div class="big">${round.name}</div>
      <p>${esc(round.how)}</p><p class="none" style="color:var(--ink)">${esc(round.from)}</p><button class="btn btn-ink" data-act="go" id="goBtn">Go!</button></div>`;
    return;
  }
  sec.innerHTML = `<div class="test-top"><div class="row"><span class="round-name">${R.kind === "final" ? "Round " + (q.round + 1) + ": " + round.name : "Weak Words Practice"}</span><span class="counter">Question ${R.i + 1} of ${n}</span></div>
      <div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${R.i}"><i style="width:${pctOf(R.i, n)}%"></i></div></div>
    <div class="panel q-card" style="margin-top:14px">${qBody(q, "opt")}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn btn-sm" data-act="quit">Save &amp; exit</button><span class="none">Progress is saved on this device after every answer.</span></div>`;
  if (q.type === "type"){
    const inp = $("#typeIn");
    inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); submitTyped(); } });
    setTimeout(() => { try { inp.focus({preventScroll:true}); } catch (e) {} }, 60);
  }
}
function record(q, ok, slip, given){
  S.run.res.push({id:q.id, t:q.type, r:q.round, w:q.word, ok, slip, g:String(given || "").slice(0, 40), c:correctText(q), p:plainPrompt(q).slice(0, 170)});
  save();
}
const nextLabel = () => S.run.i < S.run.qs.length - 1 ? "Next →" : "See my results →";
function answerOpt(i, btn){
  const R = S.run; if (!R || R.locked) return; R.locked = true;
  const q = R.qs[R.i], ok = i === q.ans, sec = $("#scr-test");
  markOptions(sec, q, i); record(q, ok, false, q.opts[i]);
  if (ok){ Sound.good(); FX.burstEl(btn, 24); addXP(10, btn); } else Sound.bad();
  sec.querySelector(".fb-slot").innerHTML = fbHTML(ok ? "ok" : "no", q, "", "tnext", nextLabel());
  announce(ok ? "Correct!" : "Not correct. The answer is " + correctText(q));
}
function submitTyped(){
  const R = S.run; if (!R || R.locked) return;
  const q = R.qs[R.i], inp = $("#typeIn"), given = (inp.value || "").trim(), t = norm(given);
  if (!t){ inp.placeholder = "type a word first"; inp.focus(); return; }
  R.locked = true;
  const forms = q.accept.map(norm);
  let kind = "no";
  if (forms.includes(t)) kind = "ok";
  else {
    const d = Math.min.apply(null, forms.map(f => lev(t, f)));
    const lim = q.answer.length <= 5 ? 1 : q.answer.length <= 9 ? 2 : 3;
    if (d <= lim && t.length >= 3 && !ALL.includes(t)) kind = "slip";
  }
  inp.disabled = true; inp.classList.add(kind);
  const sb = $('#scr-test [data-act="tsubmit"]'); if (sb) sb.disabled = true;
  record(q, kind === "ok", kind === "slip", given);
  const slot = $("#scr-test .fb-slot");
  if (kind === "ok"){
    Sound.good(); FX.burstEl(inp, 24); addXP(10, inp);
    slot.innerHTML = fbHTML("ok", q, t !== norm(q.answer) ? ` This sentence needs the form <b>${q.answer}</b>.` : "", "tnext", nextLabel());
  } else if (kind === "slip"){
    Sound.tap(); addXP(5, inp);
    slot.innerHTML = `<div class="fb slip"><span class="burst">SO CLOSE!</span><div class="fb-body">Right word, but check the spelling. You wrote <s>${esc(given)}</s>. It's spelled <b class="spell">${q.answer.toUpperCase().split("").join(" ")}</b>.</div>
      <div class="row"><button class="btn btn-go" data-act="tnext" id="nextQ">${nextLabel()}</button></div></div>`;
  } else {
    Sound.bad();
    slot.innerHTML = fbHTML("no", q, ` You wrote "${esc(given)}".`, "tnext", nextLabel());
  }
  announce(kind === "ok" ? "Correct!" : kind === "slip" ? "Right word, spelling slip. It is spelled " + q.answer : "Not correct. The answer is " + q.answer);
}
function nextQ(){
  const R = S.run; if (!R || !R.locked) return;
  R.locked = false; R.i++; save();
  if (R.i >= R.qs.length) finishRun(); else { renderTest(); window.scrollTo(0, 0); }
}
function analyze(R){
  const res = R.res, n = res.length;
  const pts = res.reduce((s, r) => s + (r.ok ? 1 : r.slip ? .5 : 0), 0);
  const byCh = CHAPTERS.map(() => [0, 0]);
  res.forEach(r => { const c = byCh[CH_OF[r.w]]; c[1]++; if (r.ok || r.slip) c[0]++; });
  const skills = {choose:[0,0], syn:[0,0], ant:[0,0], type:[0,0], spell:[0,0], detective:[0,0]};
  res.forEach(r => {
    const k = (r.t === "whitman" || r.t === "usage") ? "detective" : r.t;
    skills[k][1]++; if (r.ok || r.slip) skills[k][0]++;
    if (r.t === "type" && (r.ok || r.slip)){ skills.spell[1]++; if (r.ok) skills.spell[0]++; }
  });
  const words = {};
  res.forEach(r => { const w = words[r.w] || (words[r.w] = {t:0, ok:0, slip:0, bad:0}); w.t++; if (r.ok) w.ok++; else if (r.slip) w.slip++; else w.bad++; });
  return {id:"a" + Date.now().toString(36), kind:R.kind, at:Date.now(), n, pts, pct:pctOf(pts, n), byCh, skills, words, res};
}
function finishRun(){
  const att = analyze(S.run);
  S.attempts.push(att); if (S.attempts.length > 40) S.attempts.splice(0, S.attempts.length - 40);
  Object.keys(att.words).forEach(w => {
    const x = att.words[w], m = S.mastery[w] || (S.mastery[w] = {ok:0, bad:0, slip:0, last:""});
    m.ok += x.ok; m.bad += x.bad; m.slip += x.slip; m.last = x.bad ? "bad" : x.slip ? "slip" : "ok";
  });
  S.run = null; save();
  showReport(att.id); Sound.win(); if (att.pct >= 60) FX.party();
}

/* ---------- REPORT & WEAK SPOTS ---------- */
let lastReportId = null;
const statusOf = (u, t) => !t ? ["na", "Not tested"] : u / t >= .85 ? ["good", "Mastered"] : u / t >= .6 ? ["mid", "Almost there"] : ["low", "Go back here"];
const rankOf = p => p >= 90 ? "WORD MASTER" : p >= 75 ? "WORD HERO" : p >= 50 ? "WORD EXPLORER" : "WORD ROOKIE";
const ptsTxt = a => Number.isInteger(a.pts) ? String(a.pts) : a.pts.toFixed(1);
function showReport(id){
  const att = S.attempts.find(a => a.id === id) || S.attempts[S.attempts.length - 1];
  if (!att){ renderHome(); show("home"); return; }
  lastReportId = att.id; renderReport(att); show("report"); animateReport(att);
}
function summaryLine(att){
  const weak = att.byCh.map(([u, t], i) => ({i, p:t ? u / t : 1})).filter(x => x.p < .85).map(x => CHAPTERS[x.i].name);
  if (!weak.length) return "Every land tested is at 85% or more. Brilliant, Mohammed!";
  return `Lands to visit again: <b>${weak.join(", ")}</b>. Your study plan below shows exactly what to do next.`;
}
function planFor(att){
  const steps = [], ww = weakWords(att), sw = spellSlips(att);
  const chs = att.byCh.map(([u, t], i) => ({i, u, t, p:t ? u / t : 1})).filter(c => c.t).sort((a, b) => a.p - b.p);
  const missedIn = i => CHAPTERS[i].words.filter(w => att.words[w] && att.words[w].bad);
  chs.filter(c => c.p < .6).forEach(c => {
    const m = missedIn(c.i), C = CHAPTERS[c.i];
    steps.push({text:`Replay <b>Land ${c.i + 1}: ${C.name}</b> from the start: all 4 word cards, then the land challenge. You got ${c.u} of ${c.t} there${m.length ? "; the tricky words were <b>" + m.join(", ") + "</b>" : ""}.`,
      btn:`<button class="btn btn-sm btn-col land-${C.key}" data-act="land" data-ch="${c.i}">Replay Land ${c.i + 1}</button>`});
  });
  chs.filter(c => c.p >= .6 && c.p < .85).forEach(c => {
    const m = missedIn(c.i), C = CHAPTERS[c.i];
    steps.push({text:`Quick review in <b>Land ${c.i + 1}: ${C.name}</b>${m.length ? ": look again at <b>" + m.join(", ") + "</b>" : ""}.`,
      btn:m.length ? m.map(w => `<button class="btn btn-sm" data-act="word" data-w="${w}" data-from="report">Open "${w}"</button>`).join("") : `<button class="btn btn-sm" data-act="land" data-ch="${c.i}">Open Land ${c.i + 1}</button>`});
  });
  if (sw.length) steps.push({text:`Spelling practice: <b>${[...new Set(sw.map(s => s.w))].join(", ")}</b>. Say the word slowly, cover it, write it, then check it. Do it three times.`,
    btn:`<button class="btn btn-sm" data-act="spellprac" data-id="${att.id}">Spelling round</button>`});
  const sk = SK.map(([k]) => ({k, a:att.skills[k][0], t:att.skills[k][1]})).filter(x => x.t >= 2 && x.a / x.t < .7).sort((a, b) => a.a / a.t - b.a / b.t)[0];
  if (sk) steps.push({text:`Tricky question type: <b>${SK.find(x => x[0] === sk.k)[1]}</b>. ${esc(SKILL_TIPS[sk.k])}`});
  if (ww.length) steps.push({text:`Lock it in with <b>Weak Words Practice</b>: up to ${Math.min(16, ww.length * 2)} new questions only on the words you missed.`,
    btn:`<button class="btn btn-sm btn-go" data-act="practice" data-id="${att.id}">Start practice</button>`});
  if (!steps.length) steps.push({text:"No weak spots at all. Amazing! Try the Final Challenge again (it picks different questions each time) or teach three of the words to someone at home.",
    btn:`<button class="btn btn-sm btn-go" data-act="final">Final Challenge</button>`});
  return steps;
}
function reportText(att){
  const out = ["Word Quest · Sadlier Vocabulary Unit 2 · Mohammed",
    (att.kind === "final" ? "Final Challenge" : "Weak Words Practice") + " · " + fmtDate(att.at),
    "Score: " + ptsTxt(att) + " / " + att.n + " (" + att.pct + "%) · " + rankOf(att.pct), "", "Lands:"];
  CHAPTERS.forEach((c, i) => { const [u, t] = att.byCh[i]; if (t) out.push("  " + (i + 1) + ". " + c.name + ": " + u + "/" + t + " (" + pctOf(u, t) + "%) " + statusOf(u, t)[1]); });
  out.push("", "Skills:");
  SK.forEach(([k, label]) => { const [a, t] = att.skills[k]; if (t) out.push("  " + label + ": " + a + "/" + t + " (" + pctOf(a, t) + "%)"); });
  const ww = weakWords(att), sw = spellSlips(att);
  out.push("", "Words to practice: " + (ww.length ? ww.join(", ") : "none"));
  if (sw.length) out.push("Spelling slips: " + sw.map(s => s.g + " → " + s.c).join("; "));
  return out.join("\n");
}
function barRow(label, sub, a, t, extraClass, style){
  const [cls, st] = statusOf(a, t);
  return `<div class="bar-row ${extraClass || ""}" ${style ? `style="${style}"` : ""}><div class="bar-label">${label}<small>${sub}</small></div>
    <div class="bar"><i data-w="${pctOf(a, t)}"></i></div><div class="bar-end"><span class="pct">${t ? pctOf(a, t) + "%" : "–"}</span><span class="status ${cls}">${st}</span></div></div>`;
}
function renderReport(att){
  const sec = $("#scr-report"), isFinal = att.kind === "final", C = 2 * Math.PI * 62;
  const ringCol = att.pct >= 85 ? "var(--good)" : att.pct >= 60 ? "var(--sun)" : "var(--bad)";
  const ww = weakWords(att), sw = spellSlips(att), hist = S.attempts.slice(-8);
  let h = `<div class="panel report-head">
    <div class="ring"><svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="62" fill="none" style="stroke:var(--page);stroke-width:16"/>
      <circle id="ringArc" cx="75" cy="75" r="62" fill="none" style="stroke:${ringCol};stroke-width:16;stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${C.toFixed(1)};transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/>
      <circle cx="75" cy="75" r="70" fill="none" style="stroke:var(--ink);stroke-width:3"/><circle cx="75" cy="75" r="54" fill="none" style="stroke:var(--ink);stroke-width:3"/></svg>
      <div class="num"><span id="ringNum">${reduceMotion ? att.pct : 0}%</span><small>${ptsTxt(att)} / ${att.n}</small></div></div>
    <div><div class="q-kicker">${isFinal ? "Final Challenge" : "Weak Words Practice"} · ${fmtDate(att.at)}</div><div class="rank">${rankOf(att.pct)}</div>
      <p>${summaryLine(att)}</p>
      <div class="row" style="margin-top:12px">${ww.length ? `<button class="btn btn-go" data-act="practice" data-id="${att.id}">Practice my weak words (${ww.length})</button>` : ""}
        <button class="btn" data-act="final">${isFinal ? "Try the Final again" : "Final Challenge"}</button><button class="btn btn-sm" data-act="home">Map</button></div></div></div>`;
  h += `<div class="sec-title"><h2>Your Lands</h2><p>How well you understood each land's words. A spelling slip still counts as understood here.</p></div><div class="panel bars">`;
  CHAPTERS.forEach((c, i) => { const [u, t] = att.byCh[i]; h += barRow(`Land ${i + 1}: ${c.name}`, t ? u + " of " + t + " right" : "no questions this time", u, t, "land-" + c.key); });
  h += `</div><div class="sec-title"><h2>Your Skills</h2><p>Which kind of question was easy, and which was tricky.</p></div><div class="panel bars">`;
  SK.forEach(([k, label]) => { const [a, t] = att.skills[k]; h += barRow(label, t ? a + " of " + t : (k === "spell" ? "no typed answers to check" : "not in this round"), a, t, "", "--col:#4A4D78"); });
  h += `</div><div class="sec-title"><h2>Words to Practice</h2><p>Tap a word to open its card again.</p></div><div class="panel" style="padding:16px">`;
  h += ww.length ? `<div class="word-chips">${ww.map(w => `<button class="wchip land-${CHAPTERS[CH_OF[w]].key}" data-act="word" data-w="${w}" data-from="report"><i></i>${w}</button>`).join("")}</div>` : "<p>No weak words this time. Every word was right!</p>";
  if (sw.length) h += `<div class="spell-list"><b>Spelling watch</b>${sw.map(s => `<div>You wrote <s>${esc(s.g)}</s> → it's <b class="spell">${esc(s.c)}</b></div>`).join("")}</div>`;
  h += `</div><div class="sec-title"><h2>Your Study Plan</h2><p>Do these in order.</p></div><ol class="plan">${planFor(att).map(s => `<li><div>${s.text}</div>${s.btn ? `<div class="row">${s.btn}</div>` : ""}</li>`).join("")}</ol>`;
  if (hist.length > 1) h += `<div class="sec-title"><h2>Progress</h2><p>Your last ${hist.length} rounds. Blue = Final Challenge, green = practice.</p></div>
    <div class="panel history">${hist.map(a => `<div class="hcol"><b>${a.pct}%</b><div class="hbar ${a.kind === "final" ? "" : "p"}" style="height:${Math.max(6, a.pct)}px"></div><span>${fmtDate(a.at).split(",")[0]}</span></div>`).join("")}</div>`;
  h += `<div class="sec-title"><h2>Every Answer</h2><p>Check what you picked and what was right.</p></div>
    <details class="panel answers"><summary>Show all ${att.n} answers</summary>${att.res.map((r, i) => `<div class="ans"><span class="mark ${r.ok ? "ok" : r.slip ? "slip" : "no"}" aria-label="${r.ok ? "right" : r.slip ? "spelling slip" : "wrong"}">${r.ok ? "✓" : r.slip ? "~" : "✗"}</span>
      <div><small>${i + 1}. ${esc(ROUNDS[r.r].name)} · ${esc(r.w)}</small><div>${esc(r.p)}</div><div>${r.ok ? "" : "Your answer: <b>" + esc(r.g || "—") + "</b> · "}Correct: <b>${esc(r.c)}</b></div></div></div>`).join("")}</details>`;
  h += `<div class="sec-title"><h2>For a Parent</h2><p>Copy this summary to send or keep.</p></div>
    <div class="panel" style="padding:16px;display:grid;gap:10px"><textarea class="copy-area" id="copyText" readonly aria-label="Report summary">${esc(reportText(att))}</textarea>
    <div class="row"><button class="btn btn-sm btn-go" data-act="copy">Copy summary</button><span class="copy-note" id="copyNote"></span></div></div>`;
  sec.innerHTML = h;
}
function animateReport(att){
  const sec = $("#scr-report"), C = 2 * Math.PI * 62;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    sec.querySelectorAll(".bar i").forEach(i => { const w = +i.dataset.w; i.style.width = w + "%"; if (!w) i.classList.add("zero"); });
    const arc = $("#ringArc"); if (arc) arc.style.strokeDashoffset = (C * (1 - att.pct / 100)).toFixed(1);
    const num = $("#ringNum"); if (!num || reduceMotion) return;
    const t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 1100); num.textContent = Math.round(att.pct * (1 - Math.pow(1 - k, 3))) + "%"; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }));
}
function copyReport(){
  const ta = $("#copyText"), note = $("#copyNote"); if (!ta) return;
  const fallback = () => { ta.focus(); ta.select(); note.textContent = "Selected. Press copy on your keyboard or menu."; };
  try { navigator.clipboard.writeText(ta.value).then(() => { note.textContent = "Copied!"; }, fallback); } catch (e) { fallback(); }
}

/* ---------- EVENTS ---------- */
let discardArm = false;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.act){
    case "home": renderHome(); show("home"); break;
    case "sound": S.sound = !S.sound; save(); renderSoundBtn(); Sound.tap(); break;
    case "land": openLand(+d.ch); break;
    case "word": openWord(d.w, d.from || null); break;
    case "goword": L.w = Math.max(-1, Math.min(3, +d.i)); renderLesson(); window.scrollTo(0, 0); break;
    case "say": speak(d.t); break;
    case "saysent": { const W = WORDS[CHAPTERS[L.ch].words[L.w]]; speak(W.sents.map(s => s[1].replace("___", s[2])).join(" ")); break; }
    case "fill": fillBlank(+d.i, b); break;
    case "qc": answerQC(+d.i, b); break;
    case "challenge": openChallenge(+d.ch); break;
    case "mw": matchPick("w", d.w, b); break;
    case "md": matchPick("d", d.w, b); break;
    case "cq": answerCQ(+d.i, b); break;
    case "cnext": nextCQ(); break;
    case "final": startRun("final", buildFinal()); break;
    case "resume": resumeRun(); break;
    case "discard":
      if (!discardArm){ discardArm = true; b.textContent = "Tap again to start over"; setTimeout(() => { discardArm = false; }, 4000); }
      else { discardArm = false; S.run = null; save(); renderHome(); }
      break;
    case "go": if (S.run){ S.run.splash = S.run.qs[S.run.i].round; save(); renderTest(); } break;
    case "opt": answerOpt(+d.i, b); break;
    case "tsubmit": submitTyped(); break;
    case "tnext": nextQ(); break;
    case "quit": renderHome(); show("home"); break;
    case "report": showReport(d.id); break;
    case "backreport": showReport(lastReportId); break;
    case "practice": {
      const att = S.attempts.find(x => x.id === d.id) || lastFinal(), ww = weakWords(att);
      if (ww.length) startRun("practice", buildPractice(ww, spellSlips(att).filter(s => !att.words[s.w].bad).map(s => s.w)));
      break;
    }
    case "spellprac": {
      const att = S.attempts.find(x => x.id === d.id), ws = [...new Set(spellSlips(att).map(s => s.w))];
      if (ws.length) startRun("practice", shuffle(ws.map(w => inst(POOL.type.find(q => q.word === w)))));
      break;
    }
    case "copy": copyReport(); break;
  }
});
document.addEventListener("keydown", e => {
  if (current !== "test" || !S.run || e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (document.activeElement || {}).tagName;
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key === "Enter"){
    if (tag === "BUTTON") return;
    const go = $("#goBtn") || (S.run.locked ? $("#nextQ") : null);
    if (go){ e.preventDefault(); go.click(); }
    return;
  }
  if (S.run.locked) return;
  const k = e.key.toLowerCase(), idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (k.length === 1 && idx >= 0){ const opt = document.querySelectorAll("#scr-test .opt")[idx]; if (opt) opt.click(); }
});

/* ---------- START ---------- */
if (canSpeak) try { speechSynthesis.getVoices(); } catch (e) {}
$("#xpVal").textContent = S.xp;
renderSoundBtn();
renderHome();
</script>
</body></html>
