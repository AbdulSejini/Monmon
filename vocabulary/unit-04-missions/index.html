<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unit 4 Missions</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2212%22 fill=%22%23FFC93C%22 stroke=%22%23141B33%22 stroke-width=%225%22/%3E%3Ctext x=%2232%22 y=%2242%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2224%22 fill=%22%23141B33%22%3EU4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800;900&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Unit 4 Missions (vocabulary/unit-04-missions): the 20 Unit 4 words in 5 missions with questions made fresh every time.
   Progress is saved in vocabquest-sadlier-unit4-v1 (synced by assets/sync.js; its xp counts towards the rewards).
   Arcade time (assets/arcade.js): nothing from this page counts until Missions 1, 2 and 3 are passed; then those three
   parts count together, and Mission 4 and the Final Boss count one part each when passed.
   Layout: a game lobby — an arcade-time console up top, study tools, then a numbered mission track (real order) and a report. */
:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --surface-2:#F3F6FC; --ink:#131A31; --muted:#58627F; --line:#D8DEEC;
  --banana:#FFC93C; --banana-deep:#D99B00; --banana-ink:#2A1E00;
  --blue:#2D5BFF; --blue-soft:#E3EAFF;
  --good:#0F8F55; --good-soft:#DDF4E8; --bad:#D23F35; --bad-soft:#FCE5E3; --warn:#A86400; --warn-soft:#FFF1D6;
  --vault:#141B33; --vault-2:#1F2849; --vault-ink:#F3F5FF; --vault-muted:#A9B3D6;
  --shadow:0 1px 2px rgba(19,26,49,.06),0 12px 30px -16px rgba(19,26,49,.30);
  --f-display:'Bungee','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-ar:'Tajawal','Geeza Pro','Noto Sans Arabic',system-ui,sans-serif;
  --r:16px; --r-l:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1326; --surface:#151D37; --surface-2:#1B2546; --ink:#EBEFFF; --muted:#A2ACCA; --line:#2A355A;
    --banana:#FFCD47; --banana-deep:#FFB703; --banana-ink:#241A00;
    --blue:#7A9BFF; --blue-soft:rgba(122,155,255,.16);
    --good:#3DD68C; --good-soft:rgba(61,214,140,.15); --bad:#FF7B70; --bad-soft:rgba(255,123,112,.15); --warn:#FFB547; --warn-soft:rgba(255,181,71,.14);
    --vault:#080D1D; --vault-2:#141C38; --vault-ink:#F3F5FF; --vault-muted:#A9B3D6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1326; --surface:#151D37; --surface-2:#1B2546; --ink:#EBEFFF; --muted:#A2ACCA; --line:#2A355A;
  --banana:#FFCD47; --banana-deep:#FFB703; --banana-ink:#241A00;
  --blue:#7A9BFF; --blue-soft:rgba(122,155,255,.16);
  --good:#3DD68C; --good-soft:rgba(61,214,140,.15); --bad:#FF7B70; --bad-soft:rgba(255,123,112,.15); --warn:#FFB547; --warn-soft:rgba(255,181,71,.14);
  --vault:#080D1D; --vault-2:#141C38; --vault-ink:#F3F5FF; --vault-muted:#A9B3D6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
[lang="ar"]{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.ar-line{display:block;font-family:var(--f-ar);direction:rtl;text-align:right;color:var(--muted);font-size:15px;line-height:1.6}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;min-height:58px;padding-block:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:2px;margin-right:auto;text-align:left}
.brand-badge{width:40px;height:40px;border-radius:12px;background:var(--banana);color:var(--banana-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;box-shadow:0 3px 0 var(--banana-deep)}
.brand b{display:block;font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:700}
.chip{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.lock{color:var(--muted)}
.chip.open{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.run{background:var(--banana);color:var(--banana-ink);border-color:transparent;animation:pulse 1.4s ease-in-out infinite}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:17px}

main{padding-block:18px 90px}
.stack{display:flex;flex-direction:column;gap:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;border:2px solid transparent;font-weight:900;font-size:16px;line-height:1.2;transition:transform .1s ease,opacity .2s}
.btn:active{transform:translateY(2px)}
.btn-main{background:var(--banana);color:var(--banana-ink);box-shadow:0 4px 0 var(--banana-deep)}
.btn-main:active{box-shadow:0 2px 0 var(--banana-deep)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000 40%)}
.btn-ghost{background:var(--surface);border-color:var(--line)}
.btn-sm{min-height:38px;padding:6px 14px;font-size:14.5px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:stretch}
.hello{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:12.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--blue)}
.hello h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.6vw,38px);letter-spacing:.01em}
.hello h1 em{font-style:normal;color:var(--banana-deep)}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;font-size:14.5px}
.fact b{font-variant-numeric:tabular-nums}
.ready{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:auto}
.ring{width:74px;height:74px}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring text{font-family:var(--f-display);font-size:17px;fill:var(--ink)}

/* vault */
.vault{position:relative;background:var(--vault);color:var(--vault-ink);border-radius:var(--r-l);padding:20px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.vault::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.vault > *{position:relative}
.vault .vt{display:flex;align-items:center;gap:10px}
.vault .vt b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.03em}
.vault .state{margin-left:auto;font-size:12.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--vault-2);color:var(--vault-muted)}
.vault .state.on{background:var(--banana);color:var(--banana-ink)}
.clock{font-family:var(--f-display);font-size:clamp(46px,9vw,64px);line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--banana)}
.clock.dim{color:var(--vault-muted);opacity:.55}
.vault .msg{color:var(--vault-muted);font-weight:700;font-size:15px}
.vault .msg b{color:var(--vault-ink)}
.vault .ar-line{color:var(--vault-muted);margin-top:4px}
.locks{display:flex;gap:8px;flex-wrap:wrap}
.lockpill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--vault-2);font-weight:800;font-size:13.5px;color:var(--vault-muted)}
.lockpill.done{background:color-mix(in srgb,var(--good) 25%,var(--vault-2));color:#CFF7E2}
.vault .btn-ghost{background:var(--vault-2);border-color:transparent;color:var(--vault-ink)}
.shake-lock{display:inline-block;animation:wob 2.8s ease-in-out infinite}

/* sections */
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:21px;letter-spacing:.02em}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tool{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);transition:transform .15s}
.tool:hover{transform:translateY(-2px)}
.tool .ti{font-size:28px;line-height:1}
.tool b{font-weight:900;font-size:16.5px}
.tool span{font-size:14px;color:var(--muted);line-height:1.4}
.tool .best{font-size:12.5px;font-weight:900;color:var(--blue)}

/* mission track */
.track{display:flex;flex-direction:column;gap:12px}
.mission{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.mission .tier{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;background:var(--surface-2);border:2px solid var(--line)}
.mission.passed .tier{background:var(--good);border-color:var(--good);color:#fff}
.mission.boss{border:2px solid var(--banana-deep)}
.mission.boss .tier{background:var(--banana);border-color:var(--banana-deep);color:var(--banana-ink)}
.mission h3{font-size:18px;font-weight:900}
.mission .sub{font-size:14.5px;color:var(--muted);line-height:1.4}
.mission .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.min{background:var(--banana);color:var(--banana-ink)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.mid{background:var(--warn-soft);color:var(--warn)}
.tag.low{background:var(--bad-soft);color:var(--bad)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;box-shadow:var(--shadow)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:900;padding:4px 0}
.back:hover{color:var(--ink)}

/* word cards */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.wcard{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:92px;box-shadow:var(--shadow)}
.wcard .n{position:absolute;top:10px;right:12px;font-size:12px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.wcard b{font-size:18.5px;font-weight:900}
.wcard i{font-style:normal;font-size:13px;color:var(--muted);font-weight:700}
.wcard .ar{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:14.5px;color:var(--muted);margin-top:auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);vertical-align:middle}
.dot.ok{background:var(--good)}.dot.mid{background:var(--warn)}.dot.low{background:var(--bad)}

/* word detail */
.detail{display:flex;flex-direction:column;gap:14px}
.dh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dh h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,44px);letter-spacing:.01em}
.pron{font-weight:800;color:var(--muted)}
.posb{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.meaning{font-size:20px;font-weight:800;line-height:1.45}
.ar-big{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:21px;font-weight:800;color:var(--banana-deep)}
.trick{display:flex;gap:10px;background:var(--warn-soft);border-radius:14px;padding:12px 14px;font-weight:700}
.trick .ti{font-size:22px;line-height:1.2}
.ex{background:var(--surface-2);border-left:5px solid var(--blue);border-radius:10px;padding:10px 14px;font-size:17px}
.ex mark{background:var(--banana);color:var(--banana-ink);border-radius:5px;padding:0 4px;font-weight:900}
.sa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sa > div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.sa small{display:block;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sa .s{color:var(--good);font-weight:800}
.sa .a{color:var(--bad);font-weight:800}
.note{font-size:15px;color:var(--muted)}

/* flashcards */
.flash{perspective:1000px;width:100%;max-width:520px;margin:0 auto;min-height:260px;background:none;border:0;padding:0;display:block}
.flash .in{position:relative;display:block;min-height:260px;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flash.on .in{transform:rotateY(180deg)}
.flash .f,.flash .bk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;border-radius:var(--r-l);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.flash .f{background:var(--vault);color:var(--vault-ink);box-shadow:var(--shadow)}
.flash .f b{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,7vw,46px);color:var(--banana)}
.flash .f small{color:var(--vault-muted);font-weight:800}
.flash .bk{background:var(--surface);border:3px solid var(--banana);transform:rotateY(180deg);font-size:17.5px}
.flash .bk .m{font-weight:900;font-size:19px}
.flash .bk .arx{font-family:var(--f-ar);direction:rtl;font-size:19px;color:var(--banana-deep);font-weight:800}

/* match game */
.mgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mt{min-height:52px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);text-align:left;font-weight:800;font-size:15.5px;line-height:1.3;transition:transform .12s,border-color .15s,background .15s}
.mt.word{font-size:17px;font-weight:900}
.mt.sel{border-color:var(--blue);background:var(--blue-soft);transform:translateY(-2px)}
.mt.gone{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.55;pointer-events:none}
.mt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s ease}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qhead .qn{font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.bar{flex:1;min-width:120px;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--banana);border-radius:99px;transition:width .35s ease}
.streak{font-weight:900;color:var(--banana-deep);white-space:nowrap}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;animation:slide .3s ease}
.qsec{font-size:12.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--blue)}
.qp{font-size:19px;font-weight:800;line-height:1.5}
.qp q{quotes:"“" "”"}
.qs{font-size:19px;line-height:1.7;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qs b{background:var(--banana);color:var(--banana-ink);padding:0 4px;border-radius:5px}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--blue);text-align:center;font-weight:900;color:var(--blue)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;font-size:17px;font-weight:700;line-height:1.4;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-weight:900;font-size:14px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.5}
.opts.two .opt{justify-content:center;font-size:19px;font-weight:900}
.typerow{display:flex;gap:10px;flex-wrap:wrap}
.inp{flex:1 1 200px;min-width:0;height:54px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:800}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.inp.ok{border-color:var(--good);background:var(--good-soft)}
.inp.no{border-color:var(--bad);background:var(--bad-soft)}
.hintline{font-size:15px;font-weight:800;color:var(--warn)}
.fb{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;animation:fadeUp .25s ease}
.fb .fi{font-size:22px;line-height:1.2}
.fb b.t{display:block;font-weight:900;font-size:17.5px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb.mid{background:var(--warn-soft)}
.qfoot{display:flex;justify-content:flex-end;gap:10px}

/* results */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.big-score{font-family:var(--f-display);font-size:clamp(46px,10vw,70px);line-height:1;font-variant-numeric:tabular-nums}
.big-score.pass{color:var(--good)}
.big-score.fail{color:var(--bad)}
.earn{display:inline-flex;align-items:center;gap:8px;background:var(--vault);color:var(--banana);font-family:var(--f-display);font-size:20px;padding:10px 18px;border-radius:14px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.mistakes{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.mist{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15.5px}
.mist .y{color:var(--bad);font-weight:800}
.mist .r{color:var(--good);font-weight:900}

/* report */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:800;font-size:15px}
.rw.ok{background:var(--good-soft);border-color:transparent}
.rw.mid{background:var(--warn-soft);border-color:transparent}
.rw.low{background:var(--bad-soft);border-color:transparent}
.rw span{font-variant-numeric:tabular-nums;font-size:13.5px}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.skill:last-child{border-bottom:0}
.skill .br{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.skill .br i{display:block;height:100%;border-radius:99px}
.skill .pc{font-weight:900;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
table.log{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
table.log th,table.log td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.log th{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.tbl{overflow-x:auto}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

/* pin pad */
.pin{display:flex;flex-direction:column;align-items:center;gap:14px}
.pin-dots{display:flex;gap:12px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.f{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.pad button{height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:900;font-size:22px}

/* overlays */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(8,12,24,.6);display:grid;place-items:center;padding:16px;animation:fade .2s ease}
.modal{background:var(--surface);border-radius:var(--r-l);padding:22px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.modal .em{font-size:56px;line-height:1}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:24px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;max-width:min(520px,calc(100vw - 32px));background:var(--vault);color:var(--vault-ink);border-radius:16px;padding:12px 16px;font-weight:800;box-shadow:var(--shadow);animation:toastIn .3s ease}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.foot{margin-top:8px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes wob{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-12deg)}93%{transform:rotate(10deg)}97%{transform:rotate(-5deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .tools{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two-col{grid-template-columns:1fr}
}
@media (max-width:480px){
  body{font-size:16px}
  .brand small{display:none}
  .brand b{font-size:14.5px}
  .brand-badge{width:34px;height:34px;font-size:14px}
  .chip{padding:5px 9px;font-size:13px}
  .icon-btn{width:36px;height:36px}
  .topbar .wrap{flex-wrap:nowrap;gap:6px}
  .mission{grid-template-columns:auto minmax(0,1fr)}
  .mission .go{grid-column:1 / -1}
  .mission .go .btn{width:100%}
  .opts.two{grid-template-columns:1fr}
  .sa{grid-template-columns:1fr}
  .mgrid{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:6px}
  .mt{font-size:14px;padding:8px}
  .skill{grid-template-columns:minmax(0,1fr) 70px 44px}
  .qcard{padding:16px}
}
</style>

function weightedWords(n, filter){
  let pool = W.filter(filter || (() => true));

    const ws = pool.map((x) => { const m = mastery(x.w); return m == null ? 3 : 1 + 4 * (1 - m); });
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), k = 0;

function mcq(type, x, prompt, correct, wrongs, why, extra){
  const opts = shuffle([{html:correct, ok:true}].concat(wrongs.map((w) => ({html:w, ok:false}))));

const whyWord = (x) => `<b>${x.w}</b> (${x.pos}) = ${esc(x.d)}. <span lang="ar">${x.ars}</span>`;
const B = {
  def(x){ return mcq('def', x, `Which word means <q>${esc(x.d)}</q>?`, x.w, otherWords(x, 3).map((y) => y.w), whyWord(x)); },
  word(x){ return mcq('word', x, `What does <b>${x.w}</b> mean?`, esc(x.d), otherWords(x, 3).map((y) => esc(y.d)), whyWord(x)); },
  ar(x){ return mcq('ar', x, `Which English word means <span lang="ar">«${x.ars}»</span>?`, x.w, otherWords(x, 3).map((y) => y.w), whyWord(x)); },
  right(x){
    const sn = pick(x.S);
    const d = otherWords(x, 1, (y) => y.P.includes(sn.p))[0] || otherWords(x, 1)[0];
    const df = formOf(d, sn.f);
    const q = mcq('right', x, 'Choose the word that better completes the sentence.', sn.a, [df], `${whyWord(x)}<br><span class="muted">${esc(d.w)} = ${esc(d.d)}</span>`);

  },
  cloze(x){
    const sn = pick(x.S);

    while (ds.length < 3) { const z = otherWords(x, 1, (y) => !ds.includes(y))[0]; ds.push(z); }
    const q = mcq('cloze', x, 'Which word best fills the blank?', sn.a, ds.map((y) => formOf(y, sn.f)), whyWord(x));

  },
  syn(x){

      `<b>${x.w}</b> ≈ ${x.syn.join(', ')}. ${whyWord(x)}`, {cue});
  },
  ant(x){
    const cue = pick(x.AQ);

  },

    return mcq('context', x, `Read the sentence. In it, <b>${sn.a}</b> most nearly means…`, esc(x.d), otherWords(x, 3).map((y) => esc(y.d)), whyWord(x), {filled});

};
function buildQuiz(mix, onlyWords){
  const qs = []; const used = {};
  Object.keys(mix).forEach((type) => {
    const filt = (y) => (type === 'ant' ? y.AQ.length > 0 : true) && (!onlyWords || onlyWords.includes(y.w));
    const fresh = (y) => filt(y) && !used[y.w];
    let words = weightedWords(mix[type], fresh);
    if (words.length < mix[type]) words = words.concat(weightedWords(mix[type] - words.length, filt));
    words.forEach((x) => { used[x.w] = 1; qs.push(B[type](x)); });

}

  } catch (e) { /* no audio */ }
}

        secs.map((s) => { const v = S.sec[s]; const m = v && v.t ? v.c / v.t : null;
          return h('div', {class:'skill'}, h('span', null, s), h('div', {class:'br'}, h('i', {style:'width:' + (m == null ? 0 : pct(m)) + '%;background:' + color(m || 0)})), h('span', {class:'pc'}, m == null ? '—' : pct(m) + '%')); })),
      h('section', {class:'panel'}, h('div', {class:'sec-h', style:'margin-bottom:6px'}, h('h2', {style:'font-size:18px'}, 'Missions')),
        MISSIONS.map((m) => { const st = S.missions[m.id] || {}; const b = st.best;
          return h('div', {class:'skill'}, h('span', null, (m.boss ? '★ ' : (m.i + 1) + '. ') + m.name + (st.passed ? ' ✓' : '')), h('div', {class:'br'}, h('i', {style:'width:' + (b == null ? 0 : pct(b)) + '%;background:' + color(b || 0)})), h('span', {class:'pc'}, b == null ? '—' : pct(b) + '%')); }))),
    weak.length ? h('section', {class:'panel'},
      h('div', {class:'sec-h', style:'margin-bottom:8px'}, h('h2', {style:'font-size:18px'}, 'Focus words'), h('span', {class:'muted'}, 'Practise these before the test')),
      h('div', {class:'row'}, weak.slice(0, 8).map((o) => h('span', {class:'tag ' + (lvl(o.m) || '')}, o.x.w + (o.m == null ? '' : ' ' + pct(o.m) + '%')))),
      h('div', {class:'row', style:'margin-top:12px'}, h('button', {class:'btn btn-main', type:'button', onclick:() => startQuiz({id:'practice', name:'Practice', i:-1, pass:.8}, weak.slice(0, 6).map((o) => o.x.w))}, 'Practise weak words (10 questions)'))) : null,
    S.log.length ? h('section', {class:'panel'}, h('div', {class:'sec-h', style:'margin-bottom:6px'}, h('h2', {style:'font-size:18px'}, 'Recent attempts')),
      h('div', {class:'tbl'}, h('table', {class:'log'}, h('thead', null, h('tr', null, h('th', null, 'When'), h('th', null, 'Mission'), h('th', null, 'Score'))),
        h('tbody', null, S.log.slice(0, 12).map((l) => h('tr', null, h('td', null, new Date(l.at).toLocaleString('en-GB', {weekday:'short', hour:'2-digit', minute:'2-digit'})), h('td', null, MBY[l.m] ? MBY[l.m].name : l.m), h('td', null, l.s + '/' + l.n + ' (' + pct(l.s / l.n) + '%)'))))))) : null));
}

/* ---------- modal ---------- */
function showModal(em, title, text, buttons){
  const bg = h('div', {class:'modal-bg', role:'dialog', 'aria-modal':'true'});
  const close = () => bg.remove();
  bg.append(h('div', {class:'modal'}, h('div', {class:'em', 'aria-hidden':'true'}, em), h('h3', null, title), h('p', {class:'muted'}, text),
    h('div', {class:'row', style:'justify-content:center'}, buttons.map(([label, fn], i) => h('button', {class:'btn ' + (i === buttons.length - 1 ? 'btn-main' : 'btn-ghost'), type:'button', onclick:() => { close(); if (fn) fn(); }}, label)))));
  document.body.append(bg);
  const last = bg.querySelector('.btn-main'); if (last) last.focus();
}

/* ---------- boot ---------- */
$('#homeBtn').addEventListener('click', () => { if (view === 'quiz' && quiz) confirmLeave(); else home(); });
const sb = $('#soundBtn');
const paintSound = () => { sb.textContent = S.sound ? '🔊' : '🔇'; sb.setAttribute('aria-pressed', S.sound ? 'true' : 'false'); };
sb.addEventListener('click', () => { S.sound = !S.sound; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } paintSound(); });
paintSound();
home();
setTimeout(paintVault, 400);   /* the arcade ledger is ready after the page's first paint */
})();
</script>
