<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Units 1–3 Review Quest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2212%22 fill=%22%23FFD23F%22 stroke=%22%2314163A%22 stroke-width=%225%22/%3E%3Cpath d=%22M18 33l9 9 19-20%22 fill=%22none%22 stroke=%22%2314163A%22 stroke-width=%227%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#14163A; --ink-2:#4A4D78; --ink-3:#8A8DB0;
  --paper:#FFFFFF; --page:#E4F2FF; --dot:rgba(20,22,58,.07);
  --sun:#FFD23F; --sun-2:#FFF3C4;
  --good:#12A15E; --good-bg:#DCF7E9;
  --bad:#E23D45; --bad-bg:#FFE1E2;
  --warn:#C77700; --warn-bg:#FFF0D1;
  --c1:#2F7DE1; --c1t:#DCEBFF;
  --c2:#F39200; --c2t:#FFE8C2;
  --c3:#9A4FE0; --c3t:#EEE0FF;
  --c4:#119C77; --c4t:#D2F4E8;
  --col:var(--c1); --tint:var(--c1t);
  --shadow:4px 4px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --r:14px; --r-sm:10px;
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
.q-card:focus{outline:none}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.u-c1{--col:var(--c1);--tint:var(--c1t)} .u-c2{--col:var(--c2);--tint:var(--c2t)} .u-c3{--col:var(--c3);--tint:var(--c3t)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:3px solid var(--ink)}
.topbar-in{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-width:0}
.logo-mark{font-family:var(--display);font-size:28px;letter-spacing:.05em;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg);white-space:nowrap}
.unit-chip{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:#fff;padding:4px 8px;border-radius:6px;white-space:nowrap}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--sun-2);border:2px solid var(--ink);border-radius:999px;padding:3px 12px 3px 6px;white-space:nowrap}
.xp svg{width:20px;height:20px}
.xp.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:scale(1.18)}}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:2px 2px 0 var(--ink)}
.icon-btn svg{width:22px;height:22px}
@media (max-width:560px){.unit-chip{display:none}.logo-mark{font-size:24px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font-weight:800;font-size:16px;line-height:1.2;text-align:center;box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-go{background:var(--sun)}
.btn-ink{background:var(--ink);color:#fff}
.btn-col{background:var(--col);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn-sm{min-height:38px;padding:6px 12px;font-size:14px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.screen{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* home */
.hero{margin-top:20px;padding:20px;display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(42px,7vw,66px)}
.hero h1 span{color:var(--c2);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.hero p{margin-top:10px;max-width:52ch;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:2px solid var(--ink);border-radius:10px;padding:10px 6px;background:var(--page);text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
@media (max-width:680px){.hero{grid-template-columns:1fr}}
.banner{margin-top:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sun-2)}
.banner.alert{background:var(--bad-bg)}
.banner p{flex:1 1 260px}
.sec-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:34px 0 14px}
.sec-title h2{font-size:36px}
.sec-title p{color:var(--ink-2);font-size:14px}

/* unit cards */
.units{display:grid;gap:22px 16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));padding-top:8px}
.unit-card{position:relative;padding:16px;display:grid;gap:12px;align-content:start;background:var(--tint)}
.unit-head{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.unit-card h3{font-size:34px}
.land-num{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.badge{width:56px;height:56px;border-radius:50%;background:var(--col);border:3px solid var(--ink);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
.badge svg{width:32px;height:32px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;font-weight:700;padding:2px 9px;border:2px solid var(--ink);border-radius:999px;background:var(--paper)}
.unit-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.progress-note{font-size:13px;font-weight:700;color:var(--ink-2)}
.stars{display:flex;gap:2px}
.stars svg{width:24px;height:24px}
.unit-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.unit-btns .btn{padding:6px 8px}
.unit-btns .btn:last-child{grid-column:1 / -1}
.sticker{position:absolute;top:-19px;right:12px;font-family:var(--display);font-size:18px;letter-spacing:.05em;background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;transform:rotate(4deg);box-shadow:2px 2px 0 var(--ink)}
.sticker.ok{background:var(--good)}
.final{position:relative;margin:30px auto 0;max-width:620px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--sun)}
.final h3{font-size:34px}
.final p{font-size:14px;color:var(--ink)}
.final .row{grid-column:1 / -1}
.final .badge{background:var(--ink)}
.bank-head{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.bank-head h3{font-size:26px}
.bank-head i{width:16px;height:16px;border-radius:50%;background:var(--col);border:2px solid var(--ink)}
.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.bank{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;text-align:left;padding:10px 30px 10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:3px 3px 0 var(--col);display:grid;gap:1px;transition:transform .1s;min-width:0}
.tile:hover{transform:translate(-1px,-1px)}
.tile b{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--ink-2)}
.tile i{position:absolute;top:12px;right:10px;width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.tile i.ok{background:var(--good)} .tile i.slip{background:var(--sun)} .tile i.bad{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);display:inline-block}

/* word card */
.lesson-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.chip-land{font-family:var(--display);font-size:22px;letter-spacing:.04em;padding:3px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--col);color:#fff;-webkit-text-stroke:.5px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.lesson-top .counter{margin-left:auto}
.card{margin-top:14px;padding:16px;display:grid;gap:16px}
.word-head{display:grid;gap:12px;align-content:center;min-width:0;padding:6px 4px}
.word-title{font-family:var(--display);font-size:clamp(44px,7vw,78px);line-height:.95;letter-spacing:.03em;color:var(--col);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);overflow-wrap:anywhere}
.word-title.long{font-size:clamp(34px,6vw,60px)}
.word-title .l{display:inline-block;animation:letterPop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes letterPop{0%{transform:translateY(30px) scale(.3) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.word-count{font-size:13px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pos{font-size:13px;font-weight:800;padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--sun-2)}
.say{font-weight:700;font-size:19px;letter-spacing:.02em}
.say em{font-style:normal;background:var(--ink);color:#fff;padding:0 5px;border-radius:5px}
.info{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
@media (max-width:700px){.info{grid-template-columns:1fr}}
.box{border:2px solid var(--ink);border-radius:var(--r-sm);padding:12px 14px;background:var(--paper);min-width:0}
.box h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin:0 0 6px}
.kid-def{font-size:19px;font-weight:500;line-height:1.45}
.book-def{margin-top:10px;padding-top:8px;border-top:2px dashed var(--ink-3);font-size:14px;color:var(--ink-2)}
.trick{background:var(--sun-2);transform:rotate(.7deg);box-shadow:3px 3px 0 var(--ink)}
.trick p{font-size:17px;font-weight:500}
.sent{font-size:18px;line-height:1.7}
.blank{display:inline-block;min-width:5.5ch;margin:0 2px;padding:0 6px;border:0;border-bottom:3px solid var(--ink);background:var(--sun-2);border-radius:6px 6px 0 0;font-weight:800;color:var(--ink-2);text-align:center}
button.blank{font-size:inherit;line-height:1.3}
.blank.filled{background:var(--tint);color:var(--ink);animation:fillIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes fillIn{0%{transform:scale(.4)}100%{transform:none}}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.two-col{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;font-weight:600;padding:3px 10px;border-radius:8px;border:2px solid var(--ink)}
.chip.syn{background:var(--good-bg)} .chip.ant{background:var(--bad-bg)} .chip.fam{background:var(--tint)}
.none{color:var(--ink-2);font-size:14px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* flashcards */
.flash{display:grid;place-items:center;align-content:center;gap:12px;width:100%;min-height:290px;margin-top:14px;padding:24px 18px;text-align:center;background:var(--paper);color:var(--ink);font:inherit}
.flash.back{background:var(--tint)}
.flash.flip{animation:flip .32s ease-out}
@keyframes flip{0%{transform:perspective(900px) rotateY(80deg);opacity:.3}100%{transform:none;opacity:1}}
.flash .fw{font-family:var(--display);font-size:clamp(44px,12vw,80px);line-height:1;letter-spacing:.03em;color:var(--col);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);overflow-wrap:anywhere;max-width:100%}
.flash .fw.long{font-size:clamp(32px,8.5vw,58px)}
.flash .fdef{font-size:24px;font-weight:700;line-height:1.3}
.flash .fex{font-size:17px;color:var(--ink-2);max-width:46ch}
.flash .fex b{color:var(--ink)}
.tapnote{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.flash-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.flash-btns .btn{min-height:58px;font-size:18px}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--sun)}

/* questions */
.q-card{padding:18px;display:grid;gap:14px}
.q-kicker{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.q-text{font-size:20px;line-height:1.55;font-weight:500}
.q-text b{background:var(--sun-2);padding:0 5px;border-radius:5px;box-shadow:inset 0 -3px 0 var(--sun)}
.q-text .blank{min-width:7ch}
.q-how{font-size:14px;font-weight:700;color:var(--ink-2)}
.q-how b{color:var(--ink)}
.quote{margin:0;padding:12px 16px;border-left:6px solid var(--col);background:var(--tint);border-radius:0 10px 10px 0;font-size:17px;line-height:1.65}
.quote b{background:var(--paper);padding:0 4px;border-radius:4px}
.quote cite{display:block;margin-top:6px;font-style:normal;font-size:12px;font-weight:700;color:var(--ink-2)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:56px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:600;font-size:17px;line-height:1.35;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-width:0}
.opt > span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--page)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-bg);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad-bg);animation:shake .4s}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.04)}}
.fb{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:start;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;animation:slideUp .3s ease-out}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)} .fb.slip{background:var(--warn-bg)}
.fb .burst{font-family:var(--display);font-size:30px;line-height:1;transform:rotate(-4deg);-webkit-text-stroke:1px var(--ink)}
.fb.ok .burst{color:var(--good)} .fb.no .burst{color:var(--bad)} .fb.slip .burst{color:var(--sun)}
.fb .fb-body{font-size:16px;min-width:0;overflow-wrap:anywhere}
.fb .row{grid-column:1 / -1;justify-content:flex-end}
@media (max-width:420px){.fb{grid-template-columns:1fr}}
.spell{letter-spacing:.08em;white-space:nowrap}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.type-row{display:flex;gap:10px;flex-wrap:wrap}
.type-in{flex:1 1 220px;min-width:0;font:inherit;font-size:22px;font-weight:700;letter-spacing:.04em;padding:10px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink)}
.type-in:focus{outline:none;box-shadow:0 0 0 4px var(--sun)}
.type-in.ok{background:var(--good-bg)} .type-in.no{background:var(--bad-bg);animation:shake .4s} .type-in.slip{background:var(--warn-bg)}
.hint{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.hint-boxes{display:flex;flex-wrap:wrap;gap:4px}
.hb{width:20px;height:26px;border-bottom:3px solid var(--ink-3);display:grid;place-items:end center;font-weight:800;font-size:16px;color:var(--ink);text-transform:lowercase}
.test-top{display:grid;gap:10px;margin-top:16px}
.test-top .row{justify-content:space-between}
.round-name{font-family:var(--display);font-size:26px;letter-spacing:.04em}
.counter{font-weight:800;font-variant-numeric:tabular-nums}
.progress{height:16px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.progress i{display:block;height:100%;background:var(--sun);border-right:2px solid var(--ink);transition:width .4s}
.splash{margin-top:16px;padding:34px 20px;text-align:center;display:grid;gap:14px;justify-items:center;background:var(--sun)}
.splash .big{font-family:var(--display);font-size:clamp(46px,10vw,78px);line-height:1;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:5px 5px 0 var(--ink);animation:zoomIn .6s cubic-bezier(.3,1.6,.5,1)}
.splash .round-no{font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.splash p{max-width:46ch;font-size:17px}
@keyframes zoomIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.result-stars{display:flex;gap:10px;justify-content:center}
.result-stars span{display:inline-block;animation:starIn .6s cubic-bezier(.3,1.6,.5,1) both}
.result-stars svg{width:56px;height:56px;display:block}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}

/* report */
.report-head{margin-top:16px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.report-head .result-stars{justify-content:flex-start;margin-top:8px}
@media (max-width:600px){.report-head{grid-template-columns:1fr;justify-items:center;text-align:center}.report-head .row,.report-head .result-stars{justify-content:center}}
.ring{width:156px;height:156px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;align-content:center;font-family:var(--display);font-size:46px;line-height:1}
.ring .num small{font-family:var(--body);font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:.06em}
.rank{font-family:var(--display);font-size:clamp(36px,6vw,54px);line-height:1}
.report-head p{margin-top:6px;color:var(--ink-2)}
.bars{padding:16px;display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(130px,230px) 1fr auto;gap:10px 12px;align-items:center}
.bar-label{font-weight:700;line-height:1.25}
.bar-label small{display:block;font-weight:500;font-size:12px;color:var(--ink-2)}
.bar{height:22px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--col);border-right:2px solid var(--ink);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar i.zero{border-right:0}
.bar-end{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pct{font-weight:800;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.status{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:2px solid var(--ink);white-space:nowrap}
.status.good{background:var(--good-bg)} .status.mid{background:var(--warn-bg)} .status.low{background:var(--bad-bg)} .status.na{background:var(--page)}
@media (max-width:600px){.bar-row{grid-template-columns:1fr auto}.bar-row .bar{grid-column:1 / -1;grid-row:2}}
.word-chips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:700;box-shadow:2px 2px 0 var(--col)}
.wchip i{width:10px;height:10px;border-radius:50%;background:var(--col);border:2px solid var(--ink)}
.spell-list{display:grid;gap:8px;margin-top:12px}
.spell-list div{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 12px;border:2px dashed var(--ink-3);border-radius:10px;background:var(--warn-bg)}
.spell-list s{color:var(--bad);text-decoration-thickness:2px}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:p}
.plan li{counter-increment:p;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start;padding:14px;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.plan li::before{content:counter(p);grid-row:span 2;width:40px;height:40px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:24px}
.plan li > *{min-width:0}
.plan .row{margin-top:4px}
.history{padding:16px;display:flex;align-items:flex-end;gap:10px;min-height:170px;overflow-x:auto}
.hcol{flex:0 0 52px;display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink-2)}
.hbar{width:34px;background:var(--c1);border:2px solid var(--ink);border-radius:6px 6px 0 0}
.hbar.w{background:var(--c2)} .hbar.p{background:var(--c4)}
.hcol b{color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.answers{padding:6px 16px 16px}
.answers summary{cursor:pointer;font-weight:800;padding:10px 0}
.ans{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:2px dashed var(--ink-3);font-size:14px}
.ans > div{min-width:0;overflow-wrap:anywhere}
.ans .mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;color:#fff}
.ans .mark.ok{background:var(--good)} .ans .mark.no{background:var(--bad)} .ans .mark.slip{background:var(--sun);color:var(--ink)}
.ans small{color:var(--ink-2)}
.copy-note{font-size:13px;color:var(--ink-2)}
.copy-area{width:100%;min-height:170px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--ink);border-radius:10px;padding:10px;background:var(--page);color:var(--ink)}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.xp-float{position:fixed;z-index:60;font-family:var(--display);font-size:32px;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);text-shadow:2px 2px 0 var(--ink);pointer-events:none;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{transform:translate(-50%,-72px) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .word-title .l,.splash .big,.screen,.result-stars span,.fb,.opt,.flash,.blank.filled,.xp.bump{animation:none!important}
  .btn,.opt,.tile,.bar i,.progress i{transition:none!important}
}

  .ps-roomy li{margin-bottom:14pt;font-size:10.5pt}
}

/* Sadlier Vocabulary Workshop, Enriched Edition, Level A: Review Units 1–3 (book pages 42–49).

   the Unit 2 meanings, tricks and "use" sentences are reused from the Unit 2 page. */

  {key:"c1", name:"Unit 1", story:"The Desert Kitchen", icon:"tent",

   p: part-of-speech codes for fair wrong answers (a adjective, n noun, v verb, d adverb)

const UNIT1_WORDS = {
  apparel:{pos:"noun · verb", p:"nv", say:"uh-PAIR-ul",
    kid:"Apparel means clothing: the shirts, coats, shoes, and hats people wear.",
    def:"(n.) clothing, especially clothing of a certain kind; (v., rare) to dress or clothe",
    trick:"Apparel sounds like \"a pair\": a PAIR of shoes, a PAIR of socks, a PAIR of gloves. All apparel!",
    short:"clothing", syn:["clothing","clothes","garments","attire"], ant:[],
    ex:"The sports shop sells team {apparel}, from jerseys to caps.",
    ctx:"Hiking **apparel** should keep you warm and dry on the trail.", m:"clothing", cp:"n",
    sp:["bought new **clothing** for the school trip","n"], an:null,
    use:["The store sells sports apparel, such as jerseys, shorts, and sneakers.","We ate a delicious apparel of rice and fish for lunch.","The apparel of the storm knocked down three trees."], sh:"neu"},
  besiege:{pos:"verb", p:"v", say:"bih-SEEJ",
    kid:"To besiege is to surround a place and attack it, like an army around a castle. It also means to crowd around someone or flood them with questions or requests.",

    sp:["enemy troops **surrounded and attacked** the fort for months","v"], an:null,
    use:["Hungry seagulls besieged the boy holding the bag of chips.","She besieged her little sister to sleep by singing softly.","The tired hikers besieged quietly on a bench to rest."]},
  compress:{pos:"verb · noun", p:"vn", say:"kum-PRES",
    kid:"To compress is to squeeze or press something so it takes up less space. A compress (noun) is a soft pad you hold on a bump or a sore spot.",
    def:"(v.) to press or squeeze together; to make smaller or shorter; (n.) a soft pad pressed on part of the body",
    trick:"com-PRESS: PRESS it together until it's smaller, like squashing a sleeping bag into its sack.",
    short:"to squeeze into less space", syn:["squeeze","condense","compact","shorten"], ant:["expand","enlarge","stretch","lengthen"],
    ex:"Can you {compress} all these clothes into one small suitcase?",
    ctx:"Please **compress** your notes into one short page.", m:"to shorten or make smaller", cp:"v",
    sp:["**squeezed** the clay into a tiny ball","v"], an:["decided to **enlarge** the photo file","v"],
    use:["You can compress the sleeping bag into a tiny sack.","He compressed the balloon by blowing air into it until it was huge.","To compress a story, you add many more pages to it."], sh:"neu"},

    kid:"To denounce is to say openly and strongly that someone or something is wrong or bad, often in public.",

    trick:"de-NOUNCE sounds like an-NOUNCE: you loudly announce that something is wrong.",

    use:["The principal denounced bullying in a speech to the whole school.","Fans denounced their favorite player by cheering his amazing goal.","She denounced her best friend by giving her a birthday present."]},
  dispatch:{pos:"verb · noun", p:"vn", say:"dih-SPACH",
    kid:"To dispatch is to send someone or something off quickly to do a job. As a noun, a dispatch is an official message, and doing something \"with dispatch\" means doing it quickly.",
    def:"(v.) to send off quickly for a purpose; to finish quickly; (n.) an official message or news report; speed",

    use:["The pizza shop dispatched a driver with our order.","The teacher dispatched the lesson by sleeping through class.","He dispatched the letter by hiding it in his drawer forever."], sh:"neu"},
  douse:{pos:"verb", p:"v", say:"DOWS",
    kid:"To douse is to soak something with water, or to put out a fire or a light quickly.",

/* wrong answers: same part of speech first, never a word too close in meaning */
function fairWrong(word, posCode, scope, n){
  const pool = scope.filter(w => w !== word && !clash(w, word));
  const same = shuffle(pool.filter(w => WORDS[w].p.includes(posCode)));
  const rest = shuffle(pool.filter(w => !same.includes(w)));
  return same.concat(rest).slice(0, n);
}
/* make a playable copy: shuffles options; synonym/antonym wrong answers come from the words in scope
   (one unit for a warm-up), meaning wrong answers from all 60 words */
function inst(q, scope){
  const o = Object.assign({}, q), w = q.ws[0];
  if (q.type === "syn" || q.type === "ant"){
    o.opts = shuffle([w].concat(fairWrong(w, q.pos, scope, 3))); o.ans = o.opts.indexOf(w);
  } else if (q.type === "meaning"){
    const wrong = q.md ? q.md.slice() : fairWrong(w, q.cp, ALL, 3).map(x => WORDS[x].short);
    o.opts = shuffle([q.m].concat(wrong.filter(x => x !== q.m))); o.ans = o.opts.indexOf(q.m);
  } else if (q.type === "use"){
    const mixed = shuffle(q.sents.map((s, i) => ({s, ok:i === 0})));
    o.opts = mixed.map(x => x.s); o.ans = mixed.findIndex(x => x.ok); delete o.sents;
  } else if (q.type === "shade"){
    o.opts = SHADE_OPTS.slice(); o.ans = SHADE_KEYS.indexOf(q.cat);
  } else if (q.opts){
    const right = q.opts[q.ans]; o.opts = shuffle(q.opts.slice()); o.ans = o.opts.indexOf(right);
  }
  delete o.md; delete o.cp; delete o.m;
  o.round = ROUND_OF[q.type];
  return o;
}
function correctText(q){ return q.type === "type" ? q.answer : q.opts[q.ans]; }
function plainPrompt(q){

  if (q.type === "shade") return "Does \"" + w + "\" give a positive, negative, or neutral feeling?";
  if (q.type === "meaning") return "Meaning of the bold word: " + strip(q.prompt);
  if (q.type === "syn") return "Same as: " + strip(q.prompt);
  if (q.type === "ant") return "Opposite of: " + strip(q.prompt);
  if (q.type === "comp") return PASSAGES[q.u].title + ": " + strip(q.prompt);
  return strip(q.prompt);
}

/* pick n questions, preferring words (and units) that have been asked the least */
function pickBalanced(pool, n, cov, ucov){
  const items = shuffle(pool.slice()), out = [];
  for (let k = 0; k < n && items.length; k++){
    let best = 0, score = Infinity;
    items.forEach((it, i) => { const s = it.ws.reduce((a, w) => a + (cov[w] || 0), 0) * 10 + (ucov ? ucov[it.u] * 4 : 0); if (s < score){ score = s; best = i; } });
    const it = items.splice(best, 1)[0]; out.push(it); it.ws.forEach(w => { cov[w] = (cov[w] || 0) + 1; }); if (ucov) ucov[it.u]++;
  }
  return out;
}
function pickShades(pool, n, cov, ucov){
  const cats = shuffle(SHADE_KEYS.slice()), out = [];
  for (let k = 0; k < n; k++){
    const left = pool.filter(q => !out.includes(q)), inCat = left.filter(q => q.cat === cats[k % 3]);
    out.push(...pickBalanced(inCat.length ? inCat : left, 1, cov, ucov));
  }
  return out;
}
const FINAL_PLAN = [["comp",6],["two",5],["meaning",4],["syn",6],["ant",6],["use",5],["shade",3],["family",2],["type",3]];
const WARM_PLAN = [["comp",2],["two",1],["meaning",1],["syn",2],["ant",2],["use",2],["shade",1],["family",1],["type",1]];
const FINAL_N = FINAL_PLAN.reduce((s, x) => s + x[1], 0), WARM_N = WARM_PLAN.reduce((s, x) => s + x[1], 0);
function buildFinal(){

  const qs = FINAL_PLAN.flatMap(([p, n]) => { const got = p === "shade" ? pickShades(POOL.shade, n, cov, ucov) : pickBalanced(POOL[p], n, cov, ucov); return p === "family" || p === "type" ? got : shuffle(got); });
  return qs.map(q => inst(q, ALL));
}
function buildWarm(u){
  const scope = UNITS[u].words, cov = {};
  const qs = WARM_PLAN.flatMap(([p, n]) => { const inU = POOL[p].filter(q => q.u === u); return p === "shade" ? pickShades(inU, n, cov, null) : pickBalanced(inU, n, cov, null); });
  return qs.map(q => inst(q, scope));
}
function buildPractice(words, spellWords){
  const qs = [];
  words.forEach(w => {
    const picked = [], types = new Set();
    if ((spellWords || []).includes(w)){ const t = POOL.type.find(q => q.ws[0] === w); if (t){ picked.push(t); types.add("type"); } }
    const avail = shuffle(["syn", "ant", "use", "meaning", "type", "family", "comp", "two"].flatMap(p => POOL[p].filter(q => q.ws.includes(w))));
    for (const q of avail){ if (picked.length >= 2) break; if (!types.has(q.type) && !qs.includes(q)){ picked.push(q); types.add(q.type); } }
    picked.forEach(q => qs.push(q));
  });
  return shuffle(qs).slice(0, 16).sort((a, b) => ROUND_OF[a.type] - ROUND_OF[b.type]).map(q => inst(q, ALL));
}

/* ---------- WARM-UPS, FINAL REVIEW & PRACTICE ---------- */
function startRun(kind, qs, u){
  if (!qs.length) return;
  S.run = {kind, u:u == null ? null : u, qs, i:0, res:[], at:Date.now(), splash:-1, locked:false};
  save(); renderTest(); show("test"); focusQ();
}
function resumeRun(){
  const R = S.run; if (!R) return;
  R.locked = false; if (R.res.length > R.i) R.i = R.res.length; save();
  if (R.i >= R.qs.length) finishRun(); else { renderTest(); show("test"); focusQ(); }

function focusQ(){ setTimeout(() => { const c = $("#scr-test .q-card"); if (c && !$("#typeIn")) try { c.focus({preventScroll:true}); } catch (e) {} }, 40); }
function qBody(q){

  else if (q.type === "type") h += `<p class="q-text">${withBlank(q.prompt, '<span class="blank">&nbsp;</span>')}</p>`;
  if (q.type === "type"){
    h += `<div class="type-row"><input id="typeIn" class="type-in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type the word" aria-label="Your answer"><button class="btn btn-go" data-act="tsubmit">Check</button></div>
      <div class="hint"><span>Hint:</span><span class="hint-boxes" aria-hidden="true">${q.answer.split("").map((ch, k) => `<span class="hb">${k === 0 ? ch : ""}</span>`).join("")}</span><span>${q.answer.length} letters, starts with "${q.answer[0]}"</span></div>`;
  } else {
    h += `<div class="opts">${q.opts.map((o, k) => `<button class="opt" data-act="opt" data-i="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  return h + '<div class="fb-slot"></div>';
}
function markOptions(scope, q, picked){
  scope.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; b.classList.add(i === q.ans ? "right" : i === picked ? "wrong" : "dim"); });
}
function meaningsOf(q){
  if (q.type === "shade"){ const w = q.ws[0]; return `<b>${w}</b> (${esc(WORDS[w].short)}) has a ${{pos:"positive", neg:"negative", neu:"neutral"}[q.cat]} feeling.`; }
  return q.ws.map(w => `<b>${w}</b>: ${esc(WORDS[w].short)}.`).join("<br>");
}
function fbHTML(kind, q, extra, nextLabel){
  const head = kind === "ok" ? pick(["YES!", "BOOM!", "NAILED IT!", "SUPER!"]) : "OOPS!";
  const body = kind === "ok" ? meaningsOf(q) : `The answer is <b>${esc(correctText(q))}</b>.<br>${meaningsOf(q)}`;
  return `<div class="fb ${kind}"><span class="burst">${head}</span><div class="fb-body">${body}${extra || ""}</div><div class="row"><button class="btn btn-go" data-act="tnext" id="nextQ">${nextLabel}</button></div></div>`;
}
function runTitle(R, q){
  if (R.kind === "final") return "Round " + (q.round + 1) + ": " + ROUNDS[q.round].name;
  if (R.kind === "warm") return UNITS[R.u].name + " Warm-up";
  return "Weak Words Practice";
}
function renderTest(){
  const R = S.run, sec = $("#scr-test");

  const q = R.qs[R.i], round = ROUNDS[q.round], n = R.qs.length;
  sec.className = "screen" + (R.kind === "warm" ? " u-" + UNITS[R.u].key : "");
  if (R.kind === "final" && R.splash !== q.round){
    sec.innerHTML = `<div class="panel splash"><div class="round-no">Round ${q.round + 1} of ${ROUNDS.length}</div><div class="big">${round.name}</div>
      <p>${esc(round.how)}</p><p class="none" style="color:var(--ink)">${esc(round.from)}</p><button class="btn btn-ink" data-act="go" id="goBtn">Go!</button></div>`;
    setTimeout(() => { const g = $("#goBtn"); if (g) try { g.focus({preventScroll:true}); } catch (e) {} }, 40);
    return;
  }
  sec.innerHTML = `<div class="test-top"><div class="row"><span class="round-name">${esc(runTitle(R, q))}</span><span class="counter">Question ${R.i + 1} of ${n}</span></div>
      <div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${R.i}"><i style="width:${pctOf(R.i, n)}%"></i></div></div>
    <div class="panel q-card" tabindex="-1" style="margin-top:14px">${R.kind === "final" ? "" : `<div class="q-kicker">${esc(round.name)}</div>`}${qBody(q)}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn btn-sm" data-act="quit">Save &amp; exit</button><span class="none">Progress is saved on this device after every answer.</span></div>`;
  if (q.type === "type"){
    const inp = $("#typeIn");
    inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); submitTyped(); } });
    setTimeout(() => { try { inp.focus({preventScroll:true}); } catch (e) {} }, 60);
  }
}
function record(q, ok, slip, given){
  S.run.res.push({id:q.id, t:q.type, r:q.round, u:q.u, ws:q.ws, ok, slip, g:String(given || "").slice(0, 80), c:String(correctText(q)).slice(0, 160), p:plainPrompt(q).slice(0, 170)});
  save();
}
const nextLabel = () => S.run.i < S.run.qs.length - 1 ? "Next →" : "See my results →";
function answerOpt(i, btn){
  const R = S.run; if (!R || R.locked) return; R.locked = true;
  const q = R.qs[R.i], ok = i === q.ans, sec = $("#scr-test");
  markOptions(sec, q, i); record(q, ok, false, q.opts[i]);
  if (ok){ Sound.good(); FX.burstEl(btn, 24); addXP(10, btn); } else Sound.bad();
  sec.querySelector(".fb-slot").innerHTML = fbHTML(ok ? "ok" : "no", q, "", nextLabel());
  announce(ok ? "Correct!" : "Not correct. The answer is " + correctText(q));
  const nb = $("#nextQ"); if (nb) try { nb.focus({preventScroll:true}); } catch (e) {}
}
function submitTyped(){
  const R = S.run; if (!R || R.locked) return;
  const q = R.qs[R.i], inp = $("#typeIn"), given = (inp.value || "").trim(), t = norm(given);
  if (!t){ inp.placeholder = "type a word first"; inp.focus(); return; }
  R.locked = true;
  const forms = q.accept.map(norm);
  let kind = "no";
  if (forms.includes(t)) kind = "ok";
  else {
    const d = Math.min.apply(null, forms.map(f => lev(t, f)));
    const lim = q.answer.length <= 5 ? 1 : q.answer.length <= 9 ? 2 : 3;
    if (d <= lim && t.length >= 3 && !ALL.includes(t)) kind = "slip";
  }
  inp.disabled = true; inp.classList.add(kind);
  const sb = $('#scr-test [data-act="tsubmit"]'); if (sb) sb.disabled = true;
  record(q, kind === "ok", kind === "slip", given);
  const slot = $("#scr-test .fb-slot");
  if (kind === "ok"){
    Sound.good(); FX.burstEl(inp, 24); addXP(10, inp);
    slot.innerHTML = fbHTML("ok", q, t !== norm(q.answer) ? `<br>This sentence needs the form <b>${q.answer}</b>.` : "", nextLabel());
  } else if (kind === "slip"){
    Sound.tap(); addXP(5, inp);
    slot.innerHTML = `<div class="fb slip"><span class="burst">SO CLOSE!</span><div class="fb-body">Right word, but check the spelling. You wrote <s>${esc(given)}</s>. It's spelled <b class="spell">${q.answer.toUpperCase().split("").join(" ")}</b>.</div>
      <div class="row"><button class="btn btn-go" data-act="tnext" id="nextQ">${nextLabel()}</button></div></div>`;
  } else {
    Sound.bad();
    slot.innerHTML = fbHTML("no", q, `<br>You wrote "${esc(given)}".`, nextLabel());
  }
  announce(kind === "ok" ? "Correct!" : kind === "slip" ? "Right word, spelling slip. It is spelled " + q.answer : "Not correct. The answer is " + q.answer);
  const nb = $("#nextQ"); if (nb) try { nb.focus({preventScroll:true}); } catch (e) {}
}
function nextQ(){
  const R = S.run; if (!R || !R.locked) return;
  R.locked = false; R.i++; save();
  if (R.i >= R.qs.length) finishRun(); else { renderTest(); window.scrollTo(0, 0); focusQ(); }
}
function analyze(R){
  const res = R.res, n = res.length;
  const pts = res.reduce((s, r) => s + (r.ok ? 1 : r.slip ? .5 : 0), 0);
  const byU = UNITS.map(() => [0, 0]);
  res.forEach(r => { byU[r.u][1]++; if (r.ok || r.slip) byU[r.u][0]++; });
  const skills = {}; SK.forEach(([k]) => { skills[k] = [0, 0]; });
  res.forEach(r => {
    skills[r.t][1]++; if (r.ok || r.slip) skills[r.t][0]++;
    if (r.t === "type" && (r.ok || r.slip)){ skills.spell[1]++; if (r.ok) skills.spell[0]++; }
  });
  const words = {};
  res.forEach(r => r.ws.forEach(w => { const x = words[w] || (words[w] = {t:0, ok:0, slip:0, bad:0}); x.t++; if (r.ok) x.ok++; else if (r.slip) x.slip++; else x.bad++; }));
  return {id:"a" + Date.now().toString(36), kind:R.kind, u:R.u, at:Date.now(), n, pts, pct:pctOf(pts, n), byU, skills, words, res};
}
function finishRun(){
  const R = S.run, att = analyze(R);
  if (R.kind === "warm"){
    const stars = att.pct >= 90 ? 3 : att.pct >= 70 ? 2 : 1, prev = S.units[R.u] || {};
    S.units[R.u] = {stars:Math.max(prev.stars || 0, stars), best:Math.max(prev.best || 0, att.pct), last:att.pct, at:Date.now()};
    att.stars = stars; S.xp += stars * 10;
  }
  S.attempts.push(att); if (S.attempts.length > 40) S.attempts.splice(0, S.attempts.length - 40);
  Object.keys(att.words).forEach(w => {
    const x = att.words[w], m = S.mastery[w] || (S.mastery[w] = {ok:0, bad:0, slip:0, last:""});
    m.ok += x.ok; m.bad += x.bad; m.slip += x.slip; m.last = x.bad ? "bad" : x.slip ? "slip" : "ok";
  });
  S.run = null; save();
  const v = $("#xpVal"); if (v) v.textContent = S.xp;
  showReport(att.id); Sound.win(); if (att.pct >= 60) FX.party();
}

/* ---------- REPORT & WEAK SPOTS ---------- */
let lastReportId = null;
const statusOf = (a, t) => !t ? ["na", "Not tested"] : {good:["good", "Mastered"], mid:["mid", "Almost there"], low:["low", "Go back here"]}[levelOf(a, t)];
const rankOf = p => p >= 90 ? "WORD MASTER" : p >= 75 ? "WORD HERO" : p >= 50 ? "WORD EXPLORER" : "WORD ROOKIE";
const ptsTxt = a => Number.isInteger(a.pts) ? String(a.pts) : a.pts.toFixed(1);
const kindName = a => a.kind === "final" ? "Final Review" : a.kind === "warm" ? UNITS[a.u].name + " Warm-up" : "Weak Words Practice";
function showReport(id){
  const att = S.attempts.find(a => a.id === id) || S.attempts[S.attempts.length - 1];
  if (!att){ renderHome(); show("home"); return; }
  lastReportId = att.id; renderReport(att); show("report"); animateReport(att);
}
function summaryLine(att){
  const weak = att.byU.map(([a, t], i) => ({i, a, t})).filter(x => x.t && levelOf(x.a, x.t) !== "good").map(x => UNITS[x.i].name);
  if (!weak.length) return "Every unit tested is at 85% or more. Brilliant!";
  return `${att.kind === "warm" ? "This unit needs" : "Units that need"} another look: <b>${weak.join(", ")}</b>. Your study plan below shows exactly what to do next.`;
}
function planFor(att){
  const steps = [], ww = weakWords(att), sw = spellSlips(att);
  const us = att.byU.map(([a, t], i) => ({i, a, t, p:pctOf(a, t), lv:levelOf(a, t)})).filter(x => x.t).sort((x, y) => x.p - y.p);
  const missedIn = i => UNITS[i].words.filter(w => att.words[w] && att.words[w].bad);
  us.filter(x => x.lv === "low").forEach(x => {
    const U = UNITS[x.i], m = missedIn(x.i);
    steps.push({text:`Go back to <b>${U.name}</b>: flip all 20 flashcards, then play the ${U.name} warm-up. You got ${x.a} of ${x.t} there${m.length ? "; the tricky words were <b>" + m.join(", ") + "</b>" : ""}.`,
      btn:`<button class="btn btn-sm btn-col u-${U.key}" data-act="cards" data-u="${x.i}">${U.name} flashcards</button><button class="btn btn-sm" data-act="warm" data-u="${x.i}">${U.name} warm-up</button>`});
  });
  us.filter(x => x.lv === "mid").forEach(x => {
    const U = UNITS[x.i], m = missedIn(x.i).slice(0, 6);
    steps.push({text:`Quick review in <b>${U.name}</b>${m.length ? ": open the cards for <b>" + m.join(", ") + "</b>" : ""}.`,
      btn:m.length ? m.map(w => `<button class="btn btn-sm" data-act="word" data-w="${w}" data-from="report">Open "${w}"</button>`).join("") : `<button class="btn btn-sm" data-act="cards" data-u="${x.i}">${U.name} flashcards</button>`});
  });
  if (sw.length) steps.push({text:`Spelling practice: <b>${[...new Set(sw.map(s => s.w))].join(", ")}</b>. Say the word slowly, cover it, write it, then check it. Do it three times.`,
    btn:`<button class="btn btn-sm" data-act="spellprac" data-id="${att.id}">Spelling round</button>`});
  const sk = SK.map(([k]) => ({k, a:att.skills[k][0], t:att.skills[k][1]})).filter(x => x.t >= 2 && x.a / x.t < .7).sort((x, y) => x.a / x.t - y.a / y.t)[0];
  if (sk) steps.push({text:`Tricky question type: <b>${SK.find(x => x[0] === sk.k)[1]}</b>. ${esc(SKILL_TIPS[sk.k])}`});
  if (ww.length) steps.push({text:`Lock it in with <b>Weak Words Practice</b>: up to ${Math.min(16, ww.length * 2)} new questions only on the words you missed.`,
    btn:`<button class="btn btn-sm btn-go" data-act="practice" data-id="${att.id}">Start practice</button>`});
  if (!steps.length) steps.push({text:"No weak spots at all. Amazing! Take the Final Review again (it picks different questions each time) or teach five of the words to someone at home.",
    btn:`<button class="btn btn-sm btn-go" data-act="final">Final Review</button>`});
  return steps;
}
function reportText(att){
  const out = ["Review Quest · Sadlier Vocabulary Workshop Level A, Units 1–3",
    kindName(att) + " · " + fmtDate(att.at),
    "Score: " + ptsTxt(att) + " / " + att.n + " (" + att.pct + "%) · " + rankOf(att.pct), "", "Units:"];
  UNITS.forEach((U, i) => { const [a, t] = att.byU[i]; if (t) out.push("  " + U.name + ": " + a + "/" + t + " (" + pctOf(a, t) + "%) " + statusOf(a, t)[1]); });
  out.push("", "Skills:");
  SK.forEach(([k, label]) => { const [a, t] = att.skills[k]; if (t) out.push("  " + label + ": " + a + "/" + t + " (" + pctOf(a, t) + "%)"); });
  const ww = weakWords(att), sw = spellSlips(att);
  out.push("", "Words to practice: " + (ww.length ? ww.join(", ") : "none"));
  if (sw.length) out.push("Spelling slips: " + sw.map(s => s.g + " → " + s.c).join("; "));
  return out.join("\n");
}
function barRow(label, sub, a, t, extraClass, style){
  const [cls, st] = statusOf(a, t);
  return `<div class="bar-row ${extraClass || ""}" ${style ? `style="${style}"` : ""}><div class="bar-label">${label}<small>${sub}</small></div>
    <div class="bar"><i data-w="${pctOf(a, t)}"></i></div><div class="bar-end"><span class="pct">${t ? pctOf(a, t) + "%" : "–"}</span><span class="status ${cls}">${st}</span></div></div>`;
}
function renderReport(att){
  const sec = $("#scr-report"), C = 2 * Math.PI * 62;
  const ringCol = att.pct >= 85 ? "var(--good)" : att.pct >= 60 ? "var(--sun)" : "var(--bad)";
  const ww = weakWords(att), sw = spellSlips(att), hist = S.attempts.slice(-8);
  let h = `<div class="panel report-head">
    <div class="ring"><svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="62" fill="none" style="stroke:var(--page);stroke-width:16"/>
      <circle id="ringArc" cx="75" cy="75" r="62" fill="none" style="stroke:${ringCol};stroke-width:16;stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${C.toFixed(1)};transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/>
      <circle cx="75" cy="75" r="70" fill="none" style="stroke:var(--ink);stroke-width:3"/><circle cx="75" cy="75" r="54" fill="none" style="stroke:var(--ink);stroke-width:3"/></svg>
      <div class="num"><span id="ringNum">${reduceMotion ? att.pct : 0}%</span><small>${ptsTxt(att)} / ${att.n}</small></div></div>
    <div><div class="q-kicker">${kindName(att)} · ${fmtDate(att.at)}</div><div class="rank">${rankOf(att.pct)}</div>
      ${att.stars ? `<div class="result-stars" role="img" aria-label="${att.stars} of 3 stars">${[1, 2, 3].map((k, i) => `<span style="animation-delay:${i * .18}s">${STAR(att.stars >= k)}</span>`).join("")}</div>` : ""}
      <p>${summaryLine(att)}</p>
      <div class="row" style="margin-top:12px">${ww.length ? `<button class="btn btn-go" data-act="practice" data-id="${att.id}">Practice my weak words (${ww.length})</button>` : ""}
        ${att.kind === "warm" ? `<button class="btn" data-act="warm" data-u="${att.u}">Warm-up again</button>` : ""}<button class="btn" data-act="final">${att.kind === "final" ? "Try the Final again" : "Final Review"}</button><button class="btn btn-sm" data-act="home">Home</button></div></div></div>`;
  h += `<div class="sec-title"><h2>${att.kind === "warm" ? "Your Unit" : "Your Units"}</h2><p>How well you understood ${att.kind === "warm" ? "this unit's" : "each unit's"} words. A spelling slip still counts as understood here.</p></div><div class="panel bars">`;
  UNITS.forEach((U, i) => { if (att.kind === "warm" && i !== att.u) return; const [a, t] = att.byU[i]; h += barRow(U.name, t ? a + " of " + t + " right" : "no questions this time", a, t, "u-" + U.key); });
  h += `</div><div class="sec-title"><h2>Your Skills</h2><p>Which kind of question was easy, and which was tricky.</p></div><div class="panel bars">`;
  SK.forEach(([k, label]) => { const [a, t] = att.skills[k]; h += barRow(label, t ? a + " of " + t : (k === "spell" ? "no typed answers to check" : "not in this round"), a, t, "", "--col:#4A4D78"); });
  h += `</div><div class="sec-title"><h2>Words to Practice</h2><p>Tap a word to open its card again.</p></div><div class="panel" style="padding:16px">`;
  h += ww.length ? `<div class="word-chips">${ww.map(w => `<button class="wchip u-${UNITS[U_OF[w]].key}" data-act="word" data-w="${w}" data-from="report"><i></i>${w}</button>`).join("")}</div>` : "<p>No weak words this time. Every word was right!</p>";
  if (sw.length) h += `<div class="spell-list"><b>Spelling watch</b>${sw.map(s => `<div>You wrote <s>${esc(s.g)}</s> → it's <b class="spell">${esc(s.c)}</b></div>`).join("")}</div>`;
  h += `</div><div class="sec-title"><h2>Your Study Plan</h2><p>Do these in order.</p></div><ol class="plan">${planFor(att).map(s => `<li><div>${s.text}</div>${s.btn ? `<div class="row">${s.btn}</div>` : ""}</li>`).join("")}</ol>`;
  if (hist.length > 1) h += `<div class="sec-title"><h2>Progress</h2><p>Your last ${hist.length} rounds. Blue = Final Review, orange = warm-up, green = practice.</p></div>
    <div class="panel history">${hist.map(a => `<div class="hcol"><b>${a.pct}%</b><div class="hbar ${a.kind === "final" ? "" : a.kind === "warm" ? "w" : "p"}" style="height:${Math.max(6, a.pct)}px"></div><span>${fmtDate(a.at).split(",")[0]}</span></div>`).join("")}</div>`;
  h += `<div class="sec-title"><h2>Every Answer</h2><p>Check what you picked and what was right.</p></div>
    <details class="panel answers"><summary>Show all ${att.n} answers</summary>${att.res.map((r, i) => `<div class="ans"><span class="mark ${r.ok ? "ok" : r.slip ? "slip" : "no"}" aria-label="${r.ok ? "right" : r.slip ? "spelling slip" : "wrong"}">${r.ok ? "✓" : r.slip ? "~" : "✗"}</span>
      <div><small>${i + 1}. ${esc(ROUNDS[r.r].name)} · ${esc(r.ws.join(" + "))}</small><div>${esc(r.p)}</div><div>${r.ok ? "" : "Your answer: <b>" + esc(r.g || "—") + "</b> · "}Correct: <b>${esc(r.c)}</b></div></div></div>`).join("")}</details>`;
  h += `<div class="sec-title"><h2>For a Parent</h2><p>Copy this summary to send or keep.</p></div>
    <div class="panel" style="padding:16px;display:grid;gap:10px"><textarea class="copy-area" id="copyText" readonly aria-label="Report summary">${esc(reportText(att))}</textarea>
    <div class="row"><button class="btn btn-sm btn-go" data-act="copy">Copy summary</button><span class="copy-note" id="copyNote"></span></div></div>`;
  sec.innerHTML = h;
}
function animateReport(att){
  const sec = $("#scr-report"), C = 2 * Math.PI * 62;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    sec.querySelectorAll(".bar i").forEach(i => { const w = +i.dataset.w; i.style.width = w + "%"; if (!w) i.classList.add("zero"); });
    const arc = $("#ringArc"); if (arc) arc.style.strokeDashoffset = (C * (1 - att.pct / 100)).toFixed(1);
    const num = $("#ringNum"); if (!num || reduceMotion) return;
    const t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 1100); num.textContent = Math.round(att.pct * (1 - Math.pow(1 - k, 3))) + "%"; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }));
}
function copyReport(){
  const ta = $("#copyText"), note = $("#copyNote"); if (!ta) return;
  const fallback = () => { ta.focus(); ta.select(); note.textContent = "Selected. Press copy on your keyboard or menu."; };
  try { navigator.clipboard.writeText(ta.value).then(() => { note.textContent = "Copied!"; }, fallback); } catch (e) { fallback(); }
}

/* ---------- EVENTS ---------- */
let discardArm = false;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.act){
    case "home": renderHome(); show("home"); break;
    case "sound": S.sound = !S.sound; save(); renderSoundBtn(); Sound.tap(); break;
    case "word": openWord(d.w, d.from || null); break;
    case "say": speak(d.t); break;
    case "saysent": speak(WORDS[WV.w].ex.replace(/\{([^}]+)\}/, "$1")); break;
    case "fill": fillBlank(b); break;
    case "cards": startCards(+d.u); break;
    case "cardsback": if (FC){ renderCards(false); show("cards"); } else { renderHome(); show("home"); } break;
    case "cardsmiss": if (FC) startCards(FC.u, shuffle(FC.miss.slice())); break;
    case "flip": if (FC){ FC.flip = !FC.flip; Sound.tap(); renderCards(!reduceMotion); const fc = $("#flashCard"); if (fc) try { fc.focus({preventScroll:true}); } catch (err) {} } break;
    case "know": knowCard(+d.k, b); break;
    case "warm": startRun("warm", buildWarm(+d.u), +d.u); break;
    case "final": startRun("final", buildFinal()); break;
    case "resume": resumeRun(); break;
    case "discard":
      if (!discardArm){ discardArm = true; b.textContent = "Tap again to start over"; setTimeout(() => { discardArm = false; }, 4000); }
      else { discardArm = false; S.run = null; save(); renderHome(); }
      break;
    case "go": if (S.run){ S.run.splash = S.run.qs[S.run.i].round; save(); renderTest(); focusQ(); } break;
    case "opt": answerOpt(+d.i, b); break;
    case "tsubmit": submitTyped(); break;
    case "tnext": nextQ(); break;
    case "quit": renderHome(); show("home"); break;
    case "report": showReport(d.id); break;
    case "backreport": showReport(lastReportId); break;
    case "practice": {
      const att = S.attempts.find(x => x.id === d.id) || lastFinal(), ww = weakWords(att);
      if (ww.length) startRun("practice", buildPractice(ww, spellSlips(att).filter(s => !att.words[s.w].bad).map(s => s.w)));
      break;
    }
    case "spellprac": {
      const att = S.attempts.find(x => x.id === d.id), ws = [...new Set(spellSlips(att).map(s => s.w))];
      if (ws.length) startRun("practice", shuffle(ws.map(w => inst(POOL.type.find(q => q.ws[0] === w), ALL))));
      break;
    }
    case "copy": copyReport(); break;
  }
});
document.addEventListener("keydown", e => {
  if (current !== "test" || !S.run || e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (document.activeElement || {}).tagName;
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key === "Enter"){
    if (tag === "BUTTON") return;
    const go = $("#goBtn") || (S.run.locked ? $("#nextQ") : null);
    if (go){ e.preventDefault(); go.click(); }
    return;
  }
  if (S.run.locked) return;
  const k = e.key.toLowerCase(), idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (k.length === 1 && idx >= 0){ const opt = document.querySelectorAll("#scr-test .opt")[idx]; if (opt) opt.click(); }
});

/* ---------- PRINT SHEET: A4 word list + a short test per unit, shown only when printing ---------- */
const PRINT_TEST_IDX = [17, 1, 9, 5, 13]; /* five fixed words per unit, spread through its list */
function buildPrintSheet(){
  const one = a => (a && a.length) ? a[0] : "—";
  let h = '<header class="ps-head"><h1>Units 1–3 Word List</h1><p>Class 6.3 · Sadlier Vocabulary Workshop Level A · Review Units 1–3 (book pages 42–49)</p></header>';
  UNITS.forEach((u, ui) => {
    h += '<section class="ps-unit' + (ui ? " ps-page" : "") + '"><h2>' + esc(u.name) + '</h2>'
      + '<table class="ps-table"><colgroup><col style="width:18%"><col style="width:15%"><col style="width:35%"><col style="width:16%"><col style="width:16%"></colgroup>'
      + '<thead><tr><th>Word</th><th>Part of speech</th><th>Meaning</th><th>Synonym</th><th>Antonym</th></tr></thead><tbody>'
      + u.words.map(w => {
          const W = WORDS[w];
          return '<tr><td><b>' + esc(w) + '</b></td><td>' + esc(W.pos) + '</td><td>' + esc(W.short) + '</td><td>' + esc(one(W.syn)) + '</td><td>' + esc(one(W.ant)) + '</td></tr>';
        }).join("")
      + '</tbody></table>';
    const qs = PRINT_TEST_IDX.map(i => u.words[i]);
    h += '<div class="ps-test"><h3>Test yourself</h3><p>Write the word from the box that completes each sentence. Change its form if you need to.</p>'
      + '<div class="ps-box">' + qs.slice().sort().map(w => '<span>' + esc(w) + '</span>').join(" · ") + '</div><ol>'
      + qs.map(w => '<li>' + esc(WORDS[w].ex).replace(/\{[^}]+\}/, '<span class="ps-blank"></span>') + '</li>').join("")
      + '</ol><p class="ps-key"><b>Answers:</b> ' + qs.map((w, i) => '<span>' + (i + 1) + ". " + esc(WORDS[w].ex.match(/\{([^}]+)\}/)[1]) + '</span>').join(" · ") + '</p></div></section>';
  });
  $("#printSheet").innerHTML = h;
}

/* ---------- START ---------- */
if (canSpeak) try { speechSynthesis.getVoices(); } catch (e) {}
$("#xpVal").textContent = S.xp;
renderSoundBtn();
renderHome();
buildPrintSheet();
</script>
</body></html>
