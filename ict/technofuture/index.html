      <div><p class="rank">${rank}</p><p>Final Test · ${fmtDate(last.t)}${S.attempts.length > 1 ? ` · best ${best}%` : ""}</p>
        ${pct >= 85 ? `<span class="ready">QUIZ-READY!</span>` : `<span class="notready">Goal: 85% · ${85 - pct} more points to go</span>`}
        <div class="row" style="margin-top:12px"><button class="btn btn-go btn-sm" data-act="start-review">Take the test again</button><button class="btn btn-sm" data-act="home">${BACK} Home</button></div></div></div>`;
  })() : `<div class="report-head panel"><div class="ring" role="img" aria-label="No Final Test yet"><svg viewBox="0 0 156 156"><circle cx="78" cy="78" r="64" fill="none" stroke="#FBEEE8" stroke-width="18"/><circle cx="78" cy="78" r="73" fill="none" stroke="#14163A" stroke-width="2"/><circle cx="78" cy="78" r="55" fill="none" stroke="#14163A" stroke-width="2"/></svg><div class="num">–<small>no test yet</small></div></div>
      <div><p class="rank">My Report</p><p>No Final Test yet. The bars below use your quick checks and the Ribbon Lab.</p><div class="row" style="margin-top:12px"><button class="btn btn-go btn-sm" data-act="review">Take the Final Test</button><button class="btn btn-sm" data-act="home">${BACK} Home</button></div></div></div>`;
  const stats = PARTS.map(p => Object.assign({p}, partStats(p.id)));
  const rows = stats.map(s => {
    const p = s.p, pc = s.pct, cls = pc === null ? "na" : pc >= 85 ? "good" : pc >= 60 ? "mid" : "low";
    const lab = pc === null ? "Not tried" : pc >= 85 ? "Strong" : pc >= 60 ? "Review" : "Replay";
    const src = [s.qc ? `Quick checks ${s.qc[0]}/${s.qc[1]}` : "Quick checks –", s.ft ? `Final Test ${s.ft[0]}/${s.ft[1]}` : "Final Test –", s.lab ? `Ribbon Lab ${s.lab[0]}/${s.lab[1]}` : (["window", "slides", "buttons", "master"].includes(p.id) ? "Ribbon Lab –" : "")].filter(Boolean);
    return `<div class="bar-row col-${p.col}"><div class="bar-label">Part ${p.n} · ${p.name}<small>${p.book}</small></div><div class="bar"><i class="${pc ? "" : "zero"}" data-w="${pc || 0}"></i></div><div class="bar-end"><span class="pct">${pc === null ? "–" : pc + "%"}</span><span class="status ${cls}">${lab}</span></div><div class="src">${src.map(x => `<span>${x}</span>`).join("")}</div></div>`;
  }).join("");
  const tried = stats.filter(s => s.pct !== null).sort((a, b) => a.pct - b.pct || a.n - b.n);
  const untried = stats.filter(s => s.pct === null);
  const weak = untried.length > 4 ? untried.slice(0, 3) : tried.slice(0, 3);
  while (weak.length < 3 && untried.length) weak.push(untried.shift());
  const weakHTML = weak.length ? weak.map(s => {
    const ms = MIS_BY_PART[s.p.id] || [];
    const msg = s.pct === null ? "Not tried yet. Read the cards and do the quick check" : s.pct >= 85 ? "Already strong. A quick look at the cards keeps it fresh" : "Read the cards again and redo the quick check for 3 stars";
    return `<li><b>Part ${s.p.n}: ${s.p.name} · ${s.pct === null ? "not tried yet" : s.pct + "%"}</b><span>${msg}${ms.length ? `, then do Mission ${ms.map(m => misOf(m).n).join(" and ")} in PowerPoint` : ""}.</span>
      <div class="row"><button class="btn btn-sm btn-go" data-act="open" data-part="${s.p.id}">Open Part ${s.p.n} ${ARROW}</button>${ms.map(m => `<button class="btn btn-sm" data-act="missions" data-mis="${m}">Mission ${misOf(m).n}</button>`).join("")}</div></li>`;
  }).join("") : `<li><b>No weak parts!</b><span>Every part you tried is at 85% or more. Keep it fresh with a Ribbon Hunt.</span><div class="row"><button class="btn btn-sm btn-go" data-act="lab" data-game="hunt">Ribbon Hunt ${ARROW}</button></div></li>`;
  const plan = [];
  const noQC = PARTS.filter(p => !chState(p.id).done);
  if (noQC.length) plan.push(`Finish the quick checks for Part${noQC.length > 1 ? "s" : ""} ${noQC.map(p => p.n).join(", ")}.`);
  if (S.lab.hunt.best === null || S.lab.hunt.best < 8) plan.push("Play the Ribbon Hunt until you get 8/10 or more right first time.");
  if (S.lab.link.best === null || S.lab.link.best < LINKS.length) plan.push(`Play the Link Lab until you get ${LINKS.length}/${LINKS.length}.`);
  const misLeft = MISSIONS.filter(m => !m.timer && !misDone(m));
  if (misLeft.length) plan.push(`On a computer: finish Mission${misLeft.length > 1 ? "s" : ""} ${misLeft.map(m => m.n).join(", ")}.`);
  if (best === null || best < 85) plan.push(best === null ? "Take the Final Test (goal: 85%)." : `Take the Final Test again: your best is ${best}%, the goal is 85%.`);
  if (!S.timer.best || S.timer.best > 25 * 60000) plan.push("Do the Speed Run (Mission 6): the whole project in 25 minutes or less.");
  if (!plan.length) plan.push("You are quiz-ready! On quiz morning, read the cheat sheet for 5 minutes.");
  const hist = S.attempts.slice(-8);
  $("#scr-report").innerHTML = `${head}
    <div class="sec-title"><h2>Accuracy per part</h2><p>Your recent answers in quick checks, Final Tests and the Ribbon Lab</p></div>
    <div class="bars panel">${rows}</div>
    <div class="sec-title"><h2>Your 3 weakest parts</h2><p>${weak.length ? (weak[0].pct !== null && weak[0].pct >= 85 ? "All strong: nice work!" : "Start with the first one") : "Nice work"}</p></div>
    <ol class="plan">${weakHTML}</ol>
    <div class="sec-title"><h2>What to do next</h2><p>A short plan</p></div>
    <div class="howto panel" style="margin-top:0"><ol>${plan.map(t => `<li>${t}</li>`).join("")}</ol><div class="row"><button class="btn btn-sm" data-act="missions">Missions</button><button class="btn btn-sm" data-act="lab">Ribbon Lab</button><button class="btn btn-sm" data-act="print">Print the cheat sheet</button></div></div>
    ${hist.length > 1 ? `<div class="sec-title"><h2>Your progress</h2><p>Last ${hist.length} Final Tests</p></div><div class="history panel" role="img" aria-label="Final Test scores over time">${hist.map(h => `<div class="hcol"><b>${h.pct}%</b><div class="hbar${h.pct >= 85 ? " p" : ""}" style="height:${Math.max(6, h.pct * 1.1)}px"></div><span>${fmtDate(h.t).split(",")[0]}</span></div>`).join("")}</div>` : ""}
    ${last ? `<details class="answers panel" style="margin-top:18px"><summary>Check every answer of the last test (${last.n})</summary>
      ${(last.log || []).map(l => `<div class="ans"><span class="mark ${l.ok ? "ok" : "no"}">${l.ok ? "✓" : "✗"}</span><div><b>${esc(l.q)}</b><br>${l.ok ? `<small>${esc(l.correct)}</small>` : `<small>Your answer: ${esc(l.given)}</small><br><small>Correct: ${esc(l.correct)}</small>`}</div></div>`).join("")}</details>` : ""}`;
  requestAnimationFrame(() => setTimeout(() => $$("#scr-report .bar i").forEach(i => { i.style.width = i.dataset.w + "%"; }), 60));
  if (last && last.pct >= 85){ Sound.win(); FX.party(); }
}

/* ---------- PRINT SHEET (A4, exactly 2 pages; only visible when printing) ---------- */
const PRINT_JOB = {file:"New, Open, Save, Save As, Print, Share, Export, Close", ribbon:"tabs → groups → commands", qat:"Save, Undo, Redo/Repeat, Start From Beginning", title:"the file name + the program name", winctl:"minimize, maximize/restore, close", slides:"thumbnails: view, delete or move slides", pane:"the slide you are working on", views:"switch views (bottom right)", zoom:"make the slide look bigger or smaller"};
const PROCS = [
  ["A. Add and link an action button (START)", ["Click the Slide 1 thumbnail.", "Insert › Illustrations › Shapes › Action Buttons › the blank button.", "Click and drag to draw it (big enough for a word).", "Action Settings: Hyperlink to › arrow › Slide… › Home of the Future › OK › OK.", "Drawing Tools Format › Shape Styles: More ▾, Shape Fill (Gradient, Texture), Shape Outline (No Outline, Weight), Shape Effects.", "Right-click › Edit Text › START. Double-click the word › WordArt Styles: Text Fill, Text Outline, Text Effects. Bigger: right-click › mini toolbar › Increase Font Size.", "Test: Slide Show › From Beginning › click START › ESC. Broken? Right-click › Edit Hyperlink."]],
  ["B. A picture on every slide (Slide Master)", ["View › Master Views › Slide Master.", "Click the first slide at the TOP of the left pane.", "Insert › Images › Pictures › Future folder › future.", "Make it small (corner handle) and move it to a corner.", "Picture Tools Format › Adjust › Color › choose a color.", "Check each layout. Missing? Top slide › click the robot › Home › Copy › click the layout › Home › Paste.", "Slide Master tab › Close Master View. Check: does it block anything?"]],
  ["C. Stop click-to-advance + Home and Return", ["View › Slide Master › click the top slide.", "Transitions › Timing › untick On Mouse Click.", "Insert › Shapes › Action Buttons › Home › draw › Hyperlink to: First Slide › OK.", "Insert › Shapes › Action Buttons › Return › draw › Hyperlink to: Last Slide Viewed › OK.", "Put them along the edge; style them with Drawing Tools Format.", "Optional: click Home, SHIFT-click Return › Home › Copy › Paste on layouts (not the Title Slide layout).", "Close Master View › From Beginning: a click anywhere does nothing; the buttons work. Save."]]
];
function renderPrintSheet(){
  const el = $("#printSheet"); if (!el) return;
  const head = (t, sub, meta) => `<header class="ps-head"><div><h1>${t}</h1><p class="ps-sub">${sub}</p></div><p class="ps-meta">${meta}</p></header>`;
  const proc = ([t, steps]) => `<div class="ps-box"><h3>${t}</h3><ol>${steps.map(s => `<li>${s}</li>`).join("")}</ol></div>`;
  el.innerHTML = head("Future Lab: PowerPoint cheat sheet", "ICT practical Quiz 1 · TechnoFuture pp. 1–8, 11–22, 25–30 · PowerPoint 2013", "Class 6.3 · Thu 29 Oct 2026 · P4–P5")
    + `<h2>The PowerPoint 2013 window: 9 parts</h2><div class="ps-fig">${pptSVG({print:true})}</div>`
    + `<div class="ps-jobs">${PPT_ORDER.map(k => `<div><b>${PPT[k].name}:</b> ${PRINT_JOB[k]}</div>`).join("")}</div>`
    + `<h2>How do I…?</h2><table class="ps-table"><tr><th>I want to…</th><th>The path (› = then click)</th></tr>${CHEAT.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</table>`
    + `<p class="ps-note" style="margin-top:3pt"><b>Tricks:</b> Picture selected → Picture Tools Format · shape or button selected → Drawing Tools Format · Theme = Design · Master = View · Stop the click = Transitions · Show = Slide Show or F5, leave = ESC · Second person = you/your.</p>`
    + `<section class="ps-p2">` + head("The three big procedures", "Do them in this order. Save on the Quick Access Toolbar after each one.", "Future Lab · page 2")
    + `<div class="ps-two">${proc(PROCS[0])}${proc(PROCS[1])}</div><div class="ps-two" style="margin-top:3mm">${proc(PROCS[2])}<div class="ps-box"><h3>Futurist facts (Session 1)</h3><ul>${FUTURIST_FACTS.map(f => `<li>${f}</li>`).join("")}</ul></div></div>`
    + `<h2>Test yourself</h2><ol class="ps-q">${SELFTEST.map(([q]) => `<li>${q}<span class="ps-line"></span></li>`).join("")}</ol>`
    + `<p class="ps-key"><b>Answer key:</b> ${SELFTEST.map(([, a], i) => `${i + 1}) ${a}`).join(" · ")}</p></section>`;
}

/* ---------- EVENTS ---------- */
document.addEventListener("click", e => {
  const z = e.target.closest(".w9 .zone"); if (z){ w9Select(z.dataset.zone, z.closest(".w9")); return; }
  const w9b = e.target.closest("[data-w9]"); if (w9b){ w9Select(w9b.dataset.w9, w9b.closest(".w9")); return; }
  const hb = e.target.closest("#lab-body [data-h]"); if (hb && H){ huntTap(hb.dataset.h, hb); return; }
  const ll = e.target.closest("[data-ll]"); if (ll && LL){ linkTap(ll.dataset.ll); return; }
  const sq = e.target.closest("[data-sq]"); if (sq){ sqTap(sq); return; }
  const mt = e.target.closest("#mt [data-ml], #mt [data-mr]"); if (mt){ matchTap(mt); return; }
  const og = e.target.closest("#org [data-oi], #org [data-ob]"); if (og){ orgTap(og); return; }
  const zo = e.target.closest("[data-zo]"); if (zo && WS.z){ WS.z.pending = zo.dataset.zo; $$("#zdlg [data-zo]").forEach(x => x.classList.toggle("on", x === zo)); Sound.tap(); return; }
  const zm = e.target.closest("[data-zm]"); if (zm && WS.z){ zoomTap(zm); return; }
  const hk = e.target.closest("[data-hk]"); if (hk){ handlesKey(hk.dataset.hk); return; }
  const th = e.target.closest("[data-th]"); if (th && WS.th){ WS.th.t = th.dataset.th; themeApply(); Sound.tap(); return; }
  const vr = e.target.closest("[data-vr]"); if (vr && WS.th){ WS.th.v = +vr.dataset.vr; themeApply(); Sound.tap(); return; }
  const sg = e.target.closest("[data-sg]"); if (sg){ styleTap(sg); return; }
  const sr = e.target.closest("[data-sret]"); if (sr && WS.sim){ WS.sim.ret = sr.dataset.sret; $$("[data-sret]").forEach(x => x.setAttribute("aria-pressed", x === sr ? "true" : "false")); Sound.tap(); $("#simMsg").innerHTML = `<p>The Return button now goes to <b>${sr.dataset.sret === "lsv" ? "Last Slide Viewed" : "Previous Slide"}</b>. Jump from Home of the Future to Communication, then press Return.</p>`; return; }
  const sim = e.target.closest("[data-simgo], [data-simnav], [data-sim], #simScreen"); if (sim && WS.sim){ simTap(sim, e); return; }
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "home") nav("#/");
  else if (act === "open") nav("#/part/" + t.dataset.part);
  else if (act === "lab" || act === "lab-game"){ const g = t.dataset.game || labGame; Sound.tap(); nav("#/lab/" + g); }
  else if (act === "missions") nav("#/missions" + (t.dataset.mis ? "/" + t.dataset.mis : ""));
  else if (act === "review") nav("#/review");
  else if (act === "report") nav("#/report");
  else if (act === "words") nav("#/words");
  else if (act === "print"){ try { window.print(); } catch (err) {} }
  else if (act === "start-review"){ if (location.hash !== "#/review"){ history.pushState(null, "", "#/review"); show("review"); } startReview(); }
  else if (act === "retry-check"){ const id = location.hash.split("/")[2], c = partOf(id); if (c){ startCheck(c); scrollToEl($("#qc-host")); } }
  else if (act === "names-mode"){ namesMode = t.dataset.mode; Sound.tap(); namesStart(); }
  else if (act === "hunt-start"){ Sound.tap(); huntStart(); scrollToEl($("#lab-body")); }
  else if (act === "hunt-next"){ Sound.tap(); H.i++; H.fb = ""; huntTask(); scrollToEl($("#lab-body")); }
  else if (act === "hunt-show") huntShow();
  else if (act === "hunt-skip") huntSkip();
  else if (act === "link-start"){ Sound.tap(); linkStart(); scrollToEl($("#lab-body")); }
  else if (act === "link-next"){ Sound.tap(); LL.i++; linkScenario(); scrollToEl($("#lab-body")); }
  else if (act === "mis-clear"){ const id = t.dataset.mis; S.mis[id] = {}; save(); const sec = $("#" + id); if (sec){ sec.outerHTML = missionHTML(misOf(id)); Timer.startTick(); } Sound.tap(); }
  else if (act === "timer-toggle"){
    if (Timer.running()){ const r = Timer.stop(); const msg = $("#tmsg"); if (r && msg){ msg.textContent = `Stopped at ${fmtTime(r.ms)}.${r.isBest ? " New best time!" : ""}${r.ms <= 25 * 60000 ? " Under 25 minutes: quiz speed!" : " Target: 25 minutes."}`; }
      const b = $("#tbest"); if (b) b.innerHTML = `Your best: <b>${fmtTime(S.timer.best)}</b>${S.timer.best <= 25 * 60000 ? " ✓ under the target!" : ""}`; if (r && r.isBest){ Sound.win(); FX.burstEl($("#tclock"), 30); } else Sound.tap(); }
    else { Timer.start(); const msg = $("#tmsg"); if (msg) msg.textContent = "Go! Open a blank presentation and work through the steps."; Sound.tap(); }
  }
  else if (act === "timer-reset"){ Timer.reset(); const msg = $("#tmsg"); if (msg) msg.textContent = "Timer reset."; Sound.tap(); }
  else if (act === "motion"){ S.motion = !motionOn(); save(); applyMotion(); }
  else if (act === "sound"){ S.sound = !S.sound; save(); renderSoundBtn(); if (S.sound) Sound.tap(); }
});
document.addEventListener("change", e => {
  const c = e.target.closest("[data-mis][data-step]");
  if (c){
    const id = c.dataset.mis, i = +c.dataset.step;
    const T = S.mis[id] && typeof S.mis[id] === "object" ? S.mis[id] : (S.mis[id] = {});
    const first = c.checked && !(S.mis[id + "-ever"] && S.mis[id + "-ever"][i]);
    if (c.checked) T[i] = true; else delete T[i];
    if (first){ S.mis[id + "-ever"] = Object.assign({}, S.mis[id + "-ever"], {[i]:true}); }
    save();
    c.closest(".mstep").classList.toggle("done", c.checked);
    if (first) addXP(2, c); else Sound.tap();
    missionUpdate(id);
    return;
  }
  if (e.target.id === "simClick"){ Sound.tap(); $("#simMsg").innerHTML = `<p>On Mouse Click is now <b>${e.target.checked ? "ticked" : "unticked"}</b>. Click the empty slide and see what happens.</p>`; }
  if (e.target.id === "zr" && WS.z){ WS.z.z = +e.target.value; zoomGot("slider", e.target); }
});
document.addEventListener("input", e => { if (e.target.id === "zr" && WS.z){ WS.z.z = +e.target.value; zoomApply(); } });

/* ---------- START ---------- */
$("#xpVal").textContent = S.xp;
renderSoundBtn();
applyMotion();
addEventListener("hashchange", route);
route();
renderPrintSheet();
</script>
